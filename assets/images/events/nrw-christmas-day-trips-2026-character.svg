<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日帰りクリスマスマーケットの個性の比較</title><desc id="d">5つの行き先を町並み、歴史、子ども向け、雨の日、スケートと観覧車の観点で比べた表。ファルケンブルフは雨の日と子ども向けに、ミュンスターとモンシャウは町並みに、メローデ城は歴史と子ども向けに、マーストリヒトはスケートと観覧車に強い</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#153452">行き先ごとの個性</text><text x="60" y="122" font-size="21" fill="#405a71">何を楽しみたいかで選ぶ</text><rect x="40" y="150" width="1120" height="470" rx="16" fill="white"/><text x="420" y="200" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">町並み</text><text x="560" y="200" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">歴史</text><text x="700" y="200" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">子ども向け</text><text x="840" y="200" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">雨の日</text><text x="1010" y="200" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">スケート・観覧車</text><line x1="70" y1="228" x2="1130" y2="228" stroke="#eee3d6" stroke-width="2"/><text x="80" y="278" font-size="23" font-weight="700" fill="#153452">モンシャウ</text><circle cx="420" cy="270" r="17" fill="#8d5a3c"/><circle cx="560" cy="270" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="700" cy="270" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><line x1="828" y1="270" x2="852" y2="270" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="998" y1="270" x2="1022" y2="270" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="296" x2="1130" y2="296" stroke="#eee3d6" stroke-width="2"/><text x="80" y="346" font-size="23" font-weight="700" fill="#153452">ミュンスター</text><circle cx="420" cy="338" r="17" fill="#8d5a3c"/><circle cx="560" cy="338" r="17" fill="#8d5a3c"/><circle cx="700" cy="338" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><line x1="828" y1="338" x2="852" y2="338" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="998" y1="338" x2="1022" y2="338" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="364" x2="1130" y2="364" stroke="#eee3d6" stroke-width="2"/><text x="80" y="414" font-size="23" font-weight="700" fill="#153452">メローデ城</text><circle cx="420" cy="406" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="560" cy="406" r="17" fill="#8d5a3c"/><circle cx="700" cy="406" r="17" fill="#8d5a3c"/><line x1="828" y1="406" x2="852" y2="406" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="998" y1="406" x2="1022" y2="406" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="432" x2="1130" y2="432" stroke="#eee3d6" stroke-width="2"/><text x="80" y="482" font-size="23" font-weight="700" fill="#153452">ファルケンブルフ</text><circle cx="420" cy="474" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="560" cy="474" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="700" cy="474" r="17" fill="#8d5a3c"/><circle cx="840" cy="474" r="17" fill="#8d5a3c"/><line x1="998" y1="474" x2="1022" y2="474" stroke="#c9bcae" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="500" x2="1130" y2="500" stroke="#eee3d6" stroke-width="2"/><text x="80" y="550" font-size="23" font-weight="700" fill="#153452">マーストリヒト</text><circle cx="420" cy="542" r="17" fill="#8d5a3c"/><circle cx="560" cy="542" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="700" cy="542" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="840" cy="542" r="15" fill="none" stroke="#8d5a3c" stroke-width="4"/><circle cx="1010" cy="542" r="17" fill="#8d5a3c"/><circle cx="80" cy="603" r="9" fill="#8d5a3c"/><text x="98" y="609" font-size="17" fill="#405a71">特に強い</text><circle cx="215" cy="603" r="8" fill="none" stroke="#8d5a3c" stroke-width="3"/><text x="232" y="609" font-size="17" fill="#405a71">楽しめる</text><line x1="340" y1="603" x2="358" y2="603" stroke="#c9bcae" stroke-width="4"/><text x="368" y="609" font-size="17" fill="#405a71">主な目的ではない（J-Connect編集部の整理）</text></g></svg>