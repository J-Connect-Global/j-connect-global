<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">成績と0〜15点の対応</title><desc id="d">ギムナジウム上級段階では、成績1が15・14・13点、2が12・11・10点、3が9・8・7点、4が6・5・4点、5が3・2・1点、6が0点に対応し、2+は12点、2-は10点にあたることを示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f6f8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">高校の上の学年は「0〜15点」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ギムナジウム上級段階での、成績と点数の対応（KMK）</text><text x="200" y="210" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">成績</text><text x="450" y="210" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">＋</text><text x="650" y="210" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">ちょうど</text><text x="850" y="210" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">－</text><rect x="140" y="228" width="120" height="52" rx="10" fill="#2f8a64"/><text x="200" y="264" font-size="28" font-weight="700" fill="white" text-anchor="middle">1</text><rect x="370" y="228" width="160" height="52" rx="10" fill="white"/><text x="450" y="264" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="middle">15点</text><rect x="570" y="228" width="160" height="52" rx="10" fill="white"/><text x="650" y="264" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="middle">14点</text><rect x="770" y="228" width="160" height="52" rx="10" fill="white"/><text x="850" y="264" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="middle">13点</text><rect x="140" y="290" width="120" height="52" rx="10" fill="#6fae6a"/><text x="200" y="326" font-size="28" font-weight="700" fill="white" text-anchor="middle">2</text><rect x="370" y="290" width="160" height="52" rx="10" fill="white"/><text x="450" y="326" font-size="24" font-weight="700" fill="#6fae6a" text-anchor="midd