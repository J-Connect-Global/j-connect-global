<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">撤回の14日間の流れ</title><desc id="d">物を受け取った日の翌日から14日以内に撤回を伝え、撤回を伝えてから14日以内に物を送り返し、ショップは原則14日以内に返金するという流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ネット通販の撤回：14日間の流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">理由を言わずに契約をやめられる</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2d6a9f"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">物を受け取る</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">受け取った日の</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">翌日から</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">14日間を数える</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2d6a9f"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">撤回を伝える</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">ショップの手続き</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">メールなどで</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">はっきり伝える</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2d6a9f"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">物を送り返す</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">撤回を伝えてから</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">14日以内に</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">控えを保存</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2d6a9f"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">返金</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">ショップは</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">原則14日以内に</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">返金する</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※返品の送料はショップの案内しだい。出典：民法第355条、消費者センター</text></g></svg>