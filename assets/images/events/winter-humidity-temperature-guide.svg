<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">冬の湿度と室温の目安</title><desc id="d">湿度40〜60%、居間は20℃程度まで、台所18℃、寝室17℃、部屋どうしの温度差は5℃以内という冬の目安をまとめた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">冬の住まい：湿度と室温の目安</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">温湿度計で「見える化」するのが第一歩</text><rect x="60" y="190" width="400" height="400" rx="20" fill="white"/><rect x="60" y="190" width="400" height="66" rx="20" fill="#2d6a9f"/><rect x="60" y="236" width="400" height="20" fill="#2d6a9f"/><text x="260" y="235" font-size="28" font-weight="700" fill="white" text-anchor="middle">湿度</text><text x="260" y="360" font-size="58" font-weight="700" fill="#2d6a9f" text-anchor="middle">40〜60%</text><text x="260" y="430" font-size="22" fill="#29465f" text-anchor="middle">断熱の弱い住まいは</text><text x="260" y="465" font-size="22" fill="#29465f" text-anchor="middle">冬は50%未満が目安</text><text x="260" y="530" font-size="20" fill="#5b7086" text-anchor="middle">70〜80%が壁際で続くと</text><text x="260" y="560" font-size="20" fill="#5b7086" text-anchor="middle">カビが育ちやすい</text><rect x="490" y="190" width="650" height="88" rx="16" fill="white"/><rect x="490" y="190" width="14" height="88" rx="7" fill="#c9952a"/><text x="530" y="246" font-size="28" font-weight="700" fill="#153452" text-anchor="start">居間</text><text x="1110" y="246" font-size="30" font-weight="700" fill="#c9952a" text-anchor="end">20℃程度まで</text><rect x="490" y="292" width="650" height="88" rx="16" fill="white"/><rect x="490" y="292" width="14" height="88" rx="7" fill="#c9952a"/><text x="530" y="348" font-size="28" font-weight="700" fill="#153452" text-anchor="start">台所</text><text x="1110" y="348" font-size="30" font-weight="700" fill="#c9952a" text-anchor="end">18℃</text><rect x="490" y="394" width="650" height="88" rx="16" fill="white"/><rect x="490" y="394" width="14" height="88" rx="7" fill="#c9952a"/><text x="530" y="450" font-size="28" font-weight="700" fill="#153452" text-anchor="start">寝室</text><text x="1110" y="450" font-size="30" font-weight="700" fill="#c9952a" text-anchor="end">17℃（16〜18℃以上）</text><rect x="490" y="496" width="650" height="88" rx="16" fill="white"/><rect x="490" y="496" width="14" height="88" rx="7" fill="#2f8a64"/><text x="530" y="552" font-size="28" font-weight="700" fill="#153452" text-anchor="start">部屋の温度差</text><text x="1110" y="552" font-size="30" font-weight="700" fill="#2f8a64" text-anchor="end">5℃以内</text><text x="60" y="640" font-size="18" fill="#5b7086" text-anchor="start">図解：J-Connect。連邦環境庁・消費者センターの目安に基づく（2026年10月26日参照）。</text></g></svg>