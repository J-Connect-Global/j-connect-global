<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの労働契約で確認したい項目</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">労働契約で確認したい8項目と法律の最低ライン</text><text x="48" y="152" font-size="23" fill="#52666C">会社は主な条件を書面で渡す義務がある（証明書法第2条）</text><rect x="268" y="176" width="608" height="50" rx="10" fill="#173B48"/><text x="284" y="210" font-size="24" fill="#FFFFFF">法律の最低ライン・確認点</text><rect x="888" y="176" width="252" height="50" rx="10" fill="#146859"/><text x="904" y="210" font-size="24" fill="#FFFFFF">根拠</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="45" fill="#FFFFFF"/><text x="64" y="259" font-size="18" fill="#52666C">試用期間</text><text x="284" y="259" font-size="20" fill="#173B48">最長6か月。予告は2週間</text><text x="904" y="259" font-size="20" fill="#173B48">民法第622条</text><rect x="48" y="275" width="1104" height="45" fill="#F9F8F3"/><text x="64" y="304" font-size="18" fill="#52666C">予告期間</text><text x="284" y="304" font-size="20" fill="#173B48">4週間（15日か月末）。会社側は勤続で延長</text><text x="904" y="304" font-size="20" fill="#173B48">民法第622条</text><rect x="48" y="320" width="1104" height="45" fill="#FFFFFF"/><text x="64" y="349" font-size="18" fill="#52666C">有給休暇</text><text x="284" y="349" font-size="20" fill="#C2410C">週5日勤務で年20日以上</text><text x="904" y="349" font-size="20" fill="#173B48">連邦休暇法</text><rect x="48" y="365" width="1104" height="45" fill="#F9F8F3"/><text x="64" y="394" font-size="18" fill="#52666C">労働時間</text><text x="284" y="394" font-size="20" fill="#173B48">1日8時間。6時間超で休憩30分</text><text x="904" y="394" font-size="20" fill="#173B48">労働時間法</text><rect x="48" y="410" width="1104" height="45" fill="#FFFFFF"/><text x="64" y="439" font-size="18" fill="#52666C">給与・残業</text><text x="284" y="439" font-size="20" fill="#173B48">残業代が含まれるか。最低賃金以上か</text><text x="904" y="439" font-size="20" fill="#173B48">契約・協約</text><rect x="48" y="455" width="1104" height="45" fill="#F9F8F3"/><text x="64" y="484" font-size="18" fill="#52666C">期間</text><text x="284" y="484" font-size="20" fill="#173B48">有期は理由なしで2年・延長3回まで</text><text x="904" y="484" font-size="20" fill="#173B48">有期労働法</text><rect x="48" y="500" width="1104" height="45" fill="#FFFFFF"/><text x="64" y="529" font-size="18" fill="#52666C">勤務地・仕事</text><text x="284" y="529" font-size="20" fill="#173B48">在宅勤務・転勤の扱い</text><text x="904" y="529" font-size="20" fill="#173B48">契約</text><rect x="48" y="545" width="1104" height="45" fill="#F9F8F3"/><text x="64" y="574" font-size="18" fill="#52666C">労働協約</text><text x="284" y="574" font-size="20" fill="#173B48">適用される協約があるか</text><text x="904" y="574" font-size="20" fill="#173B48">契約</text><text x="48" y="622" font-size="22" fill="#173B48">退職・解雇は紙に署名した書面でのみ有効です。メールでは効力がありません。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：民法第622条・第623条、連邦休暇法、労働時間法、証明書法  |  2026-11-06</text></g></svg>