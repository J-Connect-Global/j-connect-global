<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">運転免許の切り替え</title><desc id="d">日本の免許でドイツを運転できるのは住み始めてから6か月までで、その間に日本の免許のドイツ語訳を用意し、市の窓口で試験なしでドイツの免許に切り替え、数週間後に受け取るという流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日本の免許からドイツの免許へ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">日本の免許で運転できるのは、住み始めてから6か月まで</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2d6a9f"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">ドイツ語訳</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">日本の免許の</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">ドイツ語訳を</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">用意する</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2d6a9f"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">窓口を予約</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">市の運転免許の</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">窓口に</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">予約する</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2d6a9f"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">書類を出す</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">パスポート・免許</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">ドイツ語訳・</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">写真など</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2d6a9f"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">受け取る</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">試験なしで</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">数週間後に</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">ドイツの免許</text><rect x="60" y="530" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="566" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">6か月を過ぎたら</text><text x="90" y="600" font-size="21" fill="#29465f" text-anchor="start">日本の免許だけではドイツで運転できません。早めに切り替えを</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：運転免許規則、ケルン市、在外公館（2026年10月29日参照）</text></g></svg>