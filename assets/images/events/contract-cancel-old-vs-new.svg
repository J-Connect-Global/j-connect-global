<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">新しい契約と古い契約</title><desc id="d">2022年3月1日以降に結んだ契約は最長2年の最初の期間の後、1か月前の通知でいつでも解約でき、2022年2月までの古い契約は自動で最長1年延長され、解約の通知は最長3か月前までという違いを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">契約を結んだのはいつ？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">解約のルールが変わる境目は2022年3月1日</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">2022年3月1日以降の契約</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">最初の契約期間は最長2年</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">期間が過ぎたら</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">1か月前の通知でいつでも解約</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">「自動で1年延長」は無効</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#c9952a"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#c9952a"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">2022年2月までの古い契約</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">以前のルールのまま</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">自動で最長1年延長されることも</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">解約の通知は最長3か月前</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">まず契約書で日付を確認</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター、連邦司法・消費者保護省（2026年10月29日参照）</text></g></svg>