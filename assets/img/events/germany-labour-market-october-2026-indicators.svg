<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">2026年10月の雇用関連指標</title>
<desc id="desc">雇用庁に登録された求人は65万4千件、広い意味の未就業者数は359万2千人、雇用庁の求人指数BA-Xは102ポイント。</desc>
<rect width="1200" height="620" rx="28" fill="#f4f6f8"/>
<text x="72" y="86" font-size="34" font-weight="700" fill="#1f2937">失業者数以外に見る3つの指標</text>
<g>
<rect x="72" y="142" width="330" height="300" rx="22" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
<rect x="435" y="142" width="330" height="300" rx="22" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
<rect x="798" y="142" width="330" height="300" rx="22" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
</g>
<g font-size="22" fill="#4b5563">
<text x="112" y="204">雇用庁の登録求人</text><text x="475" y="204">広義の雇用不足指標</text><text x="838" y="204">求人指数 BA-X</text>
</g>
<g font-size="52" font-weight="700" fill="#28658a">
<text x="112" y="294">65.4万</text><text x="475" y="294">359.2万</text><text x="838" y="294">102</text>
</g>
<g font-size="19" fill="#374151">
<text x="112" y="350">前年同月比 +3.1万</text><text x="475" y="350">前年同月比 +2.8万</text><text x="838" y="350">前月比 −1ポイント</text>
<text x="112" y="390">雇用庁に届いた求人</text><text x="475" y="390">登録失業者より広い</text><text x="838" y="390">求人動向の指数</text>
</g>
<text x="72" y="520" font-size="19" fill="#4b5563">登録求人はドイツ国内の全求人ではありません。指標ごとに対象範囲が異なります。</text>
<text x="72" y="566" font-size="18" fill="#4b5563">出典：ドイツ連邦雇用庁、2026年10月30日公表</text>
</svg>