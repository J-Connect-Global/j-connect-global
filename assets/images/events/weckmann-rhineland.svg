<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ラインラントのヴェックマン</title><desc id="d">ヴェックマンはレーズンの目と陶器のパイプが付いた人の形の甘いパンで、地域によってシュトゥーテンケールなどと呼ばれ、もとは司教ニコラウスの姿を表し、今は聖マルティン祭にも欠かせないことを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7efe8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ラインラントのパン「ヴェックマン」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">人の形をした甘いパン。もとは司教ニコラウスの姿</text><rect x="60" y="180" width="460" height="420" rx="16" fill="white"/><ellipse cx="290" cy="270" rx="55" ry="58" fill="#d9a35a"/><rect x="235" y="320" width="110" height="170" rx="40" fill="#d9a35a"/><rect x="185" y="340" width="60" height="30" rx="15" fill="#d9a35a" transform="rotate(25 215 355)"/><rect x="335" y="340" width="60" height="30" rx="15" fill="#d9a35a" transform="rotate(-25 365 355)"/><rect x="245" y="470" width="38" height="90" rx="18" fill="#d9a35a"/><rect x="297" y="470" width="38" height="90" rx="18" fill="#d9a35a"/><circle cx="272" cy="262" r="7" fill="#4a2f22"/><circle cx="308" cy="262" r="7" fill="#4a2f22"/><g fill="#4a2f22"><circle cx="290" cy="360" r="6"/><circle cx="290" cy="395" r="6"/><circle cx="290" cy="430" r="6"/></g><path d="M330 290 L 380 330 L 385 315" stroke="#f4f1ea" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="375" y="300" width="24" height="22" rx="6" fill="#f4f1ea"/><text x="450" y="520" font-size="18" font-weight="700" fill="#8a5a00" text-anchor="end">陶器のパイプ</text><rect x="550" y="180" width="590" height="94" rx="16" fill="white"/><rect x="550" y="180" width="14" height="94" rx="7" fill="#c9952a"/><text x="585" y="220" font-size="23" font-weight="700" fill="#c9952a" text-anchor="start">作り方</text><text x="585" y="254" font-size="19" fill="#29465f" text-anchor="start">小麦粉の生地を人の形に。レーズンの目</text><rect x="550" y="288" width="590" height="94" rx="16" fill="white"/><rect x="550" y="288" width="14" height="94" rx="7" fill="#2d6a9f"/><text x="585" y="328" font-size="23" font-weight="700" fill="#2d6a9f" text-anchor="start">呼び名</text><text x="585" y="362" font-size="19" fill="#29465f" text-anchor="start">ヴェックマン、シュトゥーテンケール（ルール・下ライン）など</text><rect x="550" y="396" width="590" height="94" rx="16" fill="white"/><rect x="550" y="396" width="14" height="94" rx="7" fill="#8a5aa8"/><text x="585" y="436" font-size="23" font-weight="700" fill="#8a5aa8" text-anchor="start">もとの意味</text><text x="585" y="470" font-size="19" fill="#29465f" text-anchor="start">司教ニコラウスの姿。昔はニコラウスの日に</text><rect x="550" y="504" width="590" height="94" rx="16" fill="white"/><rect x="550" y="504" width="14" height="94" rx="7" fill="#b5473a"/><text x="585" y="544" font-size="23" font-weight="700" fill="#b5473a" text-anchor="start">今</text><text x="585" y="578" font-size="19" fill="#29465f" text-anchor="start">11月11日の聖マルティン祭にも欠かせない</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：LVR（ラインラント地域連合）、LVR地域研究所（2026年10月29日参照）</text></g></svg>