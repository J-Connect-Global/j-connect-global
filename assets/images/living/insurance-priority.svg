<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">保険の優先順位</title><desc id="d">個人賠償責任保険はほぼ全員に必要で補償額は少なくとも1,000万ユーロ、家財保険は家財の価値が高い人に必要、自動車保険は車を持つ人の義務であることを3段階で示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツの保険、入る順番は？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">まず個人賠償責任保険から</text><rect x="60" y="180" width="1080" height="130" rx="16" fill="white"/><rect x="60" y="180" width="14" height="130" rx="7" fill="#b5473a"/><text x="100" y="230" font-size="28" font-weight="700" fill="#b5473a" text-anchor="start">1  個人賠償責任保険（Privathaftpflicht）</text><text x="100" y="275" font-size="21" fill="#29465f" text-anchor="start">ほぼ全員に必要 ／ 補償額は少なくとも1,000万ユーロ ／ 年50〜80ユーロ程度の契約も</text><rect x="60" y="325" width="1080" height="130" rx="16" fill="white"/><rect x="60" y="325" width="14" height="130" rx="7" fill="#c9952a"/><text x="100" y="375" font-size="28" font-weight="700" fill="#c9952a" text-anchor="start">2  家財保険（Hausrat）</text><text x="100" y="420" font-size="21" fill="#29465f" text-anchor="start">家具や電化製品が多い人に ／ 家財の実際の価値に合わせて補償額を決める</text><rect x="60" y="470" width="1080" height="130" rx="16" fill="white"/><rect x="60" y="470" width="14" height="130" rx="7" fill="#2d6a9f"/><text x="100" y="520" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="start">3  自動車保険（Kfz-Haftpflicht）</text><text x="100" y="565" font-size="21" fill="#29465f" text-anchor="start">車を持つ人は法律で義務 ／ 車両の保険（Kasko）は任意</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター、Stiftung Warentest（2026年10月29日参照）</text></g></svg>