<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>学生のアルバイトの日数の数え方</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">学生のアルバイト　年140日分の数え方</text><rect x="48" y="150" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="194" r="20" fill="#146859"/><text x="84" y="203" font-size="24" fill="#FFFFFF">1</text><text x="128" y="188" font-size="26" fill="#173B48">上限は年140日分</text><text x="128" y="218" font-size="20" fill="#52666C">学生の滞在許可で働ける日数の合計</text><rect x="48" y="250" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="294" r="20" fill="#146859"/><text x="84" y="303" font-size="24" fill="#FFFFFF">2</text><text x="128" y="288" font-size="26" fill="#173B48">4時間以内の日は「半日」</text><text x="128" y="318" font-size="20" fill="#52666C">日ごとに数える方法</text><rect x="48" y="350" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="394" r="20" fill="#146859"/><text x="84" y="403" font-size="24" fill="#FFFFFF">3</text><text x="128" y="388" font-size="26" fill="#173B48">講義期間に週20時間までの週は2.5日</text><text x="128" y="418" font-size="20" fill="#52666C">週ごとに数える方法。労働時間の配分は問わない</text><rect x="48" y="450" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="494" r="20" fill="#146859"/><text x="84" y="503" font-size="24" fill="#FFFFFF">4</text><text x="128" y="488" font-size="26" fill="#173B48">講義のない期間の週も2.5日</text><text x="128" y="518" font-size="20" fill="#52666C">週ごとに、有利なほうの数え方が選ばれる</text><rect x="760" y="150" width="392" height="388" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">数えない仕事</text><text x="788" y="268" font-size="32" fill="#173B48">大学内の</text><text x="788" y="312" font-size="32" fill="#173B48">学生アルバイト</text><text x="788" y="372" font-size="21" fill="#52666C">研究補助など、大学や研究</text><text x="788" y="404" font-size="21" fill="#52666C">機関の中の学生の仕事は</text><text x="788" y="436" font-size="21" fill="#52666C">140日に含めません</text><text x="788" y="468" font-size="21" fill="#52666C">税金・社会保険の扱いは</text><text x="788" y="500" font-size="21" fill="#52666C">働き方で別に決まります</text><text x="48" y="622" font-size="22" fill="#173B48">働いた日と時間は自分でも記録しておくと安心です。迷ったら外国人局に確認を。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第16b条第3項  |  2026-11-06</text></g></svg>