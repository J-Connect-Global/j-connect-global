ext-anchor="middle">3点</text><rect x="570" y="476" width="160" height="52" rx="10" fill="white"/><text x="650" y="512" font-size="24" font-weight="700" fill="#d7703a" text-anchor="middle">2点</text><rect x="770" y="476" width="160" height="52" rx="10" fill="white"/><text x="850" y="512" font-size="24" font-weight="700" fill="#d7703a" text-anchor="middle">1点</text><rect x="140" y="538" width="120" height="52" rx="10" fill="#b5473a"/><text x="200" y="574" font-size="28" font-weight="700" fill="white" text-anchor="middle">6</text><rect x="570" y="538" width="160" height="52" rx="10" fill="white"/><text x="650" y="574" font-size="24" font-weight="700" fill="#b5473a" text-anchor="middle">0点</text><rect x="960" y="228" width="180" height="362" rx="14" fill="#fff7e6"/><text x="1050" y="300" font-size="20" font-weight="700" fill="#8a5a00" text-anchor="middle">例</text><text x="1050" y="350" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">「2+」</text><text x="1050" y="385" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">＝12点</text><text x="1050" y="450" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">「2-」</text><text x="1050" y="485" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">＝10点</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：常設各州文部大臣会議（KMK）ギムナジウム上級段階とアビトゥーアに関する協定（2026年10月29日参照）</text></g></svg>