<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">契約変更の通知を確認する順番</title><desc id="d">DB以外で買った人は、購入した事業者の案内を確認</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="65" y="100" font-size="42" font-weight="700" fill="#153452">契約変更の通知を確認する順番</text><text x="65" y="155" font-size="25" fill="#405a71">DB以外で買った人は、購入した事業者の案内を確認</text><rect x="65" y="220" width="340" height="290" rx="20" fill="white"/><text x="90" y="280" font-size="29" font-weight="700" fill="#153452">1 購入先を確認</text><text x="90" y="345" font-size="25" fill="#29465f">どこから買った券か</text><text x="90" y="393" font-size="25" fill="#29465f">契約者の名義も確認</text><rect x="430" y="220" width="340" height="290" rx="20" fill="white"/><text x="455" y="280" font-size="29" font-weight="700" fill="#153452">2 契約者が確認</text><text x="455" y="345" font-size="25" fill="#29465f">公式アカウントを開く</text><text x="455" y="393" font-size="25" fill="#29465f">自分の契約通知を見る</text><rect x="795" y="220" width="340" height="290" rx="20" fill="white"/><text x="820" y="280" font-size="29" font-weight="700" fill="#153452">3 期限と結果を確認</text><text x="820" y="345" font-size="25" fill="#29465f">必要な回答を行う</text><text x="820" y="393" font-size="25" fill="#29465f">受付・契約状態を保存</text><text x="65" y="590" font-size="24" fill="#405a71">図解：J-Connect編集部。具体的な期限・条件は本文と購入先の公式案内を参照。</text></g></svg>
