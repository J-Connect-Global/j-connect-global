<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ツォルフェアアインの数字</title><desc id="d">ツォルフェアアイン炭鉱が1851年から1986年まで石炭を掘っていたこと、第12立坑が1932年に操業を始めたこと、2001年12月14日に世界遺産に登録されたこと、今は年間約150万人が訪れることを示した図</desc><rect width="1200" height="675" rx="28" fill="#f2efea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">世界遺産ツォルフェアアイン（エッセン）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">「世界で最も美しい炭鉱」と呼ばれた場所</text><rect x="60" y="185" width="530" height="180" rx="16" fill="white"/><rect x="60" y="185" width="16" height="180" rx="8" fill="#5b6f84"/><text x="110" y="270" font-size="36" font-weight="700" fill="#5b6f84" text-anchor="start">1851〜1986年</text><text x="110" y="320" font-size="22" fill="#29465f" text-anchor="start">石炭を掘っていた期間</text><rect x="610" y="185" width="530" height="180" rx="16" fill="white"/><rect x="610" y="185" width="16" height="180" rx="8" fill="#b5473a"/><text x="660" y="270" font-size="36" font-weight="700" fill="#b5473a" text-anchor="start">1932年</text><text x="660" y="320" font-size="22" fill="#29465f" text-anchor="start">第12立坑が操業開始</text><rect x="60" y="385" width="530" height="180" rx="16" fill="white"/><rect x="60" y="385" width="16" height="180" rx="8" fill="#2d6a9f"/><text x="110" y="470" font-size="36" font-weight="700" fill="#2d6a9f" text-anchor="start">2001年12月14日</text><text x="110" y="520" font-size="22" fill="#29465f" text-anchor="start">ユネスコの世界遺産に登録</text><rect x="610" y="385" width="530" height="180" rx="16" fill="white"/><rect x="610" y="385" width="16" height="180" rx="8" fill="#2f8a64"/><text x="660" y="470" font-size="36" font-weight="700" fill="#2f8a64" text-anchor="start">年間約150万人</text><text x="660" y="520" font-size="22" fill="#29465f" text-anchor="start">今の来場者（ツォルフェアアイン）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ・ユネスコ委員会、ツォルフェアアイン（2026年10月29日参照）</text></g></svg>