<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ベルリンの壁の年表</title><desc id="d">1961年8月13日の建設開始、全長約155km、1989年11月9日の記者会見と国境の開放、1990年10月3日のドイツ統一までを示した年表</desc><rect width="1200" height="675" rx="28" fill="#eef0f3"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ベルリンの壁の28年</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">1961年8月13日から1989年11月9日まで</text><line x1="165" y1="190" x2="165" y2="615" stroke="#d6c9b8" stroke-width="6"/><circle cx="165" cy="217" r="14" fill="#5b6f84"/><text x="55" y="225" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1961</text><rect x="190" y="185" width="950" height="72" rx="16" fill="white"/><text x="215" y="215" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">8月13日</text><text x="340" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="start">壁の建設が夜中に始まる</text><text x="340" y="243" font-size="19" fill="#405a71" text-anchor="start">最初は有刺鉄線、やがてコンクリートの壁に</text><circle cx="165" cy="301" r="14" fill="#5b6f84"/><text x="55" y="309" font-size="22" font-weight="700" fill="#153452" text-anchor="start">長さ</text><rect x="190" y="269" width="950" height="72" rx="16" fill="white"/><text x="215" y="299" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">約155km</text><text x="340" y="299" font-size="23" font-weight="700" fill="#153452" text-anchor="start">街の中約43km・西ベルリンの周り約112km</text><text x="340" y="327" font-size="19" fill="#405a71" text-anchor="start">国境警備隊の記録では156.4km</text><circle cx="165" cy="385" r="14" fill="#5b6f84"/><text x="55" y="393" font-size="22" font-weight="700" fill="#153452" text-anchor="start">犠牲</text><rect x="190" y="353" width="950" height="72" rx="16" fill="white"/><text x="215" y="383" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">140人以上</text><text x="340" y="383" font-size="23" font-weight="700" fill="#153452" text-anchor="start">1961〜1989年に壁で命を落とした人</text><text x="340" y="411" font-size="19" fill="#405a71" text-anchor="start">検問所での死者も少なくとも251人</text><circle cx="165" cy="469" r="14" fill="#5b6f84"/><text x="55" y="477" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1989</text><rect x="190" y="437" width="950" height="72" rx="16" fill="white"/><text x="215" y="467" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">11月9日</text><text x="340" y="467" font-size="23" font-weight="700" fill="#153452" text-anchor="start">記者会見で「すぐに、ただちに」</text><text x="340" y="495" font-size="19" fill="#405a71" text-anchor="start">夜11時すぎ、ボルンホルマー通りが開く</text><circle cx="165" cy="553" r="14" fill="#5b6f84"/><text x="55" y="561" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1990</text><rect x="190" y="521" width="950" height="72" rx="16" fill="white"/><text x="215" y="551" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">10月3日</text><text x="340" y="551" font-size="23" font-weight="700" fill="#153452" text-anchor="start">東西ドイツが統一</text><text x="340" y="579" font-size="19" fill="#405a71" text-anchor="start">「ドイツ統一の日」の始まり</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ベルリンの壁財団、連邦政治教育センター（2026年10月29日参照）</text></g></svg>