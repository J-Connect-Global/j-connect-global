<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">雪かきの時間と方法</title><desc id="d">雪かきの時間は平日朝7時から夜20時、日曜祝日は朝9時から夜20時、幅は少なくとも1メートル、歩道では塩を使わず砂や砂利を使うことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">雪かきの時間と方法</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">デュッセルドルフ市の例</text><rect x="60" y="185" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="185" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="224" font-size="22" font-weight="700" fill="#153452" text-anchor="start">平日</text><text x="1110" y="225" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">朝7時〜夜20時</text><rect x="60" y="257" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="257" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="296" font-size="22" font-weight="700" fill="#153452" text-anchor="start">日曜・祝日</text><text x="1110" y="297" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">朝9時〜夜20時</text><rect x="60" y="329" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="329" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="368" font-size="22" font-weight="700" fill="#153452" text-anchor="start">掃除する幅</text><text x="1110" y="369" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">少なくとも1メートル</text><rect x="60" y="401" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="401" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="440" font-size="22" font-weight="700" fill="#153452" text-anchor="start">滑り止め</text><text x="1110" y="441" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">砂や細かい砂利（塩は原則禁止）</text><rect x="60" y="480" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="525" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">雪が降り続く日は、滑りやすくなるたびにくり返し対応</text><text x="90" y="565" font-size="21" fill="#29465f" text-anchor="start">ケルン市も平日は朝7時、日曜・祝日は朝9時までに雪かきを</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：デュッセルドルフ市、ケルン市（2026年10月29日参照）</text></g></svg>