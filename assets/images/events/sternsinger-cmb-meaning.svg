<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">C+M+Bの読み方</title><desc id="d">ドアに書かれる20*C+M+B+27の前後の数字は西暦2027年、C+M+Bは今はキリストがこの家を祝福しますようにというラテン語の頭文字、昔は三賢王の名前の頭文字と解釈され、+は十字架を表すことを示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドアの「20*C+M+B+27」の読み方</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">シュテルンジンガーが残していく、1年間の祝福のしるし</text><rect x="60" y="180" width="1080" height="150" rx="20" fill="#2b3a4f"/><text x="225" y="282" font-size="72" font-weight="700" fill="#f2c94c" text-anchor="middle">20</text><text x="320" y="282" font-size="72" font-weight="700" fill="#f4f1ea" text-anchor="middle">*</text><text x="400" y="282" font-size="72" font-weight="700" fill="#f4f1ea" text-anchor="middle">C</text><text x="480" y="282" font-size="72" font-weight="700" fill="#e8655a" text-anchor="middle">+</text><text x="560" y="282" font-size="72" font-weight="700" fill="#f4f1ea" text-anchor="middle">M</text><text x="640" y="282" font-size="72" font-weight="700" fill="#e8655a" text-anchor="middle">+</text><text x="720" y="282" font-size="72" font-weight="700" fill="#f4f1ea" text-anchor="middle">B</text><text x="800" y="282" font-size="72" font-weight="700" fill="#e8655a" text-anchor="middle">+</text><text x="895" y="282" font-size="72" font-weight="700" fill="#f2c94c" text-anchor="middle">27</text><rect x="60" y="350" width="530" height="115" rx="16" fill="white"/><rect x="60" y="350" width="14" height="115" rx="7" fill="#c9952a"/><text x="100" y="395" font-size="23" font-weight="700" fill="#c9952a" text-anchor="start">20 … 27</text><text x="100" y="430" font-size="17" fill="#29465f" text-anchor="start">その年の西暦（2027年）</text><rect x="610" y="350" width="530" height="115" rx="16" fill="white"/><rect x="610" y="350" width="14" height="115" rx="7" fill="#2d6a9f"/><text x="650" y="395" font-size="23" font-weight="700" fill="#2d6a9f" text-anchor="start">C+M+B（今の解釈）</text><text x="650" y="430" font-size="17" fill="#29465f" text-anchor="start">Christus mansionem benedicat</text><text x="650" y="454" font-size="17" fill="#29465f" text-anchor="start">＝キリストがこの家を祝福しますように</text><rect x="60" y="480" width="530" height="115" rx="16" fill="white"/><rect x="60" y="480" width="14" height="115" rx="7" fill="#8a5aa8"/><text x="100" y="525" font-size="23" font-weight="700" fill="#8a5aa8" text-anchor="start">C+M+B（昔の解釈）</text><text x="100" y="560" font-size="17" fill="#29465f" text-anchor="start">三賢王カスパール・メルヒオール・バルタザールの頭文字</text><rect x="610" y="480" width="530" height="115" rx="16" fill="white"/><rect x="610" y="480" width="14" height="115" rx="7" fill="#b5473a"/><text x="650" y="525" font-size="23" font-weight="700" fill="#b5473a" text-anchor="start">＋</text><text x="650" y="560" font-size="17" fill="#29465f" text-anchor="start">キリストの十字架を表すとされる</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：katholisch.de（2026年10月29日参照）</text></g></svg>