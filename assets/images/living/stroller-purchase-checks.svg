<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"><rect width="820" height="420" rx="16" fill="#f4f7fa"/><g font-family="Noto Sans JP, sans-serif" fill="#17324d"><text x="36" y="48" font-size="24" font-weight="700">買う前に確認する3つの場所</text><rect x="24" y="82" width="248" height="292" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="56" cy="122" r="18" fill="#176e91"/><text x="56" y="129" fill="white" text-anchor="middle" font-size="20">1</text><text x="44" y="173" font-size="19" font-weight="700">家の入口・保管場所</text><text x="44" y="222" font-size="16">扉とエレベーターの幅</text><text x="44" y="265" font-size="16">畳んだ本体の置き場所</text><text x="44" y="308" font-size="16">持ち運ぶ部分の重さ</text><rect x="288" y="82" width="248" height="292" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="320" cy="122" r="18" fill="#176e91"/><text x="320" y="129" fill="white" text-anchor="middle" font-size="20">2</text><text x="308" y="173" font-size="19" font-weight="700">車のトランク</text><text x="308" y="222" font-size="16">開口部を通るか</text><text x="308" y="265" font-size="16">コットも一緒に入るか</text><text x="308" y="308" font-size="16">普段の荷物が残せるか</text><rect x="552" y="82" width="248" height="292" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="584" cy="122" r="18" fill="#176e91"/><text x="584" y="129" fill="white" text-anchor="middle" font-size="20">3</text><text x="572" y="173" font-size="19" font-weight="700">車と接続部品</text><text x="572" y="222" font-size="16">シートとベースの型番</text><text x="572" y="265" font-size="16">車の年式・使用座席</text><text x="572" y="308" font-size="16">本体とアダプターの適合</text></g></svg>