<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">砂糖入り飲料税の対象</title><desc id="d">対象になる炭酸飲料、砂糖入りフルーツ炭酸割り、アイスティー、エナジードリンク、ネクターや濃縮液、シロップと、対象外の甘味料入り飲料、牛乳、植物性の飲み物、果汁100%ジュースを分けた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">対象になる飲み物・ならない飲み物</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">砂糖を「加えた」飲み物が対象（法案）</text><rect x="60" y="175" width="530" height="430" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#b5473a"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#b5473a"/><text x="325" y="218" font-size="26" font-weight="700" fill="white" text-anchor="middle">対象になる</text><text x="95" y="290" font-size="22" fill="#29465f" text-anchor="start">● コーラなどの炭酸飲料</text><text x="95" y="342" font-size="22" fill="#29465f" text-anchor="start">● 砂糖入りフルーツの炭酸割り</text><text x="95" y="394" font-size="22" fill="#29465f" text-anchor="start">● アイスティー</text><text x="95" y="446" font-size="22" fill="#29465f" text-anchor="start">● エナジードリンク</text><text x="95" y="498" font-size="22" fill="#29465f" text-anchor="start">● 砂糖入りネクター・濃縮液</text><text x="95" y="550" font-size="22" fill="#29465f" text-anchor="start">● 砂糖入りシロップ</text><rect x="610" y="175" width="530" height="430" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="875" y="218" font-size="26" font-weight="700" fill="white" text-anchor="middle">対象にならない</text><text x="645" y="290" font-size="22" fill="#29465f" text-anchor="start">○ 甘味料の飲み物（ゼロ・ライト）</text><text x="645" y="350" font-size="22" fill="#29465f" text-anchor="start">○ 牛乳</text><text x="645" y="410" font-size="22" fill="#29465f" text-anchor="start">○ オーツ麦・米の飲み物</text><text x="645" y="470" font-size="22" fill="#29465f" text-anchor="start">○ 果汁100％・野菜100％ジュース</text><text x="645" y="530" font-size="22" fill="#29465f" text-anchor="start">○ 小規模な製造者（年7万L以下）※検討中</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦財務省 2026年10月14日（2026年10月29日参照）</text></g></svg>