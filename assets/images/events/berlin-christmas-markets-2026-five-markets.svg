<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">ベルリンの5つのクリスマスマーケットを比べる</title><desc id="desc">白いテントのジャンダルメンマルクト、シャルロッテンブルク宮殿前、観覧車のある赤の市庁舎前、追悼の場がある記念教会前、北欧の灯りが印象的なルチア市の5会場を、情報カードと編集部による模式イラストで紹介。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6ee"/><stop offset="1" stop-color="#e9e8df"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4e4e42" flood-opacity=".10"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="640" rx="23" fill="none" stroke="#c9bca3" stroke-width="2"/><g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif"><text x="54" y="83" font-size="41" font-weight="800" fill="#254538">ベルリン、5つの市に5つの風景</text><text x="56" y="124" font-size="22" fill="#657164">会場の雰囲気が伝わるミニガイド。実際の建築を正確に再現した絵ではありません。</text><g transform="translate(36 0)"><rect x="0" y="166" width="216" height="444" rx="20" fill="#fffefb" stroke="#ded6c8" stroke-width="2" filter="url(#shadow)"/><path d="M0 186Q0 166 20 166H196Q216 166 216 186V223H0Z" fill="#a67d43" opacity=".17"/><text x="108" y="204" font-size="19" font-weight="800" fill="#314f43" text-anchor="middle">01</text><rect x="13" y="236" width="190" height="190" rx="14" fill="#f1f0e9"/><g transform="translate(108 334) scale(.88)"><g><path d="M-85 68V8M-70 8V68M-55 8V68M-40 8V68M-25 8V68" stroke="#8a968e" stroke-width="4"/><path d="M-99 -5H-9M-89 -18H-19M-80 -38H-28" stroke="#748d82" stroke-width="9" stroke-linecap="round"/><path d="M8 35L37 -14L66 35Z" fill="#f6f7ef" stroke="#a88d71" stroke-width="4"/><path d="M-5 35L23 -5L51 35Z" fill="#fffdf6" stroke="#b9a48e" stroke-width="4"/><path d="M2 35H72V68H2Z" fill="#f8e9c8" stroke="#aa9370" stroke-width="4"/><path d="M-5 68H80" stroke="#ab8d63" stroke-width="8"/><circle cx="34" cy="52" r="10" fill="#e9b75b"/><circle cx="59" cy="52" r="5" fill="#c47f52"