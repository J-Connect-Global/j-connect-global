<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">NRWの冬のアイスリンク2026/27の開催期間</title><desc id="d">ケルン旧市街のリンクは2026年11月23日から2027年1月10日まで（12月24日と25日は休み）、エッセンのツォルフェアアインのリンクは12月5日から1月6日まで（12月24日、25日、31日は休み）。NRW州のクリスマス休暇は12月23日から1月6日。デュッセルドルフのリンクの期間は未確認</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#153452">リンクの期間と冬休み</text><text x="60" y="122" font-size="21" fill="#405a71">2026/27年シーズン</text><rect x="40" y="150" width="1120" height="470" rx="16" fill="white"/><line x1="300" y1="180" x2="300" y2="545" stroke="#e3dbd0" stroke-width="2"/><text x="300" y="585" font-size="18" fill="#405a71" text-anchor="middle">11月15日</text><line x1="518" y1="180" x2="518" y2="545" stroke="#e3dbd0" stroke-width="2"/><text x="518" y="585" font-size="18" fill="#405a71" text-anchor="middle">12月1日</text><line x1="708" y1="180" x2="708" y2="545" stroke="#e3dbd0" stroke-width="2"/><text x="708" y="585" font-size="18" fill="#405a71" text-anchor="middle">12月15日</text><line x1="940" y1="180" x2="940" y2="545" stroke="#e3dbd0" stroke-width="2"/><text x="940" y="585" font-size="18" fill="#405a71" text-anchor="middle">1月1日</text><line x1="1130" y1="180" x2="1130" y2="545" stroke="#e3dbd0" stroke-width="2"/><text x="1130" y="585" font-size="18" fill="#405a71" text-anchor="middle">1月15日</text><rect x="817" y="180" width="204" height="365" fill="#2e86c1" opacity="0.10"/><text x="919" y="200" font-size="16" fill="#1f618d" text-anchor="middle">NRW州のクリスマス休暇</text><text x="919" y="220" font-size="15" fill="#1f618d" text-anchor="middle">12/23〜1/6</text><text x="70" y="308" font-size="22" font-weight="700" fill="#153452">ケルン旧市街</text><rect x="408.9" y="283" width="666.7" height="36" rx="8" fill="#153452"/><rect x="830.7" y="283" width="27.2" height="36" fill="white" opacity="0.85"/><text x="70" y="338" font-size="16" fill="#405a71">11/23〜1/10（12/24・25休み）</text><text x="70" y="418" font-size="22" font-weight="700" fill="#153452">ツォルフェアアイン</text><rect x="572.1" y="393" width="449.0" height="36" rx="8" fill="#8d5a3c"/><rect x="830.7" y="393" width="27.2" height="36" fill="white" opacity="0.85"/><rect x="925.9" y="393" width="13.6" height="36" fill="white" opacity="0.85"/><text x="70" y="448" font-size="16" fill="#405a71">12/5〜1/6（12/24・25・31休み）</text><text x="70" y="515" font-size="22" font-weight="700" fill="#153452">デュッセルドルフ</text><rect x="354" y="495" width="776" height="34" rx="8" fill="none" stroke="#9aa8b4" stroke-width="3" stroke-dasharray="10 8"/><text x="640" y="518" font-size="17" fill="#405a71">2026/27年の期間は公式ページで確認</text></g></svg>