<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="冬タイヤは「日付」より「路面状況」"><rect width="960" height="440" rx="28" fill="#f4f7fc"/><rect x="0" y="0" width="960" height="12" rx="6" fill="#184c82"/><text x="44" y="74" font-family="sans-serif" font-size="32" font-weight="700" fill="#193451">冬タイヤは「日付」より「路面状況」</text><text x="44" y="116" font-family="sans-serif" font-size="19" fill="#455a75">ドイツでは固定の装着開始日が決められているわけではありません</text><rect x="44" y="154" width="277.3333333333333" height="240" rx="18" fill="#ffffff" stroke="#c9d8ec" stroke-width="2"/><rect x="63" y="178" width="7" height="45" rx="3" fill="#7391ba"/><text x="81" y="200" font-family="sans-serif" font-size="20" font-weight="700" fill="#1a3856">乾燥した道路</text><text x="64" y="255" font-family="sans-serif" font-size="21" fill="#214866">日付だけでは</text><text x="64" y="297" font-family="sans-serif" font-size="21" fill="#214866">義務にならない</text><rect x="341.3333333333333" y="154" width="277.3333333333333" height="240" rx="18" fill="#ffffff" stroke="#c9d8ec" stroke-width="2"/><rect x="360.3333333333333" y="178" width="7" height="45" rx="3" fill="#bf761e"/><text x="378.3333333333333" y="200" font-family="sans-serif" font-size="20" font-weight="700" fill="#1a3856">凍結・霜がある</text><text x="361.3333333333333" y="255" font-family="sans-serif" font-size="21" fill="#214866">適合タイヤが</text><text x="361.3333333333333" y="297" font-family="sans-serif" font-size="21" fill="#214866">必要</text><rect x="638.6666666666666" y="154" width="277.3333333333333" height="240" rx="18" fill="#ffffff" stroke="#c9d8ec" stroke-width="2"/><rect x="657.6666666666666" y="178" width="7" height="45" rx="3" fill="#a24d4d"/><text x="675.6666666666666" y="200" font-family="sans-serif" font-size="20" font-weight="700" fill="#1a3856">積雪・シャーベット</text><text x="658.6666666666666" y="255" font-family="sans-serif" font-size="21" fill="#214866">適合タイヤが</text><text x="658.6666666666666" y="297" font-family="sans-serif" font-size="21" fill="#214866">必要</text><text x="46" y="422" font-family="sans-serif" font-size="14" fill="#64758a">J-Connect Germany · 2026年10月20日確認 · 詳細と例外は記事本文・公式情報を参照</text></svg>
