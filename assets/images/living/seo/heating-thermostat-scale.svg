<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">暖房のつまみは温度の設定</title><desc id="desc">つまみの1は約12度、2は約16度、3は約20度、4は約24度、5は約28度。数字は温まる速さではなく目標の室温を表す。</desc><rect width="480" height="520" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">暖房のつまみは温度の設定</text><text x="24" y="78" font-size="18">数字は「速さ」ではなく「目標の室温」</text><g font-size="21"><rect x="20" y="104" width="440" height="56" rx="8" fill="#fff" stroke="#a7b6ca"/><text x="36" y="140">1</text><text x="100" y="140">約12℃　長期の不在</text><rect x="20" y="170" width="440" height="56" rx="8" fill="#fff" stroke="#a7b6ca"/><text x="36" y="206">2</text><text x="100" y="206">約16℃　下限・あまり使わない部屋</text><rect x="20" y="236" width="440" height="56" rx="8" fill="#e8f5ee" stroke="#1e8449" stroke-width="2"/><text x="36" y="272" font-weight="700">3</text><text x="100" y="272" font-weight="700">約20℃　居間</text><rect x="20" y="302" width="440" height="56" rx="8" fill="#fff" stroke="#a7b6ca"/><text x="36" y="338">4</text><text x="100" y="338">約24℃　暑く感じる</text><rect x="20" y="368" width="440" height="56" rx="8" fill="#fff" stroke="#a7b6ca"/><text x="36" y="404">5</text><text x="100" y="404">約28℃　通常は使わない</text></g><text x="24" y="460" font-size="17">寝室は2.5（約18℃）が目安</text><text x="24" y="488" font-size="15" fill="#5b6b82">機器によって差があります</text></g></svg>
