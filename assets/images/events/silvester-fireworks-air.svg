<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">花火による微小粒子状物質</title><desc id="d">連邦環境庁の推計で、花火から毎年約2,050トンのPM10が出て、そのうち約75%が大晦日の夜に集中し、ドイツ全体のPM10の1%近くにあたることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef1f6"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">花火と空気：微小粒子状物質（PM10）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦環境庁の推計</text><rect x="60" y="190" width="345" height="230" rx="16" fill="white"/><rect x="60" y="190" width="345" height="12" rx="6" fill="#b5473a"/><text x="232" y="300" font-size="46" font-weight="700" fill="#b5473a" text-anchor="middle">約2,050トン</text><text x="232" y="360" font-size="20" fill="#29465f" text-anchor="middle">花火から毎年出るPM10</text><rect x="425" y="190" width="345" height="230" rx="16" fill="white"/><rect x="425" y="190" width="345" height="12" rx="6" fill="#c9952a"/><text x="597" y="300" font-size="46" font-weight="700" fill="#c9952a" text-anchor="middle">約75%</text><text x="597" y="360" font-size="20" fill="#29465f" text-anchor="middle">そのうち大晦日の夜に出る割合</text><rect x="790" y="190" width="345" height="230" rx="16" fill="white"/><rect x="790" y="190" width="345" height="12" rx="6" fill="#2d6a9f"/><text x="962" y="300" font-size="46" font-weight="700" fill="#2d6a9f" text-anchor="middle">1%近く</text><text x="962" y="360" font-size="20" fill="#29465f" text-anchor="middle">ドイツ全体のPM10のうち花火の割合</text><rect x="60" y="445" width="1080" height="140" rx="16" fill="white"/><text x="90" y="500" font-size="21" fill="#29465f" text-anchor="start">・呼吸器の病気がある人や小さな子どもは、大晦日の夜は窓を閉めて家の中で</text><text x="90" y="544" font-size="21" fill="#29465f" text-anchor="start">・ペットは大きな音を怖がることが多いので、静かな部屋に</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦環境庁「大晦日の花火による微小粒子状物質」（2026年10月29日参照）</text></g></svg>