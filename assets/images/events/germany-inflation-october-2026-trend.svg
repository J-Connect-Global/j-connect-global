<svg width="1200" height="720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">ドイツの物価上昇率、2026年7月から10月</title>
<desc id="desc">前年同月比。10月は速報値。全体、食品とエネルギーを除く指数、エネルギーの上昇率を月別に比較する。</desc>
<rect width="1200" height="720" rx="28" fill="#f4f6f8"/>
<text x="72" y="86" font-size="34" font-weight="700" fill="#1f2937">ドイツの物価上昇率｜前年同月比</text>
<text x="72" y="132" font-size="21" fill="#4b5563">2026年7〜10月。10月は連邦統計局の速報値。</text>
