<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Kindergeld支給日の確認手順</title><desc id="desc">番号末尾を確認し、公式表で月の日付を探し、入金が見えない場合は口座と家族給付窓口からの連絡を順番に確認する3ステップ。</desc>
<rect width="1200" height="620" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="536" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="40" font-weight="800">支給日を確認する3ステップ</text>
<text x="90" y="148" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="21">番号末尾と対象月を確認してから、入金状況を調べます。</text>
<g transform="translate(88 194)"><rect width="320" height="240" rx="20" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><circle cx="44" cy="44" r="23" fill="#2f7771"/><text x="44" y="52" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">1</text><text x="28" y="98" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="25" font-weight="800">番号末尾を確認</text><text x="28" y="140" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">Kindergeld番号の</text><text x="28" y="170" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">最後の数字を見ます。</text></g>
<g transform="translate(440 194)"><rect width="320" height="240" rx="20" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><circle cx="44" cy="44" r="23" fill="#47658b"/><text x="44" y="52" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">2</text><text x="28" y="98" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="25" font-weight="800">月別表を確認</text><text x="28" y="140" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">対象月と末尾が交わる</text><text x="28" y="170" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">日付を公式表で探します。</text></g>
<g transform="translate(792 194)"><rect width="320" height="240" rx="20" fill="#f7eee3" stroke="#ead8c1" stroke-width="2"/><circle cx="44" cy="44" r="23" fill="#9a6130"/><text x="44" y="52" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">3</text><text x="28" y="98" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="25" font-weight="800">入金を確認</text><text x="28" y="140" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">見当たらなければ口座と</text><text x="28" y="170" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">家族給付窓口の連絡を確認。</text></g>
<text x="90" y="490" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="21" font-weight="700">注意</text><text x="90" y="527" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">週末・祝日は入金が前後する場合があります。支給日と支給額は別に確認してください。</text>
<text x="90" y="556" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜確認日：2026年10月26日</text>
</svg>