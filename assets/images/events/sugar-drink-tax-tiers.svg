<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">砂糖入り飲料税の2段階</title><desc id="d">100mlあたり砂糖5グラム未満は課税なし、5グラム以上8グラム未満は1リットル26セント、8グラム以上は1リットル32セントであることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">砂糖入り飲料税：砂糖の量で2段階</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">100mlあたりの砂糖の量と、1リットルあたりの税額（法案）</text><rect x="60" y="180" width="345" height="420" rx="16" fill="white"/><rect x="120" y="520" width="225" height="40" rx="12" fill="#2f8a64" opacity="0.9"/><text x="232" y="230" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">5g未満</text><text x="232" y="504" font-size="32" font-weight="700" fill="#2f8a64" text-anchor="middle">課税なし</text><text x="232" y="590" font-size="18" fill="#5b7086" text-anchor="middle"></text><rect x="425" y="180" width="345" height="420" rx="16" fill="white"/><rect x="485" y="360" width="225" height="200" rx="12" fill="#c9952a" opacity="0.9"/><text x="597" y="230" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">5g以上〜8g未満</text><text x="597" y="344" font-size="32" font-weight="700" fill="#c9952a" text-anchor="middle">26セント</text><text x="597" y="590" font-size="18" fill="#5b7086" text-anchor="middle">（1リットルあたり）</text><rect x="790" y="180" width="345" height="420" rx="16" fill="white"/><rect x="850" y="310" width="225" height="250" rx="12" fill="#b5473a" opacity="0.9"/><text x="962" y="230" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">8g以上</text><text x="962" y="294" font-size="32" font-weight="700" fill="#b5473a" text-anchor="middle">32セント</text><text x="962" y="590" font-size="18" fill="#5b7086" text-anchor="middle">（1リットルあたり）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">例：8g以上の1.5リットルなら約48セント。2027年7月1日導入予定（議決が必要）。出典：連邦財務省</text></g></svg>