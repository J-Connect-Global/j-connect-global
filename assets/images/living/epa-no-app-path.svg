<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ePAアプリを使わない場合の相談手順</title><desc id="desc">健康保険者のオンブズ窓口に連絡し、アクセス制限やアクセス履歴の取得方法を相談する。保険者とオンブズ窓口は診療記録の内容を閲覧できない。</desc>
<rect width="1200" height="600" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="516" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="39" font-weight="800">アプリを使わずにアクセス管理を相談する</text>
<g transform="translate(88 164)"><rect width="300" height="210" rx="18" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#2f7771"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">1</text><text x="24" y="94" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">加入先へ連絡</text><text x="24" y="133" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">健康保険者の</text><text x="24" y="160" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">相談・オンブズ窓口</text></g>
<path d="M410 268 H450" stroke="#9aa8ae" stroke-width="4" stroke-linecap="round"/><path d="M440 258 L452 268 L440 278" fill="none" stroke="#9aa8ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(468 164)"><rect width="300" height="210" rx="18" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#47658b"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">2</text><text x="24" y="94" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">希望を伝える</text><text x="24" y="133" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">施設ごとのアクセス</text><text x="24" y="160" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">制限や履歴の確認</text></g>
<path d="M790 268 H830" stroke="#9aa8ae" stroke-width="4" stroke-linecap="round"/><path d="M820 258 L832 268 L820 278" fill="none" stroke="#9aa8ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(848 164)"><rect width="264" height="210" rx="18" fill="#f7eee3" stroke="#ead8c1" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#9a6130"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">3</text><text x="24" y="94" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">結果を確認</text><text x="24" y="133" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">設定変更や履歴の</text><text x="24" y="160" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">受け取り方法を確認</text></g>
<rect x="88" y="412" width="1024" height="78" rx="15" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><text x="112" y="445" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19" font-weight="800">プライバシーのポイント</text><text x="112" y="472" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">健康保険者とオンブズ窓口は、ePA内の診療記録そのものを閲覧できません。</text>
<text x="90" y="526" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜確認日：2026年10月26日</text>
</svg>