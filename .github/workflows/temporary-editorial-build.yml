name: Temporary editorial artifact build

on:
  push:
    branches:
      - editorial/jc-content-cycle-20261028
    paths:
      - "content/registry/living.json"
      - "content/registry/events.json"
      - ".github/workflows/temporary-editorial-build.yml"

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: editorial/jc-content-cycle-20261028
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Convert original hero SVGs to optimized WebP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp
          for slug in minijob-grenze-2027 nrw-christmas-opening-hours-2026; do
            rsvg-convert -w 1024 -h 576 "assets/images/living/seo/${slug}-hero.svg" -o "/tmp/${slug}.png"
            cwebp -quiet -q 60 -m 6 "/tmp/${slug}.png" -o "assets/img/living/${slug}.webp"
          done
          git add assets/img/living/minijob-grenze-2027.webp assets/img/living/nrw-christmas-opening-hours-2026.webp

      - name: Build static pages and search artifacts
        run: npm run build

      - name: Run content and metadata validation
        run: npm run validate

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Check whitespace and protect unrelated systems
        shell: bash
        run: |
          git diff --check
          git fetch origin main --depth=1
          changed_paths="$(git diff --name-only origin/main...HEAD; git status --porcelain | sed 's/^...//')"
          printf '%s\n' "$changed_paths" | sort -u
          if printf '%s\n' "$changed_paths" | grep -E '^(apps-script/|assets/data/(community|jobs|learn-german)/|germany/ja/(community|jobs|learn-german)/)'; then
            echo "Refusing to commit: unrelated messaging, jobs or German-learning paths changed."
            exit 1
          fi

      - name: Commit generated editorial artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated layout differs slightly between repository configurations;
          # stage the validated working tree rather than naming optional paths.
          # The preceding guard rejects any changes to messaging, jobs or learning data.
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build generated pages for verified editorial content"
          git push origin editorial/jc-content-cycle-20261028
