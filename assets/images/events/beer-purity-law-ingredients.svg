<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ビールの材料の比較</title><desc id="d">1516年のビール純粋令の材料は大麦・ホップ・水の3つ、今の法律では下面発酵ビールは大麦麦芽・ホップ・酵母・水だけ、上面発酵ビールは小麦などの麦芽や決められた糖も使えること、バイエルンでは糖も使えないことを比べた図</desc><rect width="1200" height="675" rx="28" fill="#f6f1e7"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ビールの材料：1516年と今</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">材料は少ないまま、作り方で個性が生まれる</text><rect x="60" y="180" width="345" height="420" rx="16" fill="white"/><rect x="60" y="180" width="345" height="64" rx="16" fill="#8a5aa8"/><rect x="60" y="224" width="345" height="20" rx="0" fill="#8a5aa8"/><text x="232" y="222" font-size="21" font-weight="700" fill="white" text-anchor="middle">1516年 ビール純粋令</text><circle cx="100" cy="292" r="9" fill="#8a5aa8"/><text x="122" y="300" font-size="24" font-weight="700" fill="#153452" text-anchor="start">大麦</text><circle cx="100" cy="342" r="9" fill="#8a5aa8"/><text x="122" y="350" font-size="24" font-weight="700" fill="#153452" text-anchor="start">ホップ</text><circle cx="100" cy="392" r="9" fill="#8a5aa8"/><text x="122" y="400" font-size="24" font-weight="700" fill="#153452" text-anchor="start">水</text><text x="232" y="575" font-size="20" fill="#5b7086" text-anchor="middle">酵母はまだ知られていなかった</text><rect x="425" y="180" width="345" height="420" rx="16" fill="white"/><rect x="425" y="180" width="345" height="64" rx="16" fill="#2d6a9f"/><rect x="425" y="224" width="345" height="20" rx="0" fill="#2d6a9f"/><text x="597" y="222" font-size="21" font-weight="700" fill="white" text-anchor="middle">今：下面発酵（ピルスなど）</text><circle cx="465" cy="292" r="9" fill="#2d6a9f"/><text x="487" y="300" font-size="24" font-weight="700" fill="#153452" text-anchor="start">大麦麦芽</text><circle cx="465" cy="342" r="9" fill="#2d6a9f"/><text x="487" y="350" font-size="24" font-weight="700" fill="#153452" text-anchor="start">ホップ</text><circle cx="465" cy="392" r="9" fill="#2d6a9f"/><text x="487" y="400" font-size="24" font-weight="700" fill="#153452" text-anchor="start">酵母</text><circle cx="465" cy="442" r="9" fill="#2d6a9f"/><text x="487" y="450" font-size="24" font-weight="700" fill="#153452" text-anchor="start">水</text><text x="597" y="575" font-size="20" fill="#5b7086" text-anchor="middle">この4つだけ</text><rect x="790" y="180" width="345" height="420" rx="16" fill="white"/><rect x="790" y="180" width="345" height="64" rx="16" fill="#c9952a"/><rect x="790" y="224" width="345" height="20" rx="0" fill="#c9952a"/><text x="962" y="222" font-size="21" font-weight="700" fill="white" text-anchor="middle">今：上面発酵（ケルシュ・アルトなど）</text><circle cx="830" cy="292" r="9" fill="#c9952a"/><text x="852" y="300" font-size="24" font-weight="700" fill="#153452" text-anchor="start">麦芽（小麦なども可）</text><circle cx="830" cy="342" r="9" fill="#c9952a"/><text x="852" y="350" font-size="24" font-weight="700" fill="#153452" text-anchor="start">ホップ</text><circle cx="830" cy="392" r="9" fill="#c9952a"/><text x="852" y="400" font-size="24" font-weight="700" fill="#153452" text-anchor="start">酵母</text><circle cx="830" cy="442" r="9" fill="#c9952a"/><text x="852" y="450" font-size="24" font-weight="700" fill="#153452" text-anchor="start">水</text><circle cx="830" cy="492" r="9" fill="#c9952a"/><text x="852" y="500" font-size="24" font-weight="700" fill="#153452" text-anchor="start">決められた糖</text><text x="962" y="575" font-size="20" fill="#5b7086" text-anchor="middle">バイエルンでは糖も不可</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：インゴルシュタット市、ドイツ醸造者連盟、連邦議会調査局（暫定ビール法9条）、LGL</text></g></svg>