<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツ側と日本側の手続き</title><desc id="d">本帰国の手続きを、ドイツ側の住民登録の抹消、放送負担金、健康保険、銀行、年金、税金と、日本側の帰国届、転入届、国民年金、国民健康保険に分けて、手続きの先と期限を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">手続きの先は、ドイツ側と日本側</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">主な手続きと期限</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">ドイツ側</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">住民登録の抹消：引っ越しの前後2週間</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">放送負担金：住民登録の抹消の後に届け出</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">健康保険：保険組合に脱退の連絡</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">銀行：還付金の受け取りまで残すことも</text><text x="95" y="533" font-size="20" fill="#29465f" text-anchor="start">年金・税金：払い戻しの判断、最後の申告</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#b5473a"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#b5473a"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">日本側</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">帰国届：在外公館に（オンラインも可）</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">転入届：住所を決めてから14日以内</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">国民年金：20歳以上60歳未満は市区町村で</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">国民健康保険：14日以内に市区町村で</text><text x="645" y="533" font-size="20" fill="#29465f" text-anchor="start">運転免許・子どもの編入</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：外務省、日本年金機構、厚生労働省など（2026年10月29日参照）</text></g></svg>