<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>日本へ小包を出す前の5点チェック</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="46" fill="#173B48">日本へ小包を出す前の5点チェック</text><text x="48" y="176" font-size="26" fill="#52666C">DHLの海外発送チェックリストをもとに整理</text><g font-size="31"><rect x="48" y="204" width="1104" height="78" rx="14" fill="#FFFFFF"/><circle cx="96" cy="243" r="24" fill="#146859"/><text x="87" y="254" fill="#FFFFFF" font-size="30">1</text><text x="140" y="254" fill="#173B48">送れない物がない（電池・香水・スプレー・肉製品・植物）</text><rect x="48" y="294" width="1104" height="78" rx="14" fill="#FFFFFF"/><circle cx="96" cy="333" r="24" fill="#146859"/><text x="87" y="344" fill="#FFFFFF" font-size="30">2</text><text x="140" y="344" fill="#173B48">丈夫な箱と緩衝材。ひもやリボンで縛らない</text><rect x="48" y="384" width="1104" height="78" rx="14" fill="#FFFFFF"/><circle cx="96" cy="423" r="24" fill="#146859"/><text x="87" y="434" fill="#FFFFFF" font-size="30">3</text><text x="140" y="434" fill="#173B48">国際用の料金。追跡・補償が必要ならPaket</text><rect x="48" y="474" width="1104" height="78" rx="14" fill="#FFFFFF"/><circle cx="96" cy="513" r="24" fill="#146859"/><text x="87" y="524" fill="#FFFFFF" font-size="30">4</text><text x="140" y="524" fill="#173B48">日本の住所を完全に。ドイツの差出人住所も書く</text><rect x="48" y="564" width="1104" height="78" rx="14" fill="#FFFFFF"/><circle cx="96" cy="603" r="24" fill="#C2410C"/><text x="87" y="614" fill="#FFFFFF" font-size="30">5</text><text x="140" y="614" fill="#173B48">税関申告書CN22/CN23：品名と価格をラテン文字で</text></g><text x="48" y="664" font-size="18" fill="#52666C">図解：J-Connect  |  根拠：DHL・ドイツ税関  |  2026-11-01</text></g></svg>
