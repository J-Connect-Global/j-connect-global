<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">老後資金口座の補助</title><desc id="d">年間の積み立てのうち最初の360ユーロに50%、360ユーロから1,800ユーロまでに25%の補助が付き、合計で最大540ユーロになること、積み立ての上限は6,840ユーロであることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">老後資金口座：国の補助のしくみ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">自分で積み立てた年間の金額に応じて補助が付く</text><rect x="60" y="180" width="1080" height="190" rx="16" fill="white"/><rect x="100" y="230" width="200" height="70" rx="10" fill="#2d6a9f"/><rect x="304" y="230" width="796" height="70" rx="10" fill="#7fa9cf"/><text x="200" y="275" font-size="28" font-weight="700" fill="white" text-anchor="middle">50％</text><text x="700" y="275" font-size="28" font-weight="700" fill="white" text-anchor="middle">25％</text><text x="100" y="335" font-size="20" fill="#405a71" text-anchor="middle">0</text><text x="300" y="335" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">360ユーロ</text><text x="1100" y="335" font-size="20" font-weight="700" fill="#153452" text-anchor="end">1,800ユーロ</text><rect x="60" y="395" width="345" height="120" rx="16" fill="white"/><text x="232" y="442" font-size="23" font-weight="700" fill="#405a71" text-anchor="middle">最初の360ユーロ</text><text x="232" y="490" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="middle">補助 最大180ユーロ</text><rect x="425" y="395" width="345" height="120" rx="16" fill="white"/><text x="597" y="442" font-size="23" font-weight="700" fill="#405a71" text-anchor="middle">360〜1,800ユーロ</text><text x="597" y="490" font-size="28" font-weight="700" fill="#5a88b5" text-anchor="middle">補助 最大360ユーロ</text><rect x="790" y="395" width="345" height="120" rx="16" fill="white"/><text x="962" y="442" font-size="23" font-weight="700" fill="#405a71" text-anchor="middle">合計</text><text x="962" y="490" font-size="28" font-weight="700" fill="#c9952a" text-anchor="middle">最大540ユーロ／年</text><rect x="60" y="535" width="1080" height="72" rx="16" fill="#fff7e6"/><text x="90" y="580" font-size="23" font-weight="700" fill="#8a5a00" text-anchor="start">積み立ては年6,840ユーロまで。補助の対象は1,800ユーロまで</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦財務省（2026年10月29日参照）</text></g></svg>