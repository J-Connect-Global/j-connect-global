<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">子どもの看病手当の日数</title><desc id="d">子どもの看病手当は親1人につき子ども1人あたり年15日、子どもが複数なら上限35日、ひとり親は子ども1人あたり30日で上限70日、手当は手取りの原則90%であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">子どもの看病で休める日数（2026年）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">公的な健康保険・原則12歳未満の子ども</text><rect x="60" y="175" width="530" height="260" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">ふたり親（親1人あたり）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">子ども1人につき：年15日</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">子どもが複数：上限35日</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">（働く日で数える）</text><rect x="610" y="175" width="530" height="260" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#8a5aa8"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#8a5aa8"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">ひとり親</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">子ども1人につき：年30日</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">子どもが複数：上限70日</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">（働く日で数える）</text><rect x="60" y="460" width="1080" height="130" rx="16" fill="#fff7e6"/><text x="90" y="505" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">手当は、失った手取りの給与の原則90％</text><text x="90" y="548" font-size="21" fill="#29465f" text-anchor="start">条件を満たせば、看病のための証明は電話でもらえることも</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：TK（2026年10月29日参照）</text></g></svg>