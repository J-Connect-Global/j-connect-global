<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">現金が選ばれる理由</title><desc id="d">支出を把握しやすい（41%）、プライバシーを守れる（63%）、停電や障害にも強い、子どもがお金を学べる、習慣、そして現金を最も好きな方法に挙げた人は28%であることをまとめた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">それでも現金が選ばれる理由</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ドイツ連邦銀行の調査から</text><rect x="60" y="180" width="530" height="122" rx="16" fill="white"/><rect x="60" y="180" width="16" height="122" rx="8" fill="#c9952a"/><text x="105" y="235" font-size="27" font-weight="700" fill="#153452" text-anchor="start">支出を把握しやすい</text><text x="105" y="275" font-size="21" fill="#405a71" text-anchor="start">2023年調査で41%が挙げる</text><rect x="610" y="180" width="530" height="122" rx="16" fill="white"/><rect x="610" y="180" width="16" height="122" rx="8" fill="#2d6a9f"/><text x="655" y="235" font-size="27" font-weight="700" fill="#153452" text-anchor="start">プライバシーを守れる</text><text x="655" y="275" font-size="21" fill="#405a71" text-anchor="start">2023年調査で63%が挙げる</text><rect x="60" y="320" width="530" height="122" rx="16" fill="white"/><rect x="60" y="320" width="16" height="122" rx="8" fill="#b5473a"/><text x="105" y="375" font-size="27" font-weight="700" fill="#153452" text-anchor="start">停電や障害にも強い</text><text x="105" y="415" font-size="21" fill="#405a71" text-anchor="start">2025年の月報で最も重視</text><rect x="610" y="320" width="530" height="122" rx="16" fill="white"/><rect x="610" y="320" width="16" height="122" rx="8" fill="#2f8a64"/><text x="655" y="375" font-size="27" font-weight="700" fill="#153452" text-anchor="start">子どもがお金を学べる</text><text x="655" y="415" font-size="21" fill="#405a71" text-anchor="start">2025年の月報で挙げられた</text><rect x="60" y="460" width="530" height="122" rx="16" fill="white"/><rect x="60" y="460" width="16" height="122" rx="8" fill="#8a5aa8"/><text x="105" y="515" font-size="27" font-weight="700" fill="#153452" text-anchor="start">いつもの習慣</text><text x="105" y="555" font-size="21" fill="#405a71" text-anchor="start">アプリがあっても現金の人の主な理由</text><rect x="610" y="460" width="530" height="122" rx="16" fill="white"/><rect x="610" y="460" width="16" height="122" rx="8" fill="#405a71"/><text x="655" y="515" font-size="27" font-weight="700" fill="#153452" text-anchor="start">「現金がいちばん好き」</text><text x="655" y="555" font-size="21" fill="#405a71" text-anchor="start">2023年調査では28%</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ連邦銀行「ドイツの支払い行動」2023年・2025年、月報2025年4月（2026年10月27日参照）</text></g></svg>