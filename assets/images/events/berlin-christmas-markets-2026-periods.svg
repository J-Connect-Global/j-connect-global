<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ベルリンの主なクリスマスマーケットの2026年の期間</title><desc id="d">ベルリンの主な五つの市の2026年の期間を横棒で比較した図。記念教会前は11月13日から、ほかは11月23日から始まり、ルチア市は12月22日、シャルロッテンブルクは12月27日、ジャンダルメンマルクトは12月31日、赤の市庁舎と記念教会前は1月3日まで</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ベルリンの主な市：2026年の期間</text><text x="60" y="134" font-size="22" fill="#405a71">多くの市は死者の日曜日の翌日、11月23日に開幕</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="438" y1="190" x2="438" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="438" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/13</text><line x1="565" y1="190" x2="565" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="565" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/23</text><line x1="666" y1="190" x2="666" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="666" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/1</text><line x1="958" y1="190" x2="958" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="958" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/24</text><line x1="1085" y1="190" x2="1085" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="1085" y="594" font-size="18" fill="#405a71" text-anchor="middle">1/3</text><text x="84" y="226" font-size="24" font-weight="700" fill="#153452">ジャンダルメン</text><text x="84" y="250" font-size="16" fill="#405a71">マルクト</text><rect x="565" y="205" width="494" height="34" rx="8" fill="#c9a227"/><text x="1069" y="259" font-size="15" fill="#7a3b2e" text-anchor="end">12/31まで</text><text x="84" y="301" font-size="24" font-weight="700" fill="#153452">シャルロッテン</text><text x="84" y="325" font-size="16" fill="#405a71">ブルク宮殿前</text><rect x="565" y="280" width="444" height="34" rx="8" fill="#2f6a40"/><rect x="958" y="276" width="13" height="42" fill="white"/><text x="1019" y="334" font-size="15" fill="#7a3b2e" text-anchor="end">12/24休業</text><text x="84" y="376" font-size="24" font-weight="700" fill="#153452">赤の市庁舎前</text><rect x="565" y="355" width="532" height="34" rx="8" fill="#b5473a"/><rect x="958" y="351" width="13" height="42" fill="white"/><text x="1107" y="409" font-size="15" fill="#7a3b2e" text-anchor="end">12/24休業</text><text x="84" y="451" font-size="24" font-weight="700" fill="#153452">記念教会前</text><text x="84" y="475" font-size="16" fill="#405a71">ブライトシャイト広場</text><rect x="438" y="430" width="659" height="34" rx="8" fill="#2b5c8a"/><text x="84" y="526" font-size="24" font-weight="700" fill="#153452">ルチア市</text><text x="84" y="550" font-size="16" fill="#405a71">クルトゥーアブラウエライ</text><rect x="565" y="505" width="380" height="34" rx="8" fill="#7a5233"/><text x="955" y="559" font-size="15" fill="#7a3b2e" text-anchor="start">12/22まで</text><text x="60" y="645" font-size="18" fill="#405a71">白い切れ目は休業日。最新情報は各公式案内で確認（2026年11月1日参照）</text></g></svg>