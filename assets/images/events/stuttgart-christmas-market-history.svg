<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">シュトゥットガルトのクリスマスマーケットの歩み</title><desc id="d">1507年の屋台使用料の権利、クリスマス前の火曜から土曜の幼子キリストの市、三十年戦争による中断と1643年以降の再開、1692年の最初の記録、2026年11月25日の開幕を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">シュトゥットガルトの市の歩み</text><text x="60" y="134" font-size="22" fill="#405a71">戦乱で途絶えながらも続き、年間350万〜400万人が訪れる市へ</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="110" y1="380" x2="1090" y2="380" stroke="#8d5a3c" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="130" y1="380" x2="130" y2="332" stroke="#153452" stroke-width="2"/><text x="130" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1507年</text><text x="130" y="292" font-size="18" fill="#405a71" text-anchor="middle">公が屋台使用料の</text><text x="130" y="316" font-size="18" fill="#405a71" text-anchor="middle">権利を街に与える</text><circle cx="322" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="322" y1="380" x2="322" y2="428" stroke="#153452" stroke-width="2"/><text x="322" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">16〜17世紀</text><text x="322" y="502" font-size="18" fill="#405a71" text-anchor="middle">クリスマス前の</text><text x="322" y="526" font-size="18" fill="#405a71" text-anchor="middle">火〜土曜に市が立つ</text><circle cx="514" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="514" y1="380" x2="514" y2="332" stroke="#153452" stroke-width="2"/><text x="514" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">三十年戦争</text><text x="514" y="292" font-size="18" fill="#405a71" text-anchor="middle">戦乱で</text><text x="514" y="316" font-size="18" fill="#405a71" text-anchor="middle">商いが途絶える</text><circle cx="706" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="706" y1="380" x2="706" y2="428" stroke="#153452" stroke-width="2"/><text x="706" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1643年以降</text><text x="706" y="502" font-size="18" fill="#405a71" text-anchor="middle">再び市の話が</text><text x="706" y="526" font-size="18" fill="#405a71" text-anchor="middle">聞かれるように</text><circle cx="898" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="898" y1="380" x2="898" y2="332" stroke="#153452" stroke-width="2"/><text x="898" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1692年</text><text x="898" y="292" font-size="18" fill="#405a71" text-anchor="middle">市が初めて</text><text x="898" y="316" font-size="18" fill="#405a71" text-anchor="middle">文書に登場</text><circle cx="1090" cy="380" r="13" fill="#b23a3a" stroke="white" stroke-width="4"/><line x1="1090" y1="380" x2="1090" y2="428" stroke="#153452" stroke-width="2"/><text x="1090" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">2026年</text><text x="1090" y="502" font-size="18" fill="#405a71" text-anchor="middle">11月25日に開幕</text><text x="1090" y="526" font-size="18" fill="#405a71" text-anchor="middle">12月23日まで</text></g></svg>