<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アウトバーンの速度制限のない区間の割合</title><desc id="d">2015年の連邦道路研究所の調査で、アウトバーンの上下線別延長約25,767kmのうち約70.4%に速度制限がなく、残り約3割に常設または可変の制限があること、推奨速度は130km/hであることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">アウトバーンの約7割は「速度制限なし」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">上下線別の延長 約25,767km（2015年、工事区間を除く）</text><rect x="60" y="200" width="1080" height="120" rx="20" fill="white"/><rect x="80" y="220" width="732" height="80" rx="12" fill="#2d6a9f"/><rect x="818" y="220" width="302" height="80" rx="12" fill="#c9952a"/><text x="446" y="272" font-size="32" font-weight="700" fill="white" text-anchor="middle">制限なし 約70.4%</text><text x="969" y="272" font-size="26" font-weight="700" fill="white" text-anchor="middle">制限あり 約3割</text><rect x="60" y="350" width="520" height="240" rx="16" fill="white"/><text x="90" y="400" font-size="26" font-weight="700" fill="#2d6a9f" text-anchor="start">制限なしの区間でも</text><text x="90" y="445" font-size="30" font-weight="700" fill="#153452" text-anchor="start">推奨速度は 130km/h</text><text x="90" y="490" font-size="22" fill="#405a71" text-anchor="start">罰金はないが、事故のときに</text><text x="90" y="525" font-size="22" fill="#405a71" text-anchor="start">責任が重くなることがある</text><text x="90" y="565" font-size="20" fill="#5b7086" text-anchor="start">（約18,115km）</text><rect x="620" y="350" width="520" height="240" rx="16" fill="white"/><text x="650" y="400" font-size="26" font-weight="700" fill="#c9952a" text-anchor="start">制限のある区間</text><text x="650" y="445" font-size="22" fill="#29465f" text-anchor="start">・常設の標識（120・100・80km/h）</text><text x="650" y="487" font-size="22" fill="#29465f" text-anchor="start">・電光掲示で変わる制限</text><text x="650" y="529" font-size="22" fill="#29465f" text-anchor="start">・トラックは常に80km/h</text><text x="650" y="571" font-size="22" fill="#29465f" text-anchor="start">・視界50m未満は50km/h</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦道路研究所（BASt）2015年、アウトバーン推奨速度令、StVO（2026年10月26日参照）</text></g></svg>