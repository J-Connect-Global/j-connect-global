<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>日本人が職業訓練を受けて就職するまでの流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">職業訓練から就職までの流れ</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">ドイツ語B1を準備する</text><text x="128" y="213" font-size="20" fill="#52666C">多くの訓練で必要。訓練先探しの滞在も条件はB1</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">訓練先に応募して契約</text><text x="128" y="303" font-size="20" fill="#52666C">開始は8〜9月が多い。大企業は1年前から募集</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">職業訓練の滞在許可を申請</text><text x="128" y="393" font-size="20" fill="#52666C">訓練とは別に週20時間まで働ける</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">2〜3年半の訓練と修了試験</text><text x="128" y="483" font-size="20" fill="#52666C">手当は2027年開始で1年目764ユーロ以上</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">就職して専門人材の許可へ</text><text x="128" y="573" font-size="20" fill="#52666C">見つからなければ最長18か月の求職期間</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">訓練先を探す滞在</text><text x="788" y="268" font-size="32" fill="#173B48">最長9か月</text><text x="788" y="328" font-size="21" fill="#52666C">35歳未満</text><text x="788" y="360" font-size="21" fill="#52666C">大学入学資格にあたる学歴</text><text x="788" y="392" font-size="21" fill="#52666C">ドイツ語B1と生活費</text><text x="788" y="424" font-size="21" fill="#52666C">週20時間までのアルバイトと</text><text x="788" y="456" font-size="21" fill="#52666C">合計2週間の試用ができる</text><text x="48" y="622" font-size="22" fill="#173B48">ドイツで訓練を修了した専門人材は、永住許可までの期間が短くなる特例があります。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第16a条・第17条・第18a条・第18c条・第20条  |  2026-11-06</text></g></svg>