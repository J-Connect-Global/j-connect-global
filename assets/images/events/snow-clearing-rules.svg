<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">NRW3市の歩道の雪かきルール</title>
<desc id="d">デュッセルドルフの歩道幅は1メートル、ケルンとエルクラートは1.5メートル。平日は7時、日曜祝日は9時までに対応し、塩は原則禁止であることを比較した図</desc>
<rect width="1200" height="675" rx="28" fill="#eef5fb"/>
<g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="75" font-size="38" font-weight="700" fill="#153452">NRW3市の歩道の雪かきルール</text>
<text x="60" y="116" font-size="21" fill="#405a71">幅は市によって違う。時間と塩の例外も条例で確認</text>
<rect x="60" y="148" width="340" height="238" rx="18" fill="#ffffff"/>
<text x="88" y="190" font-size="24" font-weight="700" fill="#2d6a9f">デュッセルドルフ</text>
<text x="88" y="247" font-size="42" font-weight="700" fill="#153452">1m</text>
<text x="88" y="282" font-size="18" fill="#29465f">歩道を空ける幅</text>
<text x="88" y="326" font-size="18" fill="#29465f">塩は原則禁止</text>
<text x="88" y="355" font-size="17" fill="#5b7086">住民は砂・砂利。市の業者に限定例外</text>
<rect x="430" y="148" width="340" height="238" rx="18" fill="#ffffff"/>
<text x="458" y="190" font-size="24" font-weight="700" fill="#2f8a64">ケルン</text>
<text x="458" y="247" font-size="42" font-weight="700" fill="#153452">1.5m</text>
<text x="458" y="282" font-size="18" fill="#29465f">歩道を空ける幅</text>
<text x="458" y="326" font-size="18" fill="#29465f">塩は原則禁止</text>
<text x="458" y="355" font-size="17" fill="#5b7086">凍雨・危険箇所に例外</text>
<rect x="800" y="148" width="340" height="238" rx="18" fill="#ffffff"/>
<text x="828" y="190" font-size="24" font-weight="700" fill="#8a5aa8">エルクラート</text>
<text x="828" y="247" font-size="42" font-weight="700" fill="#153452">1.5m</text>
<text x="828" y="282" font-size="18" fill="#29465f">歩道を空ける幅</text>
<text x="828" y="326" font-size="18" fill="#29465f">塩は原則禁止</text>
<text x="828" y="355" font-size="17" fill="#5b7086">凍雨・危険箇所に例外</text>
<rect x="60" y="408" width="1080" height="142" rx="18" fill="#ffffff"/>
<text x="90" y="449" font-size="22" font-weight="700" fill="#153452">作業時間の目安（3市の案内・条例）</text>
<text x="90" y="490" font-size="21" fill="#29465f">平日：7時まで　｜　日曜・祝日：9時まで　｜　20時以降の雪：翌朝7時または9時まで</text>
<text x="90" y="525" font-size="18" fill="#5b7086">砂や細かい砂利を使い、排水口・消火栓をふさがない</text>
<text x="60" y="632" font-size="17" fill="#5b7086">出典：デュッセルドルフ市、ケルン市、エルクラート市（2026年11月18日確認）</text>
</g></svg>