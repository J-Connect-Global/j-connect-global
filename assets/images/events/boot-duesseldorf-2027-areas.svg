<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ボート・デュッセルドルフの主な分野</title><desc id="d">モーターボート、帆船とヨット、大型ヨット、ダイビング、サーフィン、カヌーなどの分野ごとに展示が分かれ、子ども連れは水槽や波のプールなど動きのある展示から回ると良いことを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ボート：ホールごとに違う水辺の世界</text><text x="60" y="134" font-size="22" fill="#405a71">船を買わなくても、見て・体験して楽しめる</text><rect x="60" y="170" width="345" height="185" rx="16" fill="white"/><rect x="60" y="170" width="12" height="185" rx="6" fill="#2a6f97"/><text x="100" y="245" font-size="30" font-weight="700" fill="#2a6f97">モーターボート</text><text x="100" y="295" font-size="22" fill="#405a71">速さと快適さ</text><rect x="425" y="170" width="345" height="185" rx="16" fill="white"/><rect x="425" y="170" width="12" height="185" rx="6" fill="#153452"/><text x="465" y="245" font-size="30" font-weight="700" fill="#153452">帆船・ヨット</text><text x="465" y="295" font-size="22" fill="#405a71">風で走る船</text><rect x="790" y="170" width="345" height="185" rx="16" fill="white"/><rect x="790" y="170" width="12" height="185" rx="6" fill="#8d5a3c"/><text x="830" y="245" font-size="30" font-weight="700" fill="#8d5a3c">大型ヨット</text><text x="830" y="295" font-size="22" fill="#405a71">豪華な内装</text><rect x="60" y="375" width="345" height="185" rx="16" fill="white"/><rect x="60" y="375" width="12" height="185" rx="6" fill="#2a9d8f"/><text x="100" y="450" font-size="30" font-weight="700" fill="#2a9d8f">ダイビング</text><text x="100" y="500" font-size="22" fill="#405a71">水槽と潜水塔</text><rect x="425" y="375" width="345" height="185" rx="16" fill="white"/><rect x="425" y="375" width="12" height="185" rx="6" fill="#e76f51"/><text x="465" y="450" font-size="30" font-weight="700" fill="#e76f51">サーフィン</text><text x="465" y="500" font-size="22" fill="#405a71">屋内の波</text><rect x="790" y="375" width="345" height="185" rx="16" fill="white"/><rect x="790" y="375" width="12" height="185" rx="6" fill="#2f6a40"/><text x="830" y="450" font-size="30" font-weight="700" fill="#2f6a40">カヌーなど</text><text x="830" y="500" font-size="22" fill="#405a71">川や湖の小舟</text><text x="60" y="625" font-size="20" fill="#153452" font-weight="700">子ども連れは、水槽や波のプールなど動きのある展示から回ると飽きにくい</text><text x="60" y="655" font-size="17" fill="#405a71">主な分野を整理した図。ホールの割り当ては年によって変わるため、公式サイトの会場図で確認（2026年10月30日参照）</text></g></svg>