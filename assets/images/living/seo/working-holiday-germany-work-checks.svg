<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ワーキングホリデー中に働くときの確認点</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ワーホリで働くときの5つの確認</text><text x="48" y="152" font-size="23" fill="#52666C">違法な低賃金や、保険・税金の思わぬ負担を避けるために</text><rect x="248" y="176" width="488" height="50" rx="10" fill="#173B48"/><text x="264" y="210" font-size="24" fill="#FFFFFF">確認すること</text><rect x="748" y="176" width="392" height="50" rx="10" fill="#146859"/><text x="764" y="210" font-size="24" fill="#FFFFFF">目安・根拠</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">最低賃金</text><text x="264" y="272" font-size="26" fill="#173B48">時給がこれを下回っていないか</text><text x="764" y="272" font-size="26" fill="#C2410C">26年13.90・27年14.60ユーロ</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">ミニジョブ</text><text x="264" y="336" font-size="26" fill="#173B48">月の収入が上限内か</text><text x="764" y="336" font-size="26" fill="#173B48">2027年は月633ユーロ</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">雇用契約</text><text x="264" y="400" font-size="26" fill="#173B48">時給・時間・休暇を書面で</text><text x="764" y="400" font-size="26" fill="#173B48">口約束だけにしない</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">給与明細</text><text x="264" y="464" font-size="26" fill="#173B48">税金・社会保険料の差し引き</text><text x="764" y="464" font-size="26" fill="#173B48">翌年の確定申告で還付も</text><rect x="48" y="486" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="528" font-size="24" fill="#52666C">健康保険</text><text x="264" y="528" font-size="26" fill="#173B48">仕事で加入先が変わるか</text><text x="764" y="528" font-size="26" fill="#173B48">雇用主に確認</text><text x="48" y="622" font-size="22" fill="#173B48">最低賃金は総支給額（税・社会保険料を引く前）の時給です。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：最低賃金法、社会法典第4編第8条  |  2026-11-06</text></g></svg>