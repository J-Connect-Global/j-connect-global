name: Content cycle generated output preview

on:
  push:
    branches:
      - codex/content-cycle-20261024

permissions:
  contents: read

jobs:
  build-generated-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci
      - name: Build generated site files
        run: npm run build
      - name: Package only changed content outputs
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/content-cycle-generated"
          mkdir -p "$out"
          git ls-files -m -o --exclude-standard | grep -E '^(content/registry/(living|events)\.json|germany/ja/index\.html|germany/ja/living/.*|germany/ja/events/.*|assets/data/search-index\.json|assets/js/search-index\.js|sitemap\.xml)$' > "$out/changed-files.txt" || true
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done < "$out/changed-files.txt"
          test -s "$out/changed-files.txt"
          echo "Packaged $(wc -l < "$out/changed-files.txt") changed path(s)."
      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: content-cycle-generated-output
          path: /tmp/content-cycle-generated/
          if-no-files-found: error
          retention-days: 1
