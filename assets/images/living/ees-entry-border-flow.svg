<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">EESの国境手続きの流れ</title>
  <desc id="desc">シェンゲン圏外から入る短期旅行者は、最初に入るEES参加国の外部国境でパスポート確認と必要な生体情報の登録・照合を受け、その後の入出国が電子記録されます。</desc>
  <rect width="1200" height="600" rx="28" fill="#f4f6f8"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#243447">EESは「最初の外部国境」で手続き</text>
  <g font-family="Arial, sans-serif" fill="#243447">
    <rect x="55" y="140" width="230" height="220" rx="20" fill="#ffffff" stroke="#8b9aa8" stroke-width="2"/>
    <circle cx="170" cy="190" r="28" fill="#e8edf2"/>
    <text x="170" y="199" text-anchor="middle" font-size="25" font-weight="700">1</text>
    <text x="170" y="247" text-anchor="middle" font-size="21" font-weight="700">シェンゲン圏外</text>
    <text x="170" y="281" text-anchor="middle" font-size="18">から出発</text>
    <text x="170" y="322" text-anchor="middle" font-size="16" fill="#526171">例：日本からの直行便</text>
    <path d="M292 250 H330" stroke="#6c7f90" stroke-width="4" stroke-linecap="round"/>
    <path d="M319 239 L331 250 L319 261" fill="none" stroke="#6c7f90" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="340" y="140" width="230" height="220" rx="20" fill="#ffffff" stroke="#2d6a8a" stroke-width="2"/>
    <circle cx="455" cy="190" r="28" fill="#eaf2f7"/>
    <text x="455" y="199" text-anchor="middle" font-size="25" font-weight="700">2</text>
    <text x="455" y="247" text-anchor="middle" font-size="21" font-weight="700">最初の参加国</text>
    <text x="455" y="281" text-anchor="middle" font-size="18">外部国境へ</text>
    <text x="455" y="322" text-anchor="middle" font-size="16" fill="#526171">例：パリ経由なら通常フランス</text>
    <path d="M577 250 H615" stroke="#6c7f90" stroke-width="4" stroke-linecap="round"/>
    <path d="M604 239 L616 250 L604 261" fill="none" stroke="#6c7f90" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="625" y="140" width="230" height="220" rx="20" fill="#ffffff" stroke="#2f7b72" stroke-width="2"/>
    <circle cx="740" cy="190" r="28" fill="#e8f4f1"/>
    <text x="740" y="199" text-anchor="middle" font-size="25" font-weight="700">3</text>
    <text x="740" y="247" text-anchor="middle" font-size="21" font-weight="700">本人確認</text>
    <text x="740" y="281" text-anchor="middle" font-size="18">顔画像・指紋など</text>
    <text x="740" y="322" text-anchor="middle" font-size="16" fill="#526171">対象者の登録・照合</text>
    <path d="M862 250 H900" stroke="#6c7f90" stroke-width="4" stroke-linecap="round"/>
    <path d="M889 239 L901 250 L889 261" fill="none" stroke="#6c7f90" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="910" y="140" width="235" height="220" rx="20" fill="#ffffff" stroke="#2d6a8a" stroke-width="2"/>
    <circle cx="1027" cy="190" r="28" fill="#eaf2f7"/>
    <text x="1027" y="199" text-anchor="middle" font-size="25" font-weight="700">4</text>
    <text x="1027" y="247" text-anchor="middle" font-size="21" font-weight="700">電子記録</text>
    <text x="1027" y="281" text-anchor="middle" font-size="18">入国・出国を記録</text>
    <text x="1027" y="322" text-anchor="middle" font-size="16" fill="#526171">手作業のスタンプに代わる</text>
  </g>
  <rect x="85" y="410" width="1030" height="115" rx="18" fill="#ffffff" stroke="#d3dbe2" stroke-width="2"/>
  <text x="600" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243447">シェンゲン圏内の国を移動するたびに登録する仕組みではありません</text>
  <text x="600" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526171">EESは入国条件や「180日間のうち最大90日」という滞在上限を変更しません</text>
</svg>
