<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">在外選挙の投票方法</title><desc id="d">在外選挙の投票方法は、在外公館の会場で投票する在外公館投票、投票用紙を請求して郵便で送り返す郵便投票、一時帰国中に日本で投票する日本国内での投票の3つで、どれも在外選挙人証が必要であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">在外選挙：3つの投票方法</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">どれも在外選挙人証が必要</text><rect x="60" y="180" width="346" height="250" rx="16" fill="white"/><rect x="60" y="180" width="12" height="250" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">在外公館投票</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">大使館・総領事館などの会場で</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">期間と場所は選挙ごとに案内</text><rect x="426" y="180" width="346" height="250" rx="16" fill="white"/><rect x="426" y="180" width="12" height="250" rx="6" fill="#c9952a"/><text x="462" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">郵便投票</text><text x="462" y="268" font-size="20" fill="#29465f" text-anchor="start">投票用紙を選挙管理委員会に</text><text x="462" y="298" font-size="20" fill="#29465f" text-anchor="start">請求し、郵便で送り返す</text><rect x="792" y="180" width="346" height="250" rx="16" fill="white"/><rect x="792" y="180" width="12" height="250" rx="6" fill="#2f8a64"/><text x="828" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">日本国内での投票</text><text x="828" y="268" font-size="20" fill="#29465f" text-anchor="start">一時帰国中に</text><text x="828" y="298" font-size="20" fill="#29465f" text-anchor="start">日本で投票する</text><rect x="60" y="470" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="515" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">郵便は時間がかかる</text><text x="90" y="555" font-size="21" fill="#29465f" text-anchor="start">郵便投票をするなら、選挙が決まったらすぐに投票用紙を請求しましょう</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：総務省（2026年10月29日参照）</text></g></svg>