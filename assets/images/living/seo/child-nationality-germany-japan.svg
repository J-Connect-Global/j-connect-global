<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツで生まれた子どもの国籍</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツで生まれた子どもの国籍</text><text x="48" y="152" font-size="23" fill="#52666C">日本人の親が永住許可を持つ家庭は、出生後3か月の国籍留保が特に重要です</text><rect x="48" y="180" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#146859" stroke-width="4"/><text x="68" y="220" font-size="25" fill="#173B48">ドイツで子どもが生まれる</text><text x="68" y="256" font-size="20" fill="#52666C">親が5年以上合法的に住み、期限のない滞在権を持つ</text><line x1="308" y1="280" x2="308" y2="320" stroke="#52666C" stroke-width="5"/><path d="M299 306 L308 320 L317 306 Z" fill="#52666C"/><rect x="48" y="322" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#146859" stroke-width="4"/><text x="68" y="362" font-size="25" fill="#173B48">子どもは出生時にドイツ国籍も取得</text><text x="68" y="398" font-size="20" fill="#52666C">ブルーカードだけでは条件に当たらない</text><line x1="568" y1="372" x2="628" y2="372" stroke="#52666C" stroke-width="5"/><path d="M614 363 L628 372 L614 381 Z" fill="#52666C"/><rect x="632" y="322" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#C2410C" stroke-width="4"/><text x="652" y="362" font-size="25" fill="#173B48">3か月以内に出生届と国籍留保</text><text x="652" y="398" font-size="20" fill="#52666C">出生日を含めて3か月。郵送は公館への到着日</text><line x1="892" y1="422" x2="892" y2="462" stroke="#52666C" stroke-width="5"/><path d="M883 448 L892 462 L901 448 Z" fill="#52666C"/><rect x="632" y="464" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#146859" stroke-width="4"/><text x="652" y="504" font-size="25" fill="#173B48">日本とドイツの二重国籍</text><text x="652" y="540" font-size="20" fill="#52666C">日本の法律で20歳までに国籍を選ぶ</text><line x1="308" y1="422" x2="308" y2="462" stroke="#C2410C" stroke-width="5"/><path d="M299 448 L308 462 L317 448 Z" fill="#C2410C"/><rect x="48" y="464" width="520" height="100" rx="14" fill="#FFF4EE" stroke="#C2410C" stroke-width="4"/><text x="68" y="504" font-size="25" fill="#173B48">留保しないと日本国籍を失う</text><text x="68" y="540" font-size="20" fill="#52666C">出生時にさかのぼって失う</text><text x="48" y="616" font-size="22" fill="#173B48">両親の一方が外国籍で、子どもがその国籍も出生時に取る場合も、国籍留保が必要です。</text><text x="48" y="656" font-size="19" fill="#52666C">図解：J-Connect  |  根拠：ドイツ国籍法第4条、日本の国籍法第12条・第14条、戸籍法第104条  |  2026-11-06</text></g></svg>
