<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>カビを見つけたときの対応</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">カビを見つけたら　賃貸住宅の場合</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">日付の分かる写真を撮る</text><text x="128" y="213" font-size="20" fill="#52666C">場所と広さを記録する</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">すぐに大家・管理会社へ連絡</text><text x="128" y="303" font-size="20" fill="#52666C">メールなど記録が残る方法で。借主の義務</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">小さな範囲なら自分で掃除</text><text x="128" y="393" font-size="20" fill="#52666C">0.5平方メートル未満・表面だけの場合</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">原因を調べてもらう</text><text x="128" y="483" font-size="20" fill="#52666C">換気の問題か、断熱・水漏れなど建物の問題か</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">建物が原因なら家賃の減額も</text><text x="128" y="573" font-size="20" fill="#52666C">自己判断せず、借主の協会などに相談</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">掃除の注意</text><text x="788" y="268" font-size="32" fill="#173B48">乾いた布で</text><text x="788" y="312" font-size="32" fill="#173B48">こすらない</text><text x="788" y="372" font-size="21" fill="#52666C">胞子が舞い上がります</text><text x="788" y="404" font-size="21" fill="#52666C">手袋・マスク・換気</text><text x="788" y="436" font-size="21" fill="#52666C">乾いた面は70%程度の</text><text x="788" y="468" font-size="21" fill="#52666C">消毒用アルコールを少量</text><text x="788" y="500" font-size="21" fill="#52666C">アレルギーや呼吸器の病気</text><text x="788" y="532" font-size="21" fill="#52666C">がある人は作業しない</text><text x="48" y="622" font-size="22" fill="#173B48">広い範囲や壁の内部まで広がったカビは、専門の業者に任せます。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：連邦環境庁「住まいにカビが出たら」、民法第536条・第536c条  |  2026-11-06</text></g></svg>