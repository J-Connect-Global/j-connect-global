<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">燃料税の一時引き下げ</title><desc id="d">2026年10月1日から12月31日まで、ガソリンと軽油のエネルギー税が1リットルあたり14.04セント下がり、付加価値税を含めると約17セントの負担軽減になることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">燃料税の一時引き下げ（2026年10〜12月）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ガソリン・軽油のエネルギー税を1リットルあたり引き下げ</text><rect x="60" y="180" width="1080" height="130" rx="16" fill="white"/><text x="100" y="232" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">期間</text><text x="260" y="232" font-size="30" font-weight="700" fill="#153452" text-anchor="start">2026年10月1日 〜 12月31日</text><text x="100" y="282" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">対象</text><text x="260" y="282" font-size="26" fill="#29465f" text-anchor="start">ガソリンと軽油</text><rect x="60" y="335" width="520" height="250" rx="16" fill="white"/><text x="320" y="385" font-size="24" font-weight="700" fill="#405a71" text-anchor="middle">エネルギー税の引き下げ</text><text x="320" y="470" font-size="56" font-weight="700" fill="#2d6a9f" text-anchor="middle">14.04セント</text><text x="320" y="525" font-size="22" fill="#405a71" text-anchor="middle">1リットルあたり</text><rect x="620" y="335" width="520" height="250" rx="16" fill="#fff7e6"/><text x="880" y="385" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="middle">付加価値税を含めると</text><text x="880" y="470" font-size="56" font-weight="700" fill="#c9952a" text-anchor="middle">約17セント</text><text x="880" y="525" font-size="22" fill="#405a71" text-anchor="middle">1リットルあたりの負担軽減</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※店頭価格にどれだけ反映されるかは別。出典：連邦政府、連邦議会（2026年10月29日参照）</text></g></svg>