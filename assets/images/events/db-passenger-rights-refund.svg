<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">列車が遅れたときの払い戻し</title><desc id="d">目的地への到着が60分以上遅れたら運賃の25%、120分以上なら50%が戻ること、4ユーロ未満は払われないこと、大きな自然災害などは対象外であること、定期券などは別のルールであることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">遅れたら運賃の一部が戻る</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">EUの乗客の権利（片道の乗車券の場合）</text><rect x="60" y="190" width="520" height="220" rx="16" fill="white"/><text x="320" y="250" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">目的地に60分以上遅れ</text><text x="320" y="350" font-size="84" font-weight="700" fill="#c9952a" text-anchor="middle">25%</text><rect x="620" y="190" width="520" height="220" rx="16" fill="white"/><text x="880" y="250" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">目的地に120分以上遅れ</text><text x="880" y="350" font-size="84" font-weight="700" fill="#b5473a" text-anchor="middle">50%</text><rect x="60" y="430" width="1080" height="175" rx="16" fill="white"/><text x="90" y="470" font-size="21" fill="#29465f" text-anchor="start">・乗った列車ではなく、最終目的地への到着の遅れで決まる</text><text x="90" y="508" font-size="21" fill="#29465f" text-anchor="start">・戻る金額が4ユーロ未満なら払われない</text><text x="90" y="546" font-size="21" fill="#29465f" text-anchor="start">・大きな自然災害などは対象外（ふつうの悪天候やストライキは対象）</text><text x="90" y="584" font-size="21" fill="#29465f" text-anchor="start">・定期券やドイツチケットは別のルール</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ鉄道、連邦交通省、連邦鉄道庁（EU規則2021/782）（2026年10月27日参照）</text></g></svg>