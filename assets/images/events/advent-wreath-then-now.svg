<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アドベントクランツの昔と今</title><desc id="d">1839年にヴィヒェルンが作った、日曜日は白い大きなろうそく、平日は赤い小さなろうそくを立てた車輪のクランツと、モミの枝の輪に日曜日の4本のろうそくを立てる今のクランツを比べた図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">アドベントクランツ：1839年と今</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ハンブルクの子どもたちのために生まれた「ろうそくの輪」</text><rect x="60" y="180" width="520" height="420" rx="16" fill="white"/><rect x="620" y="180" width="520" height="420" rx="16" fill="white"/><g transform="translate(0 40) scale(1 0.9)"><ellipse cx="320" cy="390" rx="150" ry="82" fill="none" stroke="#8d5a3c" stroke-width="16"/><rect x="311" y="262" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="320" cy="254" rx="5" ry="9" fill="#f2c94c"/><rect x="354" y="282" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="359" cy="274" rx="5" ry="9" fill="#f2c94c"/><rect x="390" y="291" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="395" cy="283" rx="5" ry="9" fill="#f2c94c"/><rect x="421" y="304" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="426" cy="296" rx="5" ry="9" fill="#f2c94c"/><rect x="445" y="321" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="450" cy="313" rx="5" ry="9" fill="#f2c94c"/><rect x="460" y="341" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="465" cy="333" rx="5" ry="9" fill="#f2c94c"/><rect x="461" y="344" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="470" cy="336" rx="5" ry="9" fill="#f2c94c"/><rect x="460" y