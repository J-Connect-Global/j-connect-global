<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ミュンヘンのクリスマスマーケットを形づくる伝統</title><desc id="d">マリエン広場の市は14世紀にさかのぼり1972年から市庁舎前で開催、ツリーは1977年から毎年違う自治体が寄贈し2026年はザウアーラッハ、クリッペ市は1757年から、クランプスの行列は12月13日であることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ミュンヘンの市を形づくる伝統</text><text x="60" y="134" font-size="22" fill="#405a71">市庁舎前の市、贈られるツリー、降誕の人形、アルプスの行列</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="248" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(204,300)"><rect x="-40" y="-20" width="80" height="70" fill="#8a6a54"/><polygon points="-14,-20 0,-78 14,-20" fill="#5b4636"/><rect x="-14" y="-40" width="28" height="20" fill="#8a6a54"/><rect x="-10" y="18" width="20" height="32" fill="#f7e2b0"/></g><text x="204" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">14世紀からの市</text><text x="204" y="450" font-size="16" fill="#405a71" text-anchor="middle">1972年から</text><text x="204" y="480" font-size="16" fill="#405a71" text-anchor="middle">市庁舎前の</text><text x="204" y="510" font-size="16" fill="#405a71" text-anchor="middle">マリエン広場で開催</text><rect x="344" y="190" width="248" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(468,300)"><polygon points="0,-70 -46,30 46,30" fill="#2f6a40"/><rect x="-8" y="30" width="16" height="22" fill="#7a5233"/><circle cx="0" cy="-74" r="8" fill="#e5b93a"/><circle cx="-18" cy="0" r="5" fill="#e5b93a"/><circle cx="16" cy="-20" r="5" fill="#e5b93a"/><circle cx="12" cy="14" r="5" fill="#b5473a"/></g><text x="468" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">贈られるツリー</text><text x="468" y="450" font-size="16" fill="#405a71" text-anchor="middle">1977年から毎年</text><text x="468" y="480" font-size="16" fill="#405a71" text-anchor="middle">違う自治体が寄贈</text><text x="468" y="510" font-size="16" fill="#405a71" text-anchor="middle">2026年はザウアーラッハ</text><rect x="608" y="190" width="248" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(732,300)"><polygon points="-56,-6 0,-50 56,-6" fill="#7a5233"/><rect x="-46" y="-6" width="92" height="56" fill="#c49a6c"/><circle cx="-18" cy="16" r="10" fill="#f0d9b5"/><rect x="-26" y="26" width="16" height="22" fill="#2b5c8a"/><circle cx="18" cy="16" r="10" fill="#f0d9b5"/><rect x="10" y="26" width="16" height="22" fill="#b5473a"/><rect x="-8" y="36" width="16" height="10" fill="#e5b93a"/><circle cx="0" cy="-62" r="7" fill="#e5b93a"/></g><text x="732" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">クリッペ市</text><text x="732" y="450" font-size="16" fill="#405a71" text-anchor="middle">1757年から</text><text x="732" y="480" font-size="16" fill="#405a71" text-anchor="middle">降誕の人形を販売</text><text x="732" y="510" font-size="16" fill="#405a71" text-anchor="middle">聖ペーター教会前</text><rect x="872" y="190" width="248" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(996,300)"><ellipse cx="0" cy="0" rx="40" ry="48" fill="#6b4a33"/><path d="M-36,-30 q-30,-40 -10,-60 q8,24 22,36z" fill="#3b2a1e"/><path d="M36,-30 q30,-40 10,-60 q-8,24 -22,36z" fill="#3b2a1e"/><circle cx="-14" cy="-6" r="7" fill="#f7e2b0"/><circle cx="14" cy="-6" r="7" fill="#f7e2b0"/><path d="M-18,22 q18,14 36,0" stroke="#f7e2b0" stroke-width="5" fill="none"/></g><text x="996" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">クランプスの行列</text><text x="996" y="450" font-size="16" fill="#405a71" text-anchor="middle">12月13日（日）</text><text x="996" y="480" font-size="16" fill="#405a71" text-anchor="middle">15〜17時</text><text x="996" y="510" font-size="16" fill="#405a71" text-anchor="middle">300人以上が旧市街へ</text><text x="60" y="645" font-size="18" fill="#405a71">ミュンヘン市の案内に基づく（2026年11月1日参照）</text></g></svg>