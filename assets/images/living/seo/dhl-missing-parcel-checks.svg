<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="checks-title checks-desc">
<title id="checks-title">配達済みなのに、荷物がない</title>
<desc id="checks-desc">確認する順序は3つ。1、追跡番号で全履歴を開き、受取人・保管場所・返送履歴を確認。2、通知に対応する場所として、同居人・隣人・郵便受け・指定した置き配場所を確認。3、記録を添えて状況を連絡。通販は販売店へ相談し、配送はDHLの案内へ。図解の出典確認日は2026年10月19日。</desc>
<rect width="720" height="940" rx="24" fill="#f4f3ed"/>
<g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="40" y="45" font-size="20" fill="#146859" >J-CONNECT / 暮らしのメモ</text>
<text x="40" y="102" font-size="34" fill="#173b48" font-weight="700">配達済みなのに、荷物がない</text>
<text x="40" y="146" font-size="24" fill="#52666c" >まず追跡の詳細と実際の受取先を確認する</text>
<rect x="32" y="180" width="656" height="184" rx="18" fill="#fff" stroke="#c5d4cc"/>
<circle cx="68" cy="223" r="22" fill="#146859"/>
<text x="68" y="231" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="106" y="234" font-size="30" fill="#173b48" font-weight="700">追跡番号で全履歴を開く</text>
<text x="56" y="292" font-size="28" fill="#40545b" >受取人・保管場所・返送履歴を確認</text>
<path d="M360 368v12m-6-6 6 6 6-6" fill="none" stroke="#146859" stroke-width="3"/>
<rect x="32" y="388" width="656" height="216" rx="18" fill="#fff" stroke="#c5d4cc"/>
<circle cx="68" cy="431" r="22" fill="#146859"/>
<text x="68" y="439" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="106" y="442" font-size="30" fill="#173b48" font-weight="700">通知に対応する場所を確認</text>
<text x="56" y="500" font-size="28" fill="#40545b" >同居人・隣人・郵便受け・</text>
<text x="56" y="546" font-size="28" fill="#40545b" >指定した置き配場所</text>
<path d="M360 608v12m-6-6 6 6 6-6" fill="none" stroke="#146859" stroke-width="3"/>
<rect x="32" y="628" width="656" height="216" rx="18" fill="#fff" stroke="#c5d4cc"/>
<circle cx="68" cy="671" r="22" fill="#146859"/>
<text x="68" y="679" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="106" y="682" font-size="30" fill="#173b48" font-weight="700">記録を添えて状況を連絡</text>
<text x="56" y="740" font-size="28" fill="#40545b" >通販は販売店へ相談。</text>
<text x="56" y="786" font-size="28" fill="#40545b" >配送はDHLの案内へ</text>
<text x="40" y="902" font-size="24" fill="#52666c" >図解：J-Connect | 2026-10-19</text>
</g>
</svg>
