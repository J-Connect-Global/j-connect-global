<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">瓶を捨てる前に</title><desc id="desc">預り金が付いている瓶。まず店へ返却。ガラス回収へ入れない。預り金のない空き瓶。透明・茶・緑に分別。青など他の色は緑へ。食器・鏡・耐熱ガラス。空き瓶の回収に混ぜない。品目ごとの自治体ルールを確認</desc><rect width="480" height="560" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">瓶を捨てる前に</text><text x="24" y="80" font-size="19">「用途」→「返却」→「色」の順で確認</text><rect x="20" y="108" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="140" font-size="21" font-weight="700">預り金が付いている瓶</text><text x="36" y="175" font-size="20">まず店へ返却</text><text x="36" y="205" font-size="18">ガラス回収へ入れない</text><rect x="20" y="243" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="275" font-size="21" font-weight="700">預り金のない空き瓶</text><text x="36" y="310" font-size="20">透明・茶・緑に分別</text><text x="36" y="340" font-size="18">青など他の色は緑へ</text><rect x="20" y="378" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="410" font-size="21" font-weight="700">食器・鏡・耐熱ガラス</text><text x="36" y="445" font-size="20">空き瓶の回収に混ぜない</text><text x="36" y="475" font-size="18">品目ごとの自治体ルールを確認</text><text x="24" y="540" font-size="15">J-Connect編集部作成｜根拠・条件は本文参照</text></g></svg>
