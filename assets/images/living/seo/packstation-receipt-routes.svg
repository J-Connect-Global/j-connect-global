<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Packstation：どの通知を使う？</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">Packstation：どの通知を使う？</text><text x="48" y="178" font-size="27" fill="#52666C">荷物の届き方を確認してから操作する</text><rect x="48" y="209" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="264" font-size="38" fill="#173B48">通常の直接指定 → アプリの受取コード</text><text x="81" y="312" font-size="33" fill="#52666C">DHLアカウント登録・端末の有効化が必要</text><rect x="48" y="351" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="351" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="406" font-size="38" fill="#173B48">不在後の移送 → 通知票・メールのコード</text><text x="81" y="454" font-size="33" fill="#52666C">この受取のための会員登録は不要</text><rect x="48" y="493" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="493" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="548" font-size="38" fill="#173B48">通販の「登録なし」対応 → 注文の通知</text><text x="81" y="596" font-size="33" fill="#52666C">画面なし機では、いずれもアプリが必要</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect編集部  |  2026-10-19</text></g></svg>