<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ブルーカードの年収の条件</title><desc id="d">2026年のEUブルーカードの年収の条件は原則5万700ユーロ以上、人手が足りない職業と卒業から3年以内の人は4万5,934.20ユーロ以上で、条件は毎年変わることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">EUブルーカード：2026年の年収の条件</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">年収（額面）・毎年変わる</text><rect x="60" y="180" width="520" height="260" rx="16" fill="white"/><text x="320" y="235" font-size="26" font-weight="700" fill="#405a71" text-anchor="middle">原則</text><text x="320" y="330" font-size="52" font-weight="700" fill="#2d6a9f" text-anchor="middle">50,700ユーロ</text><text x="320" y="390" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">以上</text><rect x="620" y="180" width="520" height="260" rx="16" fill="white"/><text x="880" y="235" font-size="22" font-weight="700" fill="#405a71" text-anchor="middle">人手が足りない職業・卒業3年以内</text><text x="880" y="330" font-size="46" font-weight="700" fill="#2f8a64" text-anchor="middle">45,934.20ユーロ</text><text x="880" y="390" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">以上</text><rect x="60" y="465" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="510" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">原則の条件を超える場合</text><text x="90" y="550" font-size="21" fill="#29465f" text-anchor="start">連邦雇用エージェンシーの同意は不要です</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：Make it in Germany、連邦経済エネルギー省（2026年10月29日参照）</text></g></svg>