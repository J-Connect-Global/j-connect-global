<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">2026年の聖マルティン祭の開催例</title><desc id="d">記念日は11月11日水曜日。地域の行列はその前後に開かれ、Meerbuschは11月3日、Duisburg中心部は11月6日、Meerbuschの別の行列は11月11日の予定です。</desc>
<rect width="1200" height="560" rx="28" fill="#f1f5f7"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Arial, sans-serif" fill="#20384b">
<text x="60" y="78" font-size="34" font-weight="700">2026年の開催例：行列は11月11日の前後にも</text><text x="60" y="122" font-size="20" fill="#506779">自治体が公表したNRWの一部地域の予定。全国一律の日程ではありません。</text>
<rect x="60" y="175" width="320" height="270" rx="20" fill="#fff" stroke="#9fb2bf" stroke-width="2"/><text x="90" y="230" font-size="24" font-weight="700" fill="#2d6a8a">11月3日（火）</text><text x="90" y="285" font-size="32" font-weight="700">17:15</text><text x="90" y="330" font-size="22">Meerbusch</text><text x="90" y="370" font-size="18" fill="#506779">Büderich地区</text><text x="90" y="405" font-size="18" fill="#506779">幼稚園主催・参加条件を確認</text>
<rect x="440" y="175" width="320" height="270" rx="20" fill="#fff" stroke="#9fb2bf" stroke-width="2"/><text x="470" y="230" font-size="24" font-weight="700" fill="#2d6a8a">11月6日（金）</text><text x="470" y="285" font-size="32" font-weight="700">17:00ごろ</text><text x="470" y="330" font-size="22">Duisburg中心部</text><text x="470" y="370" font-size="18" fill="#506779">16:45集合、17:00ごろ出発</text><text x="470" y="405" font-size="18" fill="#506779">17:30ごろ市庁舎到着予定</text>
<rect x="820" y="175" width="320" height="270" rx="20" fill="#eaf1f6" stroke="#2d6a8a" stroke-width="2"/><text x="850" y="230" font-size="24" font-weight="700" fill="#2d6a8a">11月11日（水）</text><text x="850" y="285" font-size="32" font-weight="700">Martinstag</text><text x="850" y="330" font-size="22">聖マルティン祭の日</text><text x="850" y="370" font-size="18" fill="#506779">記念日は固定</text><text x="850" y="405" font-size="18" fill="#506779">行列の時刻は地域ごとに確認</text>
<text x="60" y="505" font-size="18" fill="#5b7086">出典：Meerbusch市（2026年10月30日）、Duisburg市（2026年10月16日）</text></g></svg>