pse cx="175" cy="333" rx="5" ry="9" fill="#f2c94c"/><rect x="185" y="321" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="190" cy="313" rx="5" ry="9" fill="#f2c94c"/><rect x="209" y="304" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="214" cy="296" rx="5" ry="9" fill="#f2c94c"/><rect x="240" y="291" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="245" cy="283" rx="5" ry="9" fill="#f2c94c"/><rect x="276" y="282" width="10" height="28" rx="3" fill="#b5473a" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="281" cy="274" rx="5" ry="9" fill="#f2c94c"/></g><g transform="translate(0 40) scale(1 0.9)"><ellipse cx="880" cy="390" rx="150" ry="82" fill="none" stroke="#2f8a64" stroke-width="30"/><rect x="871" y="262" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="880" cy="254" rx="5" ry="9" fill="#f2c94c"/><rect x="1021" y="344" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="1030" cy="336" rx="5" ry="9" fill="#f2c94c"/><rect x="871" y="426" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="880" cy="418" rx="5" ry="9" fill="#f2c94c"/><rect x="721" y="344" width="18" height="46" rx="3" fill="#ffffff" stroke="#c9b9a6" stroke-width="2"/><ellipse cx="730" cy="336" rx="5" ry="9" fill="#f2c94c"/></g><text x="320" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">1839年 ヴィヒェルンの車輪</text><text x="320" y="575" font-size="17" fill="#405a71" text-anchor="middle">日曜は白い大きなろうそく・平日は赤い小さなろうそく</text><text x="880" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">今のアドベントクランツ</text><text x="880" y="575" font-size="17" fill="#405a71" text-anchor="middle">モミの枝の輪に、日曜日の4本</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：katholisch.de、EKD、ラウエス・ハウス。モミの枝が巻かれ