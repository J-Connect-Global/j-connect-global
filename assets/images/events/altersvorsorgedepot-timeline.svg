<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">老後資金口座の流れ</title><desc id="d">2026年3月の連邦議会の可決、5月8日の連邦参議院の承認、2027年1月1日の開始と、既存のリースター契約は継続でき、従来型の新規契約は2027年から不可であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">リースターから老後資金口座へ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">決まったことと、今のリースター契約の扱い</text><line x1="100" y1="250" x2="1100" y2="250" stroke="#9fb6cc" stroke-width="6"/><circle cx="200" cy="250" r="18" fill="#2d6a9f"/><text x="200" y="215" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">2026年3月</text><rect x="20" y="285" width="360" height="110" rx="16" fill="white"/><text x="200" y="330" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">連邦議会が改革法を可決</text><text x="200" y="368" font-size="19" fill="#405a71" text-anchor="middle">標準商品の費用上限は1％に</text><circle cx="600" cy="250" r="18" fill="#2d6a9f"/><text x="600" y="215" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">2026年5月8日</text><rect x="420" y="285" width="360" height="110" rx="16" fill="white"/><text x="600" y="330" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">連邦参議院が承認</text><text x="600" y="368" font-size="19" fill="#405a71" text-anchor="middle">ドイツ年金保険の発表</text><circle cx="1000" cy="250" r="18" fill="#2d6a9f"/><text x="1000" y="215" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">2027年1月1日</text><rect x="820" y="285" width="360" height="110" rx="16" fill="white"/><text x="1000" y="330" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">老後資金口座がスタート</text><text x="1000" y="368" font-size="19" fill="#405a71" text-anchor="middle">ETFなどで運用、元本保証なし</text><rect x="60" y="420" width="530" height="180" rx="16" fill="white"/><rect x="60" y="420" width="14" height="180" rx="7" fill="#2f8a64"/><text x="100" y="465" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">今のリースター契約</text><text x="100" y="508" font-size="21" fill="#29465f" text-anchor="start">そのまま続けられる・積み立ても可</text><text x="100" y="548" font-size="21" fill="#29465f" text-anchor="start">自動で解約・移行されることはない</text><rect x="610" y="420" width="530" height="180" rx="16" fill="white"/><rect x="610" y="420" width="14" height="180" rx="7" fill="#b5473a"/><text x="650" y="465" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">2027年から</text><text x="650" y="508" font-size="21" fill="#29465f" text-anchor="start">従来型リースターの新規契約は不可</text><text x="650" y="548" font-size="21" fill="#29465f" text-anchor="start">新しい口座への移行は本人の自由</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦議会、ドイツ年金保険、連邦財務省（2026年10月29日参照）</text></g></svg>