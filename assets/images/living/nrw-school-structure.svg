<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">NRWの学校のしくみ</title><desc id="d">NRWの現地校は、小学校が1年生から4年生、5年生から10年生はハウプトシューレ、レアルシューレ、ギムナジウム、総合制学校、中等学校に分かれ、アビトゥーアは主にギムナジウムと総合制学校で目指すことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">NRWの現地校のしくみ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">小学校は4年間、5年生から学校の種類が分かれる</text><rect x="60" y="180" width="1080" height="90" rx="16" fill="white"/><rect x="60" y="180" width="14" height="90" rx="7" fill="#2d6a9f"/><text x="100" y="235" font-size="26" font-weight="700" fill="#2d6a9f" text-anchor="start">1〜4年生：小学校（Grundschule）</text><text x="600" y="310" font-size="22" font-weight="700" fill="#405a71" text-anchor="middle">▼ 5年生から</text><rect x="60" y="330" width="203" height="150" rx="16" fill="white"/><rect x="60" y="330" width="203" height="10" rx="5" fill="#6f8aa3"/><text x="161" y="395" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">ハウプトシューレ</text><text x="161" y="435" font-size="17" fill="#405a71" text-anchor="middle">Hauptschule</text><rect x="279" y="330" width="203" height="150" rx="16" fill="white"/><rect x="279" y="330" width="203" height="10" rx="5" fill="#6f8aa3"/><text x="380" y="395" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">レアルシューレ</text><text x="380" y="435" font-size="17" fill="#405a71" text-anchor="middle">Realschule</text><rect x="498" y="330" width="203" height="150" rx="16" fill="white"/><rect x="498" y="330" width="203" height="10" rx="5" fill="#c9952a"/><text x="599" y="395" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">ギムナジウム</text><text x="599" y="435" font-size="17" fill="#405a71" text-anchor="middle">Gymnasium</text><rect x="717" y="330" width="203" height="150" rx="16" fill="white"/><rect x="717" y="330" width="203" height="10" rx="5" fill="#c9952a"/><text x="818" y="395" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">総合制学校</text><text x="818" y="435" font-size="17" fill="#405a71" text-anchor="middle">Gesamtschule</text><rect x="936" y="330" width="203" height="150" rx="16" fill="white"/><rect x="936" y="330" width="203" height="10" rx="5" fill="#6f8aa3"/><text x="1037" y="395" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">中等学校</text><text x="1037" y="435" font-size="17" fill="#405a71" text-anchor="middle">Sekundarschule</text><rect x="60" y="500" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="545" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">アビトゥーア（大学入学資格）</text><text x="90" y="585" font-size="21" fill="#29465f" text-anchor="start">主にギムナジウムと総合制学校で目指します。どの学校に進むかは、4年生の担任と相談して決めます</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：NRW州学校省（2026年10月29日参照）</text></g></svg>