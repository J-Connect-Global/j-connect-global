<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">撤回できない物</title><desc id="d">撤回できない物の例として、注文に合わせて作った物、すぐに傷む物、封を開けた衛生用品、封を開けたCDやソフト、新聞や雑誌を挙げ、お店で直接買った物には原則として撤回の権利がないことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">撤回できない物の例</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">民法第312g条</text><rect x="60" y="180" width="346" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#b5473a"/><text x="96" y="228" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">注文に合わせて作った物</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">名前入りの品など</text><rect x="426" y="180" width="346" height="195" rx="16" fill="white"/><rect x="426" y="180" width="12" height="195" rx="6" fill="#b5473a"/><text x="462" y="228" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">すぐに傷む物</text><text x="462" y="268" font-size="20" fill="#29465f" text-anchor="start">食品・花など</text><rect x="792" y="180" width="346" height="195" rx="16" fill="white"/><rect x="792" y="180" width="12" height="195" rx="6" fill="#b5473a"/><text x="828" y="228" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">封を開けた衛生用品</text><text x="828" y="268" font-size="20" fill="#29465f" text-anchor="start">化粧品の一部など</text><rect x="60" y="395" width="346" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#b5473a"/><text x="96" y="443" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">封を開けたCD・ソフト</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">ゲーム・音楽・ソフトなど</text><rect x="426" y="395" width="346" height="195" rx="16" fill="white"/><rect x="426" y="395" width="12" height="195" rx="6" fill="#b5473a"/><text x="462" y="443" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">新聞・雑誌</text><text x="462" y="483" font-size="20" fill="#29465f" text-anchor="start">定期購読の契約を除く</text><rect x="792" y="395" width="346" height="195" rx="16" fill="white"/><rect x="792" y="395" width="12" height="195" rx="6" fill="#c9952a"/><text x="828" y="443" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">お店で直接買った物</text><text x="828" y="483" font-size="20" fill="#29465f" text-anchor="start">撤回の権利は原則なし</text><text x="828" y="513" font-size="20" fill="#29465f" text-anchor="start">返品はお店の好意</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：民法第312g条（2026年10月29日参照）</text></g></svg>