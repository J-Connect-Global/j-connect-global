<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">2026年末の花火の販売日と使用日</title>
<desc id="desc">一般消費者向けのF2花火は2026年12月29日から31日に販売され、通常の使用日は12月31日と2027年1月1日です。使用には18歳以上などの条件があります。</desc>
<rect width="1200" height="620" rx="28" fill="#f3f6f9"/>
<text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#263746">年越し花火 2026/27</text>
<rect x="80" y="130" width="1040" height="190" rx="24" fill="#ffffff" stroke="#2e6688" stroke-width="3"/>
<text x="130" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2e6688">販売期間</text>
<text x="600" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#263746">12月29日（火）〜31日（木）</text>
<text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#526474">一般消費者向けF2花火の基本ルール</text>
<rect x="80" y="350" width="1040" height="190" rx="24" fill="#ffffff" stroke="#b97722" stroke-width="3"/>
<text x="130" y="405" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#8a5519">使用日</text>
<text x="600" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#263746">12月31日（木）・1月1日（金）</text>
<text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#526474">F2花火は18歳以上。自治体の追加規制も確認</text>
</svg>