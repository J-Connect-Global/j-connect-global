<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ミュージアムナイトの一晩の過ごし方の例</title><desc id="d">18時から1館目、移動をはさんで20時から2館目、21時半ごろに休憩、22時過ぎから3館目、23時半以降は帰りの交通に余裕を持たせるという時間配分の例を示した図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">一晩の過ごし方の例</text><text x="60" y="134" font-size="22" fill="#405a71">18時〜翌1時。館を絞って、移動と休憩も予定に入れる</text><rect x="60" y="170" width="1080" height="430" rx="16" fill="white"/><line x1="120" y1="200" x2="120" y2="500" stroke="#ece4da" stroke-width="2"/><text x="120" y="535" font-size="20" fill="#405a71" text-anchor="middle">18時</text><line x1="261" y1="200" x2="261" y2="500" stroke="#ece4da" stroke-width="2"/><text x="261" y="535" font-size="20" fill="#405a71" text-anchor="middle">19時</text><line x1="403" y1="200" x2="403" y2="500" stroke="#ece4da" stroke-width="2"/><text x="403" y="535" font-size="20" fill="#405a71" text-anchor="middle">20時</text><line x1="544" y1="200" x2="544" y2="500" stroke="#ece4da" stroke-width="2"/><text x="544" y="535" font-size="20" fill="#405a71" text-anchor="middle">21時</text><line x1="686" y1="200" x2="686" y2="500" stroke="#ece4da" stroke-width="2"/><text x="686" y="535" font-size="20" fill="#405a71" text-anchor="middle">22時</text><line x1="827" y1="200" x2="827" y2="500" stroke="#ece4da" stroke-width="2"/><text x="827" y="535" font-size="20" fill="#405a71" text-anchor="middle">23時</text><line x1="969" y1="200" x2="969" y2="500" stroke="#ece4da" stroke-width="2"/><text x="969" y="535" font-size="20" fill="#405a71" text-anchor="middle">0時</text><line x1="1110" y1="200" x2="1110" y2="500" stroke="#ece4da" stroke-width="2"/><text x="1110" y="535" font-size="20" fill="#405a71" text-anchor="middle">1時</text><rect x="122" y="300" width="208" height="70" rx="10" fill="#b5473a"/><text x="226" y="343" font-size="20" font-weight="700" fill="white" text-anchor="middle">1館目</text><text x="226" y="280" font-size="17" fill="#405a71" text-anchor="middle">混む前に人気館</text><rect x="334" y="300" width="67" height="70" rx="10" fill="#9aa3b2"/><text x="368" y="343" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">移動</text><rect x="405" y="300" width="208" height="70" rx="10" fill="#2a6f97"/><text x="509" y="343" font-size="20" font-weight="700" fill="white" text-anchor="middle">2館目</text><text x="509" y="280" font-size="17" fill="#405a71" text-anchor="middle">催しに合わせる</text><rect x="617" y="300" width="95" height="70" rx="10" fill="#c9a227"/><text x="664" y="343" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">休憩</text><text x="664" y="405" font-size="17" fill="#405a71" text-anchor="middle">食事・街歩き</text><rect x="716" y="300" width="180" height="70" rx="10" fill="#2f6a40"/><text x="806" y="343" font-size="20" font-weight="700" fill="white" text-anchor="middle">3館目</text><text x="806" y="280" font-size="17" fill="#405a71" text-anchor="middle">夜の展示室</text><rect x="900" y="300" width="208" height="70" rx="10" fill="#d9cfc3"/><text x="1004" y="343" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">余裕</text><text x="1004" y="405" font-size="17" fill="#405a71" text-anchor="middle">帰りの交通</text><text x="90" y="580" font-size="19" fill="#405a71">券は地域の公共交通にも使え、臨時シャトルバスが会場間を結ぶ（主催者の案内による）</text><text x="60" y="645" font-size="18" fill="#405a71">時間配分は一例。各館の催しの時間は公式サイトのプログラムで確認</text></g></svg>