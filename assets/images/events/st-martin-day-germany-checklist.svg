<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">ランタン行列の参加前チェック</title><desc id="d">参加前に一般参加の可否、日時と集合場所、ルート、ランタンの安全、料金や配布物を確認する5項目。</desc>
<rect width="1200" height="600" rx="28" fill="#f4f6f8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Arial, sans-serif" fill="#20384b"><text x="60" y="78" font-size="34" font-weight="700">参加前に確認する5つ</text>
<rect x="60" y="130" width="510" height="130" rx="18" fill="#fff" stroke="#a9bac5" stroke-width="2"/><circle cx="115" cy="195" r="28" fill="#2d6a8a"/><text x="115" y="204" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="165" y="185" font-size="23" font-weight="700">一般参加できる行事か</text><text x="165" y="220" font-size="18" fill="#506779">学校・保育施設の内部行事と区別</text>
<rect x="630" y="130" width="510" height="130" rx="18" fill="#fff" stroke="#a9bac5" stroke-width="2"/><circle cx="685" cy="195" r="28" fill="#2d6a8a"/><text x="685" y="204" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="735" y="185" font-size="23" font-weight="700">日時・集合場所</text><text x="735" y="220" font-size="18" fill="#506779">開始時刻と終了予定も確認</text>
<rect x="60" y="300" width="510" height="130" rx="18" fill="#fff" stroke="#a9bac5" stroke-width="2"/><circle cx="115" cy="365" r="28" fill="#2d6a8a"/><text x="115" y="374" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="165" y="355" font-size="23" font-weight="700">ルートと交通規制</text><text x="165" y="390" font-size="18" fill="#506779">雨天時の変更・中止も確認</text>
<rect x="630" y="300" width="510" height="130" rx="18" fill="#fff" stroke="#a9bac5" stroke-width="2"/><circle cx="685" cy="365" r="28" fill="#2d6a8a"/><text x="685" y="374" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="735" y="355" font-size="23" font-weight="700">ランタンと服装</text><text x="735" y="390" font-size="18" fill="#506779">LED、反射材、予備電池</text>
<rect x="345" y="470" width="510" height="90" rx="18" fill="#eaf1f6" stroke="#2d6a8a" stroke-width="2"/><circle cx="400" cy="515" r="28" fill="#2d6a8a"/><text x="400" y="524" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="450" y="510" font-size="23" font-weight="700">料金・菓子・火・登録</text><text x="450" y="540" font-size="18" fill="#506779">配布や参加条件は主催者に確認</text></g></svg>