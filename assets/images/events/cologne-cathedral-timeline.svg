<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルン大聖堂の歴史</title><desc id="d">1164年の東方三博士の聖遺物の到着、1248年の礎石、16世紀初めの工事中断と塔の上のクレーン、1842年の工事再開、1880年の完成、1996年の世界遺産登録までを示した年表</desc><rect width="1200" height="675" rx="28" fill="#f1f1ee"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ケルン大聖堂の632年</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">1248年の礎石から、1880年の完成まで</text><line x1="165" y1="190" x2="165" y2="615" stroke="#d6c9b8" stroke-width="6"/><circle cx="165" cy="217" r="14" fill="#5b6f84"/><text x="55" y="225" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1164</text><rect x="190" y="185" width="950" height="58" rx="16" fill="white"/><text x="215" y="215" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">聖遺物</text><text x="340" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="start">東方三博士の聖遺物がミラノから届く</text><text x="340" y="243" font-size="19" fill="#405a71" text-anchor="start">大聖堂が必要になった理由の一つ</text><circle cx="165" cy="287" r="14" fill="#5b6f84"/><text x="55" y="295" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1248</text><rect x="190" y="255" width="950" height="58" rx="16" fill="white"/><text x="215" y="285" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">着工</text><text x="340" y="285" font-size="23" font-weight="700" fill="#153452" text-anchor="start">8月15日、ゴシック様式の大聖堂の礎石</text><text x="340" y="313" font-size="19" fill="#405a71" text-anchor="start">大司教コンラート・フォン・ホーホシュターデン</text><circle cx="165" cy="357" r="14" fill="#5b6f84"/><text x="55" y="365" font-size="22" font-weight="700" fill="#153452" text-anchor="start">16世紀</text><rect x="190" y="325" width="950" height="58" rx="16" fill="white"/><text x="215" y="355" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">中断</text><text x="340" y="355" font-size="23" font-weight="700" fill="#153452" text-anchor="start">工事が止まる。南の塔は約58m</text><text x="340" y="383" font-size="19" fill="#405a71" text-anchor="start">塔の上の木のクレーンが街の目印に</text><circle cx="165" cy="427" r="14" fill="#5b6f84"/><text x="55" y="435" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1842</text><rect x="190" y="395" width="950" height="58" rx="16" fill="white"/><text x="215" y="425" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">再開</text><text x="340" y="425" font-size="23" font-weight="700" fill="#153452" text-anchor="start">プロイセン王が完成のための礎石</text><text x="340" y="453" font-size="19" fill="#405a71" text-anchor="start">費用の約60%を市民の協会が負担</text><circle cx="165" cy="497" r="14" fill="#5b6f84"/><text x="55" y="505" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1880</text><rect x="190" y="465" width="950" height="58" rx="16" fill="white"/><text x="215" y="495" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">完成</text><text x="340" y="495" font-size="23" font-weight="700" fill="#153452" text-anchor="start">2本の塔は157m超。世界一高い建物に</text><text x="340" y="523" font-size="19" fill="#405a71" text-anchor="start">着工から632年</text><circle cx="165" cy="567" r="14" fill="#5b6f84"/><text x="55" y="575" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1996</text><rect x="190" y="535" width="950" height="58" rx="16" fill="white"/><text x="215" y="565" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">世界遺産</text><text x="340" y="565" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ユネスコの世界遺産に登録</text><text x="340" y="593" font-size="19" fill="#405a71" text-anchor="start">2004〜2006年は危機遺産のリストに</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ケルン大聖堂、ドイツ・ユネスコ委員会（2026年10月29日参照）</text></g></svg>