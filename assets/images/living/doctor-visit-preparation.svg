<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">受診の準備</title><desc id="d">日本語で受診できないときに備えて、症状のメモ、薬とアレルギーの一覧、健康保険証、付き添いの人を用意し、緊急時は112、夜間や休日で命の危険がないときは116117に連絡することを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日本語で受診できないときの準備</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">持っていくものと、困ったときの電話番号</text><rect x="60" y="180" width="530" height="150" rx="16" fill="white"/><rect x="60" y="180" width="12" height="150" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">症状のメモ</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">いつから・どこが・どのように</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">ドイツ語か英語で短く</text><rect x="610" y="180" width="530" height="150" rx="16" fill="white"/><rect x="610" y="180" width="12" height="150" rx="6" fill="#2f8a64"/><text x="646" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">薬とアレルギー</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">飲んでいる薬・アレルギー</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">大きな病気や手術</text><rect x="60" y="350" width="530" height="150" rx="16" fill="white"/><rect x="60" y="350" width="12" height="150" rx="6" fill="#c9952a"/><text x="96" y="398" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">健康保険証（eGK）</text><text x="96" y="438" font-size="20" fill="#29465f" text-anchor="start">受付で必ず出す</text><text x="96" y="468" font-size="20" fill="#29465f" text-anchor="start">民間保険の人は保険の書類</text><rect x="610" y="350" width="530" height="150" rx="16" fill="white"/><rect x="610" y="350" width="12" height="150" rx="6" fill="#8a5aa8"/><text x="646" y="398" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">付き添い</text><text x="646" y="438" font-size="20" fill="#29465f" text-anchor="start">ドイツ語が話せる</text><text x="646" y="468" font-size="20" fill="#29465f" text-anchor="start">家族や知人に頼む</text><rect x="60" y="520" width="530" height="80" rx="16" fill="#fdecea"/><text x="325" y="572" font-size="28" font-weight="700" fill="#b5473a" text-anchor="middle">命に関わる緊急時：112</text><rect x="610" y="520" width="530" height="80" rx="16" fill="#e8f1fa"/><text x="875" y="572" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="middle">夜間・休日の相談：116117</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：外務省、連邦保健省（2026年10月29日参照）</text></g></svg>