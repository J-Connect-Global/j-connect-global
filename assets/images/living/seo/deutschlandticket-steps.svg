<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツチケットの申し込みから解約までの流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツチケット　申し込みから解約まで</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">販売会社を選ぶ</text><text x="128" y="213" font-size="20" fill="#52666C">ドイツ鉄道や地元の交通会社。料金は全国同じ</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">名前と支払い方法を入力</text><text x="128" y="303" font-size="20" fill="#52666C">多くは口座引き落とし。カード可の会社も</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">開始月を選ぶ</text><text x="128" y="393" font-size="20" fill="#52666C">月の途中からでもひと月分。月初めがお得</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">アプリかICカードで受け取る</text><text x="128" y="483" font-size="20" fill="#52666C">紙の切符はない。身分証明書も持ち歩く</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">使わない月は解約</text><text x="128" y="573" font-size="20" fill="#52666C">受付期限は販売会社ごとに違う</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">会社の補助</text><text x="788" y="268" font-size="32" fill="#173B48">職場向け</text><text x="788" y="312" font-size="32" fill="#173B48">ドイツチケット</text><text x="788" y="372" font-size="21" fill="#52666C">会社が料金の一部を補助</text><text x="788" y="404" font-size="21" fill="#52666C">すると追加の割引も</text><text x="788" y="436" font-size="21" fill="#52666C">通勤の公共交通の補助は</text><text x="788" y="468" font-size="21" fill="#52666C">所得税がかからない</text><text x="788" y="500" font-size="21" fill="#52666C">（所得税法第3条第15号）</text><text x="48" y="622" font-size="22" fill="#173B48">定期契約なので、旅行者も使い終わったら必ず解約の手続きをしてください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：地域化法第9条、所得税法第3条第15号  |  2026-11-06</text></g></svg>