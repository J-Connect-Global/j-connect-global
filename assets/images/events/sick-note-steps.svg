<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">病気で休むときの流れ</title><desc id="d">すぐに会社に連絡し、3日を超えるなら遅くとも4日目までに医師の診断書が必要で、診断書は医師から保険組合へ電子で送られ、6週間は給与が払われその後は傷病手当になることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">病気で仕事を休むときの流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">2026年10月時点のルール</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2f8a64"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">すぐに会社に連絡</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">休むことと</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">休む見込みの</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">日数を伝える</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2f8a64"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">医師にかかる</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">3日を超えるなら</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">遅くとも4日目までに</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">診断書が必要</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2f8a64"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">診断書は電子で</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">医師から保険組合へ</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">会社は保険組合から</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">データを受け取る</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2f8a64"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">6週間は給与あり</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">その後は</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">健康保険の</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">傷病手当</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※会社は1日目から診断書を求めることもできます。出典：賃金継続支払法、TK</text></g></svg>