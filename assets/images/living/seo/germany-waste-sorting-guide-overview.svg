<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#102c50"/><g font-family="Noto Sans CJK JP" fill="white"><text x="64" y="88" font-size="24">J-CONNECT GERMANY · 生活ガイド</text><text x="64" y="186" font-size="62" font-weight="700">ドイツのごみ分別</text><text x="64" y="247" font-size="30">全国の基本と、デュッセルドルフの地域ルール</text><rect x="64" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="88" y="365" fill="#102c50" font-size="36">分け方</text><text x="88" y="432" fill="#102c50" font-size="26">紙・包装・生ごみ</text><text x="88" y="480" fill="#102c50" font-size="24">ガラス・一般ごみ</text><rect x="432" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="456" y="365" fill="#102c50" font-size="36">地域差</text><text x="456" y="432" fill="#102c50" font-size="26">黄色は包装だけ？</text><text x="456" y="480" fill="#102c50" font-size="24">自治体の対象品目へ</text><rect x="800" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="824" y="365" fill="#102c50" font-size="36">収集日</text><text x="824" y="432" fill="#102c50" font-size="26">通り名と番地</text><text x="824" y="480" fill="#102c50" font-size="24">自宅の予定を確認</text><text x="64" y="610" font-size="23">編集部作成の図解｜詳しい条件と公式出典は本文に掲載</text></g></svg>
