<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026/27年のワクチンの対象</title><desc id="d">新型コロナワクチンの毎年の接種の標準は75歳以上に変更、持病のある人や介護施設の入居者は引き続き対象、インフルエンザは60歳以上と妊婦、持病のある人などに勧められていることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">2026/27年の冬：誰にワクチンが勧められている？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">STIKO（予防接種委員会）の勧告</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">新型コロナ（2026年7月に改訂）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">毎年の接種の標準：75歳以上</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">（これまでは60歳以上）</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">持病がある人は年齢を問わず</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">介護施設の入居者・職員</text><text x="95" y="533" font-size="20" fill="#29465f" text-anchor="start">時期：夏の終わり〜秋の初め</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#c9952a"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#c9952a"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">インフルエンザ</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">60歳以上：毎年秋に</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">妊婦（妊娠中期から）</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">持病がある人</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">介護施設の入居者</text><text x="645" y="533" font-size="20" fill="#29465f" text-anchor="start">医療・介護で働く人など</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：RKI（2026年10月29日参照）</text></g></svg>