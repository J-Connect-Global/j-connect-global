<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">シュトゥットガルトのクリスマスマーケットの見どころ</title><desc id="d">屋台の屋根に載る手づくりの冬景色、旧宮殿の中庭で行われる開幕式、蒸気機関車に乗れる子どものメルヘンランドの三つの見どころを紹介する図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">シュトゥットガルトの市の見どころ</text><text x="60" y="134" font-size="22" fill="#405a71">目線を上げる屋根飾りと、宮殿に囲まれた4週間</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(245,285)"><rect x="-60" y="10" width="120" height="50" fill="#8a5a33"/><polygon points="-72,12 0,-30 72,12" fill="#5b3a24"/><rect x="-42" y="-52" width="24" height="18" fill="#c97b4a"/><polygon points="-46,-52 -30,-66 -14,-52" fill="#fff"/><polygon points="14,-34 26,-76 38,-34" fill="#24704a"/><circle cx="26" cy="-80" r="5" fill="#ffd56b"/></g><text x="245" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">屋根の上の冬景色</text><text x="245" y="452" font-size="18" fill="#405a71" text-anchor="middle">屋台ごとに違う</text><text x="245" y="482" font-size="18" fill="#405a71" text-anchor="middle">手づくりの屋根飾り</text><text x="245" y="512" font-size="18" fill="#405a71" text-anchor="middle">美しい屋台の表彰も</text><rect x="435" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(600,285)"><rect x="-60" y="-20" width="120" height="70" fill="#9aa3b5"/><rect x="-72" y="-50" width="30" height="100" fill="#7d879b"/><polygon points="-78,-50 -57,-82 -36,-50" fill="#5b6478"/><rect x="42" y="-50" width="30" height="100" fill="#7d879b"/><polygon points="36,-50 57,-82 78,-50" fill="#5b6478"/><rect x="-14" y="10" width="28" height="40" rx="14" fill="#4a3b2a"/></g><text x="600" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">旧宮殿の中庭</text><text x="600" y="452" font-size="18" fill="#405a71" text-anchor="middle">2026年は11月25日</text><text x="600" y="482" font-size="18" fill="#405a71" text-anchor="middle">18時から開幕式</text><text x="600" y="512" font-size="18" fill="#405a71" text-anchor="middle">屋台は17時から</text><rect x="789" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(955,285)"><circle r="58" fill="#e6f0e6"/><rect x="-42" y="-14" width="60" height="34" rx="6" fill="#2f5a8b"/><rect x="18" y="-34" width="26" height="54" rx="4" fill="#c0392b"/><rect x="-30" y="-36" width="12" height="22" fill="#333"/><circle cx="-26" cy="26" r="11" fill="#333"/><circle cx="4" cy="26" r="11" fill="#333"/><circle cx="32" cy="26" r="11" fill="#333"/></g><text x="955" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">子どものメルヘンランド</text><text x="955" y="452" font-size="18" fill="#405a71" text-anchor="middle">昔ながらの</text><text x="955" y="482" font-size="18" fill="#405a71" text-anchor="middle">メリーゴーラウンドと</text><text x="955" y="512" font-size="18" fill="#405a71" text-anchor="middle">小さな蒸気機関車</text></g></svg>