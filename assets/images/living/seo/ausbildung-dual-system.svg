<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの職業訓練のしくみ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">職業訓練のしくみ　会社と学校の二か所で学ぶ</text><text x="48" y="152" font-size="23" fill="#52666C">2〜3年半の訓練の後、試験に合格すると国が認めた資格になる</text><rect x="268" y="176" width="430" height="50" rx="10" fill="#173B48"/><text x="284" y="210" font-size="24" fill="#FFFFFF">訓練先の会社</text><rect x="710" y="176" width="430" height="50" rx="10" fill="#146859"/><text x="726" y="210" font-size="24" fill="#FFFFFF">職業学校</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">週の配分（例）</text><text x="284" y="272" font-size="26" fill="#173B48">週3〜4日</text><text x="726" y="272" font-size="26" fill="#173B48">週1〜2日、またはまとめて数週間</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">学ぶこと</text><text x="284" y="336" font-size="26" fill="#173B48">実際の仕事と技術</text><text x="726" y="336" font-size="26" fill="#173B48">理論・ドイツ語・一般科目</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">お金</text><text x="284" y="400" font-size="26" fill="#C2410C">毎月の手当（毎年上がる）</text><text x="726" y="400" font-size="26" fill="#173B48">授業料は原則なし</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">決まりごと</text><text x="284" y="464" font-size="26" fill="#173B48">訓練契約・試用期間1〜4か月</text><text x="726" y="464" font-size="26" fill="#173B48">出席の義務</text><rect x="48" y="486" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="528" font-size="24" fill="#52666C">最後に</text><text x="284" y="528" font-size="26" fill="#173B48">修了試験（商工会議所など）</text><text x="726" y="528" font-size="26" fill="#173B48">修了証</text><text x="48" y="622" font-size="22" fill="#173B48">介護や保育など、学校が中心の職業訓練もあります。手当の有無は職業ごとに確認を。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：職業訓練法第11条・第17条・第20条  |  2026-11-06</text></g></svg>