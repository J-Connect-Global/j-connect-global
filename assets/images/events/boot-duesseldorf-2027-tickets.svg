<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ボート2027の入場券と回り方</title><desc id="d">1日券23ユーロ（割引16ユーロ）、月曜から金曜の14時から18時に使える午後券13ユーロ、子どもは12歳ごろまで無料であることと、平日午後と週末の違いを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ボート2027の入場券と回り方</text><text x="60" y="134" font-size="22" fill="#405a71">2027年1月23日（土）〜31日（日）、毎日10〜18時</text><rect x="60" y="170" width="345" height="220" rx="16" fill="white"/><rect x="60" y="170" width="345" height="10" rx="5" fill="#153452"/><text x="232" y="235" font-size="24" fill="#405a71" text-anchor="middle">1日券</text><text x="232" y="300" font-size="44" font-weight="700" fill="#153452" text-anchor="middle">23ユーロ</text><text x="232" y="350" font-size="20" fill="#405a71" text-anchor="middle">割引16ユーロ</text><rect x="425" y="170" width="345" height="220" rx="16" fill="white"/><rect x="425" y="170" width="345" height="10" rx="5" fill="#2a6f97"/><text x="597" y="235" font-size="24" fill="#405a71" text-anchor="middle">午後券</text><text x="597" y="300" font-size="44" font-weight="700" fill="#2a6f97" text-anchor="middle">13ユーロ</text><text x="597" y="350" font-size="20" fill="#405a71" text-anchor="middle">月〜金の14〜18時</text><rect x="790" y="170" width="345" height="220" rx="16" fill="white"/><rect x="790" y="170" width="345" height="10" rx="5" fill="#2f6a40"/><text x="962" y="235" font-size="24" fill="#405a71" text-anchor="middle">子ども</text><text x="962" y="300" font-size="44" font-weight="700" fill="#2f6a40" text-anchor="middle">無料</text><text x="962" y="350" font-size="20" fill="#405a71" text-anchor="middle">12歳ごろまで（要確認）</text><rect x="60" y="415" width="530" height="170" rx="16" fill="#e6eef4"/><text x="90" y="465" font-size="24" font-weight="700" fill="#153452">平日の午後</text><text x="90" y="507" font-size="20" fill="#405a71">午後券で費用を抑えられる</text><text x="90" y="545" font-size="20" fill="#405a71">比較的ゆっくり見て回れる</text><rect x="610" y="415" width="530" height="170" rx="16" fill="#f6e3dc"/><text x="640" y="465" font-size="24" font-weight="700" fill="#8c2f22">週末</text><text x="640" y="507" font-size="20" fill="#405a71">家族連れで特に混み合う</text><text x="640" y="545" font-size="20" fill="#405a71">早めの時間に入ると回りやすい</text><text x="60" y="645" font-size="18" fill="#405a71">主催者の入場券の案内に基づく。子どもの年齢はページにより記載が異なる（2026年10月30日参照）</text></g></svg>