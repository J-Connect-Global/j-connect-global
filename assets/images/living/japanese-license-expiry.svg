<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日本の免許の期限切れ</title><desc id="d">日本の免許の期限が切れてから6か月以内なら手続きで再び受け取れ、6か月を超えて3年以内なら帰国から1か月以内の手続きで試験が免除され、3年を超えると取り直しになる。ただしドイツなど外国の免許を持ち、その国に3か月以上滞在していれば、失効からの期間を問わず試験が免除されることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="90" font-size="40" font-weight="700" fill="#153452">ドイツにいる間に、日本の免許が切れたら</text><text x="60" y="135" font-size="24" fill="#405a71">切れてからの期間と、外国の免許があるかで手続きが変わる</text><rect x="60" y="165" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="165" width="10" height="76" rx="5" fill="#2d6a9f"/><text x="95" y="211" font-size="22" font-weight="700" fill="#153452">切れてから6か月以内</text><text x="1110" y="212" font-size="23" font-weight="700" fill="#2f8a64" text-anchor="end">手続きをすれば再び受け取れる</text><rect x="60" y="253" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="253" width="10" height="76" rx="5" fill="#2d6a9f"/><text x="95" y="299" font-size="22" font-weight="700" fill="#153452">6か月を超えて3年以内</text><text x="1110" y="300" font-size="23" font-weight="700" fill="#2d6a9f" text-anchor="end">帰国から1か月以内の手続きで試験免除</text><rect x="60" y="341" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="341" width="10" height="76" rx="5" fill="#2d6a9f"/><text x="95" y="387" font-size="22" font-weight="700" fill="#153452">3年を超える（外国の免許なし）</text><text x="1110" y="388" font-size="23" font-weight="700" fill="#b5473a" text-anchor="end">新しく取り直し</text><rect x="60" y="429" width="1080" height="76" rx="16" fill="#f0f8f3"/><rect x="60" y="429" width="10" height="76" rx="5" fill="#2d6a9f"/><text x="95" y="475" font-size="22" font-weight="700" fill="#153452">ドイツなど外国の免許がある</text><text x="1110" y="476" font-size="23" font-weight="700" fill="#2f8a64" text-anchor="end">期間を問わず試験免除（その国に3か月以上滞在）</text><rect x="60" y="523" width="1080" height="96" rx="16" fill="#fff7e6"/><text x="90" y="563" font-size="23" font-weight="700" fill="#8a5a00">いちばん確実なのは、切れる前に更新すること</text><text x="90" y="599" font-size="20" fill="#29465f">出国前や一時帰国のときに、期間の前の更新ができる場合があります</text><text x="60" y="648" font-size="18" fill="#5b7086">出典：警察庁「海外滞在者の運転免許証の更新等に係る特例」（道路交通法第97条の2）、2026年11月14日確認。図解：J-Connect</text></g></svg>