<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アドベントカレンダーの歴史</title><desc id="d">19世紀の家庭のチョークの線や壁の絵、1851年の子ども向けの本の記録、1908年のゲアハルト・ラングの印刷のカレンダー、1940年の会社の閉鎖、今の多様なカレンダーまでを並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">アドベントカレンダーの歩み</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">チョークの線から、24の扉へ</text><line x1="165" y1="190" x2="165" y2="610" stroke="#d6b8a6" stroke-width="6"/><circle cx="165" cy="222" r="14" fill="#b5473a"/><text x="55" y="230" font-size="22" font-weight="700" fill="#153452" text-anchor="start">19世紀</text><rect x="190" y="188" width="950" height="72" rx="16" fill="white"/><text x="215" y="218" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">家庭の工夫</text><text x="330" y="218" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ドアに24本のチョークの線、壁に24枚の絵</text><text x="330" y="248" font-size="19" fill="#405a71" text-anchor="start">主にプロテスタントの家庭で</text><circle cx="165" cy="308" r="14" fill="#b5473a"/><text x="55" y="316" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1851</text><rect x="190" y="274" width="950" height="72" rx="16" fill="white"/><text x="215" y="304" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">本の記録</text><text x="330" y="304" font-size="23" font-weight="700" fill="#153452" text-anchor="start">毎晩1枚ずつ絵を壁にかける</text><text x="330" y="334" font-size="19" fill="#405a71" text-anchor="start">子ども向けの本に描かれる</text><circle cx="165" cy="394" r="14" fill="#b5473a"/><text x="55" y="402" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1908</text><rect x="190" y="360" width="950" height="72" rx="16" fill="white"/><text x="215" y="390" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">印刷</text><text x="330" y="390" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ゲアハルト・ラングが印刷のカレンダーを販売</text><text x="330" y="420" font-size="19" fill="#405a71" text-anchor="start">母親の手作りの24の小箱が原点</text><circle cx="165" cy="480" r="14" fill="#b5473a"/><text x="55" y="488" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1940</text><rect x="190" y="446" width="950" height="72" rx="16" fill="white"/><text x="215" y="476" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start"></text><text x="330" y="476" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ラングの会社が閉じる</text><text x="330" y="506" font-size="19" fill="#405a71" text-anchor="start">それまでカレンダーを作り続けた</text><circle cx="165" cy="566" r="14" fill="#b5473a"/><text x="55" y="574" font-size="22" font-weight="700" fill="#153452" text-anchor="start">今</text><rect x="190" y="532" width="950" height="72" rx="16" fill="white"/><text x="215" y="562" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">多様に</text><text x="330" y="562" font-size="23" font-weight="700" fill="#153452" text-anchor="start">チョコ・紅茶・おもちゃ入り、手作りの袋も</text><text x="330" y="592" font-size="19" fill="#405a71" text-anchor="start">12月1日から24日まで1日1つ</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：katholisch.de、EKD。1902年や1904年の印刷カレンダーの記録もあり、「最初」には諸説あり</text></g></svg>