<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">2027年の申請なしKindergeld支給の段階導入</title><desc id="desc">2027年3月頃に第2子以降、11月頃に第1子へと段階導入する計画。第1子では国内居住、既知のIBAN、親の国内就労などの条件がある。条件を満たさない場合は従来の案内や申請が必要になることがある。</desc>
<rect width="1200" height="650" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="566" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="105" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="38" font-weight="800">申請なしの支給は2027年に段階導入</text>
<text x="90" y="144" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">連邦財務省が公表した導入計画。日程は「頃」とされる見込みです。</text>
<g transform="translate(88 180)"><rect width="470" height="250" rx="20" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><rect x="26" y="24" width="152" height="42" rx="12" fill="#2f7771"/><text x="102" y="52" text-anchor="middle" fill="#fff" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">2027年3月頃</text><text x="26" y="104" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="27" font-weight="800">第2子以降</text><text x="26" y="145" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">すでに児童手当を受け取っている</text><text x="26" y="174" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">家庭の既存データを利用します。</text><text x="26" y="215" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18" font-weight="700">口座情報などが把握されていること</text></g>
<g transform="translate(612 180)"><rect width="500" height="250" rx="20" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><rect x="26" y="24" width="152" height="42" rx="12" fill="#47658b"/><text x="102" y="52" text-anchor="middle" fill="#fff" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">2027年11月頃</text><text x="26" y="104" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="27" font-weight="800">第1子</text><text x="26" y="145" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">親の一人が子どもと国内居住</text><text x="26" y="174" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19">IBANが既知、親の一人が国内就労</text><text x="26" y="215" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18" font-weight="700">条件を満たす場合に対象</text></g>
<rect x="88" y="464" width="1024" height="76" rx="16" fill="#f7eee3" stroke="#ead8c1" stroke-width="2"/><text x="112" y="496" fill="#9a6130" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">重要：すべての家庭が自動支給になるわけではありません。</text><text x="112" y="523" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17">情報が不足する場合は、従来どおり案内・申請が必要になることがあります。</text>
<text x="90" y="578" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜連邦財務省の公表計画をもとに作成｜確認日：2026年10月26日</text>
</svg>