<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">出産前に家族が確認する予防接種の準備4ステップ</title><desc id="desc">母子手帳とImpfpassで接種歴を確認し、かかりつけ医に相談して予約する。受診日に保険証と接種記録を持参し、接種後はImpfpassへ記録を残す。対象と時期は医師とSTIKO指針を確認する。</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#eaf0ec"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#314b41" flood-opacity=".10"/></filter></defs>
<rect width="1200" height="675" fill="url(#paper)"/><rect x="18" y="17" width="1164" height="640" rx="28" fill="none" stroke="#b9cabe" stroke-width="2"/><g font-family="Noto Sans CJK JP, sans-serif">
<text x="600" y="82" font-size="42" font-weight="800" text-anchor="middle" fill="#25493c">出産前の予防接種｜家族の準備</text><text x="600" y="122" font-size="21" text-anchor="middle" fill="#64746b">ワクチンの種類・接種時期はかかりつけ医と公式指針で確認しましょう</text>
<line x1="78" y1="160" x2="1122" y2="160" stroke="#cad9ce" stroke-width="3"/>
