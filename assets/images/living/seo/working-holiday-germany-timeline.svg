<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツのワーキングホリデーの準備の流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツのワーホリ　出発前から到着後まで</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">数か月前：大使館の予約を確認</text><text x="128" y="213" font-size="20" fill="#52666C">東京の大使館か大阪・神戸の総領事館。本人が窓口へ</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">資金と保険を準備する</text><text x="128" y="303" font-size="20" fill="#52666C">往復航空券ありで最低2,000ユーロ、片道なら2倍</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">出発の3か月前〜2週間前に申請</text><text x="128" y="393" font-size="20" fill="#52666C">申請時に31歳未満。滞在は3か月〜1年、1回限り</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">到着後：住民登録と滞在カード</text><text x="128" y="483" font-size="20" fill="#52666C">入居から2週間以内に住民登録</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">税番号・口座をそろえて仕事探し</text><text x="128" y="573" font-size="20" fill="#52666C">最低賃金は2026年時給13.90ユーロ</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">保険の確認点</text><text x="788" y="268" font-size="32" fill="#173B48">全期間を</text><text x="788" y="312" font-size="32" fill="#173B48">カバーする</text><text x="788" y="372" font-size="21" fill="#52666C">旅行者用の医療保険</text><text x="788" y="404" font-size="21" fill="#52666C">歯科・妊娠時の扱い</text><text x="788" y="436" font-size="21" fill="#52666C">旅行賠償責任保険も必要</text><text x="788" y="468" font-size="21" fill="#52666C">病院での直接支払い</text><text x="788" y="500" font-size="21" fill="#52666C">社会保険のある仕事に就く</text><text x="788" y="532" font-size="21" fill="#52666C">と公的保険に入ることも</text><text x="48" y="622" font-size="22" fill="#173B48">必要書類と資金の金額は変わることがあります。申請前に大使館の最新の案内を確認してください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：在日ドイツ大使館の案内、滞在令第41条、最低賃金法  |  2026-11-06</text></g></svg>