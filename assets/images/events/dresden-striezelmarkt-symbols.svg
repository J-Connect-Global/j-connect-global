  <text x="600" y="496">木のピラミッド</text>
  <text x="973" y="496">シュトレン祭り</text>
 </g>
 <g font-size="19" text-anchor="middle" fill="#586357">
  <text x="227" y="533">地域と製法の基準を満たす</text><text x="227" y="565">金色の認証シールが目印</text>
  <text x="600" y="533">エルツ地方の木工伝統</text><text x="600" y="565">会場の展示は高さ約14.6m</text>
  <text x="973" y="533">2026年12月5日（土）</text><text x="973" y="565">巨大シュトレンの行列と切り分け</text>
 </g>
