<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">扶養の配偶者の上乗せ案</title><desc id="d">2028年から扶養に入っている配偶者がいる加入者の保険料に0.52%の上乗せがかかる案で、月給4,000ユーロなら約21ユーロの負担増、子どもがいる場合や配偶者が家族を介護している場合などは対象外であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">扶養の配偶者がいる場合の上乗せ案（2028年〜）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">家族保険の元になっている加入者の保険料に0.52％</text><rect x="60" y="175" width="520" height="250" rx="16" fill="white"/><text x="320" y="225" font-size="23" font-weight="700" fill="#405a71" text-anchor="middle">月の給与4,000ユーロの例</text><text x="320" y="315" font-size="48" font-weight="700" fill="#8a5aa8" text-anchor="middle">約21ユーロ／月</text><text x="320" y="370" font-size="22" fill="#405a71" text-anchor="middle">の負担増（概算）</text><rect x="620" y="175" width="520" height="410" rx="16" fill="white"/><rect x="620" y="175" width="520" height="60" rx="16" fill="#2f8a64"/><rect x="620" y="215" width="520" height="20" rx="0" fill="#2f8a64"/><text x="880" y="216" font-size="24" font-weight="700" fill="white" text-anchor="middle">上乗せがかからない例</text><text x="650" y="290" font-size="20" fill="#29465f" text-anchor="start">○ 一定の年齢未満の子どもがいる</text><text x="650" y="362" font-size="20" fill="#29465f" text-anchor="start">○ 自分で生活できない障害のある子どもがいる</text><text x="650" y="434" font-size="20" fill="#29465f" text-anchor="start">○ 配偶者が家族を週10時間以上介護</text><text x="650" y="506" font-size="20" fill="#29465f" text-anchor="start">○ 配偶者が年金の支給開始年齢に達している</text><rect x="60" y="445" width="520" height="140" rx="16" fill="#fff7e6"/><text x="90" y="495" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">まだ政府案の段階</text><text x="90" y="535" font-size="20" fill="#29465f" text-anchor="start">子どもの年齢の線引きなどは</text><text x="90" y="567" font-size="20" fill="#29465f" text-anchor="start">審議で変わる可能性あり</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦保健省 介護再編法のよくある質問（2026年10月29日参照）</text></g></svg>