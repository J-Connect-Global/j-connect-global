<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツで自転車に乗るときの主な過料</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">自転車の主な過料　国の一覧で決まっている</text><text x="48" y="152" font-size="23" fill="#52666C">他人に危険を生じさせた場合や、物を壊した場合は増額される</text><rect x="488" y="176" width="188" height="50" rx="10" fill="#173B48"/><text x="504" y="210" font-size="24" fill="#FFFFFF">過料</text><rect x="688" y="176" width="452" height="50" rx="10" fill="#146859"/><text x="704" y="210" font-size="24" fill="#FFFFFF">メモ</text><text x="64" y="210" font-size="22" fill="#52666C">違反</text><rect x="48" y="230" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="270" font-size="24" fill="#52666C">赤信号を無視</text><text x="504" y="270" font-size="26" fill="#C2410C">60ユーロ</text><text x="704" y="270" font-size="26" fill="#173B48">1秒以上の赤なら100ユーロ</text><rect x="48" y="290" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="330" font-size="24" fill="#52666C">スマートフォンを手に持って使う</text><text x="504" y="330" font-size="26" fill="#C2410C">55ユーロ</text><text x="704" y="330" font-size="26" fill="#173B48">ホルダーに固定して短く確認は可</text><rect x="48" y="350" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="390" font-size="24" fill="#52666C">大人が歩道を走る</text><text x="504" y="390" font-size="26" fill="#173B48">25〜55ユーロ</text><text x="704" y="390" font-size="26" fill="#173B48">子どもは10歳まで歩道を走れる</text><rect x="48" y="410" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="450" font-size="24" fill="#52666C">標識のある自転車道を使わない</text><text x="504" y="450" font-size="26" fill="#173B48">20ユーロ</text><text x="704" y="450" font-size="26" fill="#173B48">青い丸の標識がある場合</text><rect x="48" y="470" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="510" font-size="24" fill="#52666C">ライトの装備の違反</text><text x="504" y="510" font-size="26" fill="#173B48">20ユーロ</text><text x="704" y="510" font-size="26" fill="#173B48">点滅する前ライトも不可</text><rect x="48" y="530" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="570" font-size="24" fill="#52666C">ベルの装備の違反</text><text x="504" y="570" font-size="26" fill="#173B48">15ユーロ</text><text x="704" y="570" font-size="26" fill="#173B48">澄んだ音のベルが1つ必要</text><text x="48" y="622" font-size="22" fill="#173B48">血中アルコール1.6パーミル以上での運転は、自転車でも刑法上の罪になります。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：過料一覧規則の別表、道路交通規則第2条・第23条、刑法第316条  |  2026-11-06</text></g></svg>