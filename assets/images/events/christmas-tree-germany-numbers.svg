<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツのクリスマスツリーの数字</title><desc id="d">ドイツで毎年飾られるクリスマスツリー約2,300万〜2,500万本、ノルドマンもみの割合約75〜80%、2024年の輸入180万本のうち83%がデンマーク産、国内の栽培農家3,310軒を示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">数字で見る、今のドイツのクリスマスツリー</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ドイツ森林保護協会と連邦統計局の資料から</text><rect x="60" y="185" width="530" height="180" rx="16" fill="white"/><rect x="60" y="185" width="16" height="180" rx="8" fill="#2f8a64"/><text x="110" y="270" font-size="40" font-weight="700" fill="#2f8a64" text-anchor="start">約2,300万〜2,500万本</text><text x="110" y="320" font-size="22" fill="#29465f" text-anchor="start">毎年ドイツの家庭に飾られるツリー</text><rect x="610" y="185" width="530" height="180" rx="16" fill="white"/><rect x="610" y="185" width="16" height="180" rx="8" fill="#2d6a9f"/><text x="660" y="270" font-size="40" font-weight="700" fill="#2d6a9f" text-anchor="start">約75〜80%</text><text x="660" y="320" font-size="22" fill="#29465f" text-anchor="start">ノルドマンもみの割合</text><rect x="60" y="385" width="530" height="180" rx="16" fill="white"/><rect x="60" y="385" width="16" height="180" rx="8" fill="#c9952a"/><text x="110" y="470" font-size="40" font-weight="700" fill="#c9952a" text-anchor="start">180万本</text><text x="110" y="520" font-size="22" fill="#29465f" text-anchor="start">2024年の輸入（83%がデンマーク産）</text><rect x="610" y="385" width="530" height="180" rx="16" fill="white"/><rect x="610" y="385" width="16" height="180" rx="8" fill="#b5473a"/><text x="660" y="470" font-size="40" font-weight="700" fill="#b5473a" text-anchor="start">3,310軒</text><text x="660" y="520" font-size="22" fill="#29465f" text-anchor="start">2024年の国内のツリー栽培農家</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ森林保護協会（SDW）、連邦統計局（2026年10月27日参照）</text></g></svg>