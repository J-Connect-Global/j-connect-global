<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026年10月25日：時計を1時間戻す</title><desc id="d">ドイツでは日曜日の午前3時に、午前2時へ戻ります</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="65" y="100" font-size="42" font-weight="700" fill="#153452">2026年10月25日：時計を1時間戻す</text><text x="65" y="155" font-size="25" fill="#405a71">ドイツでは日曜日の午前3時に、午前2時へ戻ります</text><rect x="65" y="220" width="340" height="290" rx="20" fill="white"/><text x="90" y="280" font-size="29" font-weight="700" fill="#153452">変更前</text><text x="90" y="345" font-size="25" fill="#29465f">夏時間</text><text x="90" y="393" font-size="25" fill="#29465f">午前 3:00</text><rect x="430" y="220" width="340" height="290" rx="20" fill="white"/><text x="455" y="280" font-size="29" font-weight="700" fill="#153452">変更後</text><text x="455" y="345" font-size="25" fill="#29465f">標準時（冬時間）</text><text x="455" y="393" font-size="25" fill="#29465f">午前 2:00</text><rect x="795" y="220" width="340" height="290" rx="20" fill="white"/><text x="820" y="280" font-size="29" font-weight="700" fill="#153452">日本との時差</text><text x="820" y="345" font-size="25" fill="#29465f">日本が8時間先へ</text><text x="820" y="393" font-size="25" fill="#29465f">自動設定の有無を確認</text><text x="65" y="590" font-size="24" fill="#405a71">図解：J-Connect編集部。根拠：本文の欧州委員会・PTB案内（2026年10月19日確認）。</text></g></svg>
