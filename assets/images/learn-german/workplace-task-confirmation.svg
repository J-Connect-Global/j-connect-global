<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
  <title id="title">職場で確認したい3つの質問</title>
  <desc id="desc">1. 作業内容：Was genau soll ich vorbereiten? 2. 期限：Bis wann brauchen Sie die Unterlagen? 3. 優先順位：Welche Aufgabe hat Vorrang? 同じ質問と日本語訳は直後の表にもあります。</desc>
  <rect width="800" height="680" rx="24" fill="#f1f6f8"/>
  <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#16334a">
    <text x="40" y="66" font-size="34" font-weight="700">仕事を始める前に、3つ確認</text>
    <text x="40" y="110" font-size="25" fill="#415c70">内容 → 期限 → 優先順位</text>
    <rect x="32" y="144" width="736" height="150" rx="18" fill="#fff" stroke="#b9ccd5"/>
    <circle cx="76" cy="187" r="23" fill="#1e5865"/>
    <text x="76" y="197" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1</text>
    <text x="116" y="199" font-size="31" font-weight="700">作業内容</text>
    <text x="56" y="255" font-size="32">Was genau soll ich vorbereiten?</text>
    <rect x="32" y="312" width="736" height="150" rx="18" fill="#fff" stroke="#b9ccd5"/>
    <circle cx="76" cy="355" r="23" fill="#1e5865"/>
    <text x="76" y="365" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text>
    <text x="116" y="367" font-size="31" font-weight="700">期限</text>
    <text x="56" y="423" font-size="32">Bis wann brauchen Sie die Unterlagen?</text>
    <rect x="32" y="480" width="736" height="150" rx="18" fill="#fff" stroke="#b9ccd5"/>
    <circle cx="76" cy="523" r="23" fill="#1e5865"/>
    <text x="76" y="533" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text>
    <text x="116" y="535" font-size="31" font-weight="700">優先順位</text>
    <text x="56" y="591" font-size="32">Welche Aufgabe hat Vorrang?</text>
  </g>
</svg>
