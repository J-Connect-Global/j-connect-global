<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">賃貸法改正案の4つの柱</title><desc id="d">家具付き物件は家具代を分けて書き書かないと家具なし扱い、すべての家具がそろった物件の家具代の目安は家賃の10%まで、短期賃貸は原則6か月まで、インデックス賃料は物価上昇3%を超えた分は半分だけ反映という改正案を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">賃貸法改正案「賃貸法II」の4つの柱</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦議会で審議中（2026年10月14日に公聴会）</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="530" height="12" rx="6" fill="#2d6a9f"/><text x="95" y="250" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="start">家具付きの物件</text><text x="95" y="300" font-size="22" fill="#29465f" text-anchor="start">家具代を契約で分けて書く</text><text x="95" y="340" font-size="22" font-weight="700" fill="#153452" text-anchor="start">書かないと「家具なし」扱い</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="530" height="12" rx="6" fill="#c9952a"/><text x="645" y="250" font-size="28" font-weight="700" fill="#c9952a" text-anchor="start">家具代の目安</text><text x="645" y="300" font-size="22" fill="#29465f" text-anchor="start">すべての家具がそろった物件</text><text x="645" y="340" font-size="22" font-weight="700" fill="#153452" text-anchor="start">家具を除く家賃の10％まで</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="530" height="12" rx="6" fill="#2f8a64"/><text x="95" y="465" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="start">短期の賃貸</text><text x="95" y="515" font-size="22" fill="#29465f" text-anchor="start">原則6か月まで（最長8か月）</text><text x="95" y="555" font-size="22" font-weight="700" fill="#153452" text-anchor="start">短期で住む理由が必要</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="530" height="12" rx="6" fill="#b5473a"/><text x="645" y="465" font-size="28" font-weight="700" fill="#b5473a" text-anchor="start">インデックス賃料</text><text x="645" y="515" font-size="22" fill="#29465f" text-anchor="start">物価上昇3％を超えた分は</text><text x="645" y="555" font-size="22" font-weight="700" fill="#153452" text-anchor="start">半分だけ家賃に反映</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※住宅が足りない地域（家賃ブレーキの対象地域）が中心。出典：連邦司法・消費者保護省</text></g></svg>