<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツ鉄道の定時率</title><desc id="d">2025年のドイツ鉄道の定時率は長距離列車60.1%（前年62.5%）、地域の列車88.7%（前年90.3%）で、定時の基準は予定から6分未満の遅れであることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツ鉄道の定時率（2025年）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">「定時」＝予定より6分未満の遅れ</text><rect x="60" y="190" width="520" height="330" rx="16" fill="white"/><text x="320" y="240" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">長距離列車（ICE・ICなど）</text><rect x="100" y="280" width="440" height="56" rx="12" fill="#e3e8ee"/><rect x="100" y="280" width="264" height="56" rx="12" fill="#b5473a"/><text x="320" y="420" font-size="64" font-weight="700" fill="#b5473a" text-anchor="middle">60.1%</text><text x="320" y="475" font-size="22" fill="#405a71" text-anchor="middle">前年 62.5%</text><rect x="620" y="190" width="520" height="330" rx="16" fill="white"/><text x="880" y="240" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">地域の列車（RE・RBなど）</text><rect x="660" y="280" width="440" height="56" rx="12" fill="#e3e8ee"/><rect x="660" y="280" width="390" height="56" rx="12" fill="#2d6a9f"/><text x="880" y="420" font-size="64" font-weight="700" fill="#2d6a9f" text-anchor="middle">88.7%</text><text x="880" y="475" font-size="22" fill="#405a71" text-anchor="middle">前年 90.3%</text><rect x="60" y="540" width="1080" height="62" rx="14" fill="#fff7e6"/><text x="600" y="580" font-size="21" fill="#8a5a00" text-anchor="middle">長距離列車の停車の約4割で、6分以上の遅れ。主な原因は古い設備と列車の増加</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ鉄道 2025年決算・年次報告書（2026年10月27日参照）</text></g></svg>