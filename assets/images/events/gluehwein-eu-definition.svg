<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">グリューワインの法的条件</title><desc id="desc">EUの規則に基づくワイン原料、香辛料、最低アルコール度数、水の取扱いの4条件。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf9f4"/><stop offset="1" stop-color="#efe7da"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fbfaf6"/></linearGradient><filter id="shadow" x="-20%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2b291e" flood-opacity=".09"/></filter><linearGradient id="wax" x1="0" x2="1"><stop stop-color="#e1d6bc"/><stop offset=".35" stop-color="#fff6de"/><stop offset=".75" stop-color="#f5e9cd"/><stop offset="1" stop-color="#c3ae8c"/></linearGradient><radialGradient id="fire"><stop stop-color="#fff5a8"/><stop offset=".6" stop-color="#ffc84d"/><stop offset="1" stop-color="#d96c17"/></radialGradient></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none"/><rect width="1200" height="9" fill="#743e39"/><g font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif"><text x="49" y="79" font-size="39" font-weight="800" fill="#6c3733" text-anchor="start">「Glühwein」と呼べる4つの条件</text><text x="50" y="118" font-size="20" font-weight="500" fill="#5e6960" text-anchor="start">EUの表示ルールを、注文前に1分で確認</text><g filter="url(#shadow)"><rect x="47" y="156" width="532" height="178" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="67" y="180" width="55" height="55" rx="14" fill="#eee6d5" stroke="none"/><text x="94" y="217" font-size="27" font-weight="800" fill="#8c583f" text-anchor="middle">01</text><text x="139" y="213" font-size="27" font-weight="800" fill="#234a38" text-anchor="start">ベースはワイン</text><text x="76" y="264" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">赤・白・ロゼワイン、またはその組合せ</text><text x="76" y="294" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">（ロゼは2026年改正で追加）</text><g filter="url(#shadow)"><rect x="620" y="156" width="532" height="178" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="640" y="180" width="55" height="55" rx="14" fill="#eee6d5" stroke="none"/><text x="667" y="217" font-size="27" font-weight="800" fill="#8c583f" text-anchor="middle">02</text><text x="712" y="213" font-size="27" font-weight="800" fill="#234a38" text-anchor="start">香りづけ</text><text x="649" y="264" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">主にシナモン、クローブを使用</text><text x="649" y="294" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">どちらか一方、または両方</text><g filter="url(#shadow)"><rect x="47" y="355" width="532" height="178" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="67" y="379" width="55" height="55" rx="14" fill="#eee6d5" stroke="none"/><text x="94" y="416" font-size="27" font-weight="800" fill="#8c583f" text-anchor="middle">03</text><text x="139" y="412" font-size="27" font-weight="800" fill="#234a38" text-anchor="start">アルコール度数</text><text x="76" y="463" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">実際のアルコール分が 7%以上</text><text x="76" y="493" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">ジュース主体の飲料とは区別される</text><g filter="url(#shadow)"><rect x="620" y="355" width="532" height="178" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="640" y="379" width="55" height="55" rx="14" fill="#eee6d5" stroke="none"/><text x="667" y="416" font-size="27" font-weight="800" fill="#8c583f" text-anchor="middle">04</text><text x="712" y="412" font-size="27" font-weight="800" fill="#234a38" text-anchor="start">水を加えない</text><text x="649" y="463" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">原則として加水は不可</text><text x="649" y="493" font-size="20" font-weight="500" fill="#5a625b" text-anchor="start">規則が認める限定的な例外は除く</text><rect x="48" y="548" width="1103" height="55" rx="12" fill="#f1e6da" stroke="none"/><text x="67" y="584" font-size="22" font-weight="800" fill="#7b4537" text-anchor="start">ラベルの注意</text><text x="234" y="584" font-size="21" font-weight="550" fill="#493c36" text-anchor="start">白ワイン・ロゼの場合は、その種類を名前や表示で示す</text><line x1="50" y1="627" x2="1150" y2="627" stroke="#d8d6cd"/><text x="51" y="653" font-size="14" font-weight="500" fill="#686f68" text-anchor="start">出典：EU規則 251/2014 附属書II、EU規則 2026/471｜J-Connect Global 編集図解</text></g></svg>