<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl desc"><title id="ttl">クリスマスツリーの歴史年表</title><desc id="desc">中世の楽園の木、1605年のシュトラスブルクの記録、17世紀の批判、1648年以降の広がり、19世紀の定着を順番に説明。</desc><defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfaf6"/><stop offset="1" stop-color="#eee8de"/></linearGradient><filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17281e" flood-opacity=".09"/></filter></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#back)" stroke="none"/><rect x="0" y="0" width="1200" height="8" fill="#315744"/><g font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif"><text x="48" y="77" font-size="39" fill="#234d3d" font-weight="800" text-anchor="start">クリスマスツリーはどう広まった？</text><text x="49" y="118" font-size="20" fill="#667166" font-weight="500" text-anchor="start">「楽園の木」から、ろうそくを灯す家庭のツリーへ</text><g filter="url(#cardShadow)"><rect x="43" y="169" width="218" height="426" rx="18" fill="#fff" stroke="#e4e2da"/></g><rect x="61" y="189" width="175" height="37" rx="18" fill="#e7ede6" stroke="none"/><text x="148" y="215" font-size="19" fill="#2d634a" font-weight="800" text-anchor="middle">中世</text><path d="M152 258l-53 100h106Z" fill="#63835b"/><path d="M152 282l-42 85h84Z" fill="#395f45"/><circle cx="139" cy="320" r="7" fill="#c04738"/><circle cx="173" cy="337" r="7" fill="#c04738"/><circle cx="145" cy="350" r="7" fill="#c04738"/><text x="61" y="426" font-size="21" fill="#284b3b" font-weight="800" text-anchor="start">楽園の木</text><text x="61" y="472" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">アダムとイブの劇</text><text x="61" y="503" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">リンゴを飾った木</text><text x="61" y="545" font-size="16" fill="#8a7762" font-weight="500" text-anchor="start">起源には諸説あり</text><path d="M262 380h10l-6 -7m6 7-6 7" fill="none" stroke="#ba9b6b" stroke-width="3"/><g filter="url(#cardShadow)"><rect x="274" y="169" width="218" height="426" rx="18" fill="#fff" stroke="#e4e2da"/></g><rect x="292" y="189" width="175" height="37" rx="18" fill="#e7ede6" stroke="none"/><text x="379" y="215" font-size="19" fill="#2d634a" font-weight="800" text-anchor="middle">1605年</text><rect x="327" y="258" width="112" height="119" rx="7" fill="#e4d5b9" stroke="#b39c79"/><path d="M342 278h82" stroke="#a78e72" stroke-width="3" stroke-linecap="round"/><path d="M342 295h82" stroke="#a78e72" stroke-width="3" stroke-linecap="round"/><path d="M342 312h82" stroke="#a78e72" stroke-width="3" stroke-linecap="round"/><path d="M342 329h82" stroke="#a78e72" stroke-width="3" stroke-linecap="round"/><path d="M342 346h82" stroke="#a78e72" stroke-width="3" stroke-linecap="round"/><path d="M344 364l73 -68" stroke="#8a4e42" stroke-width="4" opacity=".5"/><text x="292" y="426" font-size="21" fill="#284b3b" font-weight="800" text-anchor="start">文字に残る記録</text><text x="292" y="472" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">シュトラスブルクで</text><text x="292" y="503" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">飾り付けの記述</text><text x="292" y="545" font-size="16" fill="#8a7762" font-weight="500" text-anchor="start">まだ現在の姿ではない</text><path d="M493 380h10l-6 -7m6 7-6 7" fill="none" stroke="#ba9b6b" stroke-width="3"/><g filter="url(#cardShadow)"><rect x="505" y="169" width="218" height="426" rx="18" fill="#fff" stroke="#e4e2da"/></g><rect x="523" y="189" width="175" height="37" rx="18" fill="#e7ede6" stroke="none"/><text x="610" y="215" font-size="19" fill="#2d634a" font-weight="800" text-anchor="middle">17世紀</text><rect x="566" y="262" width="96" height="116" rx="6" fill="#e8e2d0" stroke="#b7b5a5"/><text x="614" y="309" font-size="53" fill="#865e4b" font-weight="800" text-anchor="middle">?</text><text x="614" y="351" font-size="22" fill="#6b6757" font-weight="750" text-anchor="middle">議論</text><text x="523" y="426" font-size="21" fill="#284b3b" font-weight="800" text-anchor="start">宗教的な批判</text><text x="523" y="472" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">説教者らが家庭の</text><text x="523" y="503" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">ツリーを批判</text><text x="523" y="545" font-size="16" fill="#8a7762" font-weight="500" text-anchor="start">慣習は広がり続ける</text><path d="M724 380h10l-6 -7m6 7-6 7" fill="none" stroke="#ba9b6b" stroke-width="3"/><g filter="url(#cardShadow)"><rect x="736" y="169" width="218" height="426" rx="18" fill="#fff" stroke="#e4e2da"/></g><rect x="754" y="189" width="175" height="37" rx="18" fill="#e7ede6" stroke="none"/><text x="841" y="215" font-size="19" fill="#2d634a" font-weight="800" text-anchor="middle">1648年以降</text><path d="M778 364l48 -88 48 88Z" fill="#719677"/><path d="M825 364l49 -108 54 108Z" fill="#3e684c"/><path d="M792 377h138" stroke="#8c7154" stroke-width="6"/><text x="754" y="426" font-size="21" fill="#284b3b" font-weight="800" text-anchor="start">地域へ広がる</text><text x="754" y="472" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">三十年戦争後に</text><text x="754" y="503" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">町から町へ</text><text x="754" y="545" font-size="16" fill="#8a7762" font-weight="500" text-anchor="start">主に新教徒の地域</text><path d="M955 380h10l-6 -7m6 7-6 7" fill="none" stroke="#ba9b6b" stroke-width="3"/><g filter="url(#cardShadow)"><rect x="967" y="169" width="218" height="426" rx="18" fill="#fff" stroke="#e4e2da"/></g><rect x="985" y="189" width="175" height="37" rx="18" fill="#e7ede6" stroke="none"/><text x="1072" y="215" font-size="19" fill="#2d634a" font-weight="800" text-anchor="middle">19世紀</text><path d="M1076 252l-61 112h122Z" fill="#3c7054"/><path d="M1076 280l-52 89h104Z" fill="#296044"/><rect x="1068" y="368" width="16" height="22" fill="#99714c"/><circle cx="1076" cy="295" r="5" fill="#bf8b3f"/><circle cx="1055" cy="326" r="5" fill="#bf8b3f"/><circle cx="1097" cy="348" r="5" fill="#bf8b3f"/><circle cx="1068" cy="356" r="5" fill="#bf8b3f"/><text x="985" y="426" font-size="21" fill="#284b3b" font-weight="800" text-anchor="start">家庭の定番に</text><text x="985" y="472" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">ろうそくが普及</text><text x="985" y="503" font-size="18" fill="#5f675d" font-weight="500" text-anchor="start">両宗派の家庭へ</text><text x="985" y="545" font-size="16" fill="#8a7762" font-weight="500" text-anchor="start">現在の形に近づく</text><line x1="47" y1="622" x2="1150" y2="622" stroke="#d8d4ca"/><text x="48" y="649" font-size="15" fill="#77776f" font-weight="500" text-anchor="start">出典：katholisch.de｜初期のクリスマスツリーの起源や年代には諸説あり（説明用模式図）</text></g></svg>