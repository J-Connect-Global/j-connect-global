<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ボーナス手帳と補助の割合</title><desc id="d">かぶせ物や入れ歯などの補助は標準的な治療の費用の60％が基本で、5年続けて健診を受けていれば70％、10年続けていれば75％になることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ボーナス手帳で、かぶせ物などの補助が増える</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">標準的な治療の費用に対する保険組合の補助（Festzuschuss）</text><rect x="60" y="200" width="1080" height="80" rx="16" fill="white"/><text x="90" y="250" font-size="24" font-weight="700" fill="#153452" text-anchor="start">基本</text><rect x="360" y="222" width="480" height="36" rx="8" fill="#6f8aa3"/><text x="855" y="250" font-size="28" font-weight="700" fill="#6f8aa3" text-anchor="start">60％</text><rect x="60" y="300" width="1080" height="80" rx="16" fill="white"/><text x="90" y="350" font-size="24" font-weight="700" fill="#153452" text-anchor="start">5年続けて健診</text><rect x="360" y="322" width="560" height="36" rx="8" fill="#2d6a9f"/><text x="935" y="350" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="start">70％</text><rect x="60" y="400" width="1080" height="80" rx="16" fill="white"/><text x="90" y="450" font-size="24" font-weight="700" fill="#153452" text-anchor="start">10年続けて健診</text><rect x="360" y="422" width="600" height="36" rx="8" fill="#2f8a64"/><text x="975" y="450" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="start">75％</text><rect x="60" y="510" width="1080" height="100" rx="16" fill="#fff7e6"/><text x="90" y="555" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">毎年の健診のたびに、記録を残す</text><text x="90" y="595" font-size="21" fill="#29465f" text-anchor="start">押印やシールのほか、アプリや電子の記録に対応する保険組合もあります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター（2026年10月29日参照）</text></g></svg>