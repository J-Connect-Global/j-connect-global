<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">水の硬さの区分とNRWの街の位置</title><desc id="d">洗剤法の区分で8.4°dH未満が軟らかい、8.4〜14°dHが中くらい、14°dH超が硬いこと、デュッセルドルフ約14°dH、ケルン右岸15.6°dH、左岸18.1°dHがいずれも硬い区分にあることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">水の硬さ：3つの区分</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">洗剤法9条の区分（ドイツ硬度°dHは目安）</text><rect x="60" y="190" width="1080" height="130" rx="20" fill="white"/><rect x="80" y="210" width="300" height="90" rx="12" fill="#8cc3e8"/><text x="230" y="250" font-size="26" font-weight="700" fill="white" text-anchor="middle">軟らかい</text><text x="230" y="284" font-size="20" fill="white" text-anchor="middle">8.4°dH未満</text><rect x="380" y="210" width="340" height="90" rx="12" fill="#5f9fd0"/><text x="550" y="250" font-size="26" font-weight="700" fill="white" text-anchor="middle">中くらい</text><text x="550" y="284" font-size="20" fill="white" text-anchor="middle">8.4〜14°dH</text><rect x="720" y="210" width="400" height="90" rx="12" fill="#2d6a9f"/><text x="920" y="250" font-size="26" font-weight="700" fill="white" text-anchor="middle">硬い</text><text x="920" y="284" font-size="20" fill="white" text-anchor="middle">14°dH超</text><rect x="60" y="380" width="1080" height="220" rx="20" fill="white"/><text x="90" y="425" font-size="26" font-weight="700" fill="#153452" text-anchor="start">NRWの大きな街は「硬い」</text><line x1="720" y1="330" x2="720" y2="452" stroke="#153452" stroke-width="3"/><circle cx="720" cy="330" r="8" fill="#153452"/><text x="720" y="480" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">デュッセルドルフ 約14°dH</text><line x1="799" y1="330" x2="799" y2="502" stroke="#153452" stroke-width="3"/><circle cx="799" cy="330" r="8" fill="#153452"/><text x="799" y="530" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">ケルン右岸 15.6°dH</text><line x1="925" y1="330" x2="925" y2="552" stroke="#153452" stroke-width="3"/><circle cx="925" cy="330" r="8" fill="#153452"/><text x="925" y="580" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">ケルン左岸 18.1°dH</text><text x="90" y="480" font-size="22" fill="#405a71" text-anchor="start">飲んでも体に悪くない</text><text x="90" y="520" font-size="22" fill="#405a71" text-anchor="start">電気ケトルや食洗機の</text><text x="90" y="555" font-size="22" fill="#405a71" text-anchor="start">水あかに注意</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：洗剤法9条、デュッセルドルフ都市公社、ラインエネルギー（2025年値）。住所ごとの値は水道事業者で確認</text></g></svg>