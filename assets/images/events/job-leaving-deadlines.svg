<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">仕事が終わるときの期限</title><desc id="d">退職や解雇の通知は紙に手書きで署名した書面が必要でメールは無効、解雇に納得できない場合は3週間以内に労働裁判所へ、職業安定所へは3か月前までか分かってから3日以内に届け出ることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">仕事が終わるときの大切な期限</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">書面・3週間・3か月前（または3日以内）</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#b5473a"/><text x="96" y="228" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">退職・解雇の通知</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">紙に手書きで署名した書面</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">メール・チャット・PDFは無効</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="646" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">解雇に納得できないとき</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">通知を受け取ってから</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">3週間以内に労働裁判所へ</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#2f8a64"/><text x="96" y="443" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">職業安定所への届け出</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">仕事が終わる3か月前まで</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">（3か月ないときは3日以内）</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#8a5aa8"/><text x="646" y="443" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">外国籍の人</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">滞在許可が仕事と結びつく場合は</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">早めに外国人局に確認</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：民法第623条、解雇保護法第4条、連邦雇用エージェンシー（2026年10月29日参照）</text></g></svg>