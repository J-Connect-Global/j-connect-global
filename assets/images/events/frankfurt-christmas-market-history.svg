<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">フランクフルトのクリスマスマーケットの歩み</title><desc id="d">1393年の最初の記録、地元の商人だけが出店した時代、19世紀に広まったクリスマスツリー、1838年の焼き菓子ベートマンヒェンの言い伝え、19世紀後半まで続いたおもちゃの買い物、2026年11月23日の開幕を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">フランクフルトの市の歩み</text><text x="60" y="134" font-size="22" fill="#405a71">中世の商業都市の市が、街を代表する冬の風景になるまで</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="110" y1="380" x2="1090" y2="380" stroke="#8d5a3c" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="130" y1="380" x2="130" y2="332" stroke="#153452" stroke-width="2"/><text x="130" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1393年</text><text x="130" y="292" font-size="18" fill="#405a71" text-anchor="middle">クリスマス時期の</text><text x="130" y="316" font-size="18" fill="#405a71" text-anchor="middle">市が文書に登場</text><circle cx="322" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="322" y1="380" x2="322" y2="428" stroke="#153452" stroke-width="2"/><text x="322" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">中世〜近世</text><text x="322" y="502" font-size="18" fill="#405a71" text-anchor="middle">出店は地元の</text><text x="322" y="526" font-size="18" fill="#405a71" text-anchor="middle">商人と職人だけ</text><circle cx="514" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="514" y1="380" x2="514" y2="332" stroke="#153452" stroke-width="2"/><text x="514" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">19世紀初め</text><text x="514" y="292" font-size="18" fill="#405a71" text-anchor="middle">モミの木を飾る</text><text x="514" y="316" font-size="18" fill="#405a71" text-anchor="middle">習慣が街に定着</text><circle cx="706" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="706" y1="380" x2="706" y2="428" stroke="#153452" stroke-width="2"/><text x="706" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1838年</text><text x="706" y="502" font-size="18" fill="#405a71" text-anchor="middle">ベートマンヒェン</text><text x="706" y="526" font-size="18" fill="#405a71" text-anchor="middle">誕生の言い伝え</text><circle cx="898" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="898" y1="380" x2="898" y2="332" stroke="#153452" stroke-width="2"/><text x="898" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">19世紀後半まで</text><text x="898" y="292" font-size="18" fill="#405a71" text-anchor="middle">子どものおもちゃは</text><text x="898" y="316" font-size="18" fill="#405a71" text-anchor="middle">この市で買う</text><circle cx="1090" cy="380" r="13" fill="#b23a3a" stroke="white" stroke-width="4"/><line x1="1090" y1="380" x2="1090" y2="428" stroke="#153452" stroke-width="2"/><text x="1090" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">2026年</text><text x="1090" y="502" font-size="18" fill="#405a71" text-anchor="middle">11月23日に開幕</text><text x="1090" y="526" font-size="18" fill="#405a71" text-anchor="middle">12月22日まで</text></g></svg>