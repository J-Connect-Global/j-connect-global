<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">休暇中の病気と退職</title><desc id="d">休暇中に病気になり医師の診断書がある日は休暇として数えず、退職で休暇を取れなかった場合は残った休暇の分がお金で支払われ、長い病気の場合は原則15か月後に消えるとされることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">休暇中の病気と、退職のとき</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦休暇法のルール</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">休暇中に病気になったら</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">医師の診断書がある日は</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">休暇として数えない</text><text x="96" y="328" font-size="20" fill="#29465f" text-anchor="start">すぐに会社に連絡を</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#c9952a"/><text x="646" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">退職で休暇を取れなかったら</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">残った休暇の分が</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">お金で支払われる</text><text x="646" y="328" font-size="20" fill="#29465f" text-anchor="start">（在職中の換金は原則不可）</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#8a5aa8"/><text x="96" y="443" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">長い病気で取れなかったら</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">原則として、その年の終わりから</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">15か月後に消えるとされる</text><text x="96" y="543" font-size="20" fill="#29465f" text-anchor="start">個別の事情は専門家に相談</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#2f8a64"/><text x="646" y="443" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">契約の上乗せ分</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">法律の最低日数を超える休暇は</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">契約や労働協約の決まりで</text><text x="646" y="543" font-size="20" fill="#29465f" text-anchor="start">扱いが違うことも</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦休暇法第7条・第9条、連邦労働裁判所（2026年10月29日参照）</text></g></svg>