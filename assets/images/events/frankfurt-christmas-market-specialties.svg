<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">フランクフルトのクリスマスマーケットで味わいたいもの</title><desc id="d">アーモンドを三つ貼ったマジパン菓子ベートマンヒェン、干しプラムとクルミの人形、旧ニコライ教会の塔から響く金管の演奏の三つを紹介する図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">フランクフルトの市で出会いたいもの</text><text x="60" y="134" font-size="22" fill="#405a71">名物の味と、物語のある手仕事、広場に響く音</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(245,285)"><circle r="58" fill="#f1e1c2"/><circle r="44" fill="#e8cf9e"/><ellipse cx="0" cy="-22" rx="11" ry="20" fill="#c08a52" transform="rotate(0)"/><ellipse cx="0" cy="-22" rx="11" ry="20" fill="#c08a52" transform="rotate(120)"/><ellipse cx="0" cy="-22" rx="11" ry="20" fill="#c08a52" transform="rotate(240)"/></g><text x="245" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">ベートマンヒェン</text><text x="245" y="452" font-size="18" fill="#405a71" text-anchor="middle">マジパンにアーモンドを</text><text x="245" y="482" font-size="18" fill="#405a71" text-anchor="middle">三つ貼った焼き菓子</text><text x="245" y="512" font-size="18" fill="#405a71" text-anchor="middle">銀行家の一家にちなむ名前</text><rect x="435" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(600,285)"><circle cx="0" cy="-48" r="16" fill="#e8c9a0"/><path d="M-6,-64 L0,-90 L6,-64 Z" fill="#2b2b2b"/><ellipse cx="0" cy="-18" rx="22" ry="15" fill="#4a2340"/><ellipse cx="0" cy="6" rx="22" ry="15" fill="#4a2340"/><ellipse cx="0" cy="30" rx="22" ry="15" fill="#4a2340"/><ellipse cx="-30" cy="0" rx="12" ry="9" fill="#7b4a2a"/><ellipse cx="30" cy="0" rx="12" ry="9" fill="#7b4a2a"/></g><text x="600" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">プラムの人形</text><text x="600" y="452" font-size="18" fill="#405a71" text-anchor="middle">干しプラムとクルミで作る</text><text x="600" y="482" font-size="18" fill="#405a71" text-anchor="middle">19世紀には求愛の</text><text x="600" y="512" font-size="18" fill="#405a71" text-anchor="middle">贈り物だったという</text><rect x="789" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(955,285)"><circle r="58" fill="#e6eef6"/><path d="M-40,10 L10,-10 L40,-34 L40,26 L10,2 L-40,22 Z" fill="#d4a017"/><rect x="-48" y="6" width="12" height="20" fill="#b8860b"/></g><text x="955" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">塔の上の金管</text><text x="955" y="452" font-size="18" fill="#405a71" text-anchor="middle">旧ニコライ教会の塔から</text><text x="955" y="482" font-size="18" fill="#405a71" text-anchor="middle">2026年は水・土曜の</text><text x="955" y="512" font-size="18" fill="#405a71" text-anchor="middle">18時から演奏予定</text></g></svg>