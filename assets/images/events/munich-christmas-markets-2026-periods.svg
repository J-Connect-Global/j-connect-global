<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ミュンヘンの主なクリスマスマーケットの2026年の期間</title><desc id="d">ミュンヘンの主な7つの市の2026年の期間を横棒で比較した図。レジデンツは11月16日から、マリエン広場は11月20日から12月24日まで、11月22日は休業</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ミュンヘンの主な市：2026年の期間</text><text x="60" y="134" font-size="22" fill="#405a71">マリエン広場は11月20日〜12月24日。11月22日は多くの市が休業</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="434" y1="190" x2="434" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="434" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/16</text><line x1="535" y1="190" x2="535" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="535" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/22</text><line x1="687" y1="190" x2="687" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="687" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/1</text><line x1="1076" y1="190" x2="1076" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="1076" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/24</text><text x="84" y="219" font-size="22" font-weight="700" fill="#153452">マリエン広場</text><text x="84" y="243" font-size="16" fill="#405a71">クリッペ市も同期間</text><rect x="501" y="200" width="592" height="31" rx="8" fill="#b5473a"/><rect x="535" y="196" width="17" height="39" fill="white"/><text x="84" y="282" font-size="22" font-weight="700" fill="#153452">レジデンツ</text><text x="84" y="306" font-size="16" fill="#405a71">宮殿の中庭</text><rect x="434" y="262" width="625" height="31" rx="8" fill="#c9a227"/><rect x="535" y="258" width="17" height="39" fill="white"/><text x="84" y="345" font-size="22" font-weight="700" fill="#153452">中世風の市</text><text x="84" y="369" font-size="16" fill="#405a71">ヴィッテルスバッハー広場</text><rect x="501" y="325" width="575" height="31" rx="8" fill="#7a5233"/><rect x="535" y="321" width="17" height="39" fill="white"/><text x="84" y="407" font-size="22" font-weight="700" fill="#153452">トールウッド</text><text x="84" y="431" font-size="16" fill="#405a71">テレージエンヴィーゼ</text><rect x="569" y="388" width="507" height="31" rx="8" fill="#2f6a40"/><text x="84" y="470" font-size="22" font-weight="700" fill="#153452">ピンク・クリスマス</text><text x="84" y="494" font-size="16" fill="#405a71">シュテファン広場</text><rect x="501" y="450" width="524" height="31" rx="8" fill="#c2557a"/><rect x="535" y="446" width="17" height="39" fill="white"/><text x="84" y="533" font-size="22" font-weight="700" fill="#153452">シュヴァービング</text><text x="84" y="557" font-size="16" fill="#405a71">ミュンヒナー・フライハイト</text><rect x="586" y="513" width="507" height="31" rx="8" fill="#2b5c8a"/><text x="60" y="645" font-size="18" fill="#405a71">白い切れ目は11月22日（死者の日曜日）の休業。最新情報はミュンヘン市の案内で確認（2026年11月1日参照）</text></g></svg>