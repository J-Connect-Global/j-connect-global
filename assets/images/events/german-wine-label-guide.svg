<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツワインのラベルの読み方</title><desc id="d">プレディカートの6段階（カビネット、シュペートレーゼ、アウスレーゼ、ベーレンアウスレーゼ、トロッケンベーレンアウスレーゼ、アイスヴァイン）と、甘さを表すトロッケン、ハルプトロッケン、リープリッヒ、ズースの糖分の目安を示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f7ef"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ワインのラベルの読み方</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">「熟し方」と「甘さ」は別の言葉で書かれる</text><text x="60" y="215" font-size="22" font-weight="700" fill="#153452" text-anchor="start">熟し方（プレディカート）：左から右へ、ぶどうがより熟す</text><rect x="60" y="235" width="170" height="110" rx="14" fill="#e9d9a6"/><text x="145" y="285" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">カビネット</text><rect x="240" y="235" width="170" height="110" rx="14" fill="#e2c77d"/><text x="325" y="285" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">シュペートレーゼ</text><rect x="420" y="235" width="170" height="110" rx="14" fill="#d9b04f"/><text x="505" y="285" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">アウスレーゼ</text><rect x="600" y="235" width="170" height="110" rx="14" fill="#c9952a"/><text x="685" y="271" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">ベーレン</text><text x="685" y="299" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">アウスレーゼ</text><rect x="780" y="235" width="170" height="110" rx="14" fill="#a97b2a"/><text x="865" y="271" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">トロッケンベーレン</text><text x="865" y="299" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">アウスレーゼ</text><rect x="960" y="235" width="170" height="110" rx="14" fill="#8cc3e8"/><text x="1045" y="285" font-size="18" font-weight="700" fill="#153452" text-anchor="middle">アイスヴァイン</text><text x="60" y="395" font-size="22" font-weight="700" fill="#153452" text-anchor="start">甘さ（ラベルの言葉）</text><rect x="60" y="415" width="256" height="130" rx="16" fill="white"/><rect x="60" y="415" width="256" height="12" rx="6" fill="#2d6a9f"/><text x="188" y="465" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="middle">trocken</text><text x="188" y="500" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">辛口</text><text x="188" y="530" font-size="18" fill="#405a71" text-anchor="middle">4g/Lまで</text><rect x="332" y="415" width="256" height="130" rx="16" fill="white"/><rect x="332" y="415" width="256" height="12" rx="6" fill="#5f9fd0"/><text x="460" y="465" font-size="24" font-weight="700" fill="#5f9fd0" text-anchor="middle">halbtrocken</text><text x="460" y="500" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">やや辛口</text><text x="460" y="530" font-size="18" fill="#405a71" text-anchor="middle">12g/Lまで</text><rect x="604" y="415" width="256" height="130" rx="16" fill="white"/><rect x="604" y="415" width="256" height="12" rx="6" fill="#c9952a"/><text x="732" y="465" font-size="24" font-weight="700" fill="#c9952a" text-anchor="middle">lieblich</text><text x="732" y="500" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">やや甘口</text><text x="732" y="530" font-size="18" fill="#405a71" text-anchor="middle">45g/Lまで</text><rect x="876" y="415" width="256" height="130" rx="16" fill="white"/><rect x="876" y="415" width="256" height="12" rx="6" fill="#b5473a"/><text x="1004" y="465" font-size="24" font-weight="700" fill="#b5473a" text-anchor="middle">süß</text><text x="1004" y="500" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">甘口</text><text x="1004" y="530" font-size="18" fill="#405a71" text-anchor="middle">45g/L超</text><text x="600" y="590" font-size="20" fill="#7a2e24" text-anchor="middle">アウスレーゼでも辛口（trocken）のことがある。甘さは右下の言葉で確かめる</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツワイン協会、ワイン法。糖分は酸味とのバランスによって上限が変わる場合あり</text></g></svg>