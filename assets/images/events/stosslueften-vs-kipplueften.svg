<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">全開で短く換気と傾けて長く換気の比較</title><desc id="d">窓を傾けて長時間開ける方法は暖房費が増え窓まわりが冷えて結露しやすい。窓を全開にして約5分換気する方法が勧められていることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">冬の換気は「全開で短く」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">窓を傾けたまま長時間より、大きく開けて約5分</text><rect x="60" y="190" width="520" height="400" rx="20" fill="white"/><rect x="620" y="190" width="520" height="400" rx="20" fill="white"/><rect x="90" y="220" width="200" height="260" rx="8" fill="#dceaf7" stroke="#405a71" stroke-width="6"/><polygon points="96,230 284,230 260,300 120,300" fill="#ffffff" stroke="#405a71" stroke-width="4"/><text x="455" y="250" font-size="28" font-weight="700" fill="#b5473a" text-anchor="middle">✕ 傾けて長時間</text><text x="455" y="310" font-size="22" fill="#29465f" text-anchor="middle">暖房費が増える</text><text x="455" y="350" font-size="22" fill="#29465f" text-anchor="middle">窓まわりの壁が冷え</text><text x="455" y="385" font-size="22" fill="#29465f" text-anchor="middle">結露・カビの原因に</text><rect x="650" y="220" width="200" height="260" rx="8" fill="#dceaf7" stroke="#405a71" stroke-width="6"/><rect x="660" y="230" width="80" height="240" fill="#ffffff" stroke="#405a71" stroke-width="4" transform="skewY(-12) translate(0,140)"/><text x="1010" y="250" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="middle">○ 全開で約5分</text><text x="1010" y="310" font-size="22" fill="#29465f" text-anchor="middle">1日2〜3回</text><text x="1010" y="350" font-size="22" fill="#29465f" text-anchor="middle">朝の寝室・料理や</text><text x="1010" y="385" font-size="22" fill="#29465f" text-anchor="middle">シャワーの後は5〜10分</text><text x="320" y="550" font-size="22" fill="#5b7086" text-anchor="middle">Kipplüften</text><text x="880" y="550" font-size="22" fill="#5b7086" text-anchor="middle">Stoßlüften</text><text x="60" y="640" font-size="18" fill="#5b7086" text-anchor="start">図解：J-Connect。連邦環境庁の換気の解説に基づく。</text></g></svg>