<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ニュルンベルクのクリスマスマーケットの名物</title><desc id="d">スパイスとナッツの焼き菓子レープクーヘン、小さなパンに3本挟む細い焼きソーセージ、干しプラムとナッツで作る人形の3つの名物を紹介する図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ニュルンベルクの市で味わう名物</text><text x="60" y="134" font-size="22" fill="#405a71">焼き菓子、ソーセージ、素朴な人形</text><rect x="60" y="170" width="340" height="440" rx="16" fill="white"/><rect x="60" y="170" width="340" height="10" rx="5" fill="#8a4b2a"/><g transform="translate(230.0 275)"><g><circle cx="0" cy="0" r="58" fill="#f1e3c6"/><circle cx="0" cy="0" r="48" fill="#8a4b2a"/><circle cx="-18" cy="-12" r="7" fill="#f0d9a8"/><circle cx="16" cy="-16" r="7" fill="#f0d9a8"/><circle cx="0" cy="14" r="7" fill="#f0d9a8"/><circle cx="20" cy="18" r="5" fill="#f0d9a8"/><circle cx="-20" cy="20" r="5" fill="#f0d9a8"/></g></g><text x="230.0" y="385" font-size="28" font-weight="700" fill="#8a4b2a" text-anchor="middle">レープクーヘン</text><text x="230.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">スパイスとナッツの焼き菓子</text><text x="230.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">薄いウエハースの上で焼く</text><text x="230.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">EUの地理的表示保護</text><rect x="430" y="170" width="340" height="440" rx="16" fill="white"/><rect x="430" y="170" width="340" height="10" rx="5" fill="#9b4a2c"/><g transform="translate(600.0 275)"><g><path d="M-75 10 Q0 -40 75 10 Q75 45 0 45 Q-75 45 -75 10 Z" fill="#e2b778"/><rect x="-62" y="-10" width="124" height="14" rx="7" fill="#9b4a2c"/><rect x="-62" y="5" width="124" height="14" rx="7" fill="#8a3f24"/><rect x="-62" y="20" width="124" height="14" rx="7" fill="#9b4a2c"/><path d="M-75 -5 Q0 -60 75 -5" fill="none" stroke="#d3a35f" stroke-width="10"/></g></g><text x="600.0" y="385" font-size="28" font-weight="700" fill="#9b4a2c" text-anchor="middle">焼きソーセージ</text><text x="600.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">指ほどの細さ</text><text x="600.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">小さなパンに3本挟む</text><text x="600.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">歩きながら片手で</text><rect x="800" y="170" width="340" height="440" rx="16" fill="white"/><rect x="800" y="170" width="340" height="10" rx="5" fill="#5a2f40"/><g transform="translate(970.0 275)"><g><circle cx="0" cy="-48" r="16" fill="#4a2a35"/><ellipse cx="0" cy="-6" rx="22" ry="28" fill="#5a2f40"/><ellipse cx="-30" cy="-10" rx="10" ry="18" fill="#5a2f40"/><ellipse cx="30" cy="-10" rx="10" ry="18" fill="#5a2f40"/><ellipse cx="-12" cy="40" rx="10" ry="20" fill="#8a5a3c"/><ellipse cx="12" cy="40" rx="10" ry="20" fill="#8a5a3c"/><path d="M-18 -60 L0 -82 L18 -60 Z" fill="#b5473a"/></g></g><text x="970.0" y="385" font-size="28" font-weight="700" fill="#5a2f40" text-anchor="middle">干しプラムの人形</text><text x="970.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">干しプラムとナッツで作る</text><text x="970.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">市ならではの工芸品</text><text x="970.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">飾って楽しむ</text><text x="60" y="645" font-size="18" fill="#405a71">イラストは名物のイメージで、特定の店や商品を再現していない</text></g></svg>