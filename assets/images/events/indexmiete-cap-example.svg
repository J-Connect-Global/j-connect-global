<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">インデックス賃料の計算例</title><desc id="d">物価が1年で5%上がった場合、今のルールでは5%値上げできるが、改正案では3%までは全部、3%を超えた2%は半分の1%だけ反映され、合計4%までになることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">インデックス賃料の計算例（改正案）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">物価が1年で5％上がった場合</text><rect x="60" y="180" width="1080" height="300" rx="16" fill="white"/><text x="90" y="250" font-size="24" font-weight="700" fill="#405a71" text-anchor="start">今のルール</text><rect x="300" y="215" width="750" height="56" rx="10" fill="#7fa9cf"/><text x="675" y="252" font-size="26" font-weight="700" fill="white" text-anchor="middle">5％値上げ</text><text x="90" y="380" font-size="24" font-weight="700" fill="#405a71" text-anchor="start">改正案</text><rect x="300" y="345" width="450" height="56" rx="10" fill="#2d6a9f"/><text x="525" y="382" font-size="22" font-weight="700" fill="white" text-anchor="middle">3％まで：全部</text><rect x="754" y="345" width="150" height="56" rx="10" fill="#c9952a"/><text x="829" y="382" font-size="22" font-weight="700" fill="white" text-anchor="middle">＋1％</text><rect x="908" y="345" width="142" height="56" rx="10" fill="none" stroke="#c9952a" stroke-width="3" stroke-dasharray="8 6"/><text x="979.0" y="382" font-size="18" font-weight="700" fill="#c9952a" text-anchor="middle">反映なし</text><text x="750" y="440" font-size="20" fill="#405a71" text-anchor="middle">3％を超えた2％は、半分の1％だけ</text><rect x="60" y="500" width="1080" height="95" rx="16" fill="#fff7e6"/><text x="600" y="560" font-size="32" font-weight="700" fill="#8a5a00" text-anchor="middle">家賃の値上げは合計4％まで</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※住宅が足りない地域が対象。既存の契約にも適用する案。出典：連邦司法・消費者保護省</text></g></svg>