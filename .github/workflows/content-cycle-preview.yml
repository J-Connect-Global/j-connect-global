name: Content cycle generated output preview

on:
  push:
    branches:
      - codex/content-cycle-20261024

permissions:
  contents: write

jobs:
  build-generated-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci
      - name: Build generated site files
        run: npm run build
      - name: Commit generated content outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/registry/living.json content/registry/events.json
          git add germany/ja/living/ germany/ja/events/ germany/ja/index.html
          git add assets/js/search-index.js sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated content changes."
            exit 0
          fi
          git commit -m "Generate content pages and search index"
          git push origin HEAD:codex/content-cycle-20261024
