<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">在外選挙の流れ</title><desc id="d">在外選挙人名簿の登録は、日本を出る前に市区町村で申請する出国時申請と、ドイツに来てから在外公館で申請する在外公館申請の2つがあり、登録されると在外選挙人証が届き、それを使って投票することを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">在外選挙：投票までの流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">先に「在外選挙人名簿」への登録が必要</text><rect x="60" y="175" width="530" height="320" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">出国時申請</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">日本を出る前に</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">住んでいた市区町村の窓口で</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">転出届を出すときに申請</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">選挙人名簿に載っていること</text><rect x="610" y="175" width="530" height="320" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">在外公館申請</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">ドイツに来た後に</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">担当の大使館・総領事館で</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">在留届を出していること</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">登録は3か月以上住んでから</text><rect x="60" y="515" width="1080" height="85" rx="16" fill="#fff7e6"/><text x="600" y="567" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="middle">登録 → 在外選挙人証が届く → 在外公館・郵便・日本国内で投票</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：総務省、外務省（2026年10月29日参照）</text></g></svg>