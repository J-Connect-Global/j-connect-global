<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">飲料容器の３つの行き先</title><desc id="desc">DPG対象の使い捨て容器。１本 25セント。同素材を扱う店へ ※小規模店に例外。リユース瓶。一般的な瓶は 8・15セントなど。同じ種類の瓶を扱う店を確認。預り金なしの容器。返金はなし。紙・包装・ガラスなどに分別</desc><rect width="480" height="560" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">飲料容器の３つの行き先</text><text x="24" y="80" font-size="19">素材だけでなく、表示を確認</text><rect x="20" y="108" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="140" font-size="21" font-weight="700">DPG対象の使い捨て容器</text><text x="36" y="175" font-size="20">１本 25セント</text><text x="36" y="205" font-size="18">同素材を扱う店へ ※小規模店に例外</text><rect x="20" y="243" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="275" font-size="21" font-weight="700">リユース瓶</text><text x="36" y="310" font-size="20">一般的な瓶は 8・15セントなど</text><text x="36" y="340" font-size="18">同じ種類の瓶を扱う店を確認</text><rect x="20" y="378" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="410" font-size="21" font-weight="700">預り金なしの容器</text><text x="36" y="445" font-size="20">返金はなし</text><text x="36" y="475" font-size="18">紙・包装・ガラスなどに分別</text><text x="24" y="540" font-size="15">J-Connect編集部作成｜根拠・条件は本文参照</text></g></svg>
