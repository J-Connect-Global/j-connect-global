<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">2026年10月速報値の読み方</title>
<desc id="desc">前年同月比はプラス2.8パーセント、前月比はマイナス0.2パーセント。エネルギーは前年同月比プラス12.2パーセント、食品はプラス0.4パーセント。</desc>
<rect width="1200" height="620" rx="28" fill="#f4f6f8"/>
<text x="72" y="86" font-size="34" font-weight="700" fill="#1f2937">2026年10月速報値｜4つの数字を分けて読む</text>
<g>
<rect x="72" y="142" width="500" height="180" rx="20" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
<rect x="628" y="142" width="500" height="180" rx="20" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
<rect x="72" y="360" width="500" height="180" rx="20" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
<rect x="628" y="360" width="500" height="180" rx="20" fill="#ffffff" stroke="#d6dee5" stroke-width="2"/>
</g>
<g font-size="24" fill="#4b5563">
<text x="112" y="194">前年同月比｜物価全体</text><text x="668" y="194">前月比｜物価全体</text>
<text x="112" y="412">前年同月比｜エネルギー</text><text x="668" y="412">前年同月比｜食品</text>
</g>
<g font-size="58" font-weight="700">
<text x="112" y="274" fill="#28658a">+2.8%</text><text x="668" y="274" fill="#5d8b76">−0.2%</text>
<text x="112" y="492" fill="#d18b35">+12.2%</text><text x="668" y="492" fill="#28658a">+0.4%</text>
</g>
<g font-size="18" fill="#4b5563">
<text x="72" y="584">前年比の伸びが鈍化しても、前年より価格が低くなったとは限りません。家計の実感は支出構成で異なります。</text>
</g>
</svg>