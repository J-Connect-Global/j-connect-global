<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>日本大使館・総領事館でよく使う証明書</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">大使館・総領事館でよく使う証明書</text><text x="48" y="152" font-size="23" fill="#52666C">多くは本人が窓口へ。手数料と必要書類は公館ごとに確認</text><rect x="378" y="176" width="458" height="50" rx="10" fill="#173B48"/><text x="394" y="210" font-size="24" fill="#FFFFFF">よく使う場面</text><rect x="848" y="176" width="292" height="50" rx="10" fill="#146859"/><text x="864" y="210" font-size="24" fill="#FFFFFF">メモ</text><text x="64" y="210" font-size="22" fill="#52666C">証明書・届け出</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">在留証明</text><text x="394" y="272" font-size="26" fill="#173B48">年金・相続・不動産の登記</text><text x="864" y="272" font-size="26" fill="#173B48">海外の住所を証明</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">署名証明</text><text x="394" y="336" font-size="26" fill="#173B48">印鑑証明の代わり</text><text x="864" y="336" font-size="26" fill="#173B48">職員の前で署名</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">運転免許証の抜粋証明</text><text x="394" y="400" font-size="26" fill="#173B48">ドイツの免許への切り替え</text><text x="864" y="400" font-size="26" fill="#173B48">ドイツ語の翻訳として</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">出生届・婚姻届など</text><text x="394" y="464" font-size="26" fill="#173B48">戸籍の届け出</text><text x="864" y="464" font-size="26" fill="#173B48">出生届は3か月以内</text><rect x="48" y="486" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="528" font-size="24" fill="#52666C">帰国のための渡航書</text><text x="394" y="528" font-size="26" fill="#173B48">パスポートをなくして急ぎ帰国</text><text x="864" y="528" font-size="26" fill="#173B48">警察の届出証明が必要</text><text x="48" y="622" font-size="22" fill="#173B48">管轄は住所で決まります。NRW州はデュッセルドルフ、ヘッセン州はフランクフルトなど。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：在ドイツ日本国大使館・総領事館の案内  |  2026-11-06</text></g></svg>