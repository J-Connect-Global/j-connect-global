<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">失業手当の手続き</title><desc id="d">仕事が終わることが分かったら、3か月前までに求職者として届け出て、遅くとも失業の初日に失業の届け出をし、自分から辞めた場合は最長12週間止められることがあるという流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">失業手当をもらうまでの流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">届け出が遅れると、手当が止められることも</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2d6a9f"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">終わりが分かる</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">解約の通知や</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">契約の期限で</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">仕事の終わりが決まる</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2d6a9f"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">求職者の届け出</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">仕事が終わる</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">3か月前まで</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">（ないときは3日以内）</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2d6a9f"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">失業の届け出</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">遅くとも</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">失業の初日に</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">オンラインでも可</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2d6a9f"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">申請・面談</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">必要な書類を出し</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">職業安定所と</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">面談する</text><rect x="60" y="530" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="566" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">自分から辞めた場合</text><text x="90" y="600" font-size="21" fill="#29465f" text-anchor="start">正当な理由がないと、最長12週間、手当が止められることがあります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦雇用エージェンシー（2026年10月29日参照）</text></g></svg>