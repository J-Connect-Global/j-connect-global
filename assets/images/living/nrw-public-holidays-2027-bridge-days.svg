<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">NRWの2027年ブリッジデーの計画例</title>
  <desc id="desc">5月6日と5月27日の木曜祝日の翌金曜に休暇を申請すると、土日を含む4連休になることを示す。</desc>
  <rect width="1200" height="560" rx="28" fill="#f5f2eb"/>
  <rect x="48" y="42" width="1104" height="476" rx="24" fill="#ffffff" stroke="#d7dedf" stroke-width="2"/>
  <text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="40" font-weight="800">休暇1日で4連休にする計画例</text>
  <text x="90" y="147" fill="#4f6474" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="21">土日が通常の休日で、金曜の休暇が承認された場合</text>
  <g transform="translate(88 184)">
    <text x="0" y="24" fill="#2f7771" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="21" font-weight="800">5月6日（木）〜9日（日）</text>
    <g transform="translate(0 42)">
      <rect width="245" height="92" rx="14" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/>
      <text x="122" y="34" text-anchor="middle" fill="#2f7771" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">木曜日</text>
      <text x="122" y="67" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22" font-weight="800">祝日</text>
      <rect x="263" width="245" height="92" rx="14" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/>
      <text x="385" y="34" text-anchor="middle" fill="#47658b" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">金曜日</text>
      <text x="385" y="67" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22" font-weight="800">休暇を申請</text>
      <rect x="526" width="245" height="92" rx="14" fill="#f1f3f4" stroke="#d9dfe1" stroke-width="2"/>
      <text x="648" y="34" text-anchor="middle" fill="#64747d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">土曜日</text>
      <text x="648" y="67" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22" font-weight="800">週末</text>
      <rect x="789" width="245" height="92" rx="14" fill="#f1f3f4" stroke="#d9dfe1" stroke-width="2"/>
      <text x="911" y="34" text-anchor="middle" fill="#64747d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">日曜日</text>
      <text x="911" y="67" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22" font-weight="800">週末</text>
    </g>
    <text x="0" y="180" fill="#4f6474" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18">同じ考え方で、5月27日（木）の聖体祭と5月28日（金）にも適用できます。</text>
  </g>
  <text x="90" y="470" fill="#9a6130" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">注意：ブリッジデー自体は法定祝日ではありません。休暇の承認を確認してください。</text>
</svg>