<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アラーフとヘラウの地域の概略図</title><desc id="d">ケルンとその周りの「アラーフ」の地域を、デュッセルドルフや下ライン地方、ルール地方などの「ヘラウ」の地域が取り囲んでいる様子を示した概略図</desc><rect width="1200" height="675" rx="28" fill="#f4f8fc"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">掛け声の地図：「アラーフ」と「ヘラウ」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ケルン周辺のアラーフを、ヘラウの地域が囲む（概略）</text><ellipse cx="600" cy="400" rx="470" ry="210" fill="#dfe9f7"/><ellipse cx="640" cy="440" rx="200" ry="105" fill="#f7d9cf"/><path d="M430 180 C 470 300, 520 380, 560 470 S 650 580, 700 610" stroke="#7fa7cf" stroke-width="14" fill="none" stroke-linecap="round"/><text x="330" y="300" font-size="30" font-weight="700" fill="#2d6a9f" text-anchor="middle">ヘラウ（Helau）</text><text x="330" y="340" font-size="20" fill="#29465f" text-anchor="middle">デュッセルドルフ・下ライン</text><text x="880" y="300" font-size="30" font-weight="700" fill="#2d6a9f" text-anchor="middle">ヘラウ</text><text x="880" y="340" font-size="20" fill="#29465f" text-anchor="middle">ルール地方など</text><text x="660" y="440" font-size="30" font-weight="700" fill="#b5473a" text-anchor="middle">アラーフ（Alaaf）</text><text x="660" y="480" font-size="20" fill="#7a2e24" text-anchor="middle">ケルンとその周り</text><circle cx="520" cy="255" r="10" fill="#153452"/><text x="540" y="262" font-size="20" font-weight="700" fill="#153452" text-anchor="start">デュッセルドルフ</text><circle cx="610" cy="410" r="10" fill="#153452"/><text x="500" y="417" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">ケルン</text><text x="715" y="600" font-size="18" fill="#5b7086" text-anchor="start">ライン川</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">LVR地域研究所の解説をもとにした概略図です。正確な境界や地図上の位置を示すものではありません。</text></g></svg>