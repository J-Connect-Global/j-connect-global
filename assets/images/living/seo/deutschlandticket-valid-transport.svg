<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツチケットで使える乗り物と使えない乗り物</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツチケット　使える乗り物・使えない乗り物</text><text x="48" y="152" font-size="23" fill="#52666C">2026年は月63ユーロ、2027年1月から月66.80ユーロ</text><rect x="448" y="176" width="228" height="50" rx="10" fill="#173B48"/><text x="464" y="210" font-size="24" fill="#FFFFFF">ドイツチケット</text><rect x="688" y="176" width="452" height="50" rx="10" fill="#146859"/><text x="704" y="210" font-size="24" fill="#FFFFFF">メモ</text><text x="64" y="210" font-size="22" fill="#52666C">乗り物</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">地域快速・地域列車（RE・RB）</text><text x="464" y="272" font-size="26" fill="#173B48">使える</text><text x="704" y="272" font-size="26" fill="#173B48">2等席。全国どこでも</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">近郊列車（Sバーン）・地下鉄</text><text x="464" y="336" font-size="26" fill="#173B48">使える</text><text x="704" y="336" font-size="26" fill="#173B48">旅行先の街でも使える</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">路面電車・バス</text><text x="464" y="400" font-size="26" fill="#173B48">使える</text><text x="704" y="400" font-size="26" fill="#173B48">市内・地域のバス</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">ICE・IC・ECなどの長距離列車</text><text x="464" y="464" font-size="26" fill="#C2410C">使えない</text><text x="704" y="464" font-size="26" fill="#173B48">一部の例外区間を除く</text><rect x="48" y="486" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="528" font-size="24" fill="#52666C">長距離バス・1等席</text><text x="464" y="528" font-size="26" fill="#C2410C">使えない</text><text x="704" y="528" font-size="26" fill="#173B48">1等は追加料金の地域も</text><text x="48" y="622" font-size="22" fill="#173B48">子ども・自転車・犬の扱いは地域の交通連合ごとに違います。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：地域化法第9条、ドイツ鉄道の案内  |  2026-11-06</text></g></svg>