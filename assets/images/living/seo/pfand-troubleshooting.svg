<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">返却機に拒否されたら</title><desc id="desc">対象の容器か分からない。預り金表示と種類を確認。海外の容器は対象とは限らない。店がその種類を扱っていない。取扱いのある店を確認。特にリユース瓶で注意。読取り不良・変形・機械の停止。スタッフへ確認を依頼。機械の拒否だけで返金不可ではない</desc><rect width="480" height="560" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">返却機に拒否されたら</text><text x="24" y="80" font-size="19">理由を分けて、次の行動を選ぶ</text><rect x="20" y="108" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="140" font-size="21" font-weight="700">対象の容器か分からない</text><text x="36" y="175" font-size="20">預り金表示と種類を確認</text><text x="36" y="205" font-size="18">海外の容器は対象とは限らない</text><rect x="20" y="243" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="275" font-size="21" font-weight="700">店がその種類を扱っていない</text><text x="36" y="310" font-size="20">取扱いのある店を確認</text><text x="36" y="340" font-size="18">特にリユース瓶で注意</text><rect x="20" y="378" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="410" font-size="21" font-weight="700">読取り不良・変形・機械の停止</text><text x="36" y="445" font-size="20">スタッフへ確認を依頼</text><text x="36" y="475" font-size="18">機械の拒否だけで返金不可ではない</text><text x="24" y="540" font-size="15">J-Connect編集部作成｜根拠・条件は本文参照</text></g></svg>
