name: Temporary licensed cover optimization (do not merge)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.head_ref == 'chat/diagnostic-cover-bad-wildungen-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bad-wildungen-licensed-cover
          run-id: 45710904417
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jc-cover
      - name: Optimize verified original within budget
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jc-cover"
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image,ImageOps
          import hashlib,base64,io
          raw=open('source.jpg','rb').read()
          assert hashlib.sha256(raw).hexdigest() == 'd1ad67aa48074745be49932e5c603977d9791010ca27d2e9140ae0e81f973706'
          im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
          for name,sz,limit in [('hero.webp',(1200,675),65000),('hero-768w.webp',(768,432),28000),('hero-480w.webp',(480,270),12000),('hero-og.jpg',(1200,630),70000)]:
              img=ImageOps.fit(im,sz,method=Image.Resampling.LANCZOS)
              fmt='WEBP' if name.endswith('.webp') else 'JPEG'
              for q in range(82,19,-2):
                  buf=io.BytesIO()
                  img.save(buf,format=fmt,quality=q,optimize=True)
                  b=buf.getvalue()
                  if len(b)<=limit: break
              assert len(b)<=limit
              open(name,'wb').write(b)
              print('JC_FILE '+name+' '+str(len(b))+' '+hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()+' quality='+str(q))
              s=base64.b64encode(b).decode()
              for i in range(0,len(s),512): print('JC_B64 '+name+' '+s[i:i+512])
          PY
      - name: Save optimized evidence
        uses: actions/upload-artifact@v4
        with:
          name: bad-wildungen-optimized-cover
          path: ${{ runner.temp }}/jc-cover/
          retention-days: 3
