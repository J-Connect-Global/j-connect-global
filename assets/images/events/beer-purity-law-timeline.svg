<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ビール純粋令の年表</title><desc id="d">1516年4月23日のビール純粋令、1906年の全国化、1987年3月12日の欧州司法裁判所判決、2025年のビール販売量約78億リットル（前年比6.0%減）と醸造所数1,415か所を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f6f1e7"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ビール純粋令の500年</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">バイエルンの決まりから、今の統計まで</text><line x1="150" y1="190" x2="150" y2="610" stroke="#d6c39a" stroke-width="6"/><circle cx="150" cy="222" r="16" fill="#c9952a"/><text x="60" y="230" font-size="26" font-weight="700" fill="#153452" text-anchor="start">1516</text><rect x="190" y="188" width="950" height="72" rx="16" fill="white"/><text x="215" y="218" font-size="20" font-weight="700" fill="#8a5aa8" text-anchor="start">4月23日</text><text x="345" y="218" font-size="24" font-weight="700" fill="#153452" text-anchor="start">インゴルシュタットで定められる</text><text x="345" y="248" font-size="19" fill="#405a71" text-anchor="start">バイエルン公ヴィルヘルム4世とルートヴィヒ10世</text><circle cx="150" cy="308" r="16" fill="#c9952a"/><text x="60" y="316" font-size="26" font-weight="700" fill="#153452" text-anchor="start">1906</text><rect x="190" y="274" width="950" height="72" rx="16" fill="white"/><text x="215" y="304" font-size="20" font-weight="700" fill="#8a5aa8" text-anchor="start">全国化</text><text x="345" y="304" font-size="24" font-weight="700" fill="#153452" text-anchor="start">ドイツ全体の決まりに</text><text x="345" y="334" font-size="19" fill="#405a71" text-anchor="start">ドイツ醸造者連盟による</text><circle cx="150" cy="394" r="16" fill="#c9952a"/><text x="60" y="402" font-size="26" font-weight="700" fill="#153452" text-anchor="start">1987</text><rect x="190" y="360" width="950" height="72" rx="16" fill="white"/><text x="215" y="390" font-size="20" font-weight="700" fill="#8a5aa8" text-anchor="start">3月12日</text><text x="345" y="390" font-size="24" font-weight="700" fill="#153452" text-anchor="start">欧州司法裁判所の判決</text><text x="345" y="420" font-size="19" fill="#405a71" text-anchor="start">外国のビールも「ビール」として販売可能に</text><circle cx="150" cy="480" r="16" fill="#c9952a"/><text x="60" y="488" font-size="26" font-weight="700" fill="#153452" text-anchor="start">2025</text><rect x="190" y="446" width="950" height="72" rx="16" fill="white"/><text x="215" y="476" font-size="20" font-weight="700" fill="#8a5aa8" text-anchor="start">販売量</text><text x="345" y="476" font-size="24" font-weight="700" fill="#153452" text-anchor="start">約78億リットル（前年比−6.0%）</text><text x="345" y="506" font-size="19" fill="#405a71" text-anchor="start">統計開始（1993年）以来最大の減少</text><circle cx="150" cy="566" r="16" fill="#c9952a"/><text x="60" y="574" font-size="26" font-weight="700" fill="#153452" text-anchor="start">2025</text><rect x="190" y="532" width="950" height="72" rx="16" fill="white"/><text x="215" y="562" font-size="20" font-weight="700" fill="#8a5aa8" text-anchor="start">醸造所</text><text x="345" y="562" font-size="24" font-weight="700" fill="#153452" text-anchor="start">1,415か所</text><text x="345" y="592" font-size="19" fill="#405a71" text-anchor="start">連邦統計局</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ醸造者連盟、欧州司法裁判所、連邦統計局（2026年10月26日参照）</text></g></svg>