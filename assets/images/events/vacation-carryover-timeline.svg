<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">有給休暇の期限</title><desc id="d">有給休暇はその年の12月31日までに取るのが原則で、特別な理由がある場合だけ翌年3月31日まで持ち越せ、会社が休暇を取るよう促して消えることを知らせていなければ最低の休暇は消えないことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">有給休暇はいつまでに取る？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦休暇法の原則</text><line x1="120" y1="260" x2="1080" y2="260" stroke="#9fb6cc" stroke-width="6"/><circle cx="160" cy="260" r="18" fill="#2d6a9f"/><text x="160" y="225" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">1月1日</text><text x="160" y="305" font-size="19" font-weight="700" fill="#2d6a9f" text-anchor="middle">休暇の年が始まる</text><circle cx="560" cy="260" r="18" fill="#b5473a"/><text x="560" y="225" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">12月31日</text><text x="560" y="305" font-size="19" font-weight="700" fill="#b5473a" text-anchor="middle">原則この日までに取る</text><circle cx="1000" cy="260" r="18" fill="#c9952a"/><text x="1000" y="225" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">翌年3月31日</text><text x="1000" y="305" font-size="19" font-weight="700" fill="#c9952a" text-anchor="middle">特別な理由で持ち越した分</text><rect x="60" y="350" width="1080" height="240" rx="16" fill="white"/><rect x="60" y="350" width="12" height="240" rx="6" fill="#2f8a64"/><text x="100" y="400" font-size="26" font-weight="700" fill="#2f8a64" text-anchor="start">会社が知らせていなければ、休暇は消えない</text><text x="100" y="450" font-size="21" fill="#29465f" text-anchor="start">会社が「休暇を取ってください」と促し、</text><text x="100" y="485" font-size="21" fill="#29465f" text-anchor="start">取らなければ消えることをはっきり知らせた場合にだけ、</text><text x="100" y="520" font-size="21" fill="#29465f" text-anchor="start">法律で決められた最低の休暇は期限で消える（連邦労働裁判所）</text><text x="100" y="565" font-size="21" font-weight="700" fill="#153452" text-anchor="start">最低の日数：週5日勤務なら年20日</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦休暇法第3条・第7条、連邦労働裁判所（2026年10月29日参照）</text></g></svg>