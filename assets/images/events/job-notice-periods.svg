<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">解約の期間</title><desc id="d">解約の期間は原則4週間で15日か月末付け、試用期間中は2週間、会社から解約する場合は勤めた年数に応じて2年で1か月から20年で7か月まで長くなることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">仕事を辞めるときの解約の期間</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">民法第622条（契約や労働協約でもっと長いことも）</text><rect x="60" y="180" width="520" height="150" rx="16" fill="white"/><text x="90" y="225" font-size="22" font-weight="700" fill="#405a71" text-anchor="start">原則（どちらからでも）</text><text x="90" y="280" font-size="30" font-weight="700" fill="#2d6a9f" text-anchor="start">4週間・15日か月末付け</text><rect x="60" y="345" width="520" height="150" rx="16" fill="white"/><text x="90" y="390" font-size="22" font-weight="700" fill="#405a71" text-anchor="start">試用期間中（最長6か月）</text><text x="90" y="445" font-size="36" font-weight="700" fill="#2f8a64" text-anchor="start">2週間</text><rect x="620" y="180" width="520" height="410" rx="16" fill="white"/><text x="650" y="222" font-size="21" font-weight="700" fill="#405a71" text-anchor="start">会社から解約する場合（勤めた年数）</text><text x="660" y="275" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2年</text><rect x="760" y="255" width="44" height="30" rx="6" fill="#c9952a"/><text x="814" y="277" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">1か月</text><text x="660" y="321" font-size="22" font-weight="700" fill="#153452" text-anchor="start">5年</text><rect x="760" y="301" width="88" height="30" rx="6" fill="#c9952a"/><text x="858" y="323" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">2か月</text><text x="660" y="367" font-size="22" font-weight="700" fill="#153452" text-anchor="start">8年</text><rect x="760" y="347" width="132" height="30" rx="6" fill="#c9952a"/><text x="902" y="369" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">3か月</text><text x="660" y="413" font-size="22" font-weight="700" fill="#153452" text-anchor="start">10年</text><rect x="760" y="393" width="176" height="30" rx="6" fill="#c9952a"/><text x="946" y="415" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">4か月</text><text x="660" y="459" font-size="22" font-weight="700" fill="#153452" text-anchor="start">12年</text><rect x="760" y="439" width="220" height="30" rx="6" fill="#c9952a"/><text x="990" y="461" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">5か月</text><text x="660" y="505" font-size="22" font-weight="700" fill="#153452" text-anchor="start">15年</text><rect x="760" y="485" width="264" height="30" rx="6" fill="#c9952a"/><text x="1034" y="507" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">6か月</text><text x="660" y="551" font-size="22" font-weight="700" fill="#153452" text-anchor="start">20年</text><rect x="760" y="531" width="308" height="30" rx="6" fill="#c9952a"/><text x="1078" y="553" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">7か月</text><rect x="60" y="510" width="520" height="80" rx="16" fill="#fff7e6"/><text x="90" y="560" font-size="21" font-weight="700" fill="#8a5a00" text-anchor="start">例：10月29日に通知 → 11月30日付け</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：民法第622条（2026年10月29日参照）</text></g></svg>