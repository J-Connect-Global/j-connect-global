<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">家族の呼び寄せの流れ</title><desc id="d">日本国籍の配偶者や子どもは、ビザなしでドイツに入国し、住民登録をしてから外国人局で家族の呼び寄せの滞在許可を申請でき、配偶者は入国前のドイツ語の証明が原則不要であることを示した流れの図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日本国籍の家族をドイツに呼び寄せる</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ビザなしで入国して、ドイツで申請できる</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2f8a64"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">住まいを決める</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">家族が住める</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">広さの家を</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">用意する</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2f8a64"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">入国する</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">日本国籍なら</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">ビザなしで</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">入国できる</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2f8a64"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">住民登録</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">引っ越しから</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">2週間以内に</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">届け出る</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2f8a64"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">外国人局で申請</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">家族の呼び寄せの</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">滞在許可を</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">申請する</text><rect x="60" y="530" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="566" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">配偶者のドイツ語の証明（A1）</text><text x="90" y="600" font-size="21" fill="#29465f" text-anchor="start">日本国籍の配偶者は、入国前のドイツ語の証明が原則不要です</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦移民難民庁、Make it in Germany（2026年10月29日参照）</text></g></svg>