<text x="90" y="154" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="23">州共通の日程｜開始日・最終日を含みます</text>
<g><rect x="88" y="195" width="492" height="120" rx="17" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><text x="112" y="237" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">秋休み</text><text x="112" y="278" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22">2026年10月17日〜31日</text></g>
<g><rect x="608" y="195" width="492" height="120" rx="17" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><text x="632" y="237" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">クリスマス休暇</text><text x="632" y="278" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22">2026年12月23日〜2027年1月6日</text></g>
<g><rect x="88" y="345" width="492" height="120" rx="17" fill="#f7efe5" stroke="#ead6bd" stroke-width="2"/><text x="112" y="387" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">春休み</text><text x="112" y="428" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22">2027年3月22日〜4月3日</text></g>
