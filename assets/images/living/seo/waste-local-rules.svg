<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">黄色い容器の地域差</title><desc id="desc">包装用の黄色い容器。空のプラ・金属・複合素材の包装。包装以外の対象は自治体に確認。デュッセルドルフの資源容器。対象の非包装製品も回収。プラスチック・金属など。どちらにも混ぜない。電池・家電・危険物。品目別検索で専用の回収先へ</desc><rect width="480" height="560" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">黄色い容器の地域差</text><text x="24" y="80" font-size="19">色ではなく、対象品目を確認</text><rect x="20" y="108" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="140" font-size="21" font-weight="700">包装用の黄色い容器</text><text x="36" y="175" font-size="20">空のプラ・金属・複合素材の包装</text><text x="36" y="205" font-size="18">包装以外の対象は自治体に確認</text><rect x="20" y="243" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="275" font-size="21" font-weight="700">デュッセルドルフの資源容器</text><text x="36" y="310" font-size="20">対象の非包装製品も回収</text><text x="36" y="340" font-size="18">プラスチック・金属など</text><rect x="20" y="378" width="440" height="119" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="410" font-size="21" font-weight="700">どちらにも混ぜない</text><text x="36" y="445" font-size="20">電池・家電・危険物</text><text x="36" y="475" font-size="18">品目別検索で専用の回収先へ</text><text x="24" y="540" font-size="15">J-Connect編集部作成｜根拠・条件は本文参照</text></g></svg>
