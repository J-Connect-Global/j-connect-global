<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ハンブルクの主な三つのクリスマスマーケットの特徴</title><desc id="d">市庁舎前の市は空飛ぶサンタとおもちゃ通り、ユングフェルンシュティークは白いテントと湖のツリーと1899年の観覧車、ザンクト・パウリは歓楽街の大人向けの市であることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ハンブルクの三つの市</text><text x="60" y="134" font-size="22" fill="#405a71">市庁舎前、湖のほとり、歓楽街。歩く場所で冬の表情が変わる</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="336" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(248,300)"><path d="M-60,20 q10,20 40,20 h50 q10,0 14,-10" stroke="#7a5233" stroke-width="5" fill="none"/><path d="M-50,-10 h56 q12,0 12,14 v14 h-68z" fill="#b5473a"/><circle cx="-26" cy="-26" r="12" fill="#f0d9b5"/><path d="M-38,-26 l12,-22 12,22z" fill="#b5473a"/><line x1="-70" y1="-70" x2="70" y2="-70" stroke="#405a71" stroke-width="3" stroke-dasharray="6 6"/></g><text x="248" y="410" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">市庁舎前</text><text x="248" y="450" font-size="18" fill="#405a71" text-anchor="middle">空飛ぶサンタは</text><text x="248" y="480" font-size="18" fill="#405a71" text-anchor="middle">毎日16・18・20時</text><text x="248" y="510" font-size="18" fill="#405a71" text-anchor="middle">約80の屋台</text><rect x="432" y="190" width="336" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(600,300)"><circle cx="0" cy="-10" r="46" fill="none" stroke="#2b5c8a" stroke-width="5"/><g stroke="#2b5c8a" stroke-width="3"><line x1="0" y1="-56" x2="0" y2="36"/><line x1="-46" y1="-10" x2="46" y2="-10"/></g><polygon points="0,42 -20,62 20,62" fill="#2f6a40"/><path d="M-70,62 h140" stroke="#6aa0c8" stroke-width="6"/><polygon points="44,10 34,52 54,52" fill="#ffcc4d"/></g><text x="600" y="410" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">ユングフェルンシュティーク</text><text x="600" y="450" font-size="18" fill="#405a71" text-anchor="middle">白いテントと湖のツリー</text><text x="600" y="480" font-size="18" fill="#405a71" text-anchor="middle">1899年の観覧車</text><text x="600" y="510" font-size="18" fill="#405a71" text-anchor="middle">11月18日開幕</text><rect x="784" y="190" width="336" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(952,300)"><rect x="-64" y="10" width="128" height="40" fill="#4a2f4f"/><path d="M-64,-50 h128 v12 q-64,24 -128,0z" fill="#b5473a"/><circle cx="-26" cy="-14" r="7" fill="#ffcc4d"/><circle cx="0" cy="-20" r="7" fill="#ffcc4d"/><circle cx="26" cy="-14" r="7" fill="#ffcc4d"/><rect x="-6" y="-8" width="12" height="18" fill="#f0d9b5"/></g><text x="952" y="410" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">サンタ・パウリ</text><text x="952" y="450" font-size="18" fill="#405a71" text-anchor="middle">歓楽街の大人の市</text><text x="952" y="480" font-size="18" fill="#405a71" text-anchor="middle">ライブ音楽とショー</text><text x="952" y="510" font-size="18" fill="#405a71" text-anchor="middle">週末は深夜1時まで</text><text x="60" y="645" font-size="18" fill="#405a71">ハンブルク市の案内に基づく（2026年11月1日参照）</text></g></svg>