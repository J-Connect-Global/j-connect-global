<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">追加保険料率の差と手取りの計算例</title><desc id="d">月給4,000ユーロで追加保険料率が0.5ポイント違うと、本人負担は月10ユーロ、年120ユーロ変わることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">率の差は手取りにどれくらい効く？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">例：月の税込給与 4,000ユーロ／追加保険料率の差 0.5ポイント</text><rect x="60" y="200" width="340" height="300" rx="20" fill="white"/><rect x="60" y="200" width="340" height="66" rx="20" fill="#2d6a9f"/><rect x="60" y="246" width="340" height="20" fill="#2d6a9f"/><text x="230" y="245" font-size="26" font-weight="700" fill="white" text-anchor="middle">保険料全体の差</text><text x="230" y="350" font-size="32" font-weight="700" fill="#153452" text-anchor="middle">4,000 × 0.5%</text><text x="230" y="420" font-size="34" font-weight="700" fill="#2d6a9f" text-anchor="middle">＝ 月20ユーロ</text><text x="415" y="360" font-size="30" font-weight="700" fill="#405a71" text-anchor="middle">→</text><rect x="430" y="200" width="340" height="300" rx="20" fill="white"/><rect x="430" y="200" width="340" height="66" rx="20" fill="#c9952a"/><rect x="430" y="246" width="340" height="20" fill="#c9952a"/><text x="600" y="245" font-size="26" font-weight="700" fill="white" text-anchor="middle">本人負担の差</text><text x="600" y="350" font-size="32" font-weight="700" fill="#153452" text-anchor="middle">÷ 2</text><text x="600" y="420" font-size="34" font-weight="700" fill="#c9952a" text-anchor="middle">＝ 月10ユーロ</text><text x="785" y="360" font-size="30" font-weight="700" fill="#405a71" text-anchor="middle">→</text><rect x="800" y="200" width="340" height="300" rx="20" fill="white"/><rect x="800" y="200" width="340" height="66" rx="20" fill="#2f8a64"/><rect x="800" y="246" width="340" height="20" fill="#2f8a64"/><text x="970" y="245" font-size="26" font-weight="700" fill="white" text-anchor="middle">1年間の差</text><text x="970" y="350" font-size="32" font-weight="700" fill="#153452" text-anchor="middle">× 12か月</text><text x="970" y="420" font-size="34" font-weight="700" fill="#2f8a64" text-anchor="middle">＝ 年120ユーロ</text><text x="60" y="560" font-size="22" fill="#405a71" text-anchor="start">保険料は算定上限（2027年は月6,375ユーロの予定）までの給与に掛かります</text><text x="60" y="640" font-size="18" fill="#5b7086" text-anchor="start">図解：J-Connect。本文の計算例を図にしたもの。</text></g></svg>