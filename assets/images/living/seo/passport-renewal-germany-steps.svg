<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツで日本のパスポートを更新する流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツでパスポートを更新する流れ</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">在留届をオンラインで出しておく</text><text x="128" y="213" font-size="20" fill="#52666C">オンライン申請の前提。3か月以上の滞在で義務</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">オンラインで切替申請</text><text x="128" y="303" font-size="20" fill="#52666C">マイナンバーカードを使う。有効期間1年未満から</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">交付の連絡を待つ</text><text x="128" y="393" font-size="20" fill="#52666C">管轄の大使館・総領事館から連絡が届く</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">本人が窓口で受け取る</text><text x="128" y="483" font-size="20" fill="#52666C">古いパスポートと手数料を持参</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">外国人局などに変更を届け出る</text><text x="128" y="573" font-size="20" fill="#52666C">滞在カードにパスポート番号が記録されている</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">2026年7月から</text><text x="788" y="268" font-size="32" fill="#173B48">18歳以上は</text><text x="788" y="312" font-size="32" fill="#173B48">10年用のみ</text><text x="788" y="372" font-size="21" fill="#52666C">5年用は18歳未満だけ</text><text x="788" y="404" font-size="21" fill="#52666C">手数料は引き下げ</text><text x="788" y="436" font-size="21" fill="#52666C">（国内のオンライン申請で</text><text x="788" y="468" font-size="21" fill="#52666C">10年用8,900円）</text><text x="788" y="500" font-size="21" fill="#52666C">ドイツでの金額は公館で確認</text><text x="48" y="622" font-size="22" fill="#173B48">窓口で申請する場合は、申請と受け取りの2回、公館に行きます。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：在デュッセルドルフ総領事館・政府広報オンライン・外務省の案内  |  2026-11-06</text></g></svg>