<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">自動車保険の乗り換えの手順</title><desc id="d">今の契約を確認し、見積もりを比べ、新しい保険に申し込んで契約の成立を確認してから、古い保険を文書で解約するという4つの手順を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">乗り換えで失敗しない4つの手順</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">新しい保険が決まってから、古い保険を解約する</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2d6a9f"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">今の契約を確認</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">契約の期間</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">補償の内容</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">無事故の等級</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2d6a9f"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">見積もりを比べる</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">保険料だけでなく</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">免責額や</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">補償の範囲も</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2d6a9f"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">新しい保険に申し込む</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">契約の成立を</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">確認する</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2d6a9f"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">古い保険を解約</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">文書で送る</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">届いた日が</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">分かる方法で</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ADAC（2026年10月29日参照）</text></g></svg>