<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>2026年分の確定申告の期限</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="122" font-size="44" fill="#173B48">2026年分の確定申告　いつまでに出す？</text><text x="48" y="168" font-size="25" fill="#52666C">給与所得者の場合。期限が土日に当たると翌営業日に延びます</text><line x1="88" y1="262" x2="1120" y2="262" stroke="#B9C4C0" stroke-width="8" stroke-linecap="round"/><g fill="#146859"><circle cx="110" cy="262" r="16"/><circle cx="420" cy="262" r="16"/><circle cx="730" cy="262" r="16"/></g><circle cx="1090" cy="262" r="16" fill="#C2410C"/><text x="80" y="230" font-size="24" fill="#52666C">2027年1月</text><text x="390" y="230" font-size="24" fill="#52666C">2027年8月2日</text><text x="680" y="230" font-size="24" fill="#52666C">2028年2月29日</text><text x="972" y="230" font-size="24" fill="#52666C">2030年12月31日</text><rect x="48" y="310" width="250" height="240" rx="18" fill="#FFFFFF"/><rect x="48" y="310" width="250" height="12" rx="6" fill="#146859"/><text x="72" y="370" font-size="30" fill="#173B48">提出できる</text><text x="72" y="410" font-size="22" fill="#52666C">年が明けたら提出可</text><text x="72" y="448" font-size="22" fill="#52666C">勤務先のデータが</text><text x="72" y="480" font-size="22" fill="#52666C">そろうのは2月末ごろ</text><rect x="320" y="310" width="270" height="240" rx="18" fill="#FFFFFF"/><rect x="320" y="310" width="270" height="12" rx="6" fill="#146859"/><text x="344" y="370" font-size="30" fill="#173B48">義務の申告</text><text x="344" y="410" font-size="22" fill="#52666C">自分で出す場合の期限</text><text x="344" y="448" font-size="22" fill="#52666C">7月31日が土曜のため</text><text x="344" y="480" font-size="22" fill="#52666C">8月2日（月）に延長</text><rect x="612" y="310" width="270" height="240" rx="18" fill="#FFFFFF"/><rect x="612" y="310" width="270" height="12" rx="6" fill="#146859"/><text x="636" y="370" font-size="30" fill="#173B48">義務の申告</text><text x="636" y="410" font-size="22" fill="#52666C">税理士・税金相談団体</text><text x="636" y="448" font-size="22" fill="#52666C">に依頼した場合の期限</text><text x="636" y="480" font-size="22" fill="#52666C">税務署の個別指示に注意</text><rect x="904" y="310" width="248" height="240" rx="18" fill="#FFFFFF"/><rect x="904" y="310" width="248" height="12" rx="6" fill="#C2410C"/><text x="928" y="370" font-size="30" fill="#173B48">任意の申告</text><text x="928" y="410" font-size="22" fill="#52666C">義務がない人は</text><text x="928" y="448" font-size="22" fill="#52666C">4年間いつでも提出可</text><text x="928" y="480" font-size="22" fill="#52666C">延長はできない</text><text x="48" y="604" font-size="24" fill="#173B48">義務の申告が遅れると、1か月ごとに最低25ユーロの加算金が課されることがあります。</text><text x="48" y="656" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：租税通則法第108条・第149条・第152条・第169条・第170条  |  2026-11-05</text></g></svg>
