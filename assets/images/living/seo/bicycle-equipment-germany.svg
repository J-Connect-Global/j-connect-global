<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの自転車に必要な装備</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">自転車に必要な装備</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">前：白いライトと白い反射板</text><text x="128" y="213" font-size="20" fill="#52666C">点滅するライトは不可。電池式の取り外し型も可</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">後ろ：赤いライトと赤い反射板</text><text x="128" y="303" font-size="20" fill="#52666C">反射板は三角形でないもの</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">ペダルと側面の反射板</text><text x="128" y="393" font-size="20" fill="#52666C">ペダルは黄色。タイヤ側面の反射材など</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">澄んだ音のベル</text><text x="128" y="483" font-size="20" fill="#52666C">ほかの音を出す装置は付けられない</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">2つの独立したブレーキ</text><text x="128" y="573" font-size="20" fill="#52666C">前後それぞれに効くもの</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">電動自転車</text><text x="788" y="268" font-size="32" fill="#173B48">時速25km</text><text x="788" y="312" font-size="32" fill="#173B48">までは自転車</text><text x="788" y="372" font-size="21" fill="#52666C">モーター0.25kWまでの</text><text x="788" y="404" font-size="21" fill="#52666C">アシスト付きは自転車と同じ</text><text x="788" y="436" font-size="21" fill="#52666C">時速45kmまでのタイプは</text><text x="788" y="468" font-size="21" fill="#52666C">原付バイクの扱いで</text><text x="788" y="500" font-size="21" fill="#52666C">保険のナンバー・免許・</text><text x="788" y="532" font-size="21" fill="#52666C">ヘルメットが必要</text><text x="48" y="622" font-size="22" fill="#173B48">ライトは国の認可の印（波線とKの字）がついたものを選びましょう。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：車両登録規則第64a条・第65条・第67条、道路交通法第1条  |  2026-11-06</text></g></svg>