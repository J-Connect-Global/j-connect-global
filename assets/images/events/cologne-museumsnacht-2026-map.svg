<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ミュージアムナイトの館の組み合わせ方</title><desc id="d">参加施設を現代美術、街の歴史、世界の文化、20世紀の記憶、気軽に楽しむ館の5つに分け、現代美術と街の歴史と気軽に楽しむ館を組み合わせて大聖堂周辺から川沿いへ回る例を示した図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ミュージアムナイト：館の組み合わせ方</text><text x="60" y="134" font-size="22" fill="#405a71">1枚の券で、分野の違う館を2〜3か所</text><rect x="60" y="170" width="200" height="300" rx="16" fill="white"/><rect x="60" y="170" width="200" height="10" rx="5" fill="#b5473a"/><text x="160" y="235" font-size="26" font-weight="700" fill="#b5473a" text-anchor="middle">現代美術</text><text x="160" y="290" font-size="19" fill="#405a71" text-anchor="middle">ルートヴィヒ美術館</text><text x="160" y="324" font-size="19" fill="#405a71" text-anchor="middle">（大聖堂の隣）</text><rect x="278" y="170" width="200" height="300" rx="16" fill="white"/><rect x="278" y="170" width="200" height="10" rx="5" fill="#8d5a3c"/><text x="378" y="235" font-size="26" font-weight="700" fill="#8d5a3c" text-anchor="middle">街の歴史</text><text x="378" y="290" font-size="19" fill="#405a71" text-anchor="middle">ローマ・ゲルマン博物館</text><text x="378" y="324" font-size="19" fill="#405a71" text-anchor="middle">ケルン市立博物館</text><rect x="496" y="170" width="200" height="300" rx="16" fill="white"/><rect x="496" y="170" width="200" height="10" rx="5" fill="#2a6f97"/><text x="596" y="235" font-size="26" font-weight="700" fill="#2a6f97" text-anchor="middle">世界の文化</text><text x="596" y="290" font-size="19" fill="#405a71" text-anchor="middle">ラウテンシュトラウフ・</text><text x="596" y="324" font-size="19" fill="#405a71" text-anchor="middle">ヨースト博物館</text><rect x="714" y="170" width="200" height="300" rx="16" fill="white"/><rect x="714" y="170" width="200" height="10" rx="5" fill="#405a71"/><text x="814" y="235" font-size="26" font-weight="700" fill="#405a71" text-anchor="middle">20世紀の記憶</text><text x="814" y="290" font-size="19" fill="#405a71" text-anchor="middle">ナチス資料センター</text><text x="814" y="324" font-size="19" fill="#405a71" text-anchor="middle"></text><rect x="932" y="170" width="200" height="300" rx="16" fill="white"/><rect x="932" y="170" width="200" height="10" rx="5" fill="#2f6a40"/><text x="1032" y="235" font-size="26" font-weight="700" fill="#2f6a40" text-anchor="middle">気軽に楽しむ</text><text x="1032" y="290" font-size="19" fill="#405a71" text-anchor="middle">チョコレート博物館</text><text x="1032" y="324" font-size="19" fill="#405a71" text-anchor="middle">スポーツ博物館</text><rect x="60" y="495" width="1080" height="110" rx="16" fill="#153452"/><text x="90" y="540" font-size="22" font-weight="700" fill="#f2c94c">組み合わせの例</text><text x="90" y="580" font-size="21" fill="white">現代美術 ＋ 街の歴史 ＋ 気軽に楽しむ館 → 大聖堂周辺から川沿いへ歩いて回る</text><text x="60" y="645" font-size="18" fill="#405a71">参加施設の一部を分類した例。全施設と催しは公式サイトのプログラムで確認（2026年10月30日参照）</text></g></svg>