<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">新生児用品は4つに分けてそろえる</title><desc id="d">おむつ替え、授乳、お風呂と体調、衣類と移動の4つに分けて、新生児用品をドイツ語の名前と日本語訳で並べた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="88" font-size="40" font-weight="700" fill="#153452">新生児用品は4つに分けてそろえる</text>
<text x="60" y="130" font-size="24" fill="#3c5a78">ドラッグストアの売り場で探しやすいよう、ドイツ語の名前と一緒に</text>
<rect x="60" y="180" width="255" height="420" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<text x="80" y="228" font-size="24" font-weight="700" fill="#1f5f99">おむつ替え</text>
<text x="80" y="280" font-size="21" font-weight="700" fill="#153452">Windeln</text>
<text x="80" y="310" font-size="19" fill="#2b4560">おむつ（新生児用）</text>
<text x="80" y="360" font-size="21" font-weight="700" fill="#153452">Feuchttücher</text>
<text x="80" y="390" font-size="19" fill="#2b4560">おしりふき</text>
<text x="80" y="440" font-size="21" font-weight="700" fill="#153452">Wundschutzcreme</text>
<text x="80" y="470" font-size="19" fill="#2b4560">おしりのクリーム</text>
<text x="80" y="520" font-size="21" font-weight="700" fill="#153452">Wickelunterlage</text>
<text x="80" y="550" font-size="19" fill="#2b4560">おむつ替えシート</text>
<rect x="335" y="180" width="255" height="420" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<text x="355" y="228" font-size="24" font-weight="700" fill="#1f5f99">授乳</text>
<text x="355" y="280" font-size="21" font-weight="700" fill="#153452">Stilleinlagen</text>
<text x="355" y="310" font-size="19" fill="#2b4560">母乳パッド</text>
<text x="355" y="360" font-size="21" font-weight="700" fill="#153452">Brustwarzensalbe</text>
<text x="355" y="390" font-size="19" fill="#2b4560">乳頭ケアのクリーム</text>
<text x="355" y="440" font-size="21" font-weight="700" fill="#153452">Spucktücher</text>
