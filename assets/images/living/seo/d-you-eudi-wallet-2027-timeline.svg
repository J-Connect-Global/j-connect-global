<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">d-you EUDI Walletの開始予定</title>
  <desc id="desc">2026年10月15日の連邦議会可決、11月20日の連邦参議院の同意、2027年1月初旬の開始予定を示す時系列図。</desc>
  <rect width="1200" height="675" rx="28" fill="#F5F1E8"/>
  <text x="64" y="82" fill="#1F2933" font-size="38" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">d-you：法案審議から開始予定まで</text>
  <text x="64" y="126" fill="#52616B" font-size="22" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">2026年11月25日時点。予定と確定事項を分けて確認。</text>
  <line x1="190" y1="385" x2="1010" y2="385" stroke="#AAB7B8" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(190 385)">
    <circle r="28" fill="#47727A"/>
    <line x1="0" y1="-28" x2="0" y2="-95" stroke="#47727A" stroke-width="4"/>
    <rect x="-130" y="-230" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#C8D2D4" stroke-width="2"/>
    <text x="-104" y="-190" fill="#47727A" font-size="24" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">2026年10月15日</text>
    <text x="-104" y="-148" fill="#1F2933" font-size="26" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">連邦議会が可決</text>
    <text x="-104" y="-115" fill="#52616B" font-size="19" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">法案の可決</text>
  </g>
  <g transform="translate(600 385)">
    <circle r="28" fill="#C28B4B"/>
    <line x1="0" y1="28" x2="0" y2="95" stroke="#C28B4B" stroke-width="4"/>
    <rect x="-150" y="100" width="300" height="135" rx="18" fill="#FFFFFF" stroke="#D9C6A7" stroke-width="2"/>
    <text x="-122" y="140" fill="#A46E34" font-size="24" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">2026年11月20日</text>
    <text x="-122" y="180" fill="#1F2933" font-size="26" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">連邦参議院</text>
    <text x="-122" y="214" fill="#52616B" font-size="20" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">法案に同意（確認済）</text>
  </g>
  <g transform="translate(1010 385)">
    <circle r="28" fill="#687A63"/>
    <line x1="0" y1="-28" x2="0" y2="-95" stroke="#687A63" stroke-width="4"/>
    <rect x="-130" y="-230" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#C8D2D4" stroke-width="2"/>
    <text x="-104" y="-190" fill="#687A63" font-size="24" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">2027年1月初旬</text>
    <text x="-104" y="-148" fill="#1F2933" font-size="26" font-weight="700" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">開始予定</text>
    <text x="-104" y="-115" fill="#52616B" font-size="19" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">予定。全機能ではない</text>
  </g>
  <text x="64" y="658" fill="#52616B" font-size="22" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">公布・施行日、対応書類、初期版の機能は今後の案内で確認。</text>
</svg>