<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">グリューワインを選ぶときのポイント</title><desc id="d">グリューワインには材料の一覧を書く義務がないこと、調査では糖分が100ミリリットルあたり7.5〜9.5グラムだったこと、子どもには0.0%と書かれた飲み物を選ぶことを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7efe8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">グリューワインを選ぶときに知っておきたいこと</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">消費者センター（Lebensmittelklarheit）の資料から</text><rect x="60" y="185" width="1080" height="122" rx="16" fill="white"/><rect x="60" y="185" width="16" height="122" rx="8" fill="#2d6a9f"/><text x="100" y="235" font-size="26" font-weight="700" fill="#153452" text-anchor="start">材料の一覧はなくてもよい</text><text x="100" y="277" font-size="20" fill="#405a71" text-anchor="start">アルコール1.2%超の飲み物（ビール以外）は表示義務なし。調査では12本中2本だけ表示</text><rect x="60" y="325" width="1080" height="122" rx="16" fill="white"/><rect x="60" y="325" width="16" height="122" rx="8" fill="#c9952a"/><text x="100" y="375" font-size="26" font-weight="700" fill="#153452" text-anchor="start">糖分は意外と多い</text><text x="100" y="417" font-size="20" fill="#405a71" text-anchor="start">調査では100mlあたり7.5〜9.5g。マグカップ1杯で15g以上の計算</text><rect x="60" y="465" width="1080" height="122" rx="16" fill="white"/><rect x="60" y="465" width="16" height="122" rx="8" fill="#2f8a64"/><text x="100" y="515" font-size="26" font-weight="700" fill="#153452" text-anchor="start">子どもには「0.0%」</text><text x="100" y="557" font-size="20" fill="#405a71" text-anchor="start">「alkoholfrei」でもわずかにアルコールを含むことがある。キンダープンシュも選択肢</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：Lebensmittelklarheit、消費者センター（2026年10月29日参照）</text></g></svg>