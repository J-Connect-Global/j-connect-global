<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツで病気のため仕事を休むときの流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">病気で仕事を休むときの流れ</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">朝いちばんに職場へ連絡</text><text x="128" y="213" font-size="20" fill="#52666C">休む見込みの期間を伝える。病名を伝える義務はない</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">3暦日を超えたら医師を受診</text><text x="128" y="303" font-size="20" fill="#52666C">遅くともその後の勤務日までに病欠証明。会社は初日から求めることも</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">公的保険は証明が電子で届く</text><text x="128" y="393" font-size="20" fill="#52666C">会社が保険から受け取る。民間保険は紙を提出</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">6週間までは会社が給料を払う</text><text x="128" y="483" font-size="20" fill="#52666C">入社4週間後から。同じ病気は合計で数える</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">6週間を超えたら傷病手当金</text><text x="128" y="573" font-size="20" fill="#52666C">総支給の70%、手取りの90%まで。最長78週</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">夜間・休日</text><text x="788" y="268" font-size="32" fill="#173B48">116117</text><text x="788" y="328" font-size="21" fill="#52666C">全国共通の医療相談の番号</text><text x="788" y="360" font-size="21" fill="#52666C">当番の診療所を案内</text><text x="788" y="392" font-size="21" fill="#52666C">命に関わる緊急時は112</text><text x="788" y="424" font-size="21" fill="#52666C"></text><text x="788" y="456" font-size="21" fill="#52666C">休暇中に病気になったら</text><text x="788" y="488" font-size="21" fill="#52666C">医師の証明があれば、その日</text><text x="788" y="520" font-size="21" fill="#52666C">は休暇として数えません</text><text x="788" y="552" font-size="21" fill="#52666C">（連邦休暇法第9条）</text><text x="48" y="622" font-size="22" fill="#173B48">連絡の方法や証明の提出時期は、労働契約や社内のルールも確認してください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：賃金継続支払法、社会法典第5編第44条〜第48条、連邦休暇法第9条  |  2026-11-10</text></g></svg>