<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>一つの注文でも、箱は別々</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">一つの注文でも、箱は別々</text><text x="48" y="178" font-size="27" fill="#52666C">注文番号と、箱ごとの追跡番号を分けて記録する</text><rect x="48" y="209" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="264" font-size="38" fill="#173B48">注文番号：注文A</text><text x="81" y="312" font-size="33" fill="#52666C">発送メールで箱の数と追跡番号を確認</text><rect x="48" y="351" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="351" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="406" font-size="38" fill="#173B48">1箱目：追跡番号X → 受取済み</text><text x="81" y="454" font-size="33" fill="#52666C">届いたラベルと番号を照合する</text><rect x="48" y="493" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="493" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="548" font-size="38" fill="#173B48">2箱目：追跡番号Y → 未着</text><text x="81" y="596" font-size="33" fill="#52666C">この箱の番号と未着状況を販売店へ伝える</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  2026-10-19</text></g></svg>