name: Temporary render quality previews for two redesigned editorial diagrams
on:
  push:
    branches:
      - codex/article-body-media-audit-20261123
    paths:
      - .github/workflows/preview-inline-diagrams.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image renderer and Japanese glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user 'CairoSVG>=2.7,<3' 'Pillow>=11,<13'
      - name: Validate SVG syntax and render PNG previews
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          import cairosvg
          srcs=['advent-wreath-then-now','advent-calendar-history']
          out=Path('docs/previews')
          out.mkdir(parents=True,exist_ok=True)
          for name in srcs:
              src=Path('assets/images/events')/(name+'.svg')
              root=ElementTree.parse(src).getroot()
              assert root.attrib.get('viewBox')=='0 0 1200 675'
              assert len(root.findall('{http://www.w3.org/2000/svg}title'))==1
              assert len(root.findall('{http://www.w3.org/2000/svg}desc'))==1
              path=out/(name+'.png')
              cairosvg.svg2png(url=str(src),write_to=str(path),output_width=1200,output_height=675)
              assert path.stat().st_size<2000000
              print(name,path.stat().st_size)
          PY
      - name: Commit temporary PNG previews to branch for visual QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/advent-wreath-then-now.png docs/previews/advent-calendar-history.png
          git diff --cached --quiet && exit 0
          git commit -m "qa: add temporary rendered diagrams for visual review"
          git push origin "HEAD:refs/heads/codex/article-body-media-audit-20261123"
