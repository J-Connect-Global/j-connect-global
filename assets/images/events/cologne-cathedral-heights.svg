<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルン大聖堂の塔の高さ</title><desc id="d">工事が止まったとき南の塔は約58メートルで、塔の上に木のクレーンが残ったこと、1880年に完成した2本の塔は157メートルを超え、当時世界で最も高い建物だったことを比べた図</desc><rect width="1200" height="675" rx="28" fill="#f1f1ee"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">塔の高さで見るケルン大聖堂</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">工事が止まったときと、完成したとき</text><rect x="200" y="451" width="120" height="139" fill="#9aa5b1"/><polygon points="200,451 260,411 320,451" fill="#9aa5b1"/><text x="260" y="396" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">約58m</text><text x="260" y="620" font-size="18" fill="#405a71" text-anchor="middle">工事が止まったときの南の塔</text><rect x="250" y="410" width="10" height="40" fill="#8d5a3c"/><rect x="250" y="410" width="60" height="8" fill="#8d5a3c"/><text x="320" y="405" font-size="16" font-weight="700" fill="#8d5a3c" text-anchor="start">木のクレーン</text><rect x="520" y="214" width="120" height="376" fill="#5b6f84"/><polygon points="520,214 580,174 640,214" fill="#5b6f84"/><text x="580" y="159" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">157m超</text><text x="580" y="620" font-size="18" fill="#405a71" text-anchor="middle">1880年に完成した塔（2本）</text><rect x="700" y="214" width="120" height="376" fill="#5b6f84"/><polygon points="700,214 760,174 820,214" fill="#5b6f84"/><text x="760" y="159" font-size="26" font-weight="700" fill="#153452" text-anchor="middle"></text><text x="760" y="620" font-size="18" fill="#405a71" text-anchor="middle"></text><rect x="880" y="200" width="260" height="300" rx="16" fill="white"/><text x="1010" y="250" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1880年</text><text x="1010" y="300" font-size="20" fill="#29465f" text-anchor="middle">完成したときは</text><text x="1010" y="335" font-size="20" fill="#29465f" text-anchor="middle">世界で最も</text><text x="1010" y="370" font-size="26" font-weight="700" fill="#b5473a" text-anchor="middle">高い建物</text><text x="1010" y="430" font-size="20" font-weight="700" fill="#5b6f84" text-anchor="middle">着工から632年</text><line x1="120" y1="590" x2="860" y2="590" stroke="#9aa5b1" stroke-width="4"/><text x="60" y="640" font-size="18" fill="#5b6f84" text-anchor="start">出典：ケルン大聖堂（2026年10月29日参照）。図の高さは目安です</text></g></svg>