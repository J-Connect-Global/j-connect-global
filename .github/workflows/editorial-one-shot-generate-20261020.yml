name: One-time editorial generated files sync
on:
  push:
    branches:
      - automation/publish-winter-tires-nebenkosten-20261020
    paths:
      - .github/workflows/editorial-one-shot-generate-20261020.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate site and remove one-time workflow
        run: |
          npm run build
          git rm -f .github/workflows/editorial-one-shot-generate-20261020.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Regenerate published pages, search index and sitemap"
          git push
