<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">2026年のTHG-Quote申告期限</title>
  <desc id="desc">純電気自動車の登録名義人が非公開充電の定額推計を申告する期限は2026年11月15日。公共充電設備の運営者が計測値を申告する期限は2027年2月28日。後者は一般の車両所有者向けではない。</desc>
  <rect width="1200" height="675" rx="28" fill="#f5f7fa"/>
  <text x="72" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#152238">2026年のTHG-Quote申告期限</text>
  <text x="72" y="136" font-family="Arial,sans-serif" font-size="23" fill="#4b5d73">車両所有者と公共充電設備の運営者では、期限が異なります</text>
  <rect x="72" y="190" width="500" height="330" rx="24" fill="#ffffff" stroke="#c8d5e4" stroke-width="3"/>
  <rect x="72" y="190" width="500" height="18" rx="9" fill="#2b6cb0"/>
  <text x="112" y="270" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324f">純電気自動車の登録名義人</text>
  <text x="112" y="315" font-family="Arial,sans-serif" font-size="21" fill="#52647a">非公開充電の定額推計</text>
  <text x="112" y="410" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#174f83">11月15日</text>
  <text x="112" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#174f83">2026年（日）</text>
  <text x="112" y="490" font-family="Arial,sans-serif" font-size="18" fill="#52647a">仲介事業者の受付は早く終わる場合あり</text>
  <rect x="628" y="190" width="500" height="330" rx="24" fill="#ffffff" stroke="#c8d5e4" stroke-width="3"/>
  <rect x="628" y="190" width="500" height="18" rx="9" fill="#65758b"/>
  <text x="668" y="270" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324f">公共充電設備の運営者</text>
  <text x="668" y="315" font-family="Arial,sans-serif" font-size="21" fill="#52647a">公開充電設備の計測値</text>
  <text x="668" y="410" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#40536b">2月28日</text>
  <text x="668" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#40536b">2027年</text>
  <text x="668" y="490" font-family="Arial,sans-serif" font-size="18" fill="#52647a">一般の自家用車所有者の期限ではない</text>
  <rect x="72" y="558" width="1056" height="70" rx="16" fill="#e8eef5"/>
  <text x="100" y="602" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263b53">自分の車の申請なら、11月15日を基準に早めに手続きしてください。</text>
</svg>