<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026年11月11日のケルン：人が集まる2つの中心と規制</title><desc id="d">旧市街のホイマルクト、アルター・マルクト、クルト・ハッケンベルク広場、ドイツ橋の周辺は6時ごろから22時ごろまで通行止めで、ドーム／中央駅、ノイマルクト、ドイツ駅／メッセの停留所の利用が勧められている。ツュルピッヒャー通り周辺の学生街は6時ごろから深夜まで通行止め。大学そばの緑地では8時から22時までガラス容器が禁止されていることを示す概略図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" fill="#153452" font-weight="700">11月11日のケルン：人が集まる2つの中心</text><text x="60" y="132" font-size="22" fill="#405a71">位置関係を簡略化した概略図です。正確な範囲は市の地図で確認してください</text><rect x="60" y="165" width="520" height="400" rx="16" fill="white" stroke="#b5473a" stroke-width="3"/><text x="90" y="212" font-size="26" fill="#b5473a" font-weight="700">旧市街（大聖堂の南、ライン川沿い）</text><text x="90" y="256" font-size="20" fill="#153452" font-weight="700">ホイマルクト／アルター・マルクト</text><text x="90" y="286" font-size="20" fill="#153452" font-weight="700">クルト・ハッケンベルク広場、ドイツ橋の周辺</text><text x="90" y="336" font-size="19" fill="#405a71">・朝の伝統イベントと11時11分の歓声</text><text x="90" y="366" font-size="19" fill="#405a71">・6時ごろ〜22時ごろ 道路と広場を順次通行止め</text><text x="90" y="396" font-size="19" fill="#405a71">・混雑時は市電がホイマルクトなどに止まらない</text><rect x="90" y="440" width="460" height="100" rx="12" fill="#fbe9e7"/><text x="110" y="476" font-size="19" fill="#7a2a20" font-weight="700">市が勧める停留所</text><text x="110" y="508" font-size="19" fill="#7a2a20" font-weight="700">ドーム／中央駅・ノイマルクト・ドイツ駅／メッセ</text><rect x="620" y="165" width="520" height="250" rx="16" fill="white" stroke="#3d405b" stroke-width="3"/><text x="650" y="212" font-size="26" fill="#3d405b" font-weight="700">ツュルピッヒャー通り周辺（学生街）</text><text x="650" y="256" font-size="19" fill="#405a71">・若い人が非常に多く集まる</text><text x="650" y="288" font-size="19" fill="#405a71">・6時ごろ〜深夜 周辺の道路を広く通行止め</text><text x="650" y="320" font-size="19" fill="#405a71">・前年までは入口を限って人数を制限</text><text x="650" y="352" font-size="19" fill="#405a71">・子ども連れには不向き</text><rect x="620" y="435" width="520" height="130" rx="16" fill="#e3f1ec" stroke="#2a9d8f" stroke-width="3"/><text x="650" y="478" font-size="19" fill="#1d5c52" font-weight="700">大学そばの緑地（大学前の芝生広場、広島・長崎公園）</text><text x="650" y="512" font-size="19" fill="#1d5c52" font-weight="700">8時〜22時 ガラス容器の持ち込み・使用禁止（告示済み）</text><text x="60" y="606" font-size="18" fill="#153452">旧市街と学生街のガラス禁止の時間は、直前に市が発表します（2025年はどちらも8時〜翌朝8時）。</text><text x="60" y="640" font-size="16" fill="#405a71">出典：ケルン市の交通規制の案内と2026年2月5日の告示（2026年10月31日参照）</text></g></svg>