<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">冬の窓換気：傾けたままの換気と全開で短い換気</title>
<desc id="desc">窓を長時間傾けるKipplüftenは窓まわりの壁が冷えやすく、短時間大きく開けるStoßlüftenは約5分、1日に2〜3回が目安。朝の寝室や料理・シャワー後は5〜10分とされる。窓の模式図を左右に比較。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f7fa"/><stop offset="1" stop-color="#e5eef0"/></linearGradient>
<linearGradient id="outside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#99c7de"/><stop offset="1" stop-color="#dff1f4"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#39546b" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="635" rx="25" stroke="#ccdce0" stroke-width="2" fill="none"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif">
 <text x="60" y="80" font-size="42" font-weight="800" fill="#234657">冬の換気は「全開で、短く」</text>
 <text x="62" y="127" font-size="22" fill="#5b7480">窓の開け方で、壁の冷え方や空気の入れ替わり方が変わります</text>
 <g filter="url(#shadow)"><rect x="48" y="166" width="542" height="437" rx="23" fill="#fff"/><rect x="610" y="166" width="542" height="437" rx="23" fill="#fff"/></g>
 <rect x="70" y="186" width="498" height="48" rx="12" fill="#f9e6e2"/>
 <rect x="632" y="186" width="498" height="48" rx="12" fill="#e0f2eb"/>
 <circle cx="97" cy="210" r="14" fill="#bd534b"/><path d="M91 204L103 216M103 204L91 216" stroke="white" stroke-width="3.4" stroke-linecap="round"/>
 <circle cx="658" cy="210" r="14" fill="#36886d"/><path d="M652 210L657 216L665 204" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="126" y="219" font-size="24" font-weight="800" fill="#8e4038">Kipplüften：長時間の傾け開け</text>
 <text x="688" y="219" font-size="24" font-weight="800" fill="#276a57">Stoßlüften：短時間の全開</text>
 <!-- Left: frame with tilted pane, red cold wall edge and moisture -->
 <rect x="93" y="267" width="233" height="248" rx="13" fill="#ecd8d0" stroke="#d5a99b" stroke-width="10"/>
 <rect x="111" y="286" width="195" height="209" rx="5" fill="url(#outside)" stroke="#375968" stroke-width="9"/>
 <path d="M119 298L297 310L282 380L132 366Z" fill="#f9fbfd" fill-opacity=".78" stroke="#497287" stroke-width="6" stroke-linejoin="round"/>
 <path d="M121 297L301 310" stroke="#537589" stroke-width="5"/>
 <path d="M204 308L204 363" stroke="#537589" stroke-width="5"/>
 <path d="M166 394Q148 428 167 452Q186 426 166 394ZM270 405Q256 432 272 451Q289 425 270 405Z" fill="#6ea9c4" opacity=".87"/>
 <g stroke="#ad6259" fill="none" stroke-width="5" stroke-linecap="round"><path d="M95 350q-22 15-5 35"/><path d="M317 369q22 14 5 37"/></g>
 <text x="344" y="294" font-size="20" font-weight="800" fill="#9a4c43">窓まわりが</text><text x="344" y="321" font-size="20" font-weight="800" fill="#9a4c43">冷えやすい</text>
 <text x="345" y="384" font-size="20" fill="#4c6874">長く開けると</text><text x="345" y="413" font-size="20" fill="#4c6874">熱損失・結露</text><text x="345" y="442" font-size="20" fill="#4c6874">の一因に</text>
 <!-- Right: wide open two-leaf window and circulation arrows -->
 <rect x="650" y="267" width="230" height="247" rx="12" fill="#dceef1" stroke="#67899a" stroke-width="11"/>
 <rect x="662" y="280" width="204" height="219" fill="url(#outside)" stroke="#8dafb9" stroke-width="3"/>
 <path d="M666 499L758 393L866 499Z" fill="#aec7b7"/><path d="M705 499L794 400L865 499Z" fill="#84ad99"/>
 <path d="M659 290L605 313V486L659 503Z" fill="#f9f9f7" stroke="#486c7c" stroke-width="8" stroke-linejoin="round"/>
 <path d="M873 291L929 319V480L873 502Z" fill="#f9f9f7" stroke="#486c7c" stroke-width="8" stroke-linejoin="round"/>
 <path d="M792 310q32-24 59 5M794 352q40-28 66 5M788 390q35-22 63 5" fill="none" stroke="#318d93" stroke-width="6" stroke-linecap="round"/>
 <path d="M850 302l5 13-14 1M857 343l4 14-14-1M846 386l8 10-15 1" fill="none" stroke="#318d93" stroke-width="4" stroke-linecap="round"/>
 <text x="956" y="306" font-size="24" font-weight="800" fill="#277762">約5分</text>
 <text x="956" y="354" font-size="20" fill="#4c6874">1日2〜3回</text><text x="956" y="400" font-size="20" fill="#4c6874">寝室の朝・</text><text x="956" y="428" font-size="20" fill="#4c6874">料理やシャワー後</text><text x="956" y="456" font-size="20" font-weight="800" fill="#277762">5〜10分</text>
 <text x="320" y="570" font-size="18" text-anchor="middle" fill="#687d87">小さな隙間を開け続ける</text>
 <text x="882" y="570" font-size="18" text-anchor="middle" fill="#687d87">窓を大きく開いて空気を入れ替える</text>
 <text x="61" y="636" font-size="18" fill="#5b7480">出典：ドイツ連邦環境庁の換気ガイド。温度・風・湿度に応じて換気時間を調整。窓の模式図。</text>
</g></svg>