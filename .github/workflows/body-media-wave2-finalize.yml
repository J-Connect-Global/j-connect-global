name: One-time vaccine diagram QA and two article rebuild
on:
  push:
    branches:
      - codex/article-body-media-wave2-20261123
    paths:
      - .github/workflows/body-media-wave2-finalize.yml
permissions:
  contents: write
jobs:
  review-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Japanese font and SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user 'CairoSVG>=2.7,<3' 'Pillow>=11,<13'
      - name: Validate XML and render accurate Japanese preview
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree
          from pathlib import Path
          import cairosvg
          file=Path('assets/images/living/family-vaccination-preparation.svg')
          root=ElementTree.parse(file).getroot()
          assert root.attrib.get('viewBox')=='0 0 1200 675'
          assert len(root.findall('{http://www.w3.org/2000/svg}title'))==1
          assert len(root.findall('{http://www.w3.org/2000/svg}desc'))==1
          out=Path('docs/previews/family-vaccination-preparation.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          cairosvg.svg2png(url=str(file),write_to=str(out),output_width=1200,output_height=675)
          print('rendered',out, out.stat().st_size)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit regenerated article files and temporary visual QA preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u germany/ja assets/data sitemap.xml
          git add docs/previews/family-vaccination-preparation.png
          git diff --cached --quiet && exit 0
          git diff --cached --stat
          git commit -m "build: verify and render two focused body-media improvements"
          git push origin HEAD:refs/heads/codex/article-body-media-wave2-20261123
