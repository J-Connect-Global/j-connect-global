<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>チャンスカードの点数表</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">チャンスカードの点数　合計6点以上が条件</text><text x="48" y="152" font-size="23" fill="#52666C">専門人材として認められた人は点数不要。語学は最も高い段階だけを数える</text><rect x="308" y="176" width="628" height="50" rx="10" fill="#173B48"/><text x="324" y="210" font-size="24" fill="#FFFFFF">条件</text><rect x="948" y="176" width="192" height="50" rx="10" fill="#146859"/><text x="964" y="210" font-size="24" fill="#FFFFFF">点数</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="270" font-size="24" fill="#52666C">資格</text><text x="324" y="270" font-size="26" fill="#173B48">ドイツで部分的に同等と認定</text><text x="964" y="270" font-size="26" fill="#C2410C">4点</text><rect x="48" y="290" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="330" font-size="24" fill="#52666C">ドイツ語</text><text x="324" y="330" font-size="26" fill="#173B48">B2で3点・B1で2点・A2で1点</text><text x="964" y="330" font-size="26" fill="#173B48">1〜3点</text><rect x="48" y="350" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="390" font-size="24" fill="#52666C">英語</text><text x="324" y="390" font-size="26" fill="#173B48">C1</text><text x="964" y="390" font-size="26" fill="#173B48">1点</text><rect x="48" y="410" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="450" font-size="24" fill="#52666C">職務経験</text><text x="324" y="450" font-size="26" fill="#173B48">直近7年で5年以上／直近5年で2年以上</text><text x="964" y="450" font-size="26" fill="#173B48">3点／2点</text><rect x="48" y="470" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="510" font-size="24" fill="#52666C">年齢</text><text x="324" y="510" font-size="26" fill="#173B48">35歳以下／36〜40歳</text><text x="964" y="510" font-size="26" fill="#173B48">2点／1点</text><rect x="48" y="530" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="570" font-size="24" fill="#52666C">その他</text><text x="324" y="570" font-size="26" fill="#173B48">人手不足の職業・ドイツ滞在6か月・配偶者</text><text x="964" y="570" font-size="26" fill="#173B48">各1点</text><text x="48" y="622" font-size="22" fill="#173B48">前提として、国が認めた学位か2年以上の職業資格と、ドイツ語A1か英語B2が必要です。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第20a条・第20b条・別表  |  2026-11-06</text></g></svg>