<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">社会保険の保険料算定上限：2026年と2027年（予定）</title><desc id="d">公的医療・介護保険は月5,812.50ユーロから6,375ユーロへ、年金・失業保険は月8,450ユーロから8,850ユーロへ引き上げ予定</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452">保険料算定上限（月額）の比較</text><text x="60" y="145" font-size="24" fill="#405a71">上限を超える部分の給与には保険料が掛かりません。上限が上がると高所得者の負担が増えます。</text><text x="60" y="235" font-size="27" font-weight="700" fill="#153452">公的医療・介護保険</text><rect x="60" y="255" width="590" height="44" rx="10" fill="#9fb6c9"/><text x="670" y="287" font-size="25" fill="#29465f">2026年 5,812.50ユーロ</text><rect x="60" y="310" width="647" height="44" rx="10" fill="#1f4e79"/><text x="727" y="342" font-size="25" font-weight="700" fill="#153452">2027年 6,375ユーロ（予定）</text><text x="60" y="425" font-size="27" font-weight="700" fill="#153452">年金・失業保険</text><rect x="60" y="445" width="857" height="44" rx="10" fill="#9fb6c9"/><text x="937" y="477" font-size="25" fill="#29465f">2026年 8,450ユーロ</text><rect x="60" y="500" width="898" height="44" rx="10" fill="#1f4e79"/><text x="978" y="532" font-size="25" font-weight="700" fill="#153452">2027年 8,850</text><text x="978" y="562" font-size="20" fill="#29465f">ユーロ（予定）</text><text x="60" y="625" font-size="22" fill="#405a71">図解：J-Connect。2027年の値は閣議決定済み・連邦参議院の同意待ち（2026年10月21日時点）。</text></g></svg>
