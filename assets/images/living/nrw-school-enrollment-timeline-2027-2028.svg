<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">NRWの2027/28年度小学校入学手続き日程</title>
<desc id="d">NRW州全体の登録期限は2026年11月15日。デュッセルドルフの指定受付日は10月6日から8日。ケルンは10月から11月に登録し、2027年1月から5月に学校医の検査、9月に入学する。</desc>
<rect width="1200" height="675" rx="28" fill="#eef5fb"/>
<g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="82" font-size="38" font-weight="700" fill="#153452">2027/28年度の入学手続き日程</text>
<rect x="60" y="112" width="1080" height="90" rx="16" fill="#153f63"/>
<text x="96" y="150" font-size="22" fill="#dceaf5">NRW州全体の登録期限</text>
<text x="96" y="185" font-size="32" font-weight="700" fill="#ffffff">2026年11月15日まで</text>
<rect x="60" y="230" width="520" height="330" rx="18" fill="#ffffff"/>
<rect x="60" y="230" width="520" height="12" rx="6" fill="#2d6a9f"/>
<text x="92" y="280" font-size="28" font-weight="700" fill="#2d6a9f">デュッセルドルフ</text>
<text x="92" y="325" font-size="21" font-weight="700" fill="#153452">指定受付日</text>
<text x="92" y="365" font-size="20" fill="#29465f">10月6日（火）15:00〜18:00</text>
<text x="92" y="399" font-size="20" fill="#29465f">10月7日（水）11:00〜13:00</text>
<text x="92" y="433" font-size="20" fill="#29465f">　　　　　　 15:00〜18:00</text>
<text x="92" y="467" font-size="20" fill="#29465f">10月8日（木）11:00〜13:00</text>
<rect x="92" y="492" width="456" height="48" rx="10" fill="#e7f0f8"/>
<text x="112" y="523" font-size="18" fill="#244d70">指定日を逃したら希望校へ連絡</text>
<rect x="620" y="230" width="520" height="330" rx="18" fill="#ffffff"/>
<rect x="620" y="230" width="520" height="12" rx="6" fill="#2f8a64"/>
<text x="652" y="280" font-size="28" font-weight="700" fill="#2f8a64">ケルン</text>
<text x="652" y="325" font-size="20" font-weight="700" fill="#153452">市の案内にある主な流れ</text>
<text x="652" y="365" font-size="19" fill="#29465f">2026年9月：市から登録案内</text>
<text x="652" y="399" font-size="19" fill="#29465f">2026年10〜11月：小学校で登録</text>
<text x="652" y="433" font-size="19" fill="#29465f">2027年1〜5月：学校医の検査</text>
<text x="652" y="467" font-size="19" fill="#29465f">2027年9月：入学・初登校</text>
<rect x="60" y="580" width="1080" height="52" rx="12" fill="#fff7e6"/>
<text x="84" y="613" font-size="18" fill="#7a5314">予約日・書類は自治体ごとに異なります。ケルン市の個別ページは前年度表示のため、最新案内を確認してください。</text>
<text x="60" y="656" font-size="16" fill="#6b7e8e">出典：NRW Serviceportal、デュッセルドルフ市、ケルン市｜2026年11月12日確認</text>
</g>
</svg>