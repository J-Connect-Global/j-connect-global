<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">外務省の注意喚起：3つのポイント</title><desc id="d">抗議の現場に近づかない、人が多く集まる場所で撮影しない、在留届またはたびレジに登録しておく、の3点を示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452">外務省の注意喚起：3つのポイント</text><text x="60" y="145" font-size="24" fill="#405a71">広域情報「欧州での抗議活動を受けた注意喚起」（2026年10月21日）</text><rect x="60" y="190" width="340" height="360" rx="20" fill="white"/><rect x="60" y="190" width="340" height="66" rx="20" fill="#b5473a"/><rect x="60" y="236" width="340" height="20" fill="#b5473a"/><text x="85" y="235" font-size="28" font-weight="700" fill="white">1. 近づかない</text><text x="85" y="310" font-size="24" fill="#29465f">抗議の現場には</text><text x="85" y="350" font-size="24" fill="#29465f">不用意に近づかない</text><text x="85" y="410" font-size="24" fill="#29465f">遭遇したら</text><text x="85" y="450" font-size="24" fill="#29465f">すぐに離れる</text><rect x="430" y="190" width="340" height="360" rx="20" fill="white"/><rect x="430" y="190" width="340" height="66" rx="20" fill="#c9952a"/><rect x="430" y="236" width="340" height="20" fill="#c9952a"/><text x="455" y="235" font-size="28" font-weight="700" fill="white">2. 撮らない</text><text x="455" y="310" font-size="24" fill="#29465f">人が多く集まる場所で</text><text x="455" y="350" font-size="24" fill="#29465f">スマートフォン等での</text><text x="455" y="390" font-size="24" fill="#29465f">撮影は行わない</text><rect x="800" y="190" width="340" height="360" rx="20" fill="white"/><rect x="800" y="190" width="340" height="66" rx="20" fill="#2f8a64"/><rect x="800" y="236" width="340" height="20" fill="#2f8a64"/><text x="825" y="235" font-size="28" font-weight="700" fill="white">3. 登録しておく</text><text x="825" y="310" font-size="24" fill="#29465f">在留者：在留届</text><text x="825" y="350" font-size="24" fill="#29465f">旅行者：たびレジ</text><text x="825" y="410" font-size="24" fill="#29465f">家族や職場に日程と</text><text x="825" y="450" font-size="24" fill="#29465f">連絡先を伝える</text><text x="60" y="610" font-size="22" fill="#405a71">※国ごとの危険レベルの引き上げではなく、注意喚起の位置づけです</text></g></svg>
