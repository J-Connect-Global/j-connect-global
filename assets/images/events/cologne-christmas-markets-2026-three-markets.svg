<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルンの3つの主なクリスマスマーケットの違い</title><desc id="d">大聖堂前は大聖堂を見上げる広場で大きなツリーと光の天蓋、舞台の催しがある。天使の市場はノイマルクト広場で星の灯りと手仕事の品。旧市街は小人の伝説がテーマで、ホイマルクトにスケートリンクがあることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ケルン：会場ごとに違う3つの表情</text><text x="60" y="134" font-size="22" fill="#405a71">その日の気分で選ぶと楽しみやすい</text><rect x="60" y="170" width="340" height="440" rx="16" fill="white"/><rect x="60" y="170" width="340" height="10" rx="5" fill="#b5473a"/><g transform="translate(230.0 275)"><g fill="#b5473a"><rect x="-55" y="-20" width="34" height="80"/><path d="M-55 -18 L-38 -70 L-21 -18 Z"/><rect x="21" y="-20" width="34" height="80"/><path d="M21 -18 L38 -70 L55 -18 Z"/><rect x="-21" y="5" width="42" height="55"/><path d="M-21 6 L0 -20 L21 6 Z"/></g></g><text x="230.0" y="385" font-size="28" font-weight="700" fill="#b5473a" text-anchor="middle">大聖堂前</text><text x="230.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">大聖堂を見上げる広場</text><text x="230.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">大きなツリーと光の天蓋</text><text x="230.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">舞台で合唱やバンド</text><rect x="430" y="170" width="340" height="440" rx="16" fill="white"/><rect x="430" y="170" width="340" height="10" rx="5" fill="#a8861a"/><g transform="translate(600.0 275)"><g fill="#c9a227"><path d="M0 -55 l14 30 33 4 -24 22 7 33 -30 -17 -30 17 7 -33 -24 -22 33 -4 Z"/><line x1="0" y1="-75" x2="0" y2="-55" stroke="#c9a227" stroke-width="3"/><circle cx="-60" cy="30" r="8"/><circle cx="60" cy="30" r="8"/><circle cx="-45" cy="-35" r="5"/><circle cx="48" cy="-38" r="5"/></g></g><text x="600.0" y="385" font-size="28" font-weight="700" fill="#a8861a" text-anchor="middle">天使の市場</text><text x="600.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">ノイマルクト広場</text><text x="600.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">枝に吊るされた星の灯り</text><text x="600.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">手仕事の品をゆっくり</text><rect x="800" y="170" width="340" height="440" rx="16" fill="white"/><rect x="800" y="170" width="340" height="10" rx="5" fill="#2f6a40"/><g transform="translate(970.0 275)"><g><path d="M-30 -10 L0 -75 L30 -10 Z" fill="#2f6a40"/><circle cx="0" cy="8" r="24" fill="#f1d7b8"/><path d="M-26 18 Q0 70 26 18 Z" fill="#f6efe6" stroke="#d9cfc3"/><rect x="-28" y="40" width="56" height="22" rx="8" fill="#8d5a3c"/><circle cx="-8" cy="4" r="3" fill="#153452"/><circle cx="8" cy="4" r="3" fill="#153452"/></g></g><text x="970.0" y="385" font-size="28" font-weight="700" fill="#2f6a40" text-anchor="middle">旧市街</text><text x="970.0" y="432" font-size="21" fill="#405a71" text-anchor="middle">アルター・マルクトほか</text><text x="970.0" y="468" font-size="21" fill="#405a71" text-anchor="middle">夜に働く小人の伝説</text><text x="970.0" y="504" font-size="21" fill="#405a71" text-anchor="middle">ホイマルクトのスケート</text><text x="60" y="645" font-size="18" fill="#405a71">各会場の内容は年によって変わる。主催者の案内で確認（2026年10月30日参照）</text></g></svg>