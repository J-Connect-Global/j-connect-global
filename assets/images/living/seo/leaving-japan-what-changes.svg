<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>海外転出で扱いが変わるもの</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">海外転出届を出すと変わること</text><text x="48" y="152" font-size="23" fill="#52666C">1年以上海外に住む場合。日本の会社からの派遣は扱いが異なることがある</text><rect x="308" y="176" width="388" height="50" rx="10" fill="#173B48"/><text x="324" y="210" font-size="24" fill="#FFFFFF">どうなるか</text><rect x="708" y="176" width="432" height="50" rx="10" fill="#146859"/><text x="724" y="210" font-size="24" fill="#FFFFFF">すること</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="270" font-size="24" fill="#52666C">国民年金</text><text x="324" y="270" font-size="26" fill="#173B48">加入の義務がなくなる</text><text x="724" y="270" font-size="26" fill="#173B48">任意加入するか決める</text><rect x="48" y="290" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="330" font-size="24" fill="#52666C">国民健康保険</text><text x="324" y="330" font-size="26" fill="#C2410C">資格がなくなる</text><text x="724" y="330" font-size="26" fill="#173B48">脱退して保険証などを返す</text><rect x="48" y="350" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="390" font-size="24" fill="#52666C">住民税</text><text x="324" y="390" font-size="26" fill="#173B48">1月1日の住所で決まる</text><text x="724" y="390" font-size="26" fill="#173B48">納税管理人を届け出るか一括で払う</text><rect x="48" y="410" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="450" font-size="24" fill="#52666C">マイナンバーカード</text><text x="324" y="450" font-size="26" fill="#173B48">手続きしないと失効</text><text x="724" y="450" font-size="26" fill="#173B48">転出の前日までに継続利用の手続き</text><rect x="48" y="470" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="510" font-size="24" fill="#52666C">運転免許</text><text x="324" y="510" font-size="26" fill="#173B48">海外から更新できない</text><text x="724" y="510" font-size="26" fill="#173B48">期限が近ければ出国前に更新</text><rect x="48" y="530" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="570" font-size="24" fill="#52666C">日本の児童手当</text><text x="324" y="570" font-size="26" fill="#173B48">日本に住む子どもが対象</text><text x="724" y="570" font-size="26" fill="#173B48">終了の手続き</text><text x="48" y="622" font-size="22" fill="#173B48">ドイツの健康保険への加入は、どの滞在許可でも条件です。到着直後の保険も準備を。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：日本学生支援機構・マイナンバーカード総合サイトの案内  |  2026-11-06</text></g></svg>