name: One-time editorial SVG visual QA for body media wave 3
on:
  push:
    branches: [codex/article-body-media-wave3-20261123]
    paths: [.github/workflows/body-media-wave3-preview.yml]
permissions:
  contents: write
jobs:
  render-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Japanese SVG rasterization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user 'CairoSVG>=2.7,<3' 'Pillow>=11,<13'
      - name: Check and render three editorial SVGs
        shell: bash
        run: |
          mkdir -p docs/_qa/body-media-wave3
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import cairosvg
          from PIL import Image
          from pathlib import Path
          paths = [
            "assets/images/events/dresden-striezelmarkt-symbols.svg",
            "assets/images/events/winter-humidity-temperature-guide.svg",
            "assets/images/events/stosslueften-vs-kipplueften.svg"
          ]
          for path in paths:
              root=ET.parse(path).getroot()
              if root.attrib.get("viewBox")!="0 0 1200 675":raise ValueError("Unexpected viewBox "+path)
              if len(root.findall("{http://www.w3.org/2000/svg}title"))!=1:raise ValueError("Missing SVG title "+path)
              if len(root.findall("{http://www.w3.org/2000/svg}desc"))!=1:raise ValueError("Missing SVG description "+path)
              out=Path("docs/_qa/body-media-wave3")/(Path(path).stem+".png")
              cairosvg.svg2png(url=path,write_to=str(out),output_width=1200,output_height=675)
              with Image.open(out) as img:
                  if img.size != (1200,675):raise ValueError("Render failed "+path)
                  print("RENDER_OK",out,img.size,out.stat().st_size,flush=True)
          PY
      - name: Commit QA previews only on the review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_qa/body-media-wave3/*.png
          git diff --cached --quiet && exit 0
          git commit -m "qa: render three Japanese inline infographics for pixel inspection"
          git push origin "HEAD:refs/heads/codex/article-body-media-wave3-20261123"

