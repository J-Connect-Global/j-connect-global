<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">THG-Quoteを仲介事業者経由で申請する流れ</title>
  <desc id="desc">車両と2026年分の未申告を確認し、一つの仲介事業者を選び、車両登録証明書を提出する。事業者が環境庁へ申告し、証明書を燃料事業者へ販売した後、契約に従って車両所有者へ支払う。環境庁は個人へ賞金を直接支払わない。</desc>
  <rect width="1200" height="675" rx="28" fill="#f5f7fa"/>
  <text x="72" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#152238">申請から支払いまで</text>
  <text x="72" y="136" font-family="Arial,sans-serif" font-size="23" fill="#4b5d73">仲介事業者を利用する場合の一般的な流れ</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="205" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="110" cy="245" r="22" fill="#2b6cb0"/><text x="110" y="253" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="148" y="247" font-size="23" font-weight="700" fill="#18324f">車両を確認</text>
    <text x="104" y="286" font-size="18" fill="#52647a">純BEV・登録名義・未申告</text>
    <rect x="445" y="205" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="483" cy="245" r="22" fill="#2b6cb0"/><text x="483" y="253" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="521" y="247" font-size="23" font-weight="700" fill="#18324f">事業者を一社選ぶ</text>
    <text x="477" y="286" font-size="18" fill="#52647a">期限・保証額・手数料を確認</text>
    <rect x="818" y="205" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="856" cy="245" r="22" fill="#2b6cb0"/><text x="856" y="253" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="894" y="247" font-size="23" font-weight="700" fill="#18324f">書類を提出</text>
    <text x="850" y="286" font-size="18" fill="#52647a">車両登録証明書の画像</text>
    <path d="M382 261 H435 M755 261 H808" stroke="#60758d" stroke-width="5" stroke-linecap="round"/>
    <path d="M427 250 L440 261 L427 272 M800 250 L813 261 L800 272" fill="none" stroke="#60758d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="818" y="395" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="856" cy="435" r="22" fill="#65758b"/><text x="856" y="443" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="894" y="437" font-size="23" font-weight="700" fill="#18324f">環境庁が審査</text>
    <text x="850" y="476" font-size="18" fill="#52647a">電力量と削減量を証明</text>
    <rect x="445" y="395" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="483" cy="435" r="22" fill="#65758b"/><text x="483" y="443" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="521" y="437" font-size="23" font-weight="700" fill="#18324f">証明書を販売</text>
    <text x="477" y="476" font-size="18" fill="#52647a">燃料事業者へ移転</text>
    <rect x="72" y="395" width="310" height="112" rx="18" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
    <circle cx="110" cy="435" r="22" fill="#2f855a"/><text x="110" y="443" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
    <text x="148" y="437" font-size="23" font-weight="700" fill="#18324f">契約に従い支払い</text>
    <text x="104" y="476" font-size="18" fill="#52647a">事業者から車両所有者へ</text>
    <path d="M973 317 V385 M818 451 H765 M445 451 H392" stroke="#60758d" stroke-width="5" stroke-linecap="round"/>
    <path d="M962 377 L973 390 L984 377 M777 440 L764 451 L777 462 M404 440 L391 451 L404 462" fill="none" stroke="#60758d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="72" y="558" width="1056" height="70" rx="16" fill="#e8eef5"/>
  <text x="100" y="602" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263b53">環境庁は賞金を直接支払いません。受取額と手数料の扱いは契約で確認。</text>
</svg>