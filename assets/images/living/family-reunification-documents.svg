<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">家族の呼び寄せの書類</title><desc id="d">家族の滞在許可の申請では、家族側はパスポートと写真、住民登録の証明、婚姻証明書や出生証明書、健康保険の証明、呼び寄せる人側は滞在許可、収入の証明、賃貸契約書などがよく求められ、外国人局によって違うことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">家族の滞在許可の申請で、よく求められる書類</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">必要な書類は外国人局によって違うので、事前に確認する</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">家族（申請する人）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">パスポート・証明写真</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">住民登録の証明</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">婚姻証明書・出生証明書</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">（訳やアポスティーユが必要なことも）</text><text x="95" y="533" font-size="20" fill="#29465f" text-anchor="start">健康保険の証明</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">呼び寄せる人</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">滞在許可（カード）</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">雇用契約・給与の証明</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">住まいの賃貸契約書</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">（家族が住める広さか）</text><text x="645" y="533" font-size="20" fill="#29465f" text-anchor="start">パスポート</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦移民難民庁、Make it in Germany（2026年10月29日参照）</text></g></svg>