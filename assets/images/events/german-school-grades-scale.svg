<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツの学校の成績の6段階</title><desc id="d">ドイツの学校の成績は1がとてもよい、2がよい、3が満足できる、4が足りている、5が不十分な点が多い、6が不十分の6段階で、4までが合格ライン、日本とは数字の向きが逆であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f6f8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツの成績：1が一番よい</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">NRW州学校法 第48条の6段階</text><rect x="60" y="190" width="165" height="250" rx="16" fill="#2f8a64"/><text x="142" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">1</text><text x="142" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">とてもよい</text><rect x="240" y="190" width="165" height="250" rx="16" fill="#6fae6a"/><text x="322" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">2</text><text x="322" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">よい</text><rect x="420" y="190" width="165" height="250" rx="16" fill="#c9b04f"/><text x="502" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">3</text><text x="502" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">満足できる</text><rect x="600" y="190" width="165" height="250" rx="16" fill="#e0a040"/><text x="682" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">4</text><text x="682" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">足りている</text><rect x="780" y="190" width="165" height="250" rx="16" fill="#d7703a"/><text x="862" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">5</text><text x="862" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">不十分な点が多い</text><rect x="960" y="190" width="165" height="250" rx="16" fill="#b5473a"/><text x="1042" y="320" font-size="96" font-weight="700" fill="white" text-anchor="middle">6</text><text x="1042" y="400" font-size="19" font-weight="700" fill="white" text-anchor="middle">不十分</text><rect x="60" y="460" width="705" height="12" rx="6" fill="#2f8a64"/><text x="412" y="505" font-size="22" font-weight="700" fill="#2f8a64" text-anchor="middle">ここまでが合格ライン（4まで）</text><rect x="780" y="460" width="345" height="12" rx="6" fill="#b5473a"/><text x="952" y="505" font-size="20" font-weight="700" fill="#b5473a" text-anchor="middle">求められることにこたえていない</text><rect x="60" y="535" width="1080" height="58" rx="12" fill="#fff7e6"/><text x="600" y="572" font-size="19" fill="#8a5a00" text-anchor="middle">日本の5段階評価とは数字の向きが逆。小学校1・2年生では数字の成績を付けない（NRW）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：NRW州学校法 第48条、NRW州学校省（2026年10月29日参照）</text></g></svg>