<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">任意の申告の期限</title><desc id="d">自分から出す確定申告は4年以内が期限で、2022年分は2026年12月31日、2023年分は2027年12月31日、2024年分は2028年12月31日、2025年分は2029年12月31日までであることを示した表</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">自分から出す確定申告は「4年以内」</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">期限の日までに税務署に届いている必要がある（延長不可）</text><rect x="60" y="185" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="185" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="224" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2022年分</text><text x="1110" y="225" font-size="26" font-weight="700" fill="#b5473a" text-anchor="end">2026年12月31日まで</text><rect x="60" y="257" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="257" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="296" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2023年分</text><text x="1110" y="297" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">2027年12月31日まで</text><rect x="60" y="329" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="329" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="368" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2024年分</text><text x="1110" y="369" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">2028年12月31日まで</text><rect x="60" y="401" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="401" width="10" height="62" rx="5" fill="#2d6a9f"/><text x="95" y="440" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2025年分</text><text x="1110" y="441" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">2029年12月31日まで</text><rect x="60" y="480" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="525" font-size="26" font-weight="700" fill="#8a5a00" text-anchor="start">2022年分は今年が最後のチャンス</text><text x="90" y="565" font-size="21" fill="#29465f" text-anchor="start">ELSTERの登録には2週間ほどかかることも。11月中に準備を</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：NRW州財務行政、ELSTER（2026年10月29日参照）</text></g></svg>