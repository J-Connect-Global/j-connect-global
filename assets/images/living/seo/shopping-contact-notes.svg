<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>買い物で困ったら、状況を具体的に</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">買い物で困ったら、状況を具体的に</text><text x="48" y="178" font-size="27" fill="#52666C">店頭と通販で、確認することを分ける</text><rect x="48" y="209" width="1104" height="172" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="172" rx="18" fill="#146859"/><text x="81" y="264" font-size="38" fill="#173B48">店頭：商品・レシート・希望する対応</text><text x="81" y="312" font-size="33" fill="#52666C">返品・交換・不良品を伝える</text><rect x="48" y="397" width="1104" height="172" rx="18" fill="#FFFFFF"/><rect x="48" y="397" width="12" height="172" rx="18" fill="#146859"/><text x="81" y="452" font-size="38" fill="#173B48">通販：注文番号・追跡番号・未着の範囲</text><text x="81" y="500" font-size="33" fill="#52666C">箱の未着か、中身の不足かを区別する</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  2026-10-19</text></g></svg>