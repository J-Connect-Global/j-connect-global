<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日独社会保障協定</title><desc id="d">日本の会社から5年以内の予定で派遣される人は適用証明書で日本の年金だけに入り、現地採用の人はドイツの年金に入り、両国の加入期間は年金を受け取る資格の判断で合わせて数えられることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日独社会保障協定：どちらの年金に入る？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">働き方によって入る年金が決まる</text><rect x="60" y="175" width="530" height="330" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">日本の会社から派遣（5年以内の予定）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">日本の年金だけに入る</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">会社が日本で「適用証明書」を申請</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">ドイツの勤務先に出す</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">ドイツの年金の保険料は不要</text><rect x="610" y="175" width="530" height="330" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#c9952a"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#c9952a"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">ドイツの会社に現地採用</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">ドイツの年金に入る</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">給与から保険料が引かれる</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">ドイツでの加入期間の分は</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">将来ドイツから年金として受け取る</text><rect x="60" y="525" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="561" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">加入期間は「通算」できる</text><text x="90" y="595" font-size="21" fill="#29465f" text-anchor="start">年金を受け取る資格の判断では、日本とドイツの加入期間を合わせて数えます</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：日本年金機構、在外公館（2026年10月29日参照）</text></g></svg>