<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">翻訳を頼む前に、提出先へ聞く3つのこと</title><desc id="d">翻訳者の資格、原本かコピーか、アポスティーユなどの認証の要否の3点を、翻訳を頼む前に提出先に確認することを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="90" font-size="40" font-weight="700" fill="#153452">翻訳を頼む前に、提出先へ聞く3つのこと</text>
<text x="60" y="135" font-size="24" fill="#3c5a78">答えによって、翻訳者の選び方と準備の順番が変わります</text>
<rect x="60" y="190" width="347" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="100" cy="238" r="24" fill="#1f5f99"/><text x="100" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="302" font-size="22" font-weight="700" fill="#153452">翻訳者の資格</text>
<text x="80" y="370" font-size="20" fill="#2b4560">ドイツの州の裁判所に認定さ</text>
<text x="80" y="400" font-size="20" fill="#2b4560">れた翻訳者の訳が必要か。自</text>
<text x="80" y="430" font-size="20" fill="#2b4560">分の訳や国外の訳でもよいか</text>
<rect x="427" y="190" width="347" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="467" cy="238" r="24" fill="#1f5f99"/><text x="467" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="447" y="302" font-size="22" font-weight="700" fill="#153452">原本かコピーか</text>
<text x="447" y="370" font-size="20" fill="#2b4560">翻訳の元は原本か、コピーで</text>
<text x="447" y="400" font-size="20" fill="#2b4560">よいか。提出するのは原本か、</text>
<text x="447" y="430" font-size="20" fill="#2b4560">認証付きの写しか</text>
<rect x="793" y="190" width="347" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="833" cy="238" r="24" fill="#1f5f99"/><text x="833" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="813" y="302" font-size="22" font-weight="700" fill="#153452">認証の要否</text>
<text x="813" y="370" font-size="20" fill="#2b4560">発行国の書類にアポスティー</text>
<text x="813" y="400" font-size="20" fill="#2b4560">ユなどの認証が要るか。紙と</text>
<text x="813" y="430" font-size="20" fill="#2b4560">電子発行で違うか。認証部分</text>
<text x="813" y="460" font-size="20" fill="#2b4560">も訳すか</text>
<text x="60" y="645" font-size="20" fill="#3c5a78">図解：J-Connect編集部。答えは窓口と書類の種類によって変わります。</text></g></svg>