<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>児童手当の申請の流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">児童手当の申請の流れ</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">住民登録をして税番号を受け取る</text><text x="128" y="213" font-size="20" fill="#52666C">親と子どもの税番号が必要</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">家族手当金庫にオンラインで申請</text><text x="128" y="303" font-size="20" fill="#52666C">申請書と子ども1人ごとの付表</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">書類を添付する</text><text x="128" y="393" font-size="20" fill="#52666C">滞在許可・出生証明書・在学証明（18歳以上）</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">決定の通知と児童手当番号</text><text x="128" y="483" font-size="20" fill="#52666C">番号の末尾で毎月の支給日が決まる</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">毎月の振り込み</text><text x="128" y="573" font-size="20" fill="#52666C">変化があればすぐに届け出る</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">申請の期限</text><text x="788" y="268" font-size="32" fill="#173B48">さかのぼれる</text><text x="788" y="312" font-size="32" fill="#173B48">のは6か月</text><text x="788" y="372" font-size="21" fill="#52666C">申請が届いた月の前6か月分</text><text x="788" y="404" font-size="21" fill="#52666C">までしか支給されません</text><text x="788" y="436" font-size="21" fill="#52666C">引っ越してきたら、税番号が</text><text x="788" y="468" font-size="21" fill="#52666C">届き次第すぐに申請を</text><text x="788" y="500" font-size="21" fill="#52666C">2026年は月259ユーロ</text><text x="48" y="622" font-size="22" fill="#173B48">2027年からドイツで生まれた子どもは申請なしの支給が段階的に始まる予定です。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：所得税法第63条・第66条・第67条・第70条  |  2026-11-06</text></g></svg>