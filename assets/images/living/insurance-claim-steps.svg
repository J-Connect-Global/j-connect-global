<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">事故のときの手順</title><desc id="d">事故が起きたときは、写真を撮る、相手の名前と連絡先を控える、保険会社に連絡する、修理の見積もりや領収書を保存する、という4つの手順を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">事故が起きたら：4つの手順</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">人や物を傷つけてしまったとき・家財が壊れたとき</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#2f8a64"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">写真を撮る</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">壊れた物や</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">現場の様子を</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">残す</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#2f8a64"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">連絡先を控える</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">相手の名前・</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">住所・電話を</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">聞いておく</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#2f8a64"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">保険会社へ</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">できるだけ早く</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">アプリや電話で</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">知らせる</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#2f8a64"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">書類を保存</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">修理の見積もりや</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">領収書を</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">捨てない</text><rect x="60" y="530" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="566" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">自分で「全部払います」と約束しない</text><text x="90" y="600" font-size="21" fill="#29465f" text-anchor="start">責任の判断は保険会社がします。まず保険会社に相談を</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センターなど（2026年10月29日参照）</text></g></svg>