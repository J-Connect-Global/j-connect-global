<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルンの主なクリスマスマーケットの2026年の期間</title><desc id="d">大聖堂前と天使の市場は2026年11月16日から12月23日まで、11月22日は休業。旧市街の市は11月23日開始予定で、スケートリンクのある会場は2027年1月10日まで続く予定であることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ケルンの主な市：2026年の期間</text><text x="60" y="134" font-size="22" fill="#405a71">大聖堂前と天使の市場は11月16日から。11月22日は休業</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="371" y1="200" x2="371" y2="560" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="371" y="592" font-size="20" fill="#405a71" text-anchor="middle">11/16</text><line x1="467" y1="200" x2="467" y2="560" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="467" y="592" font-size="20" fill="#405a71" text-anchor="middle">11/23</text><line x1="577" y1="200" x2="577" y2="560" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="577" y="592" font-size="20" fill="#405a71" text-anchor="middle">12/1</text><line x1="879" y1="200" x2="879" y2="560" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="879" y="592" font-size="20" fill="#405a71" text-anchor="middle">12/23</text><line x1="1126" y1="200" x2="1126" y2="560" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="1126" y="592" font-size="20" fill="#405a71" text-anchor="middle">1/10</text><text x="90" y="252" font-size="26" font-weight="700" fill="#153452">大聖堂前</text><text x="90" y="282" font-size="18" fill="#405a71">ロンカリ広場</text><rect x="371" y="230" width="522" height="44" rx="10" fill="#b5473a"/><rect x="454" y="226" width="14" height="52" fill="white"/><text x="460" y="306" font-size="17" fill="#b5473a" text-anchor="middle">22日休業</text><text x="90" y="362" font-size="26" font-weight="700" fill="#153452">天使の市場</text><text x="90" y="392" font-size="18" fill="#405a71">ノイマルクト</text><rect x="371" y="340" width="522" height="44" rx="10" fill="#c9a227"/><rect x="454" y="336" width="14" height="52" fill="white"/><text x="460" y="416" font-size="17" fill="#b5473a" text-anchor="middle">22日休業</text><text x="90" y="472" font-size="26" font-weight="700" fill="#153452">旧市街</text><text x="90" y="502" font-size="18" fill="#405a71">アルター・マルクトほか</text><rect x="467" y="450" width="426" height="44" rx="10" fill="#2f6a40"/><rect x="893" y="450" width="247" height="44" rx="10" fill="none" stroke="#2f6a40" stroke-width="3" stroke-dasharray="8 6"/><text x="1016" y="526" font-size="17" fill="#2f6a40" text-anchor="middle">スケート場の会場は1/10まで（予定）</text><text x="60" y="645" font-size="18" fill="#405a71">旧市街の日程は案内による。会場ごとの最新情報は主催者の案内で確認（2026年10月30日参照）</text></g></svg>