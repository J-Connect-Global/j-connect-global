<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ドレスデン・シュトリーツェルマルクトの3つの象徴</title>
<desc id="desc">ドレスデンの伝統菓子シュトレンの金色の認証シール、約14.6メートルの木製クリスマスピラミッド、2026年12月5日開催のシュトレン祭りを、3枚の精緻な編集図解で紹介。イメージ図であり会場の現物写真ではない。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f7f0"/><stop offset="1" stop-color="#eae6dd"/></linearGradient>
 <linearGradient id="crumb" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6dba1"/><stop offset=".62" stop-color="#bd8145"/><stop offset="1" stop-color="#85552f"/></linearGradient>
 <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d0a36d"/><stop offset="1" stop-color="#7b4325"/></linearGradient>
 <linearGradient id="cake" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff9e6"/><stop offset="1" stop-color="#e8d4ac"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#423e30" flood-opacity=".13"/></filter>
 <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1" fill="#9c957e" opacity=".15"/><circle cx="17" cy="19" r="1" fill="#9c957e" opacity=".10"/></pattern>
</defs>
