<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">2022年分の任意申告の期限</title>
<desc id="desc">ドイツの2022年分の任意所得税申告は、州税務当局の案内では2026年12月31日が期限です。義務申告とは別に確認する必要があります。</desc>
<rect width="1200" height="620" rx="28" fill="#f3f6f9"/>
<rect x="64" y="60" width="1072" height="500" rx="28" fill="#ffffff" stroke="#c8d2dc" stroke-width="3"/>
<text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263746">ドイツの所得税申告</text>
<rect x="120" y="170" width="430" height="280" rx="24" fill="#edf4fa" stroke="#2e6688" stroke-width="3"/>
<text x="335" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2e6688">2022年分</text>
<text x="335" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#263746">任意申告</text>
<text x="335" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#263746">12月31日</text>
<text x="335" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#263746">2026年</text>
<rect x="620" y="170" width="430" height="280" rx="24" fill="#fff4e5" stroke="#b97722" stroke-width="3"/>
<text x="835" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8a5519">注意</text>
<text x="835" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263746">義務申告は別ルール</text>
<text x="835" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263746">まず申告義務の有無を確認</text>
<text x="835" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263746">期限直前まで待たず提出準備</text>
<text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526474">出典：ノルトライン＝ヴェストファーレン州税務当局の公式案内</text>
</svg>