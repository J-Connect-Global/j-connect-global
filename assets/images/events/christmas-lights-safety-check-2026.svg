<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">冬の飾りの安全点検</title><desc id="desc">クリスマスツリーと電飾、ろうそく、コンセントを点検する四つの項目を示す編集部作成の図解</desc><rect width="1200" height="675" fill="#f4f1e9"/><text x="70" y="94" font-size="48" font-family="sans-serif" fill="#173e3c" font-weight="bold">冬の飾り、4つの安全点検</text><g font-family="sans-serif" font-size="32" fill="#173e3c"><rect x="70" y="140" width="500" height="175" rx="20" fill="#dce9df"/><text x="102" y="205">① ろうそく</text><text x="102" y="258" font-size="24">目を離さず、燃える物から離す</text><rect x="630" y="140" width="500" height="175" rx="20" fill="#e5e4d3"/><text x="662" y="205">② 電飾</text><text x="662" y="258" font-size="24">破損と安全表示を確認</text><rect x="70" y="345" width="500" height="175" rx="20" fill="#e5e4d3"/><text x="102" y="410">③ 屋外利用</text><text x="102" y="463" font-size="24">屋外対応・防水等級を確認</text><rect x="630" y="345" width="500" height="175" rx="20" fill="#dce9df"/><text x="662" y="410">④ 緊急時</text><text x="662" y="463" font-size="24">避難して消防へ112</text></g><text x="72" y="604" font-family="sans-serif" font-size="22" fill="#435b58">出典：ドイツ消防協会・消費者センター・VDE｜編集部作成（2026年11月24日）</text></svg>