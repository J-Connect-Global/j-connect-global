<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>日本国籍の親が児童手当を受け取れる滞在許可</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">児童手当　日本国籍の親は滞在許可で決まる</text><text x="48" y="152" font-size="23" fill="#52666C">夫婦のどちらか一方が条件を満たせば、その人が申請できる</text><rect x="448" y="176" width="208" height="50" rx="10" fill="#173B48"/><text x="464" y="210" font-size="24" fill="#FFFFFF">児童手当</text><rect x="668" y="176" width="472" height="50" rx="10" fill="#146859"/><text x="684" y="210" font-size="24" fill="#FFFFFF">補足</text><text x="64" y="210" font-size="22" fill="#52666C">滞在許可</text><rect x="48" y="230" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="270" font-size="24" fill="#52666C">永住許可・EU長期滞在許可</text><text x="464" y="270" font-size="26" fill="#173B48">対象</text><text x="684" y="270" font-size="26" fill="#173B48">期限のない許可</text><rect x="48" y="290" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="330" font-size="24" fill="#52666C">EUブルーカード・ICTカード</text><text x="464" y="330" font-size="26" fill="#173B48">対象</text><text x="684" y="330" font-size="26" fill="#173B48">企業内転勤も含む</text><rect x="48" y="350" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="390" font-size="24" fill="#52666C">就労できる滞在許可（6か月以上）</text><text x="464" y="390" font-size="26" fill="#173B48">対象</text><text x="684" y="390" font-size="26" fill="#173B48">日本国籍者向けの就労許可など</text><rect x="48" y="410" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="450" font-size="24" fill="#52666C">家族の呼び寄せ（就労可）</text><text x="464" y="450" font-size="26" fill="#173B48">対象</text><text x="684" y="450" font-size="26" fill="#173B48">多くの配偶者が該当</text><rect x="48" y="470" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="510" font-size="24" fill="#52666C">大学の留学</text><text x="464" y="510" font-size="26" fill="#C2410C">対象外</text><text x="684" y="510" font-size="26" fill="#173B48">配偶者が条件を満たせば可</text><rect x="48" y="530" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="570" font-size="24" fill="#52666C">チャンスカード・卒業後の求職</text><text x="464" y="570" font-size="26" fill="#C2410C">対象外</text><text x="684" y="570" font-size="26" fill="#173B48">仕事が決まり許可が変われば対象</text><text x="48" y="622" font-size="22" fill="#173B48">子どもは原則としてドイツかEU・欧州経済領域の国に住んでいることが条件です。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：所得税法第62条第2項・第63条  |  2026-11-06</text></g></svg>