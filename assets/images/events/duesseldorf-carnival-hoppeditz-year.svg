<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ホッペディッツの1年</title><desc id="d">11月11日11時11分にマスタードの壺から目覚め、演説で市政を皮肉り、市長が市庁舎のバルコニーから応える。2月の街頭カーニバルでシーズンが最高潮になり、灰の水曜日にかつてはわら人形を燃やす「お葬式」が行われ、次の11月11日まで眠ることを示す循環図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" fill="#153452" font-weight="700">ホッペディッツの1年</text><text x="60" y="132" font-size="22" fill="#405a71">デュッセルドルフの道化は、毎年目覚めては眠りにつく</text><circle cx="600" cy="382" r="160" fill="none" stroke="#d9cfc3" stroke-width="10" stroke-dasharray="2 18" stroke-linecap="round"/><circle cx="600" cy="382" r="70" fill="#ffd166"/><text x="600" y="376" font-size="20" fill="#153452" font-weight="700" text-anchor="middle">道化の</text><text x="600" y="404" font-size="20" fill="#153452" font-weight="700" text-anchor="middle">ホッペディッツ</text><rect x="435" y="170" width="330" height="104" rx="14" fill="white" stroke="#2a9d8f" stroke-width="3"/><text x="600.0" y="204.0" font-size="21" fill="#2a9d8f" font-weight="700" text-anchor="middle">11月11日 11時11分</text><text x="600.0" y="232.0" font-size="17" fill="#405a71" text-anchor="middle">マスタードの壺から</text><text x="600.0" y="256.0" font-size="17" fill="#405a71" text-anchor="middle">目を覚ます</text><rect x="700" y="330" width="330" height="104" rx="14" fill="white" stroke="#b5473a" stroke-width="3"/><text x="865.0" y="364.0" font-size="21" fill="#b5473a" font-weight="700" text-anchor="middle">開幕の演説</text><text x="865.0" y="392.0" font-size="17" fill="#405a71" text-anchor="middle">市政や街の出来事を皮肉り</text><text x="865.0" y="416.0" font-size="17" fill="#405a71" text-anchor="middle">市長がバルコニーから応える</text><rect x="435" y="490" width="330" height="104" rx="14" fill="white" stroke="#c1121f" stroke-width="3"/><text x="600.0" y="524.0" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2月の街頭カーニバル</text><text x="600.0" y="552.0" font-size="17" fill="#405a71" text-anchor="middle">女性のカーニバルの日から</text><text x="600.0" y="576.0" font-size="17" fill="#405a71" text-anchor="middle">バラの月曜日の行列まで</text><rect x="170" y="330" width="330" height="104" rx="14" fill="white" stroke="#5c677d" stroke-width="3"/><text x="335.0" y="364.0" font-size="21" fill="#5c677d" font-weight="700" text-anchor="middle">灰の水曜日</text><text x="335.0" y="392.0" font-size="17" fill="#405a71" text-anchor="middle">かつてはわら人形を燃やす</text><text x="335.0" y="416.0" font-size="17" fill="#405a71" text-anchor="middle">「お葬式」でお別れ</text><path d="M-14 -12 L14 0 L-14 12 Z" fill="#153452" transform="translate(713 269) rotate(45)"/><path d="M-14 -12 L14 0 L-14 12 Z" fill="#153452" transform="translate(713 495) rotate(135)"/><path d="M-14 -12 L14 0 L-14 12 Z" fill="#153452" transform="translate(487 495) rotate(225)"/><path d="M-14 -12 L14 0 L-14 12 Z" fill="#153452" transform="translate(487 269) rotate(315)"/><text x="60" y="650" font-size="16" fill="#405a71">出典：デュッセルドルフ・カーニバル委員会（CC）、デュッセルドルフ観光局、デュッセルドルフ市（2026年10月31日参照）</text></g></svg>