<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">水道水を安心して飲むための習慣</title><desc id="d">配管に4時間以上たまった水は冷たくなるまで流してから使う、流した水は植物や掃除に使う、1973年より前の古い建物では鉛管の有無を確認する、分からなければ大家さんや保健所に相談する、という手順と、2026年の鉛管禁止、2028年の基準値引き下げを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">水道水を安心して飲むための習慣</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦環境庁がすすめる、毎日の小さな手順</text><rect x="60" y="185" width="530" height="150" rx="16" fill="white"/><circle cx="120" cy="260" r="36" fill="#2d6a9f"/><text x="120" y="273" font-size="34" font-weight="700" fill="white" text-anchor="middle">1</text><text x="175" y="250" font-size="26" font-weight="700" fill="#153452" text-anchor="start">4時間以上たまった水は</text><text x="175" y="293" font-size="21" fill="#405a71" text-anchor="start">朝や旅行の後は、まず流す</text><rect x="610" y="185" width="530" height="150" rx="16" fill="white"/><circle cx="670" cy="260" r="36" fill="#2f8a64"/><text x="670" y="273" font-size="34" font-weight="700" fill="white" text-anchor="middle">2</text><text x="725" y="250" font-size="26" font-weight="700" fill="#153452" text-anchor="start">冷たくなるまで流す</text><text x="725" y="293" font-size="21" fill="#405a71" text-anchor="start">流した水は植物や掃除に</text><rect x="60" y="355" width="530" height="150" rx="16" fill="white"/><circle cx="120" cy="430" r="36" fill="#c9952a"/><text x="120" y="443" font-size="34" font-weight="700" fill="white" text-anchor="middle">3</text><text x="175" y="420" font-size="26" font-weight="700" fill="#153452" text-anchor="start">古い建物は配管を確認</text><text x="175" y="463" font-size="21" fill="#405a71" text-anchor="start">1973年より前の建物は鉛管に注意</text><rect x="610" y="355" width="530" height="150" rx="16" fill="white"/><circle cx="670" cy="430" r="36" fill="#8a5aa8"/><text x="670" y="443" font-size="34" font-weight="700" fill="white" text-anchor="middle">4</text><text x="725" y="420" font-size="26" font-weight="700" fill="#153452" text-anchor="start">分からなければ相談</text><text x="725" y="463" font-size="21" fill="#405a71" text-anchor="start">大家さん・管理会社・保健所へ</text><rect x="60" y="535" width="1080" height="60" rx="14" fill="#fff7e6"/><text x="600" y="574" font-size="21" fill="#8a5a00" text-anchor="middle">2026年1月12日から鉛の水道管は原則禁止。2028年1月12日から鉛の基準値は半分に</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦環境庁、消費者センター（2026年10月27日参照）</text></g></svg>