name: One-time Berlin two-diagram visual QA
on:
  push:
    branches: [codex/article-body-media-wave4-berlin-20261123]
    paths: [.github/workflows/berlin-body-wave4-preview.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user 'CairoSVG>=2.7,<3' 'Pillow>=11,<13'
      - name: Render both Japan-language Berlin illustrations
        shell: bash
        run: |
          mkdir -p docs/_qa/berlin-wave4
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from xml.etree import ElementTree as ET
          import cairosvg
          for stem in ('berlin-christmas-markets-2026-five-markets','berlin-christmas-markets-2026-periods'):
              src=Path('assets/images/events')/(stem+'.svg')
              root=ET.parse(src).getroot()
              assert root.attrib.get('viewBox')=='0 0 1200 675'
              assert root.find('{http://www.w3.org/2000/svg}title') is not None
              assert root.find('{http://www.w3.org/2000/svg}desc') is not None
              out=Path('docs/_qa/berlin-wave4')/(stem+'.png')
              cairosvg.svg2png(url=str(src),write_to=str(out),output_width=1200,output_height=675)
              with Image.open(out) as im: assert im.size==(1200,675)
              print('RENDER_OK',out,out.stat().st_size)
          PY
      - name: Keep preview files only in draft branch until review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_qa/berlin-wave4/*.png
          git diff --cached --quiet && exit 0
          git commit -m "qa: rasterize Berlin market story and date chart for review"
          git push origin "HEAD:refs/heads/codex/article-body-media-wave4-berlin-20261123"

# Re-render after fixing 12/27 date label and Charlottenburg typography.
