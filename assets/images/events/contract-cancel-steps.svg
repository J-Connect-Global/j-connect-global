<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">契約の解約の手順</title><desc id="d">契約を結んだ日と最初の期間を確認し、解約ボタンか文書で通知し、できるだけ早い日付での解約と書き、会社からの確認を保存するという4つの手順を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">契約を解約する4つの手順</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ジム・スマホ・インターネット・サブスクなど</text><rect x="60" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="187" cy="250" r="32" fill="#8a5aa8"/><text x="187" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="187" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">契約を確認</text><text x="187" y="375" font-size="18" fill="#29465f" text-anchor="middle">契約を結んだ日と</text><text x="187" y="403" font-size="18" fill="#29465f" text-anchor="middle">最初の期間を</text><text x="187" y="431" font-size="18" fill="#29465f" text-anchor="middle">確かめる</text><text x="325" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="335" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="462" cy="250" r="32" fill="#8a5aa8"/><text x="462" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="462" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">通知する</text><text x="462" y="375" font-size="18" fill="#29465f" text-anchor="middle">ネット契約は</text><text x="462" y="403" font-size="18" fill="#29465f" text-anchor="middle">解約ボタン</text><text x="462" y="431" font-size="18" fill="#29465f" text-anchor="middle">それ以外は文書で</text><text x="600" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="610" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="737" cy="250" r="32" fill="#8a5aa8"/><text x="737" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="737" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">日付を書く</text><text x="737" y="375" font-size="18" fill="#29465f" text-anchor="middle">「できるだけ早い</text><text x="737" y="403" font-size="18" fill="#29465f" text-anchor="middle">日付で」と</text><text x="737" y="431" font-size="18" fill="#29465f" text-anchor="middle">書いておく</text><text x="875" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="885" y="190" width="255" height="330" rx="16" fill="white"/><circle cx="1012" cy="250" r="32" fill="#8a5aa8"/><text x="1012" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1012" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">確認を保存</text><text x="1012" y="375" font-size="18" fill="#29465f" text-anchor="middle">会社からの</text><text x="1012" y="403" font-size="18" fill="#29465f" text-anchor="middle">解約の確認を</text><text x="1012" y="431" font-size="18" fill="#29465f" text-anchor="middle">保存する</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター（2026年10月29日参照）</text></g></svg>