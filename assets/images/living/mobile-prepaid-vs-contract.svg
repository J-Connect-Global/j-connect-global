<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">プリペイドと契約プラン</title><desc id="d">プリペイドは先払いで身分証があれば使え、契約プランは口座引き落としで最初の期間は最長24か月、その後は1か月前の通知で解約できるという違いを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">プリペイドと契約プラン、どっちにする？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">着いたばかりならプリペイドが手軽</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">プリペイド（Prepaid）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">先にチャージした分だけ使う</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">身分証（パスポート）で本人確認</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">銀行口座がなくても使える</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">契約期間なし</text><text x="95" y="533" font-size="20" fill="#29465f" text-anchor="start">着いたばかりの人・短期の人に</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#2d6a9f"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#2d6a9f"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">契約プラン（Laufzeitvertrag）</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">毎月、口座から引き落とし</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">身分証・ドイツの口座・住所が必要</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">最初の期間は最長24か月</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">その後は1か月前の通知で解約</text><text x="645" y="533" font-size="20" fill="#29465f" text-anchor="start">長く住む人・データを多く使う人に</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：電気通信法、消費者センター（2026年10月29日参照）</text></g></svg>