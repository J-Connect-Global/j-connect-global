<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">NRWの2027年に週末と重なる祝日</title>
  <desc id="desc">メーデー5月1日土曜日、ドイツ統一の日10月3日日曜日、クリスマス12月25日土曜日と26日日曜日の4つを示す。</desc>
  <rect width="1200" height="560" rx="28" fill="#f5f2eb"/>
  <rect x="48" y="42" width="1104" height="476" rx="24" fill="#ffffff" stroke="#d7dedf" stroke-width="2"/>
  <text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="40" font-weight="800">週末と重なる祝日は4日</text>
  <text x="90" y="147" fill="#4f6474" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="21">2027年のNRW州｜別の平日への自動振替を前提にしない</text>
  <g transform="translate(88 184)">
    <rect width="500" height="110" rx="16" fill="#f7efe5" stroke="#ead6bd" stroke-width="2"/>
    <text x="24" y="42" fill="#9a6130" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="25" font-weight="800">5月1日（土）</text>
    <text x="24" y="78" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22">メーデー（労働者の日）</text>
    <rect x="524" width="500" height="110" rx="16" fill="#f7efe5" stroke="#ead6bd" stroke-width="2"/>
    <text x="548" y="42" fill="#9a6130" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="25" font-weight="800">10月3日（日）</text>
    <text x="548" y="78" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22">ドイツ統一の日</text>
    <rect y="132" width="500" height="110" rx="16" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/>
    <text x="24" y="174" fill="#47658b" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="25" font-weight="800">12月25日（土）</text>
    <text x="24" y="210" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22">クリスマス第1日</text>
    <rect x="524" y="132" width="500" height="110" rx="16" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/>
    <text x="548" y="174" fill="#47658b" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="25" font-weight="800">12月26日（日）</text>
    <text x="548" y="210" fill="#17324d" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="22">クリスマス第2日</text>
  </g>
  <text x="90" y="474" fill="#9a6130" font-family="'Noto Sans JP', system-ui, sans-serif" font-size="18" font-weight="700">勤務先に独自の休日制度・労働協約がある場合は、別途確認してください。</text>
</svg>