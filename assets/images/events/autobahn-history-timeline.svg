<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アウトバーンと速度制限の年表</title><desc id="d">1932年のケルン〜ボン自動車道路の開通、1978年の推奨速度令、2015年の制限なし区間70.4%の調査、2024年の総延長13,210km、2026年7月9日の130km/h上限法案の否決を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">アウトバーンと速度をめぐる年表</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ケルン〜ボンの20kmから、2026年の国会採決まで</text><line x1="150" y1="190" x2="150" y2="610" stroke="#9fb6cc" stroke-width="6"/><circle cx="150" cy="222" r="16" fill="#2d6a9f"/><text x="60" y="230" font-size="26" font-weight="700" fill="#153452" text-anchor="start">1932</text><rect x="190" y="188" width="950" height="72" rx="16" fill="white"/><text x="215" y="218" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">8月6日</text><text x="330" y="218" font-size="24" font-weight="700" fill="#153452" text-anchor="start">ケルン〜ボンの自動車専用道路が開通</text><text x="330" y="248" font-size="19" fill="#405a71" text-anchor="start">アデナウアーらが開通式。全長約20km</text><circle cx="150" cy="308" r="16" fill="#2d6a9f"/><text x="60" y="316" font-size="26" font-weight="700" fill="#153452" text-anchor="start">1978</text><rect x="190" y="274" width="950" height="72" rx="16" fill="white"/><text x="215" y="304" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">11月21日</text><text x="330" y="304" font-size="24" font-weight="700" fill="#153452" text-anchor="start">アウトバーン推奨速度令</text><text x="330" y="334" font-size="19" fill="#405a71" text-anchor="start">130km/hを「推奨速度」に</text><circle cx="150" cy="394" r="16" fill="#2d6a9f"/><text x="60" y="402" font-size="26" font-weight="700" fill="#153452" text-anchor="start">2015</text><rect x="190" y="360" width="950" height="72" rx="16" fill="white"/><text x="215" y="390" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">調査</text><text x="330" y="390" font-size="24" font-weight="700" fill="#153452" text-anchor="start">制限なしの区間は約70.4%</text><text x="330" y="420" font-size="19" fill="#405a71" text-anchor="start">連邦道路研究所（BASt）</text><circle cx="150" cy="480" r="16" fill="#2d6a9f"/><text x="60" y="488" font-size="26" font-weight="700" fill="#153452" text-anchor="start">2024</text><rect x="190" y="446" width="950" height="72" rx="16" fill="white"/><text x="215" y="476" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">統計</text><text x="330" y="476" font-size="24" font-weight="700" fill="#153452" text-anchor="start">総延長 13,210km</text><text x="330" y="506" font-size="19" fill="#405a71" text-anchor="start">連邦交通省</text><circle cx="150" cy="566" r="16" fill="#2d6a9f"/><text x="60" y="574" font-size="26" font-weight="700" fill="#153452" text-anchor="start">2026</text><rect x="190" y="532" width="950" height="72" rx="16" fill="white"/><text x="215" y="562" font-size="20" font-weight="700" fill="#c9952a" text-anchor="start">7月9日</text><text x="330" y="562" font-size="24" font-weight="700" fill="#153452" text-anchor="start">130km/h上限の法案を否決</text><text x="330" y="592" font-size="19" fill="#405a71" text-anchor="start">賛成137・反対467</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：LVRアーカイブ、推奨速度令、BASt、連邦交通省、連邦議会（2026年10月26日参照）</text></g></svg>