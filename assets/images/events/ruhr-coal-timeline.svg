<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ルール地方の炭鉱の歴史</title><desc id="d">1956年の最盛期、1958年の危機の始まり、1970年の約19万人、1986年のツォルフェアアインの閉山、2001年の世界遺産登録、2018年の最後の炭鉱の閉山までを示した年表</desc><rect width="1200" height="675" rx="28" fill="#f2efea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ルール地方の炭鉱：最盛期から閉山まで</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">働く人の2人に1人が炭鉱で働いた時代から</text><line x1="165" y1="190" x2="165" y2="615" stroke="#d6c9b8" stroke-width="6"/><circle cx="165" cy="217" r="14" fill="#b5473a"/><text x="55" y="225" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1956</text><rect x="190" y="185" width="950" height="58" rx="16" fill="white"/><text x="215" y="215" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">最盛期</text><text x="340" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="start">生産1億2,460万トン・働く人約48万5,000人</text><text x="340" y="243" font-size="19" fill="#405a71" text-anchor="start">ルール地方で働く人の52%</text><circle cx="165" cy="287" r="14" fill="#b5473a"/><text x="55" y="295" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1958</text><rect x="190" y="255" width="950" height="58" rx="16" fill="white"/><text x="215" y="285" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">危機</text><text x="340" y="285" font-size="23" font-weight="700" fill="#153452" text-anchor="start">休業日、石炭の山、閉山、解雇が続く</text><text x="340" y="313" font-size="19" fill="#405a71" text-anchor="start">石油・天然ガスとの競争</text><circle cx="165" cy="357" r="14" fill="#b5473a"/><text x="55" y="365" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1970</text><rect x="190" y="325" width="950" height="58" rx="16" fill="white"/><text x="215" y="355" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">縮小</text><text x="340" y="355" font-size="23" font-weight="700" fill="#153452" text-anchor="start">炭鉱で働く人は約19万人に</text><text x="340" y="383" font-size="19" fill="#405a71" text-anchor="start">「炭鉱の死」と呼ばれた時代</text><circle cx="165" cy="427" r="14" fill="#b5473a"/><text x="55" y="435" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1986</text><rect x="190" y="395" width="950" height="58" rx="16" fill="white"/><text x="215" y="425" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">閉山</text><text x="340" y="425" font-size="23" font-weight="700" fill="#153452" text-anchor="start">エッセンのツォルフェアアインが閉じる</text><text x="340" y="453" font-size="19" fill="#405a71" text-anchor="start">12月23日</text><circle cx="165" cy="497" r="14" fill="#b5473a"/><text x="55" y="505" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2001</text><rect x="190" y="465" width="950" height="58" rx="16" fill="white"/><text x="215" y="495" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">世界遺産</text><text x="340" y="495" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ツォルフェアアインが世界遺産に</text><text x="340" y="523" font-size="19" fill="#405a71" text-anchor="start">12月14日</text><circle cx="165" cy="567" r="14" fill="#b5473a"/><text x="55" y="575" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2018</text><rect x="190" y="535" width="950" height="58" rx="16" fill="white"/><text x="215" y="565" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">終わり</text><text x="340" y="565" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ボットロップのプロスパー・ハニエルが閉山</text><text x="340" y="593" font-size="19" fill="#405a71" text-anchor="start">12月21日、ドイツの石炭採掘が終わる</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦政治教育センター、LWL、ルール地域連合、ツォルフェアアイン（2026年10月29日参照）</text></g></svg>