<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">公的医療保険の保険料のしくみ</title><desc id="d">一般保険料率14.6%に保険組合ごとの追加保険料率を足したものが保険料率で、会社員は雇用主と本人が半分ずつ負担することを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">公的医療保険の保険料のしくみ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">保険料率 ＝ 一般保険料率（全国一律）＋ 追加保険料率（保険組合ごと）</text><rect x="60" y="200" width="640" height="150" rx="18" fill="#2d6a9f"/><text x="380" y="265" font-size="34" font-weight="700" fill="white" text-anchor="middle">一般保険料率 14.6%</text><text x="380" y="312" font-size="24" fill="#dceaf7" text-anchor="middle">法律で全国一律</text><rect x="720" y="200" width="420" height="150" rx="18" fill="#c9952a"/><text x="930" y="265" font-size="34" font-weight="700" fill="white" text-anchor="middle">追加保険料率</text><text x="930" y="312" font-size="22" fill="#fff4dc" text-anchor="middle">組合ごと（2026年は約2.2〜4.4%）</text><rect x="60" y="390" width="1080" height="200" rx="18" fill="white"/><text x="90" y="445" font-size="28" font-weight="700" fill="#153452" text-anchor="start">会社員の場合の負担</text><rect x="90" y="470" width="500" height="70" rx="12" fill="#e3eef8"/><text x="340" y="515" font-size="28" font-weight="700" fill="#153452" text-anchor="middle">雇用主 1/2</text><rect x="610" y="470" width="500" height="70" rx="12" fill="#fbecd0"/><text x="860" y="515" font-size="28" font-weight="700" fill="#7a5612" text-anchor="middle">本人 1/2（給与から天引き）</text><text x="90" y="575" font-size="20" fill="#405a71" text-anchor="start">2027年の「平均2.9%」は計算上の目安。実際の率は加入先の発表で確認</text><text x="60" y="640" font-size="18" fill="#5b7086" text-anchor="start">図解：J-Connect。連邦保健省「Beiträge」ほかに基づく（2026年10月26日参照）。</text></g></svg>