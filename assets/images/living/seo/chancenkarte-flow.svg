<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>チャンスカードの申請から仕事が見つかるまでの流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">チャンスカードの流れ　最長1年で仕事を探す</text><rect x="48" y="150" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="194" r="20" fill="#146859"/><text x="84" y="203" font-size="24" fill="#FFFFFF">1</text><text x="128" y="188" font-size="26" fill="#173B48">日本の大使館・総領事館で申請</text><text x="128" y="218" font-size="20" fill="#52666C">ビザなし入国後のドイツ国内申請は原則不可</text><rect x="48" y="250" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="294" r="20" fill="#146859"/><text x="84" y="303" font-size="24" fill="#FFFFFF">2</text><text x="128" y="288" font-size="26" fill="#173B48">入国して住民登録・滞在カード</text><text x="128" y="318" font-size="20" fill="#52666C">生活費の証明と健康保険が必要</text><rect x="48" y="350" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="394" r="20" fill="#146859"/><text x="84" y="403" font-size="24" fill="#FFFFFF">3</text><text x="128" y="388" font-size="26" fill="#173B48">仕事を探す（最長1年）</text><text x="128" y="418" font-size="20" fill="#52666C">週20時間まで働ける。試用は1回2週間まで</text><rect x="48" y="450" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="494" r="20" fill="#146859"/><text x="84" y="503" font-size="24" fill="#FFFFFF">4</text><text x="128" y="488" font-size="26" fill="#173B48">仕事が見つかったら切り替え</text><text x="128" y="518" font-size="20" fill="#52666C">専門人材・ブルーカード・日本国籍者向け就労など</text><rect x="760" y="150" width="392" height="388" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">見つからないとき</text><text x="788" y="268" font-size="32" fill="#173B48">1年で期限が</text><text x="788" y="312" font-size="32" fill="#173B48">来たら出国</text><text x="788" y="372" font-size="21" fill="#52666C">チャンスカードとしての</text><text x="788" y="404" font-size="21" fill="#52666C">延長はできません</text><text x="788" y="436" font-size="21" fill="#52666C">もう一度申請するには、</text><text x="788" y="468" font-size="21" fill="#52666C">ドイツにいたのと同じ期間</text><text x="788" y="500" font-size="21" fill="#52666C">以上、国外にいる必要がある</text><text x="48" y="622" font-size="22" fill="#173B48">生活費の目安は月1,091ユーロ（連邦雇用エージェンシー、2026年）。最新額は大使館で確認を。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第20a条  |  2026-11-06</text></g></svg>