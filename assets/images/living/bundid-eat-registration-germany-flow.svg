<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">電子滞在許可証でBundIDを使うための4つの準備</title><desc id="d">有効な電子滞在許可証、オンライン機能と6桁PIN、対応端末とAusweisApp、BundIDのオンライン身分証登録の4ステップ。</desc><rect width="1200" height="675" rx="28" fill="#edf3f4"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="55" y="78" font-size="39" font-weight="700" fill="#173d4d">BundID登録前の4ステップ</text><text x="55" y="116" font-size="21" fill="#456573">電子滞在許可証を使用する場合</text><g transform="translate(60 170)"><rect width="210" height="385" rx="20" fill="#fff"/><circle cx="105" cy="63" r="38" fill="#227889"/><text x="105" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">1</text><text x="105" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#173d4d">eATを準備</text><path d="M27 196H183" stroke="#dce8e8" stroke-width="2"/><text x="105" y="253" text-anchor="middle" font-size="21" fill="#456573">有効なカード</text><text x="105" y="290" text-anchor="middle" font-size="21" fill="#456573">を用意</text></g><g transform="translate(350 170)"><rect width="210" height="385" rx="20" fill="#fff"/><circle cx="105" cy="63" r="38" fill="#227889"/><text x="105" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">2</text><text x="105" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#173d4d">PINを確認</text><path d="M27 196H183" stroke="#dce8e8" stroke-width="2"/><text x="105" y="253" text-anchor="middle" font-size="21" fill="#456573">オンライン機能</text><text x="105" y="290" text-anchor="middle" font-size="21" fill="#456573">と6桁PIN</text></g><g transform="translate(640 170)"><rect width="210" height="385" rx="20" fill="#fff"/><circle cx="105" cy="63" r="38" fill="#227889"/><text x="105" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">3</text><text x="105" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#173d4d">アプリと端末</text><path d="M27 196H183" stroke="#dce8e8" stroke-width="2"/><text x="105" y="253" text-anchor="middle" font-size="21" fill="#456573">AusweisApp</text><text x="105" y="290" text-anchor="middle" font-size="21" fill="#456573">NFCまたは読取機</text></g><g transform="translate(930 170)"><rect width="210" height="385" rx="20" fill="#fff"/><circle cx="105" cy="63" r="38" fill="#227889"/><text x="105" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">4</text><text x="105" y="164" text-anchor="middle" font-size="25" font-weight="700" fill="#173d4d">BundIDを登録</text><path d="M27 196H183" stroke="#dce8e8" stroke-width="2"/><text x="105" y="253" text-anchor="middle" font-size="21" fill="#456573">オンライン身分証</text><text x="105" y="290" text-anchor="middle" font-size="21" fill="#456573">を選ぶ</text></g><path d="M284 350h40v-14l18 25-18 25v-14h-40Z" fill="#227889"/><path d="M574 350h40v-14l18 25-18 25v-14h-40Z" fill="#227889"/><path d="M864 350h40v-14l18 25-18 25v-14h-40Z" fill="#227889"/><text x="60" y="612" font-size="20" fill="#456573">PINを忘れた場合は推測せず担当窓口へ。公式情報：BundID・AusweisApp</text></g></svg>
