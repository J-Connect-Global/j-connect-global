<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2027年1月の制度変更：決定済みと未確定</title><desc id="d">最低賃金・ミニジョブ上限・ドイツチケットは決定済み、社会保険の算定上限は連邦参議院の同意待ち、児童手当と所得税の控除は政府案の段階です</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452">2027年1月の変更：どこまで決まっている？</text><text x="60" y="145" font-size="24" fill="#405a71">2026年10月21日時点の状況</text><rect x="60" y="190" width="340" height="360" rx="20" fill="white"/><rect x="60" y="190" width="340" height="66" rx="20" fill="#2f8a64"/><rect x="60" y="236" width="340" height="20" fill="#2f8a64"/><text x="85" y="235" font-size="28" font-weight="700" fill="white">決定済み</text><text x="85" y="310" font-size="25" fill="#29465f">最低賃金 14.60ユーロ</text><text x="85" y="365" font-size="25" fill="#29465f">ミニジョブ上限 633ユーロ</text><text x="85" y="420" font-size="25" fill="#29465f">ドイツチケット</text><text x="85" y="455" font-size="25" fill="#29465f">66.80ユーロ</text><rect x="430" y="190" width="340" height="360" rx="20" fill="white"/><rect x="430" y="190" width="340" height="66" rx="20" fill="#c9952a"/><rect x="430" y="236" width="340" height="20" fill="#c9952a"/><text x="455" y="235" font-size="28" font-weight="700" fill="white">同意待ち</text><text x="455" y="310" font-size="25" fill="#29465f">社会保険の算定上限</text><text x="455" y="365" font-size="25" fill="#29465f">医療保険の加入義務上限</text><text x="455" y="420" font-size="22" fill="#405a71">閣議決定済み・</text><text x="455" y="452" font-size="22" fill="#405a71">連邦参議院の同意が必要</text><rect x="800" y="190" width="340" height="360" rx="20" fill="white"/><rect x="800" y="190" width="340" height="66" rx="20" fill="#7a8a99"/><rect x="800" y="236" width="340" height="20" fill="#7a8a99"/><text x="825" y="235" font-size="28" font-weight="700" fill="white">政府案（未成立）</text><text x="825" y="310" font-size="25" fill="#29465f">児童手当 267ユーロ</text><text x="825" y="365" font-size="25" fill="#29465f">基礎控除 12,564ユーロ</text><text x="825" y="420" font-size="25" fill="#29465f">被用者概算控除の拡大</text><text x="825" y="475" font-size="25" fill="#29465f">手工業者費用控除の縮小</text><text x="60" y="610" font-size="22" fill="#405a71">図解：J-Connect編集部。本文の参考情報に基づく。金額は月額・年額の別を本文の表で確認してください。</text></g></svg>
