<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">認定翻訳を頼む流れ</title><desc id="d">原本をそろえる、認定翻訳者を探す、見積もりを比べる、翻訳と証明文を受け取る、提出するという5つの段階を左から右へ並べた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="90" font-size="40" font-weight="700" fill="#153452">認定翻訳を頼む流れ</text>
<text x="60" y="135" font-size="24" fill="#3c5a78">提出先が求める条件を先に確認してから、翻訳者を選びます</text>
<rect x="60" y="190" width="204" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="100" cy="238" r="24" fill="#1f5f99"/><text x="100" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="305" font-size="22" font-weight="700" fill="#153452">原本をそろえる</text>
<text x="80" y="355" font-size="21" fill="#2b4560">発行国の証明書の</text>
<text x="80" y="385" font-size="21" fill="#2b4560">原本。電子発行な</text>
<text x="80" y="415" font-size="21" fill="#2b4560">ら提出先に要否を</text>
<text x="80" y="445" font-size="21" fill="#2b4560">確認</text>
<path d="M266 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="284" y="190" width="204" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="324" cy="238" r="24" fill="#1f5f99"/><text x="324" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="304" y="305" font-size="22" font-weight="700" fill="#153452">認定翻訳者を探す</text>
<text x="304" y="355" font-size="21" fill="#2b4560">州の裁判所が認定</text>
<text x="304" y="385" font-size="21" fill="#2b4560">した翻訳者。司法</text>
<text x="304" y="415" font-size="21" fill="#2b4560">の検索サイトで言</text>
<text x="304" y="445" font-size="21" fill="#2b4560">語と地域から探す</text>
<path d="M490 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="508" y="190" width="204" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="548" cy="238" r="24" fill="#1f5f99"/><text x="548" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="528" y="305" font-size="22" font-weight="700" fill="#153452">見積もりを比べる</text>
<text x="528" y="355" font-size="21" fill="#2b4560">2〜3人に依頼。</text>
<text x="528" y="385" font-size="21" fill="#2b4560">スキャンで受け付</text>
<text x="528" y="415" font-size="21" fill="#2b4560">けるか、原本の郵</text>
<text x="528" y="445" font-size="21" fill="#2b4560">送が要るか、納期</text>
<text x="528" y="475" font-size="21" fill="#2b4560">を聞く</text>
<path d="M714 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="732" y="190" width="204" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="772" cy="238" r="24" fill="#1f5f99"/><text x="772" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="752" y="305" font-size="22" font-weight="700" fill="#153452">翻訳と証明文</text>
<text x="752" y="355" font-size="21" fill="#2b4560">訳文に、正確であ</text>
<text x="752" y="385" font-size="21" fill="#2b4560">ることの証明、日</text>
<text x="752" y="415" font-size="21" fill="#2b4560">付、翻訳者の署名</text>
<text x="752" y="445" font-size="21" fill="#2b4560">と押印が付く</text>
<path d="M938 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="956" y="190" width="204" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="996" cy="238" r="24" fill="#1f5f99"/><text x="996" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="976" y="305" font-size="22" font-weight="700" fill="#153452">提出する</text>
<text x="976" y="355" font-size="21" fill="#2b4560">提出先が原本・翻</text>
<text x="976" y="385" font-size="21" fill="#2b4560">訳・コピーのどれ</text>
<text x="976" y="415" font-size="21" fill="#2b4560">を求めるかを確認</text>
<text x="976" y="445" font-size="21" fill="#2b4560">して出す</text>
<text x="60" y="645" font-size="20" fill="#3c5a78">図解：J-Connect編集部。翻訳者の条件と認証の要否は、提出先の窓口ごとに確認してください。</text>
</g></svg>