<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ニュルンベルクのクリスマスマーケットの歩み</title><desc id="d">1530年ごろの宗教改革後の贈り物の習慣の変化、1678年の最古の記録、1898年の移転と1933年の中央広場への復帰、1969年からのクリストキントの選出、2026年11月27日の開幕、2028年の350周年を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ニュルンベルクの市の歩み</text><text x="60" y="134" font-size="22" fill="#405a71">贈り物の習慣の変化から生まれ、2028年に350周年</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="110" y1="380" x2="1090" y2="380" stroke="#8d5a3c" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="130" y1="380" x2="130" y2="332" stroke="#153452" stroke-width="2"/><text x="130" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1530年ごろ</text><text x="130" y="292" font-size="18" fill="#405a71" text-anchor="middle">宗教改革後、贈り物を</text><text x="130" y="316" font-size="18" fill="#405a71" text-anchor="middle">イブに渡す習慣へ</text><circle cx="285" cy="380" r="13" fill="#b5473a" stroke="white" stroke-width="4"/><line x1="285" y1="380" x2="285" y2="420" stroke="#b5473a" stroke-width="2"/><text x="285" y="440" font-size="26" font-weight="700" fill="#b5473a" text-anchor="middle">1678年</text><text x="285" y="472" font-size="18" fill="#405a71" text-anchor="middle">市の最も古い記録</text><text x="285" y="496" font-size="18" fill="#405a71" text-anchor="middle">（木箱の銘）</text><circle cx="440" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="440" y1="380" x2="440" y2="332" stroke="#153452" stroke-width="2"/><text x="440" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1898年</text><text x="440" y="292" font-size="18" fill="#405a71" text-anchor="middle">中央広場を離れ</text><text x="440" y="316" font-size="18" fill="#405a71" text-anchor="middle">中洲の島へ移転</text><circle cx="595" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="595" y1="380" x2="595" y2="420" stroke="#153452" stroke-width="2"/><text x="595" y="440" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1933年</text><text x="595" y="472" font-size="18" fill="#405a71" text-anchor="middle">中央広場へ</text><text x="595" y="496" font-size="18" fill="#405a71" text-anchor="middle">戻る</text><circle cx="750" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="750" y1="380" x2="750" y2="332" stroke="#153452" stroke-width="2"/><text x="750" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1969年</text><text x="750" y="292" font-size="18" fill="#405a71" text-anchor="middle">クリストキントを</text><text x="750" y="316" font-size="18" fill="#405a71" text-anchor="middle">2年ごとに選ぶ形に</text><circle cx="905" cy="380" r="13" fill="#2f6a40" stroke="white" stroke-width="4"/><line x1="905" y1="380" x2="905" y2="420" stroke="#2f6a40" stroke-width="2"/><text x="905" y="440" font-size="26" font-weight="700" fill="#2f6a40" text-anchor="middle">2026年</text><text x="905" y="472" font-size="18" fill="#405a71" text-anchor="middle">11月27日に開幕</text><text x="905" y="496" font-size="18" fill="#405a71" text-anchor="middle">12月24日まで</text><circle cx="1060" cy="380" r="13" fill="#b5473a" stroke="white" stroke-width="4"/><line x1="1060" y1="380" x2="1060" y2="332" stroke="#b5473a" stroke-width="2"/><text x="1060" y="260" font-size="26" font-weight="700" fill="#b5473a" text-anchor="middle">2028年</text><text x="1060" y="292" font-size="18" fill="#405a71" text-anchor="middle">350周年</text><text x="1060" y="316" font-size="18" fill="#405a71" text-anchor="middle"></text><text x="60" y="645" font-size="18" fill="#405a71">最古の記録は長く1628年とされていたが、近年の調査で1678年と結論づけられた</text></g></svg>