<text x="355" y="520" font-size="21" font-weight="700" fill="#153452">Babyflaschen</text>
<text x="355" y="550" font-size="19" fill="#2b4560">哺乳びん</text>
<rect x="610" y="180" width="255" height="420" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<text x="630" y="228" font-size="24" font-weight="700" fill="#1f5f99">お風呂と体調</text>
<text x="630" y="280" font-size="21" font-weight="700" fill="#153452">Babybadewanne</text>
<text x="630" y="310" font-size="19" fill="#2b4560">ベビーバス</text>
<text x="630" y="360" font-size="21" font-weight="700" fill="#153452">Badethermometer</text>
