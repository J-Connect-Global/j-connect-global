<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドレスデンのシュトリーツェルマルクトを象徴するもの</title><desc id="d">金色の認証シールが目印のドレスデンのシュトレン、高さ約14.6メートルの多段の木のピラミッド、12月5日のシュトレン祭りの三つを紹介する図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">シュトリーツェルマルクトの三つの象徴</text><text x="60" y="134" font-size="22" fill="#405a71">名物の焼き菓子と、エルツ地方の手工芸の伝統</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(245,285)"><circle r="56" fill="#e8c35a"/><circle r="44" fill="none" stroke="#fff6d5" stroke-width="4"/><path d="M-22,4 C-22,-14 22,-14 22,4 Z" fill="#fbf7f0"/><rect x="-24" y="4" width="48" height="8" fill="#d79a52"/></g><text x="245" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">本場のシュトレン</text><text x="245" y="452" font-size="18" fill="#405a71" text-anchor="middle">ドレスデン周辺で</text><text x="245" y="482" font-size="18" fill="#405a71" text-anchor="middle">基準を満たして焼いたもの</text><text x="245" y="512" font-size="18" fill="#405a71" text-anchor="middle">金色の認証シールが目印</text><rect x="435" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(600,285)"><rect x="-4" y="-80" width="8" height="30" fill="#8a5a33"/><path d="M0,-80 L-44,-74 L-40,-70 Z M0,-80 L44,-74 L40,-70 Z" fill="#e9d2a6"/><rect x="-50.0" y="40" width="100" height="6" fill="#c99a5b"/><rect x="-40.0" y="10" width="80" height="6" fill="#c99a5b"/><rect x="-30.0" y="-20" width="60" height="6" fill="#c99a5b"/><rect x="-20.0" y="-48" width="40" height="6" fill="#c99a5b"/><path d="M-36,40 L-30,18 L-24,40 Z" fill="#b23a3a"/><path d="M-6,40 L0,18 L6,40 Z" fill="#b23a3a"/><path d="M24,40 L30,18 L36,40 Z" fill="#b23a3a"/><path d="M-26,10 L-20,-12 L-14,10 Z" fill="#b23a3a"/><path d="M14,10 L20,-12 L26,10 Z" fill="#b23a3a"/><path d="M-6,-20 L0,-42 L6,-20 Z" fill="#b23a3a"/></g><text x="600" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">木のピラミッド</text><text x="600" y="452" font-size="18" fill="#405a71" text-anchor="middle">高さ約14.6メートル</text><text x="600" y="482" font-size="18" fill="#405a71" text-anchor="middle">エルツ地方の</text><text x="600" y="512" font-size="18" fill="#405a71" text-anchor="middle">伝統工芸をかたどる</text><rect x="789" y="190" width="331" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(955,285)"><path d="M-62,30 C-66,-10 -20,-30 0,-26 C20,-30 66,-10 62,30 Z" fill="#d79a52"/><path d="M-58,10 C-56,-14 -18,-28 0,-22 C18,-28 56,-14 58,10 C30,-4 -30,-4 -58,10 Z" fill="#fbf7f0"/></g><text x="955" y="410" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">シュトレン祭り</text><text x="955" y="452" font-size="18" fill="#405a71" text-anchor="middle">2026年は12月5日（土）</text><text x="955" y="482" font-size="18" fill="#405a71" text-anchor="middle">旧市街を行列が進み</text><text x="955" y="512" font-size="18" fill="#405a71" text-anchor="middle">巨大シュトレンを切る</text></g></svg>