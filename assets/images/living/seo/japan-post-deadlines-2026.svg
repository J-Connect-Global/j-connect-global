<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>日本向けクリスマス郵便の最終差出日2026</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="46" fill="#173B48">ドイツ→日本　クリスマスの最終差出日 2026</text><text x="48" y="176" font-size="26" fill="#52666C">日本は「ヨーロッパ以外」の区分。オンライン支払いの小包は1〜2日遅くても可</text><rect x="48" y="210" width="344" height="330" rx="18" fill="#FFFFFF"/><rect x="48" y="210" width="344" height="14" rx="7" fill="#146859"/><text x="78" y="282" font-size="32" fill="#52666C">手紙・はがき</text><text x="78" y="380" font-size="76" fill="#173B48">11/25</text><text x="78" y="432" font-size="32" fill="#52666C">水曜日</text><text x="78" y="500" font-size="24" fill="#52666C">クリスマスカード</text><rect x="428" y="210" width="344" height="330" rx="18" fill="#FFFFFF"/><rect x="428" y="210" width="344" height="14" rx="7" fill="#146859"/><text x="458" y="282" font-size="32" fill="#52666C">小包</text><text x="458" y="380" font-size="76" fill="#173B48">11/26</text><text x="458" y="432" font-size="32" fill="#52666C">木曜日</text><text x="458" y="500" font-size="24" fill="#52666C">Päckchen・Paket</text><rect x="808" y="210" width="344" height="330" rx="18" fill="#FFFFFF"/><rect x="808" y="210" width="344" height="14" rx="7" fill="#C2410C"/><text x="838" y="282" font-size="32" fill="#52666C">Express</text><text x="838" y="380" font-size="76" fill="#173B48">12/18</text><text x="838" y="432" font-size="32" fill="#52666C">金曜日</text><text x="838" y="500" font-size="24" fill="#52666C">各窓口の締め時刻まで</text><text x="48" y="598" font-size="25" fill="#173B48">目安であり配達日の保証ではありません。元日着の別締切は公表されていません。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：Deutsche Post・DHL  |  2026-11-01</text></g></svg>
