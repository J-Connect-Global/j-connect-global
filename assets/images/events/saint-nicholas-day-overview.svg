<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">聖ニコラウスの日の流れと伝説</title><desc id="d">12月5日の夜に磨いた靴を置き、6日の朝にお菓子が入っている流れと、その由来の紙の船の習慣、4世紀のミラの司教ニコラウスの伝説（3つの金の玉、船乗りの守護聖人）、従者クネヒト・ループレヒトを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7efe8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">聖ニコラウスの日（12月6日）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">4世紀の司教の伝説から生まれた、子どもたちの楽しみ</text><rect x="60" y="180" width="520" height="420" rx="16" fill="white"/><text x="320" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">夜と朝の流れ</text><rect x="90" y="255" width="460" height="92" rx="14" fill="#2d6a9f"/><text x="115" y="295" font-size="23" font-weight="700" fill="white" text-anchor="start">12月5日の夜</text><text x="115" y="329" font-size="20" fill="white" text-anchor="start">磨いた靴を玄関に置く</text><rect x="90" y="365" width="460" height="92" rx="14" fill="#b5473a"/><text x="115" y="405" font-size="23" font-weight="700" fill="white" text-anchor="start">12月6日の朝</text><text x="115" y="439" font-size="20" fill="white" text-anchor="start">靴にみかん・ナッツ・お菓子</text><rect x="90" y="475" width="460" height="92" rx="14" fill="#8a5aa8"/><text x="115" y="515" font-size="23" font-weight="700" fill="white" text-anchor="start">由来</text><text x="115" y="549" font-size="20" fill="white" text-anchor="start">紙の船を置いた昔の習慣</text><rect x="620" y="180" width="520" height="420" rx="16" fill="white"/><text x="880" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">伝説のニコラウス</text><circle cx="665" cy="265" r="10" fill="#c9952a"/><text x="690" y="273" font-size="22" font-weight="700" fill="#153452" text-anchor="start">4世紀</text><text x="690" y="303" font-size="19" fill="#405a71" text-anchor="start">小アジアのミラの司教</text><circle cx="665" cy="347" r="10" fill="#c9952a"/><text x="690" y="355" font-size="22" font-weight="700" fill="#153452" text-anchor="start">3つの金の玉</text><text x="690" y="385" font-size="19" fill="#405a71" text-anchor="start">貧しい娘たちを救った話</text><circle cx="665" cy="429" r="10" fill="#c9952a"/><text x="690" y="437" font-size="22" font-weight="700" fill="#153452" text-anchor="start">船乗りの守護聖人</text><text x="690" y="467" font-size="19" fill="#405a71" text-anchor="start">嵐の海から船を救った話</text><circle cx="665" cy="511" r="10" fill="#c9952a"/><text x="690" y="519" font-size="22" font-weight="700" fill="#153452" text-anchor="start">相棒</text><text x="690" y="549" font-size="19" fill="#405a71" text-anchor="start">クネヒト・ループレヒト（16世紀〜）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：katholisch.de、ケルン大司教区（2026年10月29日参照）。2026年の12月6日は日曜日（第2アドベント）</text></g></svg>