<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">住宅手当の改正の流れ</title><desc id="d">2026年10月の連邦議会での第1読会、委員会での審議と議決、連邦参議院の同意を経て、2027年1月1日の施行を目指すという流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">住宅手当の改正：今後の流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦議会の議決と、連邦参議院の同意が必要</text><line x1="100" y1="250" x2="1100" y2="250" stroke="#9fb6cc" stroke-width="6"/><circle cx="180" cy="250" r="18" fill="#2d6a9f"/><text x="180" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">2026年10月</text><rect x="50" y="285" width="260" height="110" rx="16" fill="white"/><text x="180" y="330" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">連邦議会で第1読会</text><text x="180" y="366" font-size="18" fill="#405a71" text-anchor="middle">法案の最初の審議</text><circle cx="460" cy="250" r="18" fill="#2d6a9f"/><text x="460" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">委員会</text><rect x="330" y="285" width="260" height="110" rx="16" fill="white"/><text x="460" y="330" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">審議・議決</text><text x="460" y="366" font-size="18" fill="#405a71" text-anchor="middle">修正の可能性あり</text><circle cx="740" cy="250" r="18" fill="#2d6a9f"/><text x="740" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">連邦参議院</text><rect x="610" y="285" width="260" height="110" rx="16" fill="white"/><text x="740" y="330" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">同意が必要</text><text x="740" y="366" font-size="18" fill="#405a71" text-anchor="middle">削減には批判的</text><circle cx="1020" cy="250" r="18" fill="#2d6a9f"/><text x="1020" y="215" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">2027年1月1日</text><rect x="890" y="285" width="260" height="110" rx="16" fill="white"/><text x="1020" y="330" font-size="21" font-weight="700" fill="#153452" text-anchor="middle">施行を目指す</text><text x="1020" y="366" font-size="18" fill="#405a71" text-anchor="middle">家賃水準も見直し</text><rect x="60" y="440" width="1080" height="150" rx="16" fill="#eef5fb"/><rect x="60" y="440" width="1080" height="150" rx="16" fill="white"/><text x="90" y="490" font-size="26" font-weight="700" fill="#2f8a64" text-anchor="start">住宅手当そのものはなくならない</text><text x="90" y="535" font-size="21" fill="#29465f" text-anchor="start">家賃の負担が重いときは、市町村の住宅手当の窓口で受け取れるか確認を</text><text x="90" y="570" font-size="21" fill="#29465f" text-anchor="start">支給額は世帯の人数・収入・家賃・地域で決まる</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦議会、DIP（2026年10月29日参照）</text></g></svg>