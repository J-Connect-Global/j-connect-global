<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#102c50"/><g font-family="Noto Sans CJK JP" fill="white"><text x="64" y="88" font-size="24">J-CONNECT GERMANY · 生活ガイド</text><text x="64" y="186" font-size="62" font-weight="700">Pfandの返却・返金</text><text x="64" y="247" font-size="30">容器の種類と、返却機で困ったときの確認順序</text><rect x="64" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="88" y="365" fill="#102c50" font-size="36">容器の表示</text><text x="88" y="432" fill="#102c50" font-size="26">DPG対象は25セント</text><text x="88" y="480" fill="#102c50" font-size="24">リユースは別ルール</text><rect x="432" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="456" y="365" fill="#102c50" font-size="36">店へ返却</text><text x="456" y="432" fill="#102c50" font-size="26">素材・取扱いを確認</text><text x="456" y="480" fill="#102c50" font-size="24">読取り不良は店員へ</text><rect x="800" y="310" width="336" height="235" rx="12" fill="#fff"/><text x="824" y="365" fill="#102c50" font-size="36">返金券</text><text x="824" y="432" fill="#102c50" font-size="26">発券した店舗で精算</text><text x="824" y="480" fill="#102c50" font-size="24">金額をその場で確認</text><text x="64" y="610" font-size="23">編集部作成の図解｜詳しい条件と公式出典は本文に掲載</text></g></svg>
