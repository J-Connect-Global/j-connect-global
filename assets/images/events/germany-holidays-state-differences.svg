<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">州によって違う祝日</title><desc id="d">10月31日の宗教改革記念日は東部と北部の一部の州、11月1日の万聖節と聖体祭はNRWなど南部・西部の州で祝日になっていることを、宗教の分布と合わせて示した概略図</desc><rect width="1200" height="675" rx="28" fill="#f4f8fc"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">同じ日でも、州によって休みが違う</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">宗教の分布が、祝日の地図に表れる（概略）</text><rect x="60" y="180" width="345" height="400" rx="16" fill="white"/><rect x="60" y="180" width="345" height="90" rx="16" fill="#2d6a9f"/><rect x="60" y="250" width="345" height="20" rx="0" fill="#2d6a9f"/><text x="232" y="240" font-size="32" font-weight="700" fill="white" text-anchor="middle">10月31日</text><text x="232" y="330" font-size="25" font-weight="700" fill="#153452" text-anchor="middle">宗教改革記念日</text><text x="232" y="375" font-size="21" font-weight="700" fill="#2d6a9f" text-anchor="middle">プロテスタント</text><text x="232" y="440" font-size="19" fill="#405a71" text-anchor="middle">東部の州と</text><text x="232" y="472" font-size="19" fill="#405a71" text-anchor="middle">北部の一部の州（2018年〜）</text><rect x="425" y="180" width="345" height="400" rx="16" fill="white"/><rect x="425" y="180" width="345" height="90" rx="16" fill="#b5473a"/><rect x="425" y="250" width="345" height="20" rx="0" fill="#b5473a"/><text x="597" y="240" font-size="32" font-weight="700" fill="white" text-anchor="middle">11月1日</text><text x="597" y="330" font-size="25" font-weight="700" fill="#153452" text-anchor="middle">万聖節</text><text x="597" y="375" font-size="21" font-weight="700" fill="#b5473a" text-anchor="middle">カトリック</text><text x="597" y="440" font-size="19" fill="#405a71" text-anchor="middle">NRWなど</text><text x="597" y="472" font-size="19" fill="#405a71" text-anchor="middle">南部・西部の州</text><rect x="790" y="180" width="345" height="400" rx="16" fill="white"/><rect x="790" y="180" width="345" height="90" rx="16" fill="#c9952a"/><rect x="790" y="250" width="345" height="20" rx="0" fill="#c9952a"/><text x="962" y="240" font-size="32" font-weight="700" fill="white" text-anchor="middle">聖体祭</text><text x="962" y="330" font-size="25" font-weight="700" fill="#153452" text-anchor="middle">復活祭の60日後の木曜日</text><text x="962" y="375" font-size="21" font-weight="700" fill="#c9952a" text-anchor="middle">カトリック</text><text x="962" y="440" font-size="19" fill="#405a71" text-anchor="middle">NRWなど南部・西部の州</text><text x="962" y="472" font-size="19" fill="#405a71" text-anchor="middle">2027年は5月27日</text><rect x="60" y="595" width="1080" height="0" rx="16" fill="white"/><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">国の法律が決めた祝日は10月3日だけ。ほかは各州の祝日法による（連邦内務省）</text></g></svg>