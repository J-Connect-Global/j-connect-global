<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">シュテルンジンガーの数字</title><desc id="d">シュテルンジンガーの活動期間は12月27日から1月の第3金曜日まで、2026年の募金は約4,717万ユーロ、1959年からの合計は14億ユーロ超、2027年のテーマはよい食事、強い子どもたちで、2015年にドイツの無形文化遺産に登録されたことを示した図</desc><rect width="1200" height="675" rx="28" fill="#f4f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">シュテルンジンガーの数字</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">「子どもが子どものために」行う募金活動</text><rect x="60" y="185" width="530" height="170" rx="16" fill="white"/><rect x="60" y="185" width="16" height="170" rx="8" fill="#2d6a9f"/><text x="105" y="265" font-size="30" font-weight="700" fill="#2d6a9f" text-anchor="start">12/27〜1月第3金曜</text><text x="105" y="313" font-size="21" fill="#29465f" text-anchor="start">活動の期間</text><rect x="610" y="185" width="530" height="170" rx="16" fill="white"/><rect x="610" y="185" width="16" height="170" rx="8" fill="#c9952a"/><text x="655" y="265" font-size="30" font-weight="700" fill="#c9952a" text-anchor="start">約4,717万ユーロ</text><text x="655" y="313" font-size="21" fill="#29465f" text-anchor="start">2026年の募金（7月31日時点）</text><rect x="60" y="375" width="530" height="170" rx="16" fill="white"/><rect x="60" y="375" width="16" height="170" rx="8" fill="#b5473a"/><text x="105" y="455" font-size="30" font-weight="700" fill="#b5473a" text-anchor="start">14億ユーロ超</text><text x="105" y="503" font-size="21" fill="#29465f" text-anchor="start">1959年からの合計</text><rect x="610" y="375" width="530" height="170" rx="16" fill="white"/><rect x="610" y="375" width="16" height="170" rx="8" fill="#2f8a64"/><text x="655" y="455" font-size="25" font-weight="700" fill="#2f8a64" text-anchor="start">「よい食事、強い子どもたち」</text><text x="655" y="503" font-size="21" fill="#29465f" text-anchor="start">2027年のテーマ（例の国：グアテマラ）</text><rect x="60" y="570" width="1080" height="42" rx="10" fill="#fff3f0"/><text x="600" y="598" font-size="19" fill="#7a2e24" text-anchor="middle">2015年12月、ドイツの無形文化遺産の一覧に登録（ドイツ・ユネスコ委員会）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：シュテルンジンガー（子ども宣教会）、ドイツ・ユネスコ委員会（2026年10月29日参照）</text></g></svg>