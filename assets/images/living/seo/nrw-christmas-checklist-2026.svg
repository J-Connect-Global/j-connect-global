<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">クリスマス前後に確認する3項目</title><desc id="d">買い物は店舗の公式情報、薬局は緊急当番検索、交通は行き帰り両方の時刻を公式案内で確認。</desc><rect width="1200" height="675" rx="28" fill="#eef4f4"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="58" y="75" font-size="40" font-weight="700" fill="#17394b">出かける前に確認する3つ</text><text x="58" y="115" font-size="21" fill="#466775">クリスマス前後は通常の営業・運行とは限りません。</text><g transform="translate(60 170)"><rect width="320" height="376" rx="22" fill="#fff"/><rect x="28" y="28" width="70" height="60" rx="15" fill="#2d7b74"/><text x="63" y="69" font-size="27" font-weight="700" text-anchor="middle" fill="#fff">01</text><text x="28" y="145" font-size="32" font-weight="700" fill="#17394b">買い物</text><text x="28" y="195" font-size="21" font-weight="700" fill="#2d7b74">店舗の公式案内</text><path d="M28 224H292" stroke="#e1e9e9" stroke-width="2"/><g font-size="21" fill="#466775"><text x="28" y="270">✓ 24日の閉店時刻</text><text x="28" y="316">✓ 25〜27日の例外</text></g></g><g transform="translate(440 170)"><rect width="320" height="376" rx="22" fill="#fff"/><rect x="28" y="28" width="70" height="60" rx="15" fill="#ae655c"/><text x="63" y="69" font-size="27" font-weight="700" text-anchor="middle" fill="#fff">02</text><text x="28" y="145" font-size="32" font-weight="700" fill="#17394b">薬局</text><text x="28" y="195" font-size="21" font-weight="700" fill="#ae655c">aponet.de</text><path d="M28 224H292" stroke="#e1e9e9" stroke-width="2"/><g font-size="21" fill="#466775"><text x="28" y="270">✓ 緊急当番を検索</text><text x="28" y="316">✓ 直前に再確認</text></g></g><g transform="translate(820 170)"><rect width="320" height="376" rx="22" fill="#fff"/><rect x="28" y="28" width="70" height="60" rx="15" fill="#476f93"/><text x="63" y="69" font-size="27" font-weight="700" text-anchor="middle" fill="#fff">03</text><text x="28" y="145" font-size="32" font-weight="700" fill="#17394b">公共交通</text><text x="28" y="195" font-size="21" font-weight="700" fill="#476f93">Rheinbahn・DB</text><path d="M28 224H292" stroke="#e1e9e9" stroke-width="2"/><g font-size="21" fill="#466775"><text x="28" y="270">✓ 行きの時刻</text><text x="28" y="316">✓ 帰りの最終便</text></g></g><text x="60" y="607" font-size="21" fill="#17394b">実際の営業状況・運行情報は、本文にある各公式案内を参照。</text></g></svg>
