<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">失業手当のしくみ</title><desc id="d">失業手当の条件として30か月のうち12か月以上の加入、金額は手取りの60％で子どもがいれば67％、期間は50歳未満で6か月から12か月、50歳以上は最長24か月であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">失業手当（Arbeitslosengeld）のしくみ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">条件・金額・期間</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">条件</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">過去30か月のうち</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">12か月以上、失業保険に加入</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#2f8a64"/><text x="646" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">金額</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">手取りの給与の60％</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">子どもがいれば67％</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#c9952a"/><text x="96" y="443" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">期間（50歳未満）</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">加入期間に応じて</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">6か月〜12か月</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#8a5aa8"/><text x="646" y="443" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">期間（50歳以上）</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">年齢と加入期間に応じて</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">最長24か月</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：社会法典第3編、連邦雇用エージェンシー（2026年10月29日参照）</text></g></svg>