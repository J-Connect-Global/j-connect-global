<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026年の日帰りクリスマスマーケットの開催期間</title><desc id="d">モンシャウは11月27日から12月20日までの4つの週末、ミュンスターは11月23日から12月23日、メローデ城は11月25日から12月22日（11月30日と12月1日は休み）、ファルケンブルフの洞窟の市は11月13日から12月30日、町全体の催しは2027年1月3日まで、マーストリヒトは11月27日から12月27日</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#153452">開催期間を並べてみる（2026年）</text><text x="60" y="122" font-size="21" fill="#405a71">週末だけの町、ひと月続く街、年明けまで続く町</text><rect x="40" y="150" width="1120" height="470" rx="16" fill="white"/><line x1="330" y1="175" x2="330" y2="560" stroke="#d9cfc3" stroke-width="2"/><text x="330" y="595" font-size="18" fill="#405a71" text-anchor="middle">11月1日</text><line x1="668" y1="175" x2="668" y2="560" stroke="#d9cfc3" stroke-width="2"/><text x="668" y="595" font-size="18" fill="#405a71" text-anchor="middle">12月1日</text><line x1="1017" y1="175" x2="1017" y2="560" stroke="#d9cfc3" stroke-width="2"/><text x="1017" y="595" font-size="18" fill="#405a71" text-anchor="middle">1月1日</text><rect x="927" y="175" width="23" height="385" fill="#c0392b" opacity="0.10"/><text x="938" y="190" font-size="15" fill="#a03224" text-anchor="middle">24〜25日</text><text x="70" y="233" font-size="21" font-weight="700" fill="#153452">モンシャウ</text><rect x="623.0" y="211" width="33.8" height="30" rx="7" fill="#8d5a3c"/><rect x="701.8" y="211" width="33.8" height="30" rx="7" fill="#8d5a3c"/><rect x="780.7" y="211" width="33.8" height="30" rx="7" fill="#8d5a3c"/><rect x="859.6" y="211" width="33.8" height="30" rx="7" fill="#8d5a3c"/><text x="901" y="233" font-size="17" fill="#405a71">金〜日の4週末</text><text x="70" y="293" font-size="21" font-weight="700" fill="#153452">ミュンスター</text><rect x="577.9" y="271" width="349.3" height="30" rx="7" fill="#153452"/><text x="935" y="293" font-size="17" fill="#405a71">11/23〜12/23</text><text x="70" y="353" font-size="21" font-weight="700" fill="#153452">メローデ城</text><rect x="600.4" y="331" width="56.3" height="30" rx="7" fill="#2e6b4f"/><rect x="679.3" y="331" width="236.6" height="30" rx="7" fill="#2e6b4f"/><text x="924" y="353" font-size="17" fill="#405a71">11/25〜12/22</text><text x="70" y="413" font-size="21" font-weight="700" fill="#153452">ファルケンブルフ洞窟</text><rect x="465.2" y="391" width="540.8" height="30" rx="7" fill="#7a4d8c"/><text x="475" y="412" font-size="16" fill="white">11/13〜12/30</text><text x="70" y="473" font-size="21" font-weight="700" fill="#153452">ファルケンブルフ町全体</text><rect x="465.2" y="451" width="585.9" height="30" rx="7" fill="#b38bc2"/><text x="475" y="472" font-size="16" fill="white">〜1/3</text><text x="70" y="533" font-size="21" font-weight="700" fill="#153452">マーストリヒト</text><rect x="623.0" y="511" width="349.3" height="30" rx="7" fill="#c47f17"/><text x="980" y="533" font-size="17" fill="#405a71">11/27〜12/27</text></g></svg>