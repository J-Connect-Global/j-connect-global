<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">車検の間隔</title><desc id="d">乗用車の車検は新車が最初の登録から3年後、その後は2年ごとで、ナンバープレートのステッカーで次の年と月が分かり、期限から2か月を超えると細かい検査が必要になることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">車検（HU・TÜV）はいつ？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">乗用車の場合</text><rect x="60" y="180" width="520" height="230" rx="16" fill="white"/><text x="320" y="235" font-size="26" font-weight="700" fill="#405a71" text-anchor="middle">新車</text><text x="320" y="315" font-size="56" font-weight="700" fill="#2d6a9f" text-anchor="middle">3年後</text><text x="320" y="370" font-size="22" fill="#29465f" text-anchor="middle">最初の登録から</text><rect x="620" y="180" width="520" height="230" rx="16" fill="white"/><text x="880" y="235" font-size="26" font-weight="700" fill="#405a71" text-anchor="middle">その後</text><text x="880" y="315" font-size="56" font-weight="700" fill="#2f8a64" text-anchor="middle">2年ごと</text><text x="880" y="370" font-size="22" fill="#29465f" text-anchor="middle">ステッカーで次の年と月が分かる</text><rect x="60" y="435" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="480" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">期限を過ぎると</text><text x="90" y="520" font-size="21" fill="#29465f" text-anchor="start">罰金がかかることも。2か月を超えると細かい検査が必要になり、費用が上がります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ADAC（2026年10月29日参照）</text></g></svg>