<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">雪かきは誰の役目</title><desc id="d">歩道の雪かきは原則として建物の持ち主の役目で、賃貸契約で決まっていれば借りている人の役目、大きな集合住宅では管理会社や清掃業者が行い費用は共益費に含まれることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">家の前の歩道の雪かき、誰の役目？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ケルン市・デュッセルドルフ市の場合</text><rect x="60" y="180" width="530" height="190" rx="16" fill="white"/><rect x="60" y="180" width="12" height="190" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">原則：建物の持ち主</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">町の条例で決まっている</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">最終的な責任は持ち主に残る</text><rect x="610" y="180" width="530" height="190" rx="16" fill="white"/><rect x="610" y="180" width="12" height="190" rx="6" fill="#c9952a"/><text x="646" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">賃貸契約で決まっていれば</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">借りている人の役目になる</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">（建物の決まりだけでは不十分とも）</text><rect x="60" y="390" width="530" height="190" rx="16" fill="white"/><rect x="60" y="390" width="12" height="190" rx="6" fill="#2f8a64"/><text x="96" y="438" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">大きな集合住宅</text><text x="96" y="478" font-size="20" fill="#29465f" text-anchor="start">管理会社や清掃業者が担当</text><text x="96" y="508" font-size="20" fill="#29465f" text-anchor="start">費用は共益費（Nebenkosten）に</text><rect x="610" y="390" width="530" height="190" rx="16" fill="white"/><rect x="610" y="390" width="12" height="190" rx="6" fill="#8a5aa8"/><text x="646" y="438" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">まず確認</text><text x="646" y="478" font-size="20" fill="#29465f" text-anchor="start">賃貸契約書と管理会社の案内</text><text x="646" y="508" font-size="20" fill="#29465f" text-anchor="start">分からなければ家主に聞く</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ケルン市、デュッセルドルフ市、ドイツ借家人連盟（2026年10月29日参照）</text></g></svg>