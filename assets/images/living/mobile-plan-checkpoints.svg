<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">スマホのプランのチェック</title><desc id="d">スマホのプランを選ぶときは、電波のつながりやすさ、データ量、EUでの利用、日本への通話、eSIM、日本の電話番号のSMS認証を確認することを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">スマホのプランを選ぶ5つのチェック</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">契約の前に確かめたいこと</text><rect x="60" y="180" width="346" height="200" rx="16" fill="white"/><rect x="60" y="180" width="12" height="200" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">電波</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">住まい・職場・通勤の道で</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">つながりやすいか</text><rect x="426" y="180" width="346" height="200" rx="16" fill="white"/><rect x="426" y="180" width="12" height="200" rx="6" fill="#2f8a64"/><text x="462" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">データ量</text><text x="462" y="268" font-size="20" fill="#29465f" text-anchor="start">動画や地図をよく使うなら</text><text x="462" y="298" font-size="20" fill="#29465f" text-anchor="start">多めのプランに</text><rect x="792" y="180" width="346" height="200" rx="16" fill="white"/><rect x="792" y="180" width="12" height="200" rx="6" fill="#c9952a"/><text x="828" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">EUでの利用</text><text x="828" y="268" font-size="20" fill="#29465f" text-anchor="start">EUの国は追加料金なしが原則</text><text x="828" y="298" font-size="20" fill="#29465f" text-anchor="start">スイス・イギリスは要確認</text><rect x="60" y="400" width="346" height="200" rx="16" fill="white"/><rect x="60" y="400" width="12" height="200" rx="6" fill="#8a5aa8"/><text x="96" y="448" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">日本への通話</text><text x="96" y="488" font-size="20" fill="#29465f" text-anchor="start">通話アプリのほうが</text><text x="96" y="518" font-size="20" fill="#29465f" text-anchor="start">安く済むことが多い</text><rect x="426" y="400" width="346" height="200" rx="16" fill="white"/><rect x="426" y="400" width="12" height="200" rx="6" fill="#2d6a9f"/><text x="462" y="448" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">eSIM</text><text x="462" y="488" font-size="20" fill="#29465f" text-anchor="start">対応したスマホなら</text><text x="462" y="518" font-size="20" fill="#29465f" text-anchor="start">カードの差し替え不要</text><rect x="792" y="400" width="346" height="200" rx="16" fill="white"/><rect x="792" y="400" width="12" height="200" rx="6" fill="#b5473a"/><text x="828" y="448" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">日本の番号</text><text x="828" y="488" font-size="20" fill="#29465f" text-anchor="start">SMSの認証に使っていないか</text><text x="828" y="518" font-size="20" fill="#29465f" text-anchor="start">解約の前に確認</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター、連邦ネットワーク庁（2026年10月29日参照）</text></g></svg>