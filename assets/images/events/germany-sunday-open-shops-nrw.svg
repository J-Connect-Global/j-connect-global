<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">NRW州で日曜日に開いているお店</title><desc id="d">NRW州でパン屋・花屋・新聞の売店は1日5時間まで、薬局は当番制、ガソリンスタンドは終日営業でき、スーパーなどは原則休業であること、日曜営業日は1店あたり年8回・13時から最大5時間であることをまとめた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">NRW州：日曜・祝日に開いているのは？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">原則は休業。暮らしに必要なお店だけ例外</text><rect x="60" y="180" width="345" height="112" rx="16" fill="white"/><rect x="60" y="180" width="345" height="10" rx="5" fill="#c9952a"/><text x="232" y="236" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">パン屋・ケーキ屋</text><text x="232" y="272" font-size="22" font-weight="700" fill="#c9952a" text-anchor="middle">1日5時間まで</text><rect x="425" y="180" width="345" height="112" rx="16" fill="white"/><rect x="425" y="180" width="345" height="10" rx="5" fill="#c9952a"/><text x="597" y="236" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">花屋</text><text x="597" y="272" font-size="22" font-weight="700" fill="#c9952a" text-anchor="middle">1日5時間まで</text><rect x="790" y="180" width="345" height="112" rx="16" fill="white"/><rect x="790" y="180" width="345" height="10" rx="5" fill="#c9952a"/><text x="962" y="236" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">新聞・雑誌</text><text x="962" y="272" font-size="22" font-weight="700" fill="#c9952a" text-anchor="middle">1日5時間まで</text><rect x="60" y="310" width="345" height="112" rx="16" fill="white"/><rect x="60" y="310" width="345" height="10" rx="5" fill="#2f8a64"/><text x="232" y="366" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">薬局</text><text x="232" y="402" font-size="22" font-weight="700" fill="#2f8a64" text-anchor="middle">当番薬局が開く</text><rect x="425" y="310" width="345" height="112" rx="16" fill="white"/><rect x="425" y="310" width="345" height="10" rx="5" fill="#2f8a64"/><text x="597" y="366" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">ガソリンスタンド</text><text x="597" y="402" font-size="22" font-weight="700" fill="#2f8a64" text-anchor="middle">終日（燃料・旅行用品）</text><rect x="790" y="310" width="345" height="112" rx="16" fill="white"/><rect x="790" y="310" width="345" height="10" rx="5" fill="#b5473a"/><text x="962" y="366" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">スーパー・洋服店</text><text x="962" y="402" font-size="22" font-weight="700" fill="#b5473a" text-anchor="middle">原則休業</text><rect x="60" y="450" width="1080" height="150" rx="16" fill="#fff7e6"/><text x="90" y="495" font-size="28" font-weight="700" fill="#8a5a00" text-anchor="start">年に数回の「日曜営業日」</text><text x="90" y="537" font-size="22" fill="#29465f" text-anchor="start">1店あたり年8回まで ／ 13時から最大5時間 ／ 2日続けては不可</text><text x="90" y="575" font-size="22" fill="#29465f" text-anchor="start">市町村全体で年16日まで。待降節の日曜は全域開店なら1日だけ</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※復活祭・聖霊降臨祭の翌月曜日と12月26日はパン屋なども休み。出典：NRW州閉店法、ケルン商工会議所</text></g></svg>