<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドイツのワイン産地の概略図</title><desc id="d">ライン川とモーゼル川に沿ったアール、ミッテルライン、モーゼル、ラインヘッセン、プファルツの5つの産地の位置と面積、全国のぶどう畑約10万2,000ヘクタールを示した概略図</desc><rect width="1200" height="675" rx="28" fill="#f4f7ef"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツのワイン産地（13のうち5つ）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">南西部、ライン川とその支流に沿って広がる（概略）</text><path d="M700 170 C 690 250, 710 300, 690 360 S 680 520, 700 600" stroke="#7fa7cf" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M693 330 C 620 350, 560 400, 470 410" stroke="#7fa7cf" stroke-width="10" fill="none" stroke-linecap="round"/><text x="720" y="590" font-size="18" fill="#5b7086" text-anchor="start">ライン川</text><text x="470" y="440" font-size="18" fill="#5b7086" text-anchor="start">モーゼル川</text><circle cx="700" cy="190" r="10" fill="#153452"/><text x="720" y="197" font-size="18" font-weight="700" fill="#153452" text-anchor="start">ボン</text><circle cx="660" cy="250" r="16" fill="#8a5aa8"/><rect x="352" y="216" width="280" height="66" rx="12" fill="white"/><text x="368" y="244" font-size="22" font-weight="700" fill="#8a5aa8" text-anchor="start">アール</text><text x="368" y="272" font-size="18" fill="#405a71" text-anchor="start">約530ha・赤ワイン</text><circle cx="720" cy="340" r="16" fill="#2f8a64"/><rect x="748" y="306" width="280" height="66" rx="12" fill="white"/><text x="764" y="334" font-size="22" font-weight="700" fill="#2f8a64" text-anchor="start">ミッテルライン</text><text x="764" y="362" font-size="18" fill="#405a71" text-anchor="start">約460ha・最小級</text><circle cx="460" cy="380" r="16" fill="#2d6a9f"/><rect x="152" y="346" width="280" height="66" rx="12" fill="white"/><text x="168" y="374" font-size="22" font-weight="700" fill="#2d6a9f" text-anchor="start">モーゼル</text><text x="168" y="402" font-size="18" fill="#405a71" text-anchor="start">白ワインの割合が最も高い</text><circle cx="665" cy="460" r="16" fill="#c9952a"/><rect x="357" y="426" width="280" height="66" rx="12" fill="white"/><text x="373" y="454" font-size="22" font-weight="700" fill="#c9952a" text-anchor="start">ラインヘッセン</text><text x="373" y="482" font-size="18" fill="#405a71" text-anchor="start">約2万7,500ha・最大</text><circle cx="660" cy="560" r="16" fill="#b5473a"/><rect x="352" y="526" width="280" height="66" rx="12" fill="white"/><text x="368" y="554" font-size="22" font-weight="700" fill="#b5473a" text-anchor="start">プファルツ</text><text x="368" y="582" font-size="18" fill="#405a71" text-anchor="start">約2万3,800ha</text><rect x="900" y="460" width="240" height="130" rx="16" fill="#ffffff"/><text x="1020" y="505" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">全国のぶどう畑</text><text x="1020" y="550" font-size="26" font-weight="700" fill="#2f8a64" text-anchor="middle">約10万2,000ha</text><text x="1020" y="578" font-size="16" fill="#5b7086" text-anchor="middle">（2025年）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">ドイツワイン協会、連邦統計局の資料に基づく概略図。位置・境界は正確ではありません</text></g></svg>