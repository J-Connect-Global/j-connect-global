<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">支払い件数の割合の変化</title><desc id="d">ドイツ連邦銀行の調査で、支払い件数のうち現金の割合が2023年の51%から2025年の45%に下がり、モバイル決済が6%から10%に増えたこと、2025年の金額ベースではデビットカードが28%で1位であることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">支払いの件数：現金は51%から45%へ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ドイツ連邦銀行の調査（記録された買い物の件数の割合）</text><rect x="60" y="180" width="1080" height="330" rx="20" fill="white"/><text x="60" y="263" font-size="28" font-weight="700" fill="#153452" text-anchor="start">2023年</text><rect x="200" y="215" width="455" height="80" rx="10" fill="#c9952a"/><text x="427" y="265" font-size="22" font-weight="700" fill="white" text-anchor="middle">現金 51%</text><rect x="659" y="215" width="50" height="80" rx="10" fill="#2f8a64"/><text x="684" y="265" font-size="22" font-weight="700" fill="white" text-anchor="middle">6%</text><rect x="713" y="215" width="383" height="80" rx="10" fill="#9aa5b1"/><text x="904" y="265" font-size="22" font-weight="700" fill="white" text-anchor="middle">その他 43%</text><text x="60" y="393" font-size="28" font-weight="700" fill="#153452" text-anchor="start">2025年</text><rect x="200" y="345" width="401" height="80" rx="10" fill="#c9952a"/><text x="400" y="395" font-size="22" font-weight="700" fill="white" text-anchor="middle">現金 45%</text><rect x="605" y="345" width="86" height="80" rx="10" fill="#2f8a64"/><text x="648" y="395" font-size="22" font-weight="700" fill="white" text-anchor="middle">10%</text><rect x="695" y="345" width="401" height="80" rx="10" fill="#9aa5b1"/><text x="895" y="395" font-size="22" font-weight="700" fill="white" text-anchor="middle">その他 45%</text><rect x="200" y="455" width="22" height="22" rx="5" fill="#c9952a"/><text x="232" y="474" font-size="20" fill="#29465f" text-anchor="start">現金</text><rect x="320" y="455" width="22" height="22" rx="5" fill="#2f8a64"/><text x="352" y="474" font-size="20" fill="#29465f" text-anchor="start">モバイル決済</text><rect x="510" y="455" width="22" height="22" rx="5" fill="#9aa5b1"/><text x="542" y="474" font-size="20" fill="#29465f" text-anchor="start">デビットカード・ネット決済など</text><rect x="60" y="530" width="1080" height="70" rx="14" fill="#fff7e6"/><text x="600" y="575" font-size="22" fill="#8a5a00" text-anchor="middle">2025年の金額ベースでは、デビットカード28%、現金23%、振込23%</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ連邦銀行「ドイツの支払い行動」2023年・2025年（2026年10月27日参照）</text></g></svg>