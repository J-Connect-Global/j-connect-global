<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>保管期限：7日と9日を分ける</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">保管期限：7日と9日を分ける</text><text x="48" y="178" font-size="27" fill="#52666C">通知に表示された、その荷物の受取期限を優先する</text><rect x="48" y="209" width="1104" height="172" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="172" rx="18" fill="#146859"/><text x="81" y="264" font-size="38" fill="#173B48">通常のロッカー宛て：7暦日</text><text x="81" y="312" font-size="33" fill="#52666C">入庫日を含む。土日も数える</text><rect x="48" y="397" width="1104" height="172" rx="18" fill="#FFFFFF"/><rect x="48" y="397" width="12" height="172" rx="18" fill="#146859"/><text x="81" y="452" font-size="38" fill="#173B48">自宅で受け取れず移送：9暦日</text><text x="81" y="500" font-size="33" fill="#52666C">通常の延長は不可。期限後は差出人へ返送</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect編集部  |  2026-10-19</text></g></svg>