<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツ国籍の取得と永住許可の比較</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツ国籍の取得と永住許可　日本人の場合</text><text x="48" y="152" font-size="23" fill="#52666C">最大の違いは日本国籍。自分の意思で外国籍を取ると日本国籍を失います</text><rect x="400" y="176" width="360" height="54" rx="10" fill="#173B48"/><text x="420" y="212" font-size="26" fill="#FFFFFF">ドイツ国籍の取得</text><rect x="780" y="176" width="372" height="54" rx="10" fill="#146859"/><text x="800" y="212" font-size="26" fill="#FFFFFF">永住許可</text><rect x="48" y="230" width="1104" height="56" fill="#FFFFFF"/><text x="72" y="267" font-size="24" fill="#52666C">日本国籍</text><text x="420" y="267" font-size="26" fill="#C2410C">失う</text><text x="800" y="267" font-size="26" fill="#173B48">そのまま</text><rect x="48" y="286" width="1104" height="56" fill="#F9F8F3"/><text x="72" y="323" font-size="24" fill="#52666C">滞在期間</text><text x="420" y="323" font-size="26" fill="#173B48">原則5年</text><text x="800" y="323" font-size="26" fill="#173B48">原則5年など</text><rect x="48" y="342" width="1104" height="56" fill="#FFFFFF"/><text x="72" y="379" font-size="24" fill="#52666C">ドイツの選挙権</text><text x="420" y="379" font-size="26" fill="#173B48">あり</text><text x="800" y="379" font-size="26" fill="#173B48">なし</text><rect x="48" y="398" width="1104" height="56" fill="#F9F8F3"/><text x="72" y="435" font-size="24" fill="#52666C">EU内の移動</text><text x="420" y="435" font-size="26" fill="#173B48">自由</text><text x="800" y="435" font-size="26" fill="#173B48">国ごとに手続き</text><rect x="48" y="454" width="1104" height="56" fill="#FFFFFF"/><text x="72" y="491" font-size="24" fill="#52666C">長期の国外滞在</text><text x="420" y="491" font-size="26" fill="#173B48">影響なし</text><text x="800" y="491" font-size="26" fill="#B8661F">6か月超で失効あり</text><rect x="48" y="510" width="1104" height="56" fill="#F9F8F3"/><text x="72" y="547" font-size="24" fill="#52666C">手数料</text><text x="420" y="547" font-size="26" fill="#173B48">255ユーロ</text><text x="800" y="547" font-size="26" fill="#173B48">113ユーロ</text><text x="48" y="616" font-size="22" fill="#173B48">ドイツ人の配偶者は、国籍の取得も永住許可も3年で申請できる場合があります。</text><text x="48" y="656" font-size="19" fill="#52666C">図解：J-Connect  |  根拠：ドイツ国籍法第9条・第10条・第38条、滞在法第9条・第51条、日本の国籍法第11条  |  2026-11-06</text></g></svg>
