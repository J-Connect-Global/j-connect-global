<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">エッセン・モーターショー2026のホール構成</title><desc id="d">第1・第2ホールが旧車、第3・5・6・7ホールが性能を高めた車と改造・ライフスタイル、第8ホールがモータースポーツであることと、関心に合わせた回り方の例を示した図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">エッセン・モーターショー2026：ホールの構成</text><text x="60" y="134" font-size="22" fill="#405a71">分野ごとに分かれた会場を、見たいものから回る</text><rect x="60" y="170" width="1080" height="430" rx="16" fill="white"/><rect x="90" y="210" width="300" height="170" rx="14" fill="#2f6a40"/><text x="240.0" y="260" font-size="22" fill="#f6efe6" text-anchor="middle">第1・第2ホール</text><text x="240.0" y="305" font-size="27" font-weight="700" fill="white" text-anchor="middle">旧車</text><text x="240.0" y="347" font-size="18" fill="#f6efe6" text-anchor="middle">2026年から新しい形に</text><rect x="420" y="210" width="420" height="170" rx="14" fill="#b5473a"/><text x="630.0" y="260" font-size="22" fill="#f6efe6" text-anchor="middle">第3・5・6・7ホール</text><text x="630.0" y="305" font-size="27" font-weight="700" fill="white" text-anchor="middle">性能・改造・ライフスタイル</text><text x="630.0" y="347" font-size="18" fill="#f6efe6" text-anchor="middle">部品、ホイール、仕上げの技術</text><rect x="870" y="210" width="240" height="170" rx="14" fill="#153452"/><text x="990.0" y="260" font-size="22" fill="#f6efe6" text-anchor="middle">第8ホール</text><text x="990.0" y="305" font-size="27" font-weight="700" fill="white" text-anchor="middle">モータースポーツ</text><text x="990.0" y="347" font-size="18" fill="#f6efe6" text-anchor="middle">レースチームと競技車両</text><rect x="90" y="410" width="1020" height="160" rx="14" fill="#f3ede4"/><text x="120" y="455" font-size="21" fill="#153452">車に詳しくなくても → 旧車のホールでデザインの移り変わりを</text><text x="120" y="499" font-size="21" fill="#153452">レースが好き → 第8ホールで競技車両とチームを間近に</text><text x="120" y="543" font-size="21" fill="#153452">自分の車を手入れしたい → 改造・部品のホールで技術を見比べる</text><text x="60" y="645" font-size="18" fill="#405a71">主催者の2026年の発表に基づく。ホールの割り当ては変わることがある（2026年10月30日参照）</text></g></svg>