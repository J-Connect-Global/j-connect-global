<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">クラインガルテンの決まりと目安</title><desc id="d">庭の小屋は屋根のあるテラスを含めて床面積24平方メートルまでで住むことはできないこと、庭は少なくとも3分の1を畑、3分の1を休む場所、3分の1を小屋や通路に使うのが目安であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#f2f5ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">クラインガルテンの決まりと目安</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">連邦市民農園法とドイツ市民農園連盟の資料から</text><rect x="60" y="180" width="520" height="420" rx="16" fill="white"/><rect x="150" y="240" width="340" height="240" fill="#e6efd9" stroke="#9fb67a" stroke-width="4"/><polygon points="190,360 270,300 350,360" fill="#b5473a"/><rect x="205" y="360" width="130" height="90" fill="#c9a77a"/><rect x="255" y="395" width="30" height="55" fill="#8d5a3c"/><rect x="335" y="400" width="90" height="50" fill="none" stroke="#8d5a3c" stroke-width="4" stroke-dasharray="8 6"/><text x="320" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">小屋（Laube）</text><text x="320" y="520" font-size="21" fill="#29465f" text-anchor="middle">屋根のあるテラスを含めて</text><text x="320" y="560" font-size="26" font-weight="700" fill="#b5473a" text-anchor="middle">24㎡まで・住むのは不可</text><rect x="620" y="180" width="520" height="420" rx="16" fill="white"/><text x="880" y="225" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">庭の使い方の目安</text><rect x="660" y="260" width="440" height="88" rx="12" fill="#6f8f4f"/><text x="690" y="300" font-size="23" font-weight="700" fill="white" text-anchor="start">畑（野菜・果物）</text><text x="690" y="332" font-size="20" fill="white" text-anchor="start">少なくとも3分の1</text><rect x="660" y="365" width="440" height="88" rx="12" fill="#9fb67a"/><text x="690" y="405" font-size="23" font-weight="700" fill="white" text-anchor="start">休む場所（芝生など）</text><text x="690" y="437" font-size="20" fill="white" text-anchor="start">3分の1</text><rect x="660" y="470" width="440" height="88" rx="12" fill="#c9a77a"/><text x="690" y="510" font-size="23" font-weight="700" fill="white" text-anchor="start">小屋・通路</text><text x="690" y="542" font-size="20" fill="white" text-anchor="start">3分の1</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦市民農園法 第3条、ドイツ市民農園連盟。細かい規則は各協会の「庭の規則」で決まる</text></g></svg>