<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">任意の申告と義務の申告</title><desc id="d">給与だけの会社員の多くは任意申告では4年間の期限がある、夫婦双方が給与、片方がV/VI・IV係数や別の収入がある人などは申告の義務があり別のルールになることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">あなたの申告はどっち？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">自分から出す申告と、出す義務がある申告</text><rect x="60" y="175" width="530" height="420" rx="16" fill="white"/><rect x="60" y="175" width="530" height="62" rx="16" fill="#2f8a64"/><rect x="60" y="215" width="530" height="22" rx="0" fill="#2f8a64"/><text x="325" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">自分から出す申告（任意）</text><text x="95" y="285" font-size="20" fill="#29465f" text-anchor="start">給与だけの会社員の多く</text><text x="95" y="347" font-size="20" fill="#29465f" text-anchor="start">払いすぎた税金が戻ることがある</text><text x="95" y="409" font-size="20" fill="#29465f" text-anchor="start">期限：4年以内（延長不可）</text><text x="95" y="471" font-size="20" fill="#29465f" text-anchor="start">例：年の途中で赴任・帰国した</text><rect x="610" y="175" width="530" height="420" rx="16" fill="white"/><rect x="610" y="175" width="530" height="62" rx="16" fill="#b5473a"/><rect x="610" y="215" width="530" height="22" rx="0" fill="#b5473a"/><text x="875" y="217" font-size="24" font-weight="700" fill="white" text-anchor="middle">出す義務がある申告</text><text x="645" y="285" font-size="20" fill="#29465f" text-anchor="start">税区分V/VIまたはIVの係数方式の夫婦</text><text x="645" y="347" font-size="20" fill="#29465f" text-anchor="start">同時に複数の勤務先から給与</text><text x="645" y="409" font-size="20" fill="#29465f" text-anchor="start">一定額を超える別収入・給付</text><text x="645" y="471" font-size="20" fill="#29465f" text-anchor="start">期限や遅れたときの扱いが別</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ELSTER、所得税法第46条、NRW州財務行政（2026年11月1日参照）</text></g></svg>