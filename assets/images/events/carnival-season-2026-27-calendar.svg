<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026/27年カーニバルシーズンの流れ</title><desc id="d">2026年11月11日11時11分のシーズン開始、11月12日から1月6日までのお休み、1月からの催し再開、2027年2月4日の女性のカーニバルの日、2月8日のバラの月曜日、2月10日の灰の水曜日までの流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#fbf4ef"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">2026/27年 カーニバルシーズンの流れ</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">11月11日に開会、本番は2月</text><rect x="60" y="200" width="165" height="300" rx="16" fill="white"/><rect x="60" y="200" width="165" height="80" rx="16" fill="#b5473a"/><rect x="60" y="260" width="165" height="20" rx="0" fill="#b5473a"/><text x="142" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">11/11（水）</text><text x="142" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">11時11分</text><text x="142" y="420" font-size="20" fill="#405a71" text-anchor="middle">シーズン</text><text x="142" y="452" font-size="20" fill="#405a71" text-anchor="middle">開始</text><polygon points="227,375 237,385 227,395" fill="#9fb6cc"/><rect x="240" y="200" width="165" height="300" rx="16" fill="white"/><rect x="240" y="200" width="165" height="80" rx="16" fill="#9fb6cc"/><rect x="240" y="260" width="165" height="20" rx="0" fill="#9fb6cc"/><text x="322" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">11/12〜1/6</text><text x="322" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">お休み</text><text x="322" y="420" font-size="20" fill="#405a71" text-anchor="middle">待降節・</text><text x="322" y="452" font-size="20" fill="#405a71" text-anchor="middle">クリスマス</text><polygon points="407,375 417,385 407,395" fill="#9fb6cc"/><rect x="420" y="200" width="165" height="300" rx="16" fill="white"/><rect x="420" y="200" width="165" height="80" rx="16" fill="#c9952a"/><rect x="420" y="260" width="165" height="20" rx="0" fill="#c9952a"/><text x="502" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">1月〜</text><text x="502" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">催し再開</text><text x="502" y="420" font-size="20" fill="#405a71" text-anchor="middle">各団体の</text><text x="502" y="452" font-size="20" fill="#405a71" text-anchor="middle">集まり</text><polygon points="587,375 597,385 587,395" fill="#9fb6cc"/><rect x="600" y="200" width="165" height="300" rx="16" fill="white"/><rect x="600" y="200" width="165" height="80" rx="16" fill="#8a5aa8"/><rect x="600" y="260" width="165" height="20" rx="0" fill="#8a5aa8"/><text x="682" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">2/4（木）</text><text x="682" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">女性の日</text><text x="682" y="420" font-size="20" fill="#405a71" text-anchor="middle">街頭の</text><text x="682" y="452" font-size="20" fill="#405a71" text-anchor="middle">お祭り開始</text><polygon points="767,375 777,385 767,395" fill="#9fb6cc"/><rect x="780" y="200" width="165" height="300" rx="16" fill="white"/><rect x="780" y="200" width="165" height="80" rx="16" fill="#b5473a"/><rect x="780" y="260" width="165" height="20" rx="0" fill="#b5473a"/><text x="862" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">2/8（月）</text><text x="862" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">バラの月曜日</text><text x="862" y="420" font-size="20" fill="#405a71" text-anchor="middle">大きな</text><text x="862" y="452" font-size="20" fill="#405a71" text-anchor="middle">行列</text><polygon points="947,375 957,385 947,395" fill="#9fb6cc"/><rect x="960" y="200" width="165" height="300" rx="16" fill="white"/><rect x="960" y="200" width="165" height="80" rx="16" fill="#405a71"/><rect x="960" y="260" width="165" height="20" rx="0" fill="#405a71"/><text x="1042" y="250" font-size="21" font-weight="700" fill="white" text-anchor="middle">2/10（水）</text><text x="1042" y="360" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">灰の水曜日</text><text x="1042" y="420" font-size="20" fill="#405a71" text-anchor="middle">終わり・</text><text x="1042" y="452" font-size="20" fill="#405a71" text-anchor="middle">断食へ</text><rect x="60" y="530" width="1080" height="56" rx="14" fill="#fff3f0"/><text x="600" y="567" font-size="21" fill="#7a2e24" text-anchor="middle">2027年の復活祭は3月28日。カーニバルの日程は毎年、復活祭に合わせて変わります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：LVR地域研究所、ケルン市（2026年10月26日参照）</text></g></svg>