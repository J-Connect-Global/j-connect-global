<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">BundIDのオンライン本人確認のしくみ</title><desc id="d">電子滞在許可証、AusweisApp、BundID対応行政サービスの3つの関係。本人が送信先とデータ項目を確認し、PINを入力して承認する。</desc>
<rect width="1200" height="675" rx="28" fill="#ecf3f6"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif">
<text x="55" y="70" font-size="38" font-weight="700" fill="#16354a">オンラインで本人確認するしくみ</text><text x="55" y="107" font-size="20" fill="#456573">eAT（電子滞在許可証）とBundID</text>
<g transform="translate(58 160)"><rect width="330" height="345" rx="22" fill="#fff"/><rect width="330" height="57" rx="20" fill="#315f83"/><text x="165" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">電子滞在許可証</text><rect x="55" y="108" width="220" height="145" rx="15" fill="#e0e9ee" stroke="#315f83" stroke-width="4"/><circle cx="105" cy="160" r="23" fill="#789bb2"/><path d="M73 207Q105 174 137 207" fill="#789bb2"/><path d="M160 150H245M160 180H245M160 210H223" stroke="#789bb2" stroke-width="10" stroke-linecap="round"/><text x="165" y="303" text-anchor="middle" font-size="21" fill="#16354a">カード内の情報</text></g>
<g transform="translate(435 160)"><rect width="330" height="345" rx="22" fill="#fff"/><rect width="330" height="57" rx="20" fill="#227889"/><text x="165" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">AusweisApp</text><rect x="112" y="85" width="106" height="180" rx="17" fill="#244756"/><rect x="124" y="100" width="82" height="147" rx="10" fill="#e5f2ee"/><path d="M143 164l17 18 30-38" fill="none" stroke="#227889" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="303" text-anchor="middle" font-size="21" fill="#16354a">読み取り・PIN入力</text></g>
<g transform="translate(812 160)"><rect width="330" height="345" rx="22" fill="#fff"/><rect width="330" height="57" rx="20" fill="#315f83"/><text x="165" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">対応する行政サービス</text><path d="M60 140L165 88L270 140Z" fill="#315f83"/><rect x="74" y="140" width="182" height="18" fill="#789bb2"/><g fill="#789bb2"><rect x="91" y="160" width="25" height="90"/><rect x="152" y="160" width="25" height="90"/><rect x="213" y="160" width="25" height="90"/></g><path d="M66 252H264" stroke="#315f83" stroke-width="12"/><text x="165" y="303" text-anchor="middle" font-size="21" fill="#16354a">本人確認が完了</text></g>
<g fill="#227889"><path d="M395 325h25v-12l18 20-18 20v-12h-25z"/><path d="M772 325h25v-12l18 20-18 20v-12h-25z"/></g>
<rect x="58" y="535" width="1084" height="85" rx="15" fill="#d7eaf0"/><text x="600" y="571" font-size="23" text-anchor="middle" font-weight="700" fill="#16354a">本人が送信先と情報を確認してから承認する</text><text x="600" y="602" font-size="18" text-anchor="middle" fill="#456573">実際の身分証やアプリ画面を再現したものではありません。</text>
</g></svg>
