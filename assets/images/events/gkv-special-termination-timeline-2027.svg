<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">特別解約権のタイムライン</title><desc id="d">1月1日に追加保険料率が上がる場合、1月31日までに新しい保険組合へ申し込み、3月31日に退会、4月1日から新しい保険組合へ移る流れを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">値上げのときの乗り換えスケジュール（例）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">2027年1月1日から追加保険料率が上がった場合（SGB V §175第4項）</text><rect x="100" y="318" width="1000" height="10" rx="5" fill="#9fb6cb"/><circle cx="130" cy="323" r="22" fill="#b5473a"/><text x="130" y="270" font-size="28" font-weight="700" fill="#b5473a" text-anchor="middle">1月1日</text><text x="130" y="395" font-size="22" fill="#29465f" text-anchor="middle">値上げ後の率が</text><text x="130" y="428" font-size="22" fill="#29465f" text-anchor="middle">適用開始</text><circle cx="420" cy="323" r="22" fill="#c9952a"/><text x="420" y="270" font-size="28" font-weight="700" fill="#c9952a" text-anchor="middle">1月31日まで</text><text x="420" y="395" font-size="22" fill="#29465f" text-anchor="middle">新しい組合に</text><text x="420" y="428" font-size="22" fill="#29465f" text-anchor="middle">加入を申し込む</text><circle cx="730" cy="323" r="22" fill="#2d6a9f"/><text x="730" y="270" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="middle">3月31日</text><text x="730" y="395" font-size="22" fill="#29465f" text-anchor="middle">元の組合を</text><text x="730" y="428" font-size="22" fill="#29465f" text-anchor="middle">退会（翌々月末）</text><circle cx="1030" cy="323" r="22" fill="#2f8a64"/><text x="1030" y="270" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="middle">4月1日</text><text x="1030" y="395" font-size="22" fill="#29465f" text-anchor="middle">新しい組合で</text><text x="1030" y="428" font-size="22" fill="#29465f" text-anchor="middle">加入スタート</text><rect x="100" y="480" width="1000" height="110" rx="18" fill="white"/><text x="130" y="525" font-size="22" fill="#29465f" text-anchor="start">・1月〜3月は上がった率で保険料を払う</text><text x="130" y="565" font-size="22" fill="#29465f" text-anchor="start">・新しい組合への申込みが、元の組合への解約の代わりになる</text><text x="60" y="640" font-size="18" fill="#5b7086" text-anchor="start">図解：J-Connect。SGB V §175第4項に基づく例。勤務先への連絡も忘れずに。</text></g></svg>