<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ビザなしで入国して滞在許可を申請する流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ビザなしで入国して滞在許可を取る流れ</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">ビザなしでドイツに入国</text><text x="128" y="213" font-size="20" fill="#52666C">日本国籍者は長期滞在の目的でも可（滞在令第41条）</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">住まいを決めて住民登録</text><text x="128" y="303" font-size="20" fill="#52666C">外国人局は登録した住所で決まる</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">健康保険に加入する</text><text x="128" y="393" font-size="20" fill="#52666C">どの滞在許可でも加入が条件</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">入国から90日以内に申請</text><text x="128" y="483" font-size="20" fill="#52666C">予約が取れなくても申請の記録を残す</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">電子滞在カードを受け取る</text><text x="128" y="573" font-size="20" fill="#52666C">働ける範囲を確認してから仕事を始める</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">例外に注意</text><text x="788" y="268" font-size="32" fill="#173B48">ICTカードと</text><text x="788" y="312" font-size="32" fill="#173B48">チャンスカード</text><text x="788" y="372" font-size="21" fill="#52666C">企業内転勤のICTカードは</text><text x="788" y="404" font-size="21" fill="#52666C">日本でビザを取ってから入国</text><text x="788" y="436" font-size="21" fill="#52666C">チャンスカードは、ドイツ国内</text><text x="788" y="468" font-size="21" fill="#52666C">では学生・就労の許可を持つ</text><text x="788" y="500" font-size="21" fill="#52666C">人だけが申請できます</text><text x="48" y="622" font-size="22" fill="#173B48">許可が出るまでは原則として働けません。手数料は新規取得で原則100ユーロです。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在令第41条・第45条、滞在法第20a条  |  2026-11-06</text></g></svg>