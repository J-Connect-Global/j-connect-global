<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>育児給付の分け方の例</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">両親での分け方の一例（生後月）</text><text x="48" y="152" font-size="23" fill="#52666C">月は誕生日から数える「生後月」。両親が同じ月に基本給付を受けられるのは1か月だけ</text><text x="300" y="196" font-size="20" fill="#52666C">生後月 →</text><text x="328" y="222" font-size="19" fill="#52666C" text-anchor="middle">1</text><text x="384" y="222" font-size="19" fill="#52666C" text-anchor="middle">2</text><text x="440" y="222" font-size="19" fill="#52666C" text-anchor="middle">3</text><text x="496" y="222" font-size="19" fill="#52666C" text-anchor="middle">4</text><text x="552" y="222" font-size="19" fill="#52666C" text-anchor="middle">5</text><text x="608" y="222" font-size="19" fill="#52666C" text-anchor="middle">6</text><text x="664" y="222" font-size="19" fill="#52666C" text-anchor="middle">7</text><text x="720" y="222" font-size="19" fill="#52666C" text-anchor="middle">8</text><text x="776" y="222" font-size="19" fill="#52666C" text-anchor="middle">9</text><text x="832" y="222" font-size="19" fill="#52666C" text-anchor="middle">10</text><text x="888" y="222" font-size="19" fill="#52666C" text-anchor="middle">11</text><text x="944" y="222" font-size="19" fill="#52666C" text-anchor="middle">12</text><text x="1000" y="222" font-size="19" fill="#52666C" text-anchor="middle">13</text><text x="1056" y="222" font-size="19" fill="#52666C" text-anchor="middle">14</text><line x1="300" y1="236" x2="300" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="356" y1="236" x2="356" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="412" y1="236" x2="412" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="468" y1="236" x2="468" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="524" y1="236" x2="524" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="580" y1="236" x2="580" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="636" y1="236" x2="636" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="692" y1="236" x2="692" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="748" y1="236" x2="748" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="804" y1="236" x2="804" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="860" y1="236" x2="860" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="916" y1="236" x2="916" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="972" y1="236" x2="972" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="1028" y1="236" x2="1028" y2="430" stroke="#E2E4DD" stroke-width="2"/><line x1="1084" y1="236" x2="1084" y2="430" stroke="#E2E4DD" stroke-width="2"/><text x="48" y="292" font-size="28" fill="#173B48">母親</text><text x="48" y="392" font-size="28" fill="#173B48">父親</text><rect x="303" y="250" width="106" height="64" rx="10" fill="#B8661F"/><text x="356" y="290" font-size="21" fill="#FFFFFF" text-anchor="middle">出産手当</text><rect x="415" y="250" width="442" height="64" rx="10" fill="#146859"/><text x="636" y="290" font-size="21" fill="#FFFFFF" text-anchor="middle">基本給付</text><rect x="863" y="250" width="218" height="64" rx="10" fill="#3F7391"/><text x="972" y="290" font-size="21" fill="#FFFFFF" text-anchor="middle">ボーナス</text><rect x="359" y="350" width="50" height="64" rx="10" fill="#146859"/><text x="384" y="390" font-size="21" fill="#FFFFFF" text-anchor="middle">基本</text><rect x="863" y="350" width="218" height="64" rx="10" fill="#3F7391"/><text x="972" y="390" font-size="21" fill="#FFFFFF" text-anchor="middle">ボーナス</text><g font-size="21" fill="#173B48"><rect x="48" y="462" width="22" height="22" rx="4" fill="#B8661F"/><text x="80" y="481">出産手当（基本給付の月として数え、金額は差し引き）</text><rect x="48" y="500" width="22" height="22" rx="4" fill="#146859"/><text x="80" y="519">基本給付：仕事を休む月（両親で合計14か月まで）</text><rect x="48" y="538" width="22" height="22" rx="4" fill="#3F7391"/><text x="80" y="557">パートナーボーナス：2人とも週24〜32時間働く月（1人最大4か月）</text></g><text x="48" y="610" font-size="21" fill="#173B48">この例では基本給付を11か月分使い、残り3か月分はElterngeldPlus（6か月）に回せます。</text><text x="48" y="652" font-size="19" fill="#52666C">図解：J-Connect  |  根拠：連邦両親手当・育児休業法第3条・第4条・第4b条  |  一例です  |  2026-11-06</text></g></svg>
