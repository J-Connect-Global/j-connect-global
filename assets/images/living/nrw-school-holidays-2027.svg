<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">NRWの学校休暇 2026年秋から2027年夏</title><desc id="desc">秋休みは2026年10月17日から31日、クリスマス休暇は12月23日から2027年1月6日、春休みは3月22日から4月3日、聖霊降臨祭の休暇は5月18日、夏休みは7月19日から8月31日。</desc><rect width="1200" height="470" rx="28" fill="#f7f5ef"/><text x="48" y="58" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#203b4b">NRWの学校休暇｜2026年秋〜2027年夏</text><g font-family="Arial,sans-serif"><rect x="48" y="94" width="1104" height="64" rx="14" fill="#e0ebf2"/><text x="76" y="135" font-size="24" font-weight="700" fill="#203b4b">秋休み</text><text x="370" y="135" font-size="24" fill="#203b4b">2026年10月17日〜10月31日</text><rect x="48" y="174" width="1104" height="64" rx="14" fill="#e7eee7"/><text x="76" y="215" font-size="24" font-weight="700" fill="#203b4b">クリスマス</text><text x="370" y="215" font-size="24" fill="#203b4b">2026年12月23日〜2027年1月6日</text><rect x="48" y="254" width="1104" height="64" rx="14" fill="#f3e7d5"/><text x="76" y="295" font-size="24" font-weight="700" fill="#203b4b">春休み</text><text x="370" y="295" font-size="24" fill="#203b4b">2027年3月22日〜4月3日</text><rect x="48" y="334" width="1104" height="64" rx="14" fill="#f4e0dc"/><text x="76" y="375" font-size="24" font-weight="700" fill="#203b4b">聖霊降臨祭</text><text x="370" y="375" font-size="24" fill="#203b4b">2027年5月18日（1日）</text><rect x="48" y="414" width="1104" height="38" rx="12" fill="#203b4b"/><text x="600" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">夏休み：2027年7月19日〜8月31日｜学校ごとの移動休日は別途確認</text></g></svg>