<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ブルーカードの条件</title><desc id="d">EUブルーカードの主な条件は、ドイツの大学と同等と認められる学歴、学歴に合った専門職の仕事、2026年は原則5万700ユーロ以上の年収、ドイツの会社との雇用契約の4つであることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">EUブルーカードの主な条件</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">4つをそろえて、外国人局で申請する</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">学歴</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">ドイツの大学と同等と認められる</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">大学の卒業（ITは経験で代わる場合も）</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#2f8a64"/><text x="646" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">仕事の内容</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">学歴に合った</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">専門職の仕事</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#c9952a"/><text x="96" y="443" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">年収</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">2026年は原則5万700ユーロ以上</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">人手不足の職業などは4万5,934.20ユーロ以上</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#8a5aa8"/><text x="646" y="443" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">雇用契約</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">ドイツの会社との</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">雇用契約か内定</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：Make it in Germany、滞在法第18g条（2026年10月29日参照）</text></g></svg>