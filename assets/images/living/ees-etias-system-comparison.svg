<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">EESとETIASの違い</title>
  <desc id="desc">EESは国境で入出国を電子記録する仕組み、ETIASは対象となるビザ免除旅行者が出発前に取得する渡航認証です。2026年10月28日時点でETIASは申請受付前です。</desc>
  <rect width="1200" height="650" rx="28" fill="#f4f6f8"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#243447">EESとETIASは役割が違う</text>
  <rect x="60" y="105" width="520" height="440" rx="22" fill="#ffffff" stroke="#2d6a8a" stroke-width="3"/>
  <rect x="620" y="105" width="520" height="440" rx="22" fill="#ffffff" stroke="#2f7b72" stroke-width="3"/>
  <rect x="60" y="105" width="520" height="84" rx="22" fill="#2d6a8a"/>
  <rect x="620" y="105" width="520" height="84" rx="22" fill="#2f7b72"/>
  <text x="320" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">EES</text>
  <text x="880" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">ETIAS</text>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#243447">国境で行う</text>
  <text x="100" y="275" font-family="Arial, sans-serif" font-size="20" fill="#243447">・入国・出国を電子記録</text>
  <text x="100" y="312" font-family="Arial, sans-serif" font-size="20" fill="#243447">・顔画像や指紋を登録・照合</text>
  <text x="100" y="349" font-family="Arial, sans-serif" font-size="20" fill="#243447">・2026年4月10日から全面運用</text>
  <rect x="95" y="398" width="450" height="95" rx="14" fill="#eaf2f7"/>
  <text x="320" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2d6a8a">事前申請・申請料は不要</text>
  <text x="320" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#243447">対象者は国境で手続き</text>
  <text x="660" y="235" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#243447">出発前に取得する認証</text>
  <text x="660" y="275" font-family="Arial, sans-serif" font-size="20" fill="#243447">・ビザ免除の短期旅行者が対象</text>
  <text x="660" y="312" font-family="Arial, sans-serif" font-size="20" fill="#243447">・パスポートにひもづく渡航認証</text>
  <text x="660" y="349" font-family="Arial, sans-serif" font-size="20" fill="#243447">・通常90日／180日の短期滞在</text>
  <rect x="655" y="398" width="450" height="95" rx="14" fill="#e8f4f1"/>
  <text x="880" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2f7b72">2026年10月28日時点</text>
  <text x="880" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#243447">まだ申請受付前・開始日未公表</text>
  <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526171">渡航前にEU公式サイトで最新の対象・開始状況を確認してください</text>
</svg>
