<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">学校の4つの選び方</title><desc id="d">現地校はドイツ語で授業料無料、日本人学校は日本語で日本の学校と同じ内容、補習授業校は現地校に通いながら日本語で学ぶ、インターナショナルスクールは主に英語という4つの選び方を比べた図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">子どもの学校、4つの選び方</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">授業の言葉と、帰国の予定で考える</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">現地校（公立）</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">ドイツ語で授業</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">授業料は無料（教材費などは別）</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#b5473a"/><text x="646" y="228" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">日本人学校</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">日本語で、日本の学校と同じ内容</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">授業料あり</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#2f8a64"/><text x="96" y="443" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">補習授業校</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">現地校などに通いながら</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">週末などに日本語で学ぶ</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#8a5aa8"/><text x="646" y="443" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">インターナショナルスクール</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">主に英語で授業</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">授業料は高め</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：NRW州学校省、海外子女教育振興財団（2026年10月29日参照）</text></g></svg>