<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ベルリンの主な五つのクリスマスマーケットの特徴</title><desc id="d">ジャンダルメンマルクトは白いテントと舞台で入場料あり、シャルロッテンブルク宮殿前は2007年からの宮殿の市、赤の市庁舎前は観覧車とスケートリンク、記念教会前は100を超える屋台と追悼の場、ルチア市は北欧風の市であることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ベルリンの五つの市、それぞれの物語</text><text x="60" y="134" font-size="22" fill="#405a71">背景にある建物と広場が、市の性格を決める</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="80" y="190" width="195" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(178,300)"><polygon points="-56,0 -28,-44 0,0" fill="#ffffff" stroke="#c9b8a3" stroke-width="3"/><polygon points="0,0 28,-44 56,0" fill="#ffffff" stroke="#c9b8a3" stroke-width="3"/><rect x="-56" y="0" width="112" height="48" fill="#fff6dd" stroke="#c9b8a3" stroke-width="3"/><circle cx="-28" cy="24" r="6" fill="#e5b93a"/><circle cx="28" cy="24" r="6" fill="#e5b93a"/></g><text x="178" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">白いテントの市</text><text x="178" y="450" font-size="16" fill="#405a71" text-anchor="middle">ジャンダルメンマルクト</text><text x="178" y="480" font-size="16" fill="#405a71" text-anchor="middle">劇場前の舞台</text><text x="178" y="510" font-size="16" fill="#405a71" text-anchor="middle">入場2ユーロ</text><rect x="291" y="190" width="195" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(389,300)"><rect x="-64" y="-10" width="128" height="60" fill="#d9c7a6"/><ellipse cx="0" cy="-14" rx="18" ry="16" fill="#3e7a6b"/><rect x="-4" y="-48" width="8" height="20" fill="#3e7a6b"/><g fill="#8a6a54"><rect x="-52" y="4" width="10" height="16"/><rect x="-30" y="4" width="10" height="16"/><rect x="20" y="4" width="10" height="16"/><rect x="42" y="4" width="10" height="16"/></g><rect x="-10" y="20" width="20" height="30" fill="#8a6a54"/></g><text x="389" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">宮殿前の市</text><text x="389" y="450" font-size="16" fill="#405a71" text-anchor="middle">シャルロッテンブルク</text><text x="389" y="480" font-size="16" fill="#405a71" text-anchor="middle">2007年から</text><text x="389" y="510" font-size="16" fill="#405a71" text-anchor="middle">入場無料</text><rect x="502" y="190" width="195" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(600,300)"><circle cx="0" cy="-10" r="48" fill="none" stroke="#b5473a" stroke-width="5"/><g stroke="#b5473a" stroke-width="3"><line x1="0" y1="-58" x2="0" y2="38"/><line x1="-48" y1="-10" x2="48" y2="-10"/><line x1="-34" y1="-44" x2="34" y2="24"/><line x1="34" y1="-44" x2="-34" y2="24"/></g><polygon points="-24,54 0,-10 24,54" fill="none" stroke="#405a71" stroke-width="5"/></g><text x="600" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">赤の市庁舎前</text><text x="600" y="450" font-size="16" fill="#405a71" text-anchor="middle">50mの観覧車</text><text x="600" y="480" font-size="16" fill="#405a71" text-anchor="middle">空飛ぶサンタ</text><text x="600" y="510" font-size="16" fill="#405a71" text-anchor="middle">スケートリンク</text><rect x="714" y="190" width="195" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(811,300)"><rect x="-64" y="10" width="128" height="40" fill="#cfc6bb"/><rect x="-50" y="-4" width="100" height="14" fill="#ddd5cb"/><path d="M-40,-4 l14,18 -10,12 22,10 -6,14" stroke="#d4a017" stroke-width="6" fill="none"/><rect x="-30" y="-74" width="60" height="70" fill="#7a6a5c"/><polygon points="-30,-74 -10,-92 4,-74" fill="#5b4f45"/></g><text x="811" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">記念教会前</text><text x="811" y="450" font-size="16" fill="#405a71" text-anchor="middle">ブライトシャイト広場</text><text x="811" y="480" font-size="16" fill="#405a71" text-anchor="middle">100を超える屋台</text><text x="811" y="510" font-size="16" fill="#405a71" text-anchor="middle">追悼の場「金色の亀裂」</text><rect x="925" y="190" width="195" height="400" rx="14" fill="#fbf6ee" stroke="#e3d6c3" stroke-width="2"/><g transform="translate(1022,300)"><circle cx="0" cy="0" r="30" fill="#f0d9b5"/><ellipse cx="0" cy="-30" rx="36" ry="10" fill="#2f6a40"/><g fill="#e5b93a"><rect x="-26" y="-52" width="6" height="18"/><rect x="-3" y="-58" width="6" height="22"/><rect x="20" y="-52" width="6" height="18"/></g><g fill="#ffcc4d"><circle cx="-23" cy="-56" r="4"/><circle cx="0" cy="-62" r="4"/><circle cx="23" cy="-56" r="4"/></g><path d="M-30,30 q30,30 60,0 l8,30 h-76z" fill="#ffffff" stroke="#c9b8a3" stroke-width="3"/></g><text x="1022" y="410" font-size="20" font-weight="700" fill="#153452" text-anchor="middle">ルチア市</text><text x="1022" y="450" font-size="16" fill="#405a71" text-anchor="middle">北欧風の市</text><text x="1022" y="480" font-size="16" fill="#405a71" text-anchor="middle">レンガの中庭</text><text x="1022" y="510" font-size="16" fill="#405a71" text-anchor="middle">入場無料</text><text x="60" y="645" font-size="18" fill="#405a71">ベルリン観光局、ベルリン市、ルチア市主催者の案内に基づく（2026年11月1日参照）</text></g></svg>