name: Curated seasonal Wikimedia photo refresh (draft branch)
on:
  push:
    branches:
      - codex/article-cover-seasonal-wave2-20261123
    paths:
      - .github/workflows/seasonal-commons-wave2.yml
permissions:
  contents: write
jobs:
  curated-seasonal-photos:
    if: github.ref == 'refs/heads/codex/article-cover-seasonal-wave2-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned image tool
        run: python3 -m pip install --user 'Pillow>=11,<13'
      - name: Obtain selected Commons originals and update article metadata
        run: python3 scripts/curated-seasonal-covers-20261123.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit approved results to dedicated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add assets/img/events/*-480w.webp assets/img/events/*-768w.webp assets/img/events/*-og.jpg
          git add docs/article-cover-seasonal-wave2-20261123.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "photos: add documented historical Christmas market photos for seven guides"
          git push origin "HEAD:refs/heads/codex/article-cover-seasonal-wave2-20261123"

