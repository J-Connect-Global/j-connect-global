<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">静かな祝日の制限の時間</title><desc id="d">万聖節と死者の日曜日は朝5時から18時まで市場や娯楽の催しとダンスが禁止、国民哀悼の日は市場やスポーツの催しが13時まで、音楽や娯楽の催しとダンスは18時まで制限されることを時間の帯で示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">静かな祝日に制限される時間（NRW）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">時間を過ぎれば、特別な制限はなくなる</text><text x="330.0" y="205" font-size="17" fill="#405a71" text-anchor="middle">5時</text><text x="490.0" y="205" font-size="17" fill="#405a71" text-anchor="middle">9時</text><text x="650.0" y="205" font-size="17" fill="#405a71" text-anchor="middle">13時</text><text x="850.0" y="205" font-size="17" fill="#405a71" text-anchor="middle">18時</text><text x="1010.0" y="205" font-size="17" fill="#405a71" text-anchor="middle">22時</text><rect x="60" y="225" width="1080" height="70" rx="16" fill="white"/><text x="80" y="255" font-size="19" font-weight="700" fill="#153452" text-anchor="start">万聖節・死者の日曜日</text><text x="80" y="283" font-size="17" fill="#405a71" text-anchor="start">市場・娯楽の催し</text><rect x="330.0" y="243" width="520.0" height="34" rx="8" fill="#8a5aa8"/><text x="862.0" y="268" font-size="19" font-weight="700" fill="#8a5aa8" text-anchor="start">〜18時</text><rect x="60" y="310" width="1080" height="70" rx="16" fill="white"/><text x="80" y="340" font-size="19" font-weight="700" fill="#153452" text-anchor="start"></text><text x="80" y="368" font-size="17" fill="#405a71" text-anchor="start">ダンスのイベント</text><rect x="330.0" y="328" width="520.0" height="34" rx="8" fill="#8a5aa8"/><text x="862.0" y="353" font-size="19" font-weight="700" fill="#8a5aa8" text-anchor="start">〜18時</text><rect x="60" y="395" width="1080" height="70" rx="16" fill="white"/><text x="80" y="425" font-size="19" font-weight="700" fill="#153452" text-anchor="start">国民哀悼の日</text><text x="80" y="453" font-size="17" fill="#405a71" text-anchor="start">市場・スポーツ・祭り</text><rect x="330.0" y="413" width="320.0" height="34" rx="8" fill="#2d6a9f"/><text x="662.0" y="438" font-size="19" font-weight="700" fill="#2d6a9f" text-anchor="start">〜13時</text><rect x="60" y="480" width="1080" height="70" rx="16" fill="white"/><text x="80" y="510" font-size="19" font-weight="700" fill="#153452" text-anchor="start"></text><text x="80" y="538" font-size="17" fill="#405a71" text-anchor="start">音楽・娯楽・ダンス</text><rect x="330.0" y="498" width="520.0" height="34" rx="8" fill="#2d6a9f"/><text x="862.0" y="523" font-size="19" font-weight="700" fill="#2d6a9f" text-anchor="start">〜18時</text><rect x="60" y="575" width="1080" height="40" rx="16" fill="#fff7e6"/><text x="90" y="602" font-size="17" fill="#8a5a00" text-anchor="start">※国民哀悼の日の市場などは朝から13時まで。ふつうの日曜日の決まり（お店の休みなど）は終日</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ケルン市（2026年10月29日参照）</text></g></svg>