<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>予約の連絡前に、この4項目</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">予約の連絡前に、この4項目</text><text x="48" y="178" font-size="27" fill="#52666C">手元にメモすると、電話でも確認しやすい</text><rect x="48" y="209" width="1104" height="86" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="86" rx="18" fill="#146859"/><text x="81" y="264" font-size="36" fill="#173B48">用件</text><text x="460" y="261" font-size="32" fill="#52666C">何の予約を取りたいか</text><rect x="48" y="311" width="1104" height="86" rx="18" fill="#FFFFFF"/><rect x="48" y="311" width="12" height="86" rx="18" fill="#146859"/><text x="81" y="366" font-size="36" fill="#173B48">希望日時</text><text x="460" y="363" font-size="32" fill="#52666C">第一希望と、別の候補</text><rect x="48" y="413" width="1104" height="86" rx="18" fill="#FFFFFF"/><rect x="48" y="413" width="12" height="86" rx="18" fill="#146859"/><text x="81" y="468" font-size="36" fill="#173B48">氏名・連絡先</text><text x="460" y="465" font-size="32" fill="#52666C">氏名のつづり・電話番号</text><rect x="48" y="515" width="1104" height="86" rx="18" fill="#FFFFFF"/><rect x="48" y="515" width="12" height="86" rx="18" fill="#146859"/><text x="81" y="570" font-size="36" fill="#173B48">最後に確認</text><text x="460" y="567" font-size="32" fill="#52666C">日付・時刻・場所・持ち物</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  2026-10-19</text></g></svg>