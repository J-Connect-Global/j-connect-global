<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">電飾の安全表示の見分け方</title><desc id="d">CE、GS、IPの役割の違いを示す説明図。認証マークそのものの模写ではありません。</desc><rect width="1200" height="675" fill="#f5f2eb"/><text x="70" y="95" font-family="sans-serif" font-size="48" fill="#173e3c" font-weight="bold">電飾の表示、意味が違います</text><g font-family="sans-serif" fill="#173e3c"><rect x="70" y="155" width="1060" height="125" rx="16" fill="#dfebe5"/><text x="102" y="207" font-size="34" font-weight="bold">CE</text><text x="300" y="207" font-size="27">メーカーによる適合表示</text><text x="300" y="247" font-size="23">独立した安全試験の合格印ではない</text><rect x="70" y="305" width="1060" height="125" rx="16" fill="#e9e4d4"/><text x="102" y="357" font-size="34" font-weight="bold">GS</text><text x="300" y="357" font-size="27">第三者による安全試験の表示</text><text x="300" y="397" font-size="23">任意の認証。ないだけで危険とは断定できない</text><rect x="70" y="455" width="1060" height="125" rx="16" fill="#dfebe5"/><text x="102" y="507" font-size="34" font-weight="bold">IP</text><text x="300" y="507" font-size="27">水・ほこりに対する保護等級</text><text x="300" y="547" font-size="23">屋外使用は製品の用途表示も確認</text></g><text x="70" y="625" font-family="sans-serif" font-size="20" fill="#435b58">出典：ドイツ消費者センター・VDE｜編集部作成（2026年11月24日）</text></svg>