<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">前払い税（Vorauszahlung）の流れ</title><desc id="d">確定申告で追加の納税が出る、税務署が前払いの通知を出す、3月・6月・9月・12月の10日に払う、収入が変わったら調整を申請する、翌年の申告で精算するという流れを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="90" font-size="40" font-weight="700" fill="#153452">前払い税（Vorauszahlung）の流れ</text>
<text x="60" y="135" font-size="24" fill="#3c5a78">確定申告の結果をもとに、税務署が翌年以降の前払いを決めます</text>
<rect x="60" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="100" cy="238" r="24" fill="#1f5f99"/><text x="100" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="302" font-size="22" font-weight="700" fill="#153452">申告で追加の納</text>
<text x="80" y="332" font-size="22" font-weight="700" fill="#153452">税</text>
<text x="80" y="370" font-size="20" fill="#2b4560">給与以外の収入</text>
<text x="80" y="400" font-size="20" fill="#2b4560">や給付があり、</text>
<text x="80" y="430" font-size="20" fill="#2b4560">申告で追加の納</text>
<text x="80" y="460" font-size="20" fill="#2b4560">税が出る</text>
<path d="M262 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="280" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="320" cy="238" r="24" fill="#1f5f99"/><text x="320" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="300" y="302" font-size="22" font-weight="700" fill="#153452">前払いの通知</text>
<text x="300" y="370" font-size="20" fill="#2b4560">税務署が、前払</text>
<text x="300" y="400" font-size="20" fill="#2b4560">いの額と納期を</text>
<text x="300" y="430" font-size="20" fill="#2b4560">書いた通知を出</text>
<text x="300" y="460" font-size="20" fill="#2b4560">す</text>
<path d="M482 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="500" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="540" cy="238" r="24" fill="#1f5f99"/><text x="540" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="520" y="302" font-size="22" font-weight="700" fill="#153452">年4回払う</text>
<text x="520" y="370" font-size="20" fill="#2b4560">3月・6月・9</text>
<text x="520" y="400" font-size="20" fill="#2b4560">月・12月の各</text>
<text x="520" y="430" font-size="20" fill="#2b4560">10日に払う</text>
<path d="M702 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="720" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="760" cy="238" r="24" fill="#1f5f99"/><text x="760" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="740" y="302" font-size="22" font-weight="700" fill="#153452">調整を申請</text>
<text x="740" y="370" font-size="20" fill="#2b4560">収入が減るなど</text>
<text x="740" y="400" font-size="20" fill="#2b4560">したら、見込み</text>
<text x="740" y="430" font-size="20" fill="#2b4560">を書いて調整を</text>
<text x="740" y="460" font-size="20" fill="#2b4560">申請する</text>
<path d="M922 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="940" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="980" cy="238" r="24" fill="#1f5f99"/><text x="980" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="960" y="302" font-size="22" font-weight="700" fill="#153452">翌年に精算</text>
<text x="960" y="370" font-size="20" fill="#2b4560">次の確定申告で、</text>
<text x="960" y="400" font-size="20" fill="#2b4560">払った前払い</text>
<text x="960" y="430" font-size="20" fill="#2b4560">と実際の税を精</text>
<text x="960" y="460" font-size="20" fill="#2b4560">算する</text>
<text x="60" y="645" font-size="20" fill="#3c5a78">図解：J-Connect編集部。根拠：所得税法第37条（2026年11月14日確認）。</text></g></svg>