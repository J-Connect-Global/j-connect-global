<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">ルールの強さは3段階</title><desc id="desc">法律は守る必要がある。建物や地域の決まりは契約書と使用規則を確認する。ただの習慣は相手の様子を見て合わせる。</desc><rect width="480" height="520" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">ルールの強さは3段階</text><text x="24" y="78" font-size="18">まず「どの段階か」を見分ける</text><rect x="20" y="104" width="440" height="116" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="36" y="136" font-size="22" font-weight="700" fill="#c0392b">1 法律</text><text x="36" y="168" font-size="19">夜の静穏・日曜の屋外作業・歩行者</text><text x="36" y="198" font-size="19">破ると罰金や注意の対象になる</text><rect x="20" y="236" width="440" height="116" rx="10" fill="#fff" stroke="#d68910" stroke-width="2"/><text x="36" y="268" font-size="22" font-weight="700" fill="#b9770e">2 建物・地域の決まり</text><text x="36" y="300" font-size="19">契約書や使用規則に時間帯が書いてある</text><text x="36" y="330" font-size="19">最初に読んで確認する</text><rect x="20" y="368" width="440" height="116" rx="10" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="36" y="400" font-size="22" font-weight="700" fill="#1e8449">3 ただの習慣</text><text x="36" y="432" font-size="19">チップ・あいさつ・口調・ドア</text><text x="36" y="462" font-size="19">相手の様子を見て合わせれば十分</text></g></svg>
