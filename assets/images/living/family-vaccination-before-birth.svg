<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">出産前に確認したい家族の予防接種</title><desc id="d">妊婦は百日咳を妊娠28週以降に毎回、インフルエンザを妊娠中期以降に、同居する家族や世話をする人は最後の接種から10年以上なら百日咳を出産の4週間前までに、1970年以降生まれの大人ではしかの接種が0回・1回・不明なら1回接種することを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="90" font-size="40" font-weight="700" fill="#153452">出産前に確認したい家族の予防接種</text>
<text x="60" y="135" font-size="24" fill="#3c5a78">G-BAの予防接種指針（2026年10月29日施行）で、保険の対象として書かれているもの</text>
<rect x="60" y="190" width="255" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="100" cy="238" r="24" fill="#1f5f99"/><text x="100" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="302" font-size="22" font-weight="700" fill="#153452">妊婦本人</text>
<text x="80" y="370" font-size="20" fill="#2b4560">百日咳：妊娠28週</text>
<text x="80" y="400" font-size="20" fill="#2b4560">から、妊娠のたびに。</text>
<text x="80" y="430" font-size="20" fill="#2b4560">インフルエンザ：</text>
<text x="80" y="460" font-size="20" fill="#2b4560">妊娠中期から（秋冬）</text>
<rect x="335" y="190" width="255" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="375" cy="238" r="24" fill="#1f5f99"/><text x="375" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="355" y="302" font-size="22" font-weight="700" fill="#153452">同居の家族・世話を</text>
<text x="355" y="332" font-size="22" font-weight="700" fill="#153452">する人</text>
<text x="355" y="370" font-size="20" fill="#2b4560">百日咳：最後の接種</text>
<text x="355" y="400" font-size="20" fill="#2b4560">から10年以上たっ</text>
<text x="355" y="430" font-size="20" fill="#2b4560">ていれば、出産の4</text>
<text x="355" y="460" font-size="20" fill="#2b4560">週間前までに</text>
<rect x="610" y="190" width="255" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="650" cy="238" r="24" fill="#1f5f99"/><text x="650" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="630" y="302" font-size="22" font-weight="700" fill="#153452">1970年以降生ま</text>
<text x="630" y="332" font-size="22" font-weight="700" fill="#153452">れの大人</text>
<text x="630" y="370" font-size="20" fill="#2b4560">はしか：接種が0回・</text>
<text x="630" y="400" font-size="20" fill="#2b4560">1回・分からない</text>
<text x="630" y="430" font-size="20" fill="#2b4560">人は、MMRワクチ</text>
<text x="630" y="460" font-size="20" fill="#2b4560">ンを1回</text>
<rect x="885" y="190" width="255" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="925" cy="238" r="24" fill="#1f5f99"/><text x="925" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="905" y="302" font-size="22" font-weight="700" fill="#153452">インフルエンザ（家</text>
<text x="905" y="332" font-size="22" font-weight="700" fill="#153452">族）</text>
<text x="905" y="370" font-size="20" fill="#2b4560">新生児の家族は明記</text>
<text x="905" y="400" font-size="20" fill="#2b4560">なし。保険の対象に</text>
<text x="905" y="430" font-size="20" fill="#2b4560">なるかは医師・保険</text>
<text x="905" y="460" font-size="20" fill="#2b4560">者に確認</text>
<text x="60" y="645" font-size="20" fill="#3c5a78">図解：J-Connect編集部。接種するかどうかは医師と相談して決めてください。</text></g></svg>