<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">ePAの標準アクセス期間</title><desc id="desc">電子健康保険証を読み取った後、医療機関は通常90日、薬局は通常3日アクセスできる。アプリで期間を短縮または延長できる。</desc><rect width="1200" height="420" rx="28" fill="#f7f5ef"/><text x="48" y="58" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#203b4b">ePAの標準アクセス期間</text><rect x="48" y="96" width="520" height="226" rx="20" fill="#e0ebf2" stroke="#6d93aa" stroke-width="2"/><circle cx="112" cy="150" r="28" fill="#2e6178"/><path d="M100 150h24M112 138v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="160" y="148" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#203b4b">医師・医療機関</text><text x="80" y="230" font-size="66" font-family="Arial,sans-serif" font-weight="700" fill="#2e6178">通常90日</text><text x="80" y="274" font-size="20" font-family="Arial,sans-serif" fill="#203b4b">診療に必要で、非表示にしていない情報</text><rect x="632" y="96" width="520" height="226" rx="20" fill="#e7eee7" stroke="#8aa58a" stroke-width="2"/><circle cx="696" cy="150" r="28" fill="#4b7051"/><rect x="683" y="138" width="26" height="24" rx="4" fill="none" stroke="#fff" stroke-width="3"/><path d="M689 138v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#fff" stroke-width="3"/><text x="744" y="148" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#203b4b">薬局</text><text x="664" y="230" font-size="66" font-family="Arial,sans-serif" font-weight="700" fill="#4b7051">通常3日</text><text x="664" y="274" font-size="20" font-family="Arial,sans-serif" fill="#203b4b">電子健康保険証を読み取った後</text><rect x="48" y="345" width="1104" height="42" rx="12" fill="#203b4b"/><text x="600" y="373" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" font-weight="700" fill="#fff">標準期間はアプリで短縮・延長できます。個別のアクセス設定も確認してください。</text></svg>