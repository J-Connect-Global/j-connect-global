<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">NRWの2026年クリスマスの一般店舗の営業日</title><desc id="d">12月24日は一般店舗の法定上限14時、25日と26日は祝日、27日は日曜で原則休業。店舗ごとに確認。</desc><rect width="1200" height="675" rx="28" fill="#ecf2f1"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="57" y="75" font-size="40" font-weight="700" fill="#17394b">クリスマスの買い物は24日まで</text><text x="57" y="114" font-size="22" fill="#466775">NRW州・2026年12月24日〜27日｜一般小売店</text><g transform="translate(60 166)"><rect width="240" height="390" rx="22" fill="#fff"/><rect width="240" height="72" rx="21" fill="#ad7729"/><text x="120" y="49" font-size="27" text-anchor="middle" fill="#fff" font-weight="700">12/24（木）</text><text x="120" y="163" font-size="39" font-weight="700" text-anchor="middle" fill="#ad7729">14時まで</text><path d="M30 202H210" stroke="#e4ecec" stroke-width="3"/><text x="120" y="260" font-size="20" fill="#17394b" text-anchor="middle">法定上限</text><text x="120" y="303" font-size="19" fill="#466775" text-anchor="middle">店舗は早閉めも</text></g><g transform="translate(340 166)"><rect width="240" height="390" rx="22" fill="#fff"/><rect width="240" height="72" rx="21" fill="#a74c42"/><text x="120" y="49" font-size="27" text-anchor="middle" fill="#fff" font-weight="700">12/25（金）</text><text x="120" y="163" font-size="39" font-weight="700" text-anchor="middle" fill="#a74c42">原則休業</text><path d="M30 202H210" stroke="#e4ecec" stroke-width="3"/><text x="120" y="260" font-size="20" fill="#17394b" text-anchor="middle">クリスマス第1日</text><text x="120" y="303" font-size="19" fill="#466775" text-anchor="middle">法定祝日</text></g><g transform="translate(620 166)"><rect width="240" height="390" rx="22" fill="#fff"/><rect width="240" height="72" rx="21" fill="#a74c42"/><text x="120" y="49" font-size="27" text-anchor="middle" fill="#fff" font-weight="700">12/26（土）</text><text x="120" y="163" font-size="39" font-weight="700" text-anchor="middle" fill="#a74c42">原則休業</text><path d="M30 202H210" stroke="#e4ecec" stroke-width="3"/><text x="120" y="260" font-size="20" fill="#17394b" text-anchor="middle">クリスマス第2日</text><text x="120" y="303" font-size="19" fill="#466775" text-anchor="middle">法定祝日</text></g><g transform="translate(900 166)"><rect width="240" height="390" rx="22" fill="#fff"/><rect width="240" height="72" rx="21" fill="#526b83"/><text x="120" y="49" font-size="27" text-anchor="middle" fill="#fff" font-weight="700">12/27（日）</text><text x="120" y="163" font-size="39" font-weight="700" text-anchor="middle" fill="#526b83">原則休業</text><path d="M30 202H210" stroke="#e4ecec" stroke-width="3"/><text x="120" y="260" font-size="20" fill="#17394b" text-anchor="middle">日曜日</text><text x="120" y="303" font-size="19" fill="#466775" text-anchor="middle">例外店舗は要確認</text></g><text x="60" y="606" font-size="22" fill="#17394b" font-weight="700">14時まで営業する義務はありません。店舗の公式案内を確認。</text><text x="60" y="643" font-size="16" fill="#466775">出典：LÖG NRW §4、Feiertagsgesetz NW §2（2026年11月25日確認）</text></g></svg>
