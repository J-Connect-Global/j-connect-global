<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">グリューワインの条件</title><desc id="d">EUの規則でグリューワインと名乗るには、赤・白・ロゼワインだけから作ること、主にシナモンとクローブで香りをつけること、アルコール7%以上であること、水を加えないことが必要であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#f7efe8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">「グリューワイン」と名乗るための条件</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">EU規則 第251/2014号（2026年の改正を含む）</text><rect x="60" y="185" width="530" height="170" rx="16" fill="white"/><circle cx="120" cy="270" r="34" fill="#b5473a"/><text x="120" y="282" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="175" y="260" font-size="25" font-weight="700" fill="#153452" text-anchor="start">ワインだけから作る</text><text x="175" y="300" font-size="19" fill="#405a71" text-anchor="start">赤・白・ロゼ（2026年改正で追加）、その組み合わせ</text><rect x="610" y="185" width="530" height="170" rx="16" fill="white"/><circle cx="670" cy="270" r="34" fill="#8d5a3c"/><text x="670" y="282" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="725" y="260" font-size="25" font-weight="700" fill="#153452" text-anchor="start">主な香りはシナモンとクローブ</text><text x="725" y="300" font-size="19" fill="#405a71" text-anchor="start">どちらか、または両方</text><rect x="60" y="375" width="530" height="170" rx="16" fill="white"/><circle cx="120" cy="460" r="34" fill="#c9952a"/><text x="120" y="472" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="175" y="450" font-size="25" font-weight="700" fill="#153452" text-anchor="start">アルコール7%以上</text><text x="175" y="490" font-size="19" fill="#405a71" text-anchor="start">実際のアルコール度数</text><rect x="610" y="375" width="530" height="170" rx="16" fill="white"/><circle cx="670" cy="460" r="34" fill="#2d6a9f"/><text x="670" y="472" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="725" y="450" font-size="25" font-weight="700" fill="#153452" text-anchor="start">水を加えない</text><text x="725" y="490" font-size="19" fill="#405a71" text-anchor="start">規則で認められたわずかな例外を除く</text><rect x="60" y="570" width="1080" height="40" rx="10" fill="#fff3f0"/><text x="600" y="597" font-size="19" fill="#7a2e24" text-anchor="middle">白ワインで作ったら「weiß（白）」など、ロゼならそのことを名前やラベルに書く</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：EU規則 第251/2014号 附属書II、EU規則 第2026/471号（2026年10月29日参照）</text></g></svg>