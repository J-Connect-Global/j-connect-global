<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">車の登録の手順</title><desc id="d">車を選び、自動車保険に申し込んでeVBの番号を受け取り、市の登録窓口で登録してナンバープレートを付け、自動車税は口座から引き落とされるという5つの手順を示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">車を登録するまでの5つの手順</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">保険の番号（eVB）がないと登録できない</text><rect x="60" y="190" width="200" height="330" rx="16" fill="white"/><circle cx="160" cy="250" r="32" fill="#2d6a9f"/><text x="160" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">1</text><text x="160" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">車を選ぶ</text><text x="160" y="375" font-size="18" fill="#29465f" text-anchor="middle">新車・中古車・</text><text x="160" y="403" font-size="18" fill="#29465f" text-anchor="middle">リース</text><text x="270" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="280" y="190" width="200" height="330" rx="16" fill="white"/><circle cx="380" cy="250" r="32" fill="#2d6a9f"/><text x="380" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">2</text><text x="380" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">保険に申し込む</text><text x="380" y="375" font-size="18" fill="#29465f" text-anchor="middle">7けたの</text><text x="380" y="403" font-size="18" fill="#29465f" text-anchor="middle">eVBの番号を</text><text x="380" y="431" font-size="18" fill="#29465f" text-anchor="middle">受け取る</text><text x="490" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="500" y="190" width="200" height="330" rx="16" fill="white"/><circle cx="600" cy="250" r="32" fill="#2d6a9f"/><text x="600" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">3</text><text x="600" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">市で登録</text><text x="600" y="375" font-size="18" fill="#29465f" text-anchor="middle">登録の窓口へ</text><text x="600" y="403" font-size="18" fill="#29465f" text-anchor="middle">オンライン</text><text x="600" y="431" font-size="18" fill="#29465f" text-anchor="middle">（i-Kfz）も可</text><text x="710" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="720" y="190" width="200" height="330" rx="16" fill="white"/><circle cx="820" cy="250" r="32" fill="#2d6a9f"/><text x="820" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">4</text><text x="820" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">ナンバー</text><text x="820" y="375" font-size="18" fill="#29465f" text-anchor="middle">プレートを作り</text><text x="820" y="403" font-size="18" fill="#29465f" text-anchor="middle">車に付ける</text><text x="930" y="360" font-size="40" font-weight="700" fill="#9fb6cc" text-anchor="middle">›</text><rect x="940" y="190" width="200" height="330" rx="16" fill="white"/><circle cx="1040" cy="250" r="32" fill="#2d6a9f"/><text x="1040" y="262" font-size="32" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1040" y="330" font-size="23" font-weight="700" fill="#153452" text-anchor="middle">自動車税</text><text x="1040" y="375" font-size="18" fill="#29465f" text-anchor="middle">登録のときの</text><text x="1040" y="403" font-size="18" fill="#29465f" text-anchor="middle">口座から</text><text x="1040" y="431" font-size="18" fill="#29465f" text-anchor="middle">引き落とし</text><rect x="60" y="530" width="1080" height="90" rx="16" fill="#fff7e6"/><text x="90" y="566" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">登録に持っていくもの</text><text x="90" y="600" font-size="21" fill="#29465f" text-anchor="start">身分証 ／ eVBの番号 ／ 登録証明書 ／ 車検の証明 ／ 口座引き落としの依頼書（SEPA）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ADAC、デュッセルドルフ市（2026年10月29日参照）</text></g></svg>