<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">介護保険の改革案</title><desc id="d">介護保険料率3.6%は据え置き、子どものいない人の上乗せ0.9%と配偶者0.52%は政府案で、介護保険の上限は2027年政令案で6,075ユーロ、PNOG成立時に6,375ユーロとなることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">介護保険の改革案：何がいつ変わる？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">保険料率3.6％は据え置き（政府案）</text><rect x="60" y="175" width="1080" height="90" rx="16" fill="white"/><text x="100" y="232" font-size="24" font-weight="700" fill="#405a71" text-anchor="start">一般の保険料率</text><text x="1100" y="234" font-size="32" font-weight="700" fill="#2f8a64" text-anchor="end">3.6％のまま</text><rect x="60" y="285" width="1080" height="68" rx="16" fill="white"/><rect x="60" y="285" width="12" height="68" rx="6" fill="#b5473a"/><text x="95" y="328" font-size="21" font-weight="700" fill="#b5473a" text-anchor="start">2027年1月</text><text x="260" y="328" font-size="23" font-weight="700" fill="#153452" text-anchor="start">子どものいない人の上乗せ</text><text x="1110" y="329" font-size="25" font-weight="700" fill="#b5473a" text-anchor="end">0.6％ → 0.9％</text><rect x="60" y="365" width="1080" height="68" rx="16" fill="white"/><rect x="60" y="365" width="12" height="68" rx="6" fill="#c9952a"/><text x="95" y="408" font-size="21" font-weight="700" fill="#c9952a" text-anchor="start">2027年1月</text><text x="260" y="408" font-size="23" font-weight="700" fill="#153452" text-anchor="start">介護保険の保険料算定上限</text><text x="1110" y="409" font-size="20" font-weight="700" fill="#c9952a" text-anchor="end">6,075（政令案）／6,375（PNOG成立時）</text><rect x="60" y="445" width="1080" height="68" rx="16" fill="white"/><rect x="60" y="445" width="12" height="68" rx="6" fill="#2d6a9f"/><text x="95" y="488" font-size="21" font-weight="700" fill="#2d6a9f" text-anchor="start">2027年1月</text><text x="260" y="488" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ミニジョブの雇用主</text><text x="1110" y="489" font-size="25" font-weight="700" fill="#2d6a9f" text-anchor="end">介護保険料を負担</text><rect x="60" y="525" width="1080" height="68" rx="16" fill="white"/><rect x="60" y="525" width="12" height="68" rx="6" fill="#8a5aa8"/><text x="95" y="568" font-size="21" font-weight="700" fill="#8a5aa8" text-anchor="start">2028年1月</text><text x="260" y="568" font-size="23" font-weight="700" fill="#153452" text-anchor="start">扶養の配偶者がいる加入者</text><text x="1110" y="569" font-size="25" font-weight="700" fill="#8a5aa8" text-anchor="end">0.52％の上乗せ</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">※2027年の政令案・PNOG法案はいずれも未確定。出典：連邦保健省・連邦労働社会省（2026年11月10日参照）</text></g></svg>