<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルン旧市街とツォルフェアアインのリンクの料金比較</title><desc id="d">ケルン旧市街は大人が平日9.50ユーロ、土日祝11.50ユーロ、5〜12歳の子ども6ユーロ、家族券24ユーロ、貸し靴は大人6.50ユーロ・子ども5.50ユーロ。ツォルフェアアインは大人11.50ユーロ、14歳までの子ども9ユーロ、家族券27ユーロ、貸し靴6ユーロ、夜間券の大人6.50ユーロ</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#153452">家族で滑るといくら？</text><text x="60" y="122" font-size="21" fill="#405a71">2026/27年の主な料金（オンライン手数料・割引条件は公式サイトで確認）</text><rect x="40" y="150" width="545" height="470" rx="16" fill="white"/><rect x="615" y="150" width="545" height="470" rx="16" fill="white"/><rect x="40" y="150" width="545" height="64" rx="16" fill="#153452"/><rect x="40" y="190" width="545" height="24" fill="#153452"/><text x="70" y="192" font-size="26" font-weight="700" fill="white">ケルン旧市街</text><text x="70" y="262" font-size="21" fill="#405a71">大人（平日／土日祝）</text><text x="555" y="262" font-size="23" font-weight="700" fill="#153452" text-anchor="end">9.50／11.50€</text><line x1="70" y1="278" x2="555" y2="278" stroke="#eee3d6" stroke-width="2"/><text x="70" y="314" font-size="21" fill="#405a71">子ども5〜12歳</text><text x="555" y="314" font-size="23" font-weight="700" fill="#153452" text-anchor="end">6€</text><line x1="70" y1="330" x2="555" y2="330" stroke="#eee3d6" stroke-width="2"/><text x="70" y="366" font-size="21" fill="#405a71">家族（大人2・子ども2）</text><text x="555" y="366" font-size="23" font-weight="700" fill="#153452" text-anchor="end">24€</text><line x1="70" y1="382" x2="555" y2="382" stroke="#eee3d6" stroke-width="2"/><text x="70" y="418" font-size="21" fill="#405a71">貸し靴（大人／子ども）</text><text x="555" y="418" font-size="23" font-weight="700" fill="#153452" text-anchor="end">6.50／5.50€</text><line x1="70" y1="434" x2="555" y2="434" stroke="#eee3d6" stroke-width="2"/><text x="70" y="470" font-size="21" fill="#405a71">5歳未満</text><text x="555" y="470" font-size="23" font-weight="700" fill="#153452" text-anchor="end">無料</text><line x1="70" y1="486" x2="555" y2="486" stroke="#eee3d6" stroke-width="2"/><text x="70" y="540" font-size="18" fill="#153452">● 月曜は「子どもの日」（5〜12歳5€）</text><text x="70" y="570" font-size="18" fill="#153452">● 6〜10歳向けスケート教室（要予約）</text><rect x="615" y="150" width="545" height="64" rx="16" fill="#8d5a3c"/><rect x="615" y="190" width="545" height="24" fill="#8d5a3c"/><text x="645" y="192" font-size="26" font-weight="700" fill="white">ツォルフェアアイン</text><text x="645" y="262" font-size="21" fill="#405a71">大人 1日券</text><text x="1130" y="262" font-size="23" font-weight="700" fill="#153452" text-anchor="end">11.50€</text><line x1="645" y1="278" x2="1130" y2="278" stroke="#eee3d6" stroke-width="2"/><text x="645" y="314" font-size="21" fill="#405a71">子ども14歳まで 1日券</text><text x="1130" y="314" font-size="23" font-weight="700" fill="#153452" text-anchor="end">9€</text><line x1="645" y1="330" x2="1130" y2="330" stroke="#eee3d6" stroke-width="2"/><text x="645" y="366" font-size="21" fill="#405a71">家族（大人2・子ども3まで）</text><text x="1130" y="366" font-size="23" font-weight="700" fill="#153452" text-anchor="end">27€</text><line x1="645" y1="382" x2="1130" y2="382" stroke="#eee3d6" stroke-width="2"/><text x="645" y="418" font-size="21" fill="#405a71">貸し靴</text><text x="1130" y="418" font-size="23" font-weight="700" fill="#153452" text-anchor="end">6€</text><line x1="645" y1="434" x2="1130" y2="434" stroke="#eee3d6" stroke-width="2"/><text x="645" y="470" font-size="21" fill="#405a71">閉場2時間前から（大人）</text><text x="1130" y="470" font-size="23" font-weight="700" fill="#153452" text-anchor="end">6.50€</text><line x1="645" y1="486" x2="1130" y2="486" stroke="#eee3d6" stroke-width="2"/><text x="645" y="540" font-size="18" fill="#8d5a3c">● ペンギン型の補助具あり</text><text x="645" y="570" font-size="18" fill="#8d5a3c">● 車いす・リハビリ用ベビーカーも可</text></g></svg>