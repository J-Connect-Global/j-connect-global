<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ワクチンの費用</title><desc id="d">STIKOが勧めている人のワクチンは公的健康保険が負担し、勧告の対象外の人は保険組合ごとの判断になること、受ける前に保険組合で確認し、保険証と予防接種手帳を持っていくことを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ワクチンの費用は健康保険で出る？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">公的な健康保険（GKV）の場合</text><rect x="60" y="180" width="530" height="190" rx="16" fill="white"/><rect x="60" y="180" width="12" height="190" rx="6" fill="#2f8a64"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">STIKOが勧めている人</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">保険組合が費用を負担</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">（年齢・持病・妊娠などの条件）</text><rect x="610" y="180" width="530" height="190" rx="16" fill="white"/><rect x="610" y="180" width="12" height="190" rx="6" fill="#c9952a"/><text x="646" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">勧告の対象外の人</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">保険組合ごとの判断</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">独自のサービスで出すところも多い</text><rect x="60" y="390" width="530" height="190" rx="16" fill="white"/><rect x="60" y="390" width="12" height="190" rx="6" fill="#2d6a9f"/><text x="96" y="438" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">受ける前に</text><text x="96" y="478" font-size="20" fill="#29465f" text-anchor="start">加入している保険組合の</text><text x="96" y="508" font-size="20" fill="#29465f" text-anchor="start">ウェブサイトやアプリで確認</text><rect x="610" y="390" width="530" height="190" rx="16" fill="white"/><rect x="610" y="390" width="12" height="190" rx="6" fill="#8a5aa8"/><text x="646" y="438" font-size="24" font-weight="700" fill="#8a5aa8" text-anchor="start">持っていくもの</text><text x="646" y="478" font-size="20" fill="#29465f" text-anchor="start">健康保険証（eGK）</text><text x="646" y="508" font-size="20" fill="#29465f" text-anchor="start">予防接種手帳（あれば）</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：infektionsschutz.de（2026年10月29日参照）</text></g></svg>