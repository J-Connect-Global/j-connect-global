<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>永住許可の準備チェックリスト</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="118" font-size="42" fill="#173B48">永住許可の準備　5つの確認と1つの注意</text><g font-size="26" fill="#173B48"><rect x="48" y="150" width="680" height="76" rx="14" fill="#FFFFFF"/><circle cx="92" cy="188" r="20" fill="#146859"/><text x="84" y="197" font-size="24" fill="#FFFFFF">1</text><text x="128" y="182">カードの条文番号を見る</text><text x="128" y="212" font-size="20" fill="#52666C">§18a・18b・18d・18g・19c・28など。ルートが決まる</text><rect x="48" y="238" width="680" height="76" rx="14" fill="#FFFFFF"/><circle cx="92" cy="276" r="20" fill="#146859"/><text x="84" y="285" font-size="24" fill="#FFFFFF">2</text><text x="128" y="270">年金の加入月数を確かめる</text><text x="128" y="300" font-size="20" fill="#52666C">一般60か月・専門人材36か月。夫婦はどちらか一方で可</text><rect x="48" y="326" width="680" height="76" rx="14" fill="#FFFFFF"/><circle cx="92" cy="364" r="20" fill="#146859"/><text x="84" y="373" font-size="24" fill="#FFFFFF">3</text><text x="128" y="358">ドイツ語の証明を用意する</text><text x="128" y="388" font-size="20" fill="#52666C">多くはB1。ブルーカードはA1でも27か月で申請可</text><rect x="48" y="414" width="680" height="76" rx="14" fill="#FFFFFF"/><circle cx="92" cy="452" r="20" fill="#146859"/><text x="84" y="461" font-size="24" fill="#FFFFFF">4</text><text x="128" y="446">社会の基礎知識の証明</text><text x="128" y="476" font-size="20" fill="#52666C">「ドイツでの生活」テスト、または統合コース修了</text><rect x="48" y="502" width="680" height="76" rx="14" fill="#FFFFFF"/><circle cx="92" cy="540" r="20" fill="#146859"/><text x="84" y="549" font-size="24" fill="#FFFFFF">5</text><text x="128" y="534">収入と住居の書類</text><text x="128" y="564" font-size="20" fill="#52666C">雇用契約・給与明細・賃貸契約・健康保険の証明</text></g><rect x="760" y="150" width="392" height="428" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">取得後の注意</text><text x="788" y="268" font-size="34" fill="#173B48">6か月以上の</text><text x="788" y="312" font-size="34" fill="#173B48">出国で失効</text><text x="788" y="372" font-size="21" fill="#52666C">出産・介護などで長く</text><text x="788" y="404" font-size="21" fill="#52666C">離れるときは、出国前に</text><text x="788" y="436" font-size="21" fill="#52666C">外国人局へ延長を相談</text><text x="788" y="496" font-size="21" fill="#52666C">手数料は一般に113ユーロ</text><text x="788" y="528" font-size="21" fill="#52666C">（滞在令第44条）</text><text x="48" y="622" font-size="22" fill="#173B48">必要書類は自治体ごとに異なります。管轄の外国人局の最新リストを確認してください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第9条・第18c条・第51条、滞在令第44条  |  2026-11-05</text></g></svg>
