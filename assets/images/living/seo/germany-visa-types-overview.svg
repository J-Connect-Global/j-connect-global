<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの主な滞在許可の種類</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツの主な滞在許可　目的で種類が決まる</text><text x="48" y="152" font-size="23" fill="#52666C">働ける範囲は種類ごとに違い、カードに記載されます</text><rect x="308" y="176" width="458" height="50" rx="10" fill="#173B48"/><text x="324" y="210" font-size="24" fill="#FFFFFF">代表的な許可</text><rect x="778" y="176" width="362" height="50" rx="10" fill="#146859"/><text x="794" y="210" font-size="24" fill="#FFFFFF">働ける範囲</text><text x="64" y="210" font-size="22" fill="#52666C">目的</text><rect x="48" y="230" width="1104" height="51" fill="#FFFFFF"/><text x="64" y="263" font-size="21" fill="#52666C">会社で働く</text><text x="324" y="263" font-size="23" fill="#173B48">専門人材・ブルーカード</text><text x="794" y="263" font-size="23" fill="#173B48">許可された仕事</text><rect x="48" y="281" width="1104" height="51" fill="#F9F8F3"/><text x="64" y="314" font-size="21" fill="#52666C">会社で働く（資格不問）</text><text x="324" y="314" font-size="23" fill="#173B48">日本国籍者などの就労許可</text><text x="794" y="314" font-size="23" fill="#173B48">許可された仕事</text><rect x="48" y="332" width="1104" height="51" fill="#FFFFFF"/><text x="64" y="365" font-size="21" fill="#52666C">大学で学ぶ</text><text x="324" y="365" font-size="23" fill="#173B48">留学の許可</text><text x="794" y="365" font-size="23" fill="#C2410C">年140日分まで</text><rect x="48" y="383" width="1104" height="51" fill="#F9F8F3"/><text x="64" y="416" font-size="21" fill="#52666C">語学学校・職業訓練</text><text x="324" y="416" font-size="23" fill="#173B48">語学コース・職業訓練の許可</text><text x="794" y="416" font-size="23" fill="#C2410C">週20時間まで</text><rect x="48" y="434" width="1104" height="51" fill="#FFFFFF"/><text x="64" y="467" font-size="21" fill="#52666C">仕事を探す</text><text x="324" y="467" font-size="23" fill="#173B48">チャンスカード</text><text x="794" y="467" font-size="23" fill="#C2410C">週20時間＋試用</text><rect x="48" y="485" width="1104" height="51" fill="#F9F8F3"/><text x="64" y="518" font-size="21" fill="#52666C">家族と暮らす</text><text x="324" y="518" font-size="23" fill="#173B48">家族の呼び寄せ</text><text x="794" y="518" font-size="23" fill="#173B48">原則として可</text><rect x="48" y="536" width="1104" height="51" fill="#FFFFFF"/><text x="64" y="569" font-size="21" fill="#52666C">自営業</text><text x="324" y="569" font-size="23" fill="#173B48">自営業の許可</text><text x="794" y="569" font-size="23" fill="#173B48">許可された事業</text><text x="48" y="622" font-size="22" fill="#173B48">18〜30歳はワーキングホリデーも選べます。主な種類のみで、すべてではありません。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第16a条〜第21条・第4a条  |  2026-11-06</text></g></svg>