<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アーヘンのクリスマスマーケットとカール大帝の宮廷跡</title><desc id="d">かつての王の広間である市庁舎と、宮廷礼拝堂である大聖堂の間に、宮殿の中庭だったカッチュホーフがあり、マルクト広場や大聖堂周辺とともに屋台が並ぶことを示す模式図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">市が立つのは、カール大帝の宮廷の跡</text><text x="60" y="134" font-size="22" fill="#405a71">王の広間と宮廷礼拝堂を、中庭がつないでいた</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><rect x="330" y="200" width="540" height="100" rx="10" fill="#8d5a3c"/><text x="600" y="243" font-size="26" font-weight="700" fill="white" text-anchor="middle">市庁舎</text><text x="600" y="278" font-size="20" fill="#f6efe6" text-anchor="middle">かつての王の広間</text><rect x="380" y="320" width="440" height="110" rx="10" fill="#f3e7c9" stroke="#c9a227" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="368" font-size="26" font-weight="700" fill="#7a5c12" text-anchor="middle">カッチュホーフ</text><text x="600" y="402" font-size="20" fill="#7a5c12" text-anchor="middle">かつての宮殿の中庭・屋台が並ぶ</text><path d="M520 450 L680 450 L700 500 L680 580 L520 580 L500 500 Z" fill="#405a71"/><text x="600" y="508" font-size="26" font-weight="700" fill="white" text-anchor="middle">大聖堂</text><text x="600" y="543" font-size="19" fill="#e6edf3" text-anchor="middle">かつての宮廷礼拝堂</text><rect x="90" y="200" width="210" height="100" rx="10" fill="#f3e7c9" stroke="#c9a227" stroke-width="3" stroke-dasharray="8 6"/><text x="195" y="243" font-size="24" font-weight="700" fill="#7a5c12" text-anchor="middle">マルクト広場</text><text x="195" y="276" font-size="19" fill="#7a5c12" text-anchor="middle">市庁舎の前</text><rect x="900" y="450" width="210" height="130" rx="10" fill="#f3e7c9" stroke="#c9a227" stroke-width="3" stroke-dasharray="8 6"/><text x="1005" y="505" font-size="24" font-weight="700" fill="#7a5c12" text-anchor="middle">大聖堂周辺の</text><text x="1005" y="540" font-size="24" font-weight="700" fill="#7a5c12" text-anchor="middle">広場と通り</text><line x1="300" y1="250" x2="330" y2="250" stroke="#c9a227" stroke-width="3"/><line x1="700" y1="515" x2="900" y2="515" stroke="#c9a227" stroke-width="3"/><rect x="90" y="520" width="26" height="18" rx="4" fill="#f3e7c9" stroke="#c9a227" stroke-width="2" stroke-dasharray="4 3"/><text x="126" y="536" font-size="18" fill="#405a71">市の主な会場</text><text x="60" y="645" font-size="18" fill="#405a71">位置関係を単純化した模式図で、縮尺や実際の形とは異なる。アーヘン観光局の解説に基づく</text></g></svg>