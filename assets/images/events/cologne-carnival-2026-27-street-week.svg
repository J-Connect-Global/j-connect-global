<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ケルンの街頭カーニバル2027：6日間の流れ</title><desc id="d">2027年2月4日（木）の女性のカーニバルの日にセヴェリン門前でヤンとグリートの劇と行列、6日（土）夜に幽霊の行列、7日（日）に学校と地区の行列、8日（月）に先頭が10時に出発する大行列、9日（火）のすみれの火曜日、10日（水）の灰の水曜日でカーニバルが終わることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" fill="#153452" font-weight="700">ケルンの街頭カーニバル2027：6日間の流れ</text><text x="60" y="132" font-size="22" fill="#405a71">日ごとに主役が変わる。行列の時間は例年の目安で、直前に公式発表を確認</text><rect x="60" y="170" width="172" height="420" rx="14" fill="white" stroke="#b5473a" stroke-width="3"/><rect x="60" y="170" width="172" height="58" rx="14" fill="#b5473a"/><rect x="60" y="210" width="172" height="18" fill="#b5473a"/><text x="146.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/4 木</text><text x="146.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">女性の</text><text x="146.0" y="300" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">カーニバルの日</text><text x="146.0" y="352" font-size="19" fill="#405a71" text-anchor="middle">12時ごろ</text><text x="146.0" y="386" font-size="19" fill="#405a71" text-anchor="middle">セヴェリン門前で</text><text x="146.0" y="420" font-size="19" fill="#405a71" text-anchor="middle">ヤンとグリートの劇</text><text x="146.0" y="454" font-size="19" fill="#405a71" text-anchor="middle">→ 市中心部へ行列</text><rect x="245" y="170" width="172" height="420" rx="14" fill="white" stroke="#3d405b" stroke-width="3"/><rect x="245" y="170" width="172" height="58" rx="14" fill="#3d405b"/><rect x="245" y="210" width="172" height="18" fill="#3d405b"/><text x="331.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/6 土</text><text x="331.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">幽霊の行列</text><text x="331.0" y="322" font-size="19" fill="#405a71" text-anchor="middle">夜</text><text x="331.0" y="356" font-size="19" fill="#405a71" text-anchor="middle">幽霊に仮装して</text><text x="331.0" y="390" font-size="19" fill="#405a71" text-anchor="middle">誰でも参加できる</text><text x="331.0" y="424" font-size="19" fill="#405a71" text-anchor="middle">ルートは毎年変わる</text><rect x="430" y="170" width="172" height="420" rx="14" fill="white" stroke="#2a9d8f" stroke-width="3"/><rect x="430" y="170" width="172" height="58" rx="14" fill="#2a9d8f"/><rect x="430" y="210" width="172" height="18" fill="#2a9d8f"/><text x="516.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/7 日</text><text x="516.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">学校と地区の</text><text x="516.0" y="300" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">行列</text><text x="516.0" y="352" font-size="19" fill="#405a71" text-anchor="middle">11時11分ごろから</text><text x="516.0" y="386" font-size="19" fill="#405a71" text-anchor="middle">手づくりの衣装</text><text x="516.0" y="420" font-size="19" fill="#405a71" text-anchor="middle">沿道に25万人以上</text><rect x="615" y="170" width="172" height="420" rx="14" fill="white" stroke="#c1121f" stroke-width="3"/><rect x="615" y="170" width="172" height="58" rx="14" fill="#c1121f"/><rect x="615" y="210" width="172" height="18" fill="#c1121f"/><text x="701.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/8 月</text><text x="701.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">バラの月曜日</text><text x="701.0" y="322" font-size="19" fill="#405a71" text-anchor="middle">10時に先頭が出発</text><text x="701.0" y="356" font-size="19" fill="#405a71" text-anchor="middle">約3時間半</text><text x="701.0" y="390" font-size="19" fill="#405a71" text-anchor="middle">お菓子と花束</text><text x="701.0" y="424" font-size="19" fill="#405a71" text-anchor="middle">最後に三人組</text><rect x="800" y="170" width="172" height="420" rx="14" fill="white" stroke="#6a4c93" stroke-width="3"/><rect x="800" y="170" width="172" height="58" rx="14" fill="#6a4c93"/><rect x="800" y="210" width="172" height="18" fill="#6a4c93"/><text x="886.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/9 火</text><text x="886.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">すみれの火曜日</text><text x="886.0" y="322" font-size="19" fill="#405a71" text-anchor="middle">街頭カーニバルの</text><text x="886.0" y="356" font-size="19" fill="#405a71" text-anchor="middle">最終日</text><rect x="985" y="170" width="172" height="420" rx="14" fill="white" stroke="#5c677d" stroke-width="3"/><rect x="985" y="170" width="172" height="58" rx="14" fill="#5c677d"/><rect x="985" y="210" width="172" height="18" fill="#5c677d"/><text x="1071.0" y="208" font-size="24" fill="white" font-weight="700" text-anchor="middle">2/10 水</text><text x="1071.0" y="270" font-size="22" fill="#153452" font-weight="700" text-anchor="middle">灰の水曜日</text><text x="1071.0" y="322" font-size="19" fill="#405a71" text-anchor="middle">カーニバルが終わり</text><text x="1071.0" y="356" font-size="19" fill="#405a71" text-anchor="middle">復活祭前の</text><text x="1071.0" y="390" font-size="19" fill="#405a71" text-anchor="middle">断食期間へ</text><text x="60" y="630" font-size="16" fill="#405a71">出典：ケルン市、ケルン・カーニバル祭典委員会（2026年10月31日参照）。土・日の日付は市が示す木・月の日程から数えたもの</text></g></svg>