<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">年金の払い戻し</title><desc id="d">ドイツの年金の払い戻しは、外国に住み任意加入の権利がない人が保険の義務がなくなってから24か月後に申請でき、日本国籍の人はドイツで60か月以上払うと対象外で、払い戻すと加入期間がなくなることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツの年金、払い戻す？残す？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">払い戻し（Beitragserstattung）の主な条件</text><rect x="60" y="180" width="530" height="195" rx="16" fill="white"/><rect x="60" y="180" width="12" height="195" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">申請できる時期</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">保険の義務がなくなってから</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">24か月たった後</text><rect x="610" y="180" width="530" height="195" rx="16" fill="white"/><rect x="610" y="180" width="12" height="195" rx="6" fill="#2f8a64"/><text x="646" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">対象の人</text><text x="646" y="268" font-size="20" fill="#29465f" text-anchor="start">外国に住み</text><text x="646" y="298" font-size="20" fill="#29465f" text-anchor="start">ドイツの任意加入の権利がない人</text><rect x="60" y="395" width="530" height="195" rx="16" fill="white"/><rect x="60" y="395" width="12" height="195" rx="6" fill="#b5473a"/><text x="96" y="443" font-size="24" font-weight="700" fill="#b5473a" text-anchor="start">日本国籍の人の注意</text><text x="96" y="483" font-size="20" fill="#29465f" text-anchor="start">ドイツで60か月以上払うと</text><text x="96" y="513" font-size="20" fill="#29465f" text-anchor="start">払い戻しの対象外</text><rect x="610" y="395" width="530" height="195" rx="16" fill="white"/><rect x="610" y="395" width="12" height="195" rx="6" fill="#c9952a"/><text x="646" y="443" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">払い戻すと</text><text x="646" y="483" font-size="20" fill="#29465f" text-anchor="start">ドイツの加入期間がなくなり</text><text x="646" y="513" font-size="20" fill="#29465f" text-anchor="start">日本との通算にも使えない</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ年金保険（2026年10月29日参照）</text></g></svg>