name: Temporary content cycle build (removed after successful run)
on:
  push:
    branches:
      - editorial/jc-content-cycle-20261101
permissions:
  contents: write
jobs:
  build-generated-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge latest main into the editorial branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - run: npm ci
      - name: Re-encode only the three new original vector cover sets within the existing image budget
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false sharp
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import { rename } from "node:fs/promises";
          const files = [
            ["assets/img/events/dresden-striezelmarkt-2026-guide.webp", 900],
            ["assets/img/events/dresden-striezelmarkt-2026-guide-768w.webp", 768],
            ["assets/img/events/dresden-striezelmarkt-2026-guide-480w.webp", 480],
            ["assets/img/events/frankfurt-christmas-market-2026-guide.webp", 900],
            ["assets/img/events/frankfurt-christmas-market-2026-guide-768w.webp", 768],
            ["assets/img/events/frankfurt-christmas-market-2026-guide-480w.webp", 480],
            ["assets/img/events/stuttgart-christmas-market-2026-guide.webp", 900],
            ["assets/img/events/stuttgart-christmas-market-2026-guide-768w.webp", 768],
            ["assets/img/events/stuttgart-christmas-market-2026-guide-480w.webp", 480]
          ];
          for (const [file, width] of files) {
            const temp = file + ".optimized.webp";
            await sharp(file)
              .resize({ width, withoutEnlargement: true })
              .webp({ quality: 30, effort: 6, smartSubsample: true })
              .toFile(temp);
            await rename(temp, file);
          }
          console.log("Optimized nine new vector cover files; original source/captions remain unchanged.");
          NODE
      - run: npm run build
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/j-connect-browser-results
        run: npm run test:browser
      - name: Check whitespace and protect unrelated systems
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/main)"
          git diff --check "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE")
          for path in "${changed[@]}"; do
            case "$path" in
              content/events/news/deutschlandticket-2027-price-consent.md|content/events/news/tax-refund-2022-deadline-december-2026.md|content/events/columns/germany-silvester-fireworks-rules.md|content/events/columns/st-martin-day-germany.md|content/registry/events.json|content/events/frankfurt-christmas-market-2026-guide.md|content/events/stuttgart-christmas-market-2026-guide.md|content/events/dresden-striezelmarkt-2026-guide.md|assets/images/events/dresden-striezelmarkt-history.svg|assets/images/events/dresden-striezelmarkt-symbols.svg|assets/images/events/frankfurt-christmas-market-history.svg|assets/images/events/frankfurt-christmas-market-specialties.svg|assets/images/events/stuttgart-christmas-market-highlights.svg|assets/images/events/stuttgart-christmas-market-history.svg|assets/img/events/dresden-striezelmarkt-2026-guide.webp|assets/img/events/dresden-striezelmarkt-2026-guide-480w.webp|assets/img/events/dresden-striezelmarkt-2026-guide-768w.webp|assets/img/events/frankfurt-christmas-market-2026-guide.webp|assets/img/events/frankfurt-christmas-market-2026-guide-480w.webp|assets/img/events/frankfurt-christmas-market-2026-guide-768w.webp|assets/img/events/stuttgart-christmas-market-2026-guide.webp|assets/img/events/stuttgart-christmas-market-2026-guide-480w.webp|assets/img/events/stuttgart-christmas-market-2026-guide-768w.webp|docs/article-image-generation-2026-10-31.json|assets/images/events/tax-refund-voluntary-vs-mandatory.svg|assets/images/events/silvester-fireworks-calendar.svg|assets/images/events/st-martin-day-germany-timeline.svg|assets/images/events/st-martin-day-germany-checklist.svg|germany/ja/events/news/deutschlandticket-2027-price-consent/index.html|germany/ja/events/news/tax-refund-2022-deadline-december-2026/index.html|germany/ja/events/columns/germany-silvester-fireworks-rules/index.html|germany/ja/events/columns/st-martin-day-germany/index.html|germany/ja/events/dresden-striezelmarkt-2026-guide/index.html|germany/ja/events/frankfurt-christmas-market-2026-guide/index.html|germany/ja/events/stuttgart-christmas-market-2026-guide/index.html|germany/ja/events/index.html|germany/ja/events/news/index.html|germany/ja/events/columns/index.html|germany/ja/index.html|assets/js/search-index.js|sitemap.xml|docs/jc-content-cycle-2026-11-01-provenance.md|.github/workflows/content-cycle-build.yml) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          echo "Change-scope guard passed."
      - name: Remove temporary builder and commit generated output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/content-cycle-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build generated pages for verified editorial updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
