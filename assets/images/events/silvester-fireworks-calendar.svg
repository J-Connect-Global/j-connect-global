<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">大晦日の花火を買える日と使える日</title><desc id="d">2026年は一般向けの花火を12月29日から31日まで買うことができ、打ち上げてよいのは12月31日と1月1日だけであること、購入と使用は18歳以上、教会や病院などの近くでは禁止であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef1f6"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">大晦日の花火：買える日と使える日</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">一般向けの花火（カテゴリー2）。買うのも使うのも18歳以上</text><text x="60" y="230" font-size="22" font-weight="700" fill="#153452" text-anchor="start">2026〜27年</text><rect x="60" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="142" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">12/28</text><text x="142" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">月曜日</text><rect x="60" y="355" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="142" y="410" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="60" y="460" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="142" y="515" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="240" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="322" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">12/29</text><text x="322" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">火曜日</text><rect x="240" y="355" width="165" height="90" rx="14" fill="#c9952a"/><text x="322" y="410" font-size="24" font-weight="700" fill="white" text-anchor="middle">買える</text><rect x="240" y="460" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="322" y="515" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="420" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="502" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">12/30</text><text x="502" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">水曜日</text><rect x="420" y="355" width="165" height="90" rx="14" fill="#c9952a"/><text x="502" y="410" font-size="24" font-weight="700" fill="white" text-anchor="middle">買える</text><rect x="420" y="460" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="502" y="515" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="600" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="682" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">12/31</text><text x="682" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">木曜日</text><rect x="600" y="355" width="165" height="90" rx="14" fill="#c9952a"/><text x="682" y="410" font-size="24" font-weight="700" fill="white" text-anchor="middle">買える</text><rect x="600" y="460" width="165" height="90" rx="14" fill="#b5473a"/><text x="682" y="515" font-size="24" font-weight="700" fill="white" text-anchor="middle">使える</text><rect x="780" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="862" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">1/1</text><text x="862" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">金曜日</text><rect x="780" y="355" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="862" y="410" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="780" y="460" width="165" height="90" rx="14" fill="#b5473a"/><text x="862" y="515" font-size="24" font-weight="700" fill="white" text-anchor="middle">使える</text><rect x="960" y="250" width="165" height="90" rx="14" fill="#153452"/><text x="1042" y="292" font-size="30" font-weight="700" fill="white" text-anchor="middle">1/2</text><text x="1042" y="325" font-size="18" fill="#cfe0ef" text-anchor="middle">土曜日</text><rect x="960" y="355" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="1042" y="410" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><rect x="960" y="460" width="165" height="90" rx="14" fill="#e3e8ee"/><text x="1042" y="515" font-size="24" font-weight="700" fill="#9aa5b1" text-anchor="middle">×</text><text x="50" y="410" font-size="1" fill="#29465f" text-anchor="start"></text><rect x="60" y="565" width="1080" height="46" rx="12" fill="#fff3f0"/><text x="600" y="596" font-size="19" fill="#7a2e24" text-anchor="middle">教会・病院・子どもや高齢者の施設・燃えやすい建物のすぐ近くでは禁止。違反は最高5万ユーロの過料</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：爆発物法第1施行令 第20条・第22条・第23条、連邦内務省。日曜日にあたる年は12月28日から販売可</text></g></svg>