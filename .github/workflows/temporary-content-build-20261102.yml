name: Temporary branch content build

on:
  push:
    branches:
      - editorial/content-refresh-20261102

permissions:
  contents: write
  actions: write

concurrency:
  group: editorial-content-build-20261102
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message != 'Build generated content'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical content and layout
        run: npm run build

      - name: Commit generated files to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build generated content"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi


