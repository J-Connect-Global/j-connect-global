<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>冬のカビを防ぐ換気と暖房の目安</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">冬のカビを防ぐ　換気と暖房の目安</text><text x="48" y="152" font-size="23" fill="#52666C">4人家族では、1日に約12リットルの水分が空気中に出る</text><rect x="268" y="176" width="408" height="50" rx="10" fill="#173B48"/><text x="284" y="210" font-size="24" fill="#FFFFFF">目安</text><rect x="688" y="176" width="452" height="50" rx="10" fill="#146859"/><text x="704" y="210" font-size="24" fill="#FFFFFF">ポイント</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="270" font-size="24" fill="#52666C">換気</text><text x="284" y="270" font-size="26" fill="#173B48">窓を全開にして冬は5〜10分</text><text x="704" y="270" font-size="26" fill="#173B48">1日数回。向かい合う窓で風を通す</text><rect x="48" y="290" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="330" font-size="24" fill="#52666C">傾けて開ける</text><text x="284" y="330" font-size="26" fill="#C2410C">長時間は避ける</text><text x="704" y="330" font-size="26" fill="#173B48">窓まわりが冷えて結露する</text><rect x="48" y="350" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="390" font-size="24" fill="#52666C">湯気</text><text x="284" y="390" font-size="26" fill="#173B48">料理・シャワー後すぐ換気</text><text x="704" y="390" font-size="26" fill="#173B48">室内干しの部屋もこまめに</text><rect x="48" y="410" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="450" font-size="24" fill="#52666C">暖房</text><text x="284" y="450" font-size="26" fill="#173B48">居間20度・台所18度・寝室17度</text><text x="704" y="450" font-size="26" fill="#173B48">冷やしすぎるとカビが出やすい</text><rect x="48" y="470" width="1104" height="60" fill="#FFFFFF"/><text x="64" y="510" font-size="24" fill="#52666C">湿度</text><text x="284" y="510" font-size="26" fill="#173B48">断熱が弱い家は冬50%未満</text><text x="704" y="510" font-size="26" fill="#173B48">湿度計で見えるように</text><rect x="48" y="530" width="1104" height="60" fill="#F9F8F3"/><text x="64" y="570" font-size="24" fill="#52666C">家具</text><text x="284" y="570" font-size="26" fill="#173B48">外壁から10cm以上離す</text><text x="704" y="570" font-size="26" fill="#173B48">暖房器具の前もふさがない</text><text x="48" y="622" font-size="22" fill="#173B48">換気の間は暖房のつまみを下げると、熱を無駄にしません。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：連邦環境庁「暖房と室温」  |  2026-11-06</text></g></svg>