name: One-time rebuild after article body image UX and SVG updates
on:
  push:
    branches:
      - codex/article-body-media-audit-20261123
    paths:
      - .github/workflows/finalize-inline-diagram-ux.yml
permissions:
  contents: write
jobs:
  rebuild-generated-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit only verified generated page artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u germany/ja assets/data sitemap.xml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized"
            exit 0
          fi
          git commit -m "build: publish accessible full-size links for inline images"
          git push origin "HEAD:refs/heads/codex/article-body-media-audit-20261123"
