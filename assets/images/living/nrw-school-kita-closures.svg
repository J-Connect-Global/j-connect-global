<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">学校休暇と保育施設の休園日の違い</title><desc id="desc">学校休暇は州共通の日程と学校ごとの移動休日で決まる一方、Kitaの休園日は施設や運営者の年間予定で確認する必要がある。</desc>
<rect width="1200" height="600" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="516" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="39" font-weight="800">学校とKitaは、予定表を別々に確認</text>
<g transform="translate(88 154)"><rect width="480" height="238" rx="18" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><text x="28" y="48" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="24" font-weight="800">学校</text><text x="28" y="92" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">・州共通の休暇期間</text><text x="28" y="128" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">・学校ごとの移動休日</text><text x="28" y="176" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19" font-weight="700">学校の年間予定表</text></g>
<g transform="translate(632 154)"><rect width="480" height="238" rx="18" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><text x="28" y="48" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="24" font-weight="800">Kita（保育施設）</text><text x="28" y="92" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">・施設独自の休園期間</text><text x="28" y="128" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">・代替保育の有無</text><text x="28" y="176" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19" font-weight="700">運営者からの案内</text></g>
<rect x="88" y="424" width="1024" height="70" rx="14" fill="#f7eee3" stroke="#ead8c1" stroke-width="2"/><text x="112" y="466" fill="#9a6130" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">勤務先への休暇申請前に、両方の日程を照合しましょう。</text>
<text x="90" y="526" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜確認日：2026年10月26日</text>
</svg>