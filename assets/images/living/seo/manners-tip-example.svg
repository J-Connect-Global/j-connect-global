<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">チップの渡し方の例</title><desc id="desc">請求額が23.50ユーロなら25ユーロ、請求額が48ユーロなら52ユーロのように、少し足した合計額を会計のときに伝えて払う。</desc><rect width="480" height="520" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">チップの渡し方の例</text><text x="24" y="78" font-size="18">会計のときに合計額を伝える</text><rect x="20" y="104" width="440" height="150" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="138" font-size="20">請求額 23.50ユーロ</text><text x="36" y="176" font-size="30" font-weight="700" fill="#1e8449">→ 25ユーロでお願いします</text><text x="36" y="216" font-size="18">小さな額は、切りのいい額に丸める</text><rect x="20" y="270" width="440" height="150" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="304" font-size="20">請求額 48ユーロ</text><text x="36" y="342" font-size="30" font-weight="700" fill="#1e8449">→ 52ユーロでお願いします</text><text x="36" y="382" font-size="18">目安は5〜10%程度（義務ではありません）</text><text x="24" y="470" font-size="17">セルフサービスの店では、ほぼ不要です</text><text x="24" y="498" font-size="15" fill="#5b6b82">金額は説明用の例です</text></g></svg>
