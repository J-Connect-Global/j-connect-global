<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>子どもの看病のための休暇の日数（2026年と2027年）</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">子どもの看病のための休暇　2027年は原則10日に</text><text x="48" y="152" font-size="23" fill="#52666C">12歳未満の子どもが対象。手取りの90%が公的保険から出る</text><rect x="388" y="176" width="328" height="50" rx="10" fill="#173B48"/><text x="404" y="210" font-size="24" fill="#FFFFFF">2026年（特例）</text><rect x="728" y="176" width="412" height="50" rx="10" fill="#146859"/><text x="744" y="210" font-size="24" fill="#FFFFFF">2027年（特例延長がなければ）</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">子ども1人あたり（親1人）</text><text x="404" y="272" font-size="26" fill="#173B48">15日</text><text x="744" y="272" font-size="26" fill="#C2410C">10日</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">合計の上限（親1人）</text><text x="404" y="336" font-size="26" fill="#173B48">35日</text><text x="744" y="336" font-size="26" fill="#C2410C">25日</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">ひとり親：子ども1人</text><text x="404" y="400" font-size="26" fill="#173B48">30日</text><text x="744" y="400" font-size="26" fill="#C2410C">20日</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">ひとり親：合計</text><text x="404" y="464" font-size="26" fill="#173B48">70日</text><text x="744" y="464" font-size="26" fill="#C2410C">50日</text><text x="48" y="622" font-size="22" fill="#173B48">連邦保健省FAQの特例は2026年まで。延長がなければ2027年は通常ルールです。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：社会法典第5編第45条  |  2026-11-10</text></g></svg>