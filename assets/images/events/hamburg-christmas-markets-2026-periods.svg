<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ハンブルクの主なクリスマスマーケットと冬のドームの2026年の期間</title><desc id="d">ハンブルクの主な市と冬のドームの2026年の期間を横棒で比較した図。サンタ・パウリは11月9日から、ユングフェルンシュティークは11月18日から、市庁舎前は11月23日から、いずれも12月23日まで。冬のドームは11月6日から12月6日まで</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">ハンブルクの主な市：2026年の期間</text><text x="60" y="134" font-size="22" fill="#405a71">主な三つの市はいずれも12月23日まで</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="468" y1="190" x2="468" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="468" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/9</text><line x1="591" y1="190" x2="591" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="591" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/18</text><line x1="659" y1="190" x2="659" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="659" y="594" font-size="18" fill="#405a71" text-anchor="middle">11/23</text><line x1="837" y1="190" x2="837" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="837" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/6</text><line x1="1069" y1="190" x2="1069" y2="566" stroke="#d9cfc3" stroke-width="2" stroke-dasharray="4 6"/><text x="1069" y="594" font-size="18" fill="#405a71" text-anchor="middle">12/23</text><text x="84" y="235" font-size="24" font-weight="700" fill="#153452">市庁舎前</text><text x="84" y="259" font-size="16" fill="#405a71">歴史的クリスマスマーケット</text><rect x="659" y="214" width="423" height="34" rx="8" fill="#b5473a"/><text x="84" y="329" font-size="24" font-weight="700" fill="#153452">ユングフェルン</text><text x="84" y="353" font-size="16" fill="#405a71">シュティーク</text><rect x="591" y="308" width="492" height="34" rx="8" fill="#2b5c8a"/><rect x="646" y="304" width="14" height="42" fill="white"/><text x="1093" y="362" font-size="15" fill="#7a3b2e" text-anchor="end">11/22休業</text><text x="84" y="423" font-size="24" font-weight="700" fill="#153452">サンタ・パウリ</text><text x="84" y="447" font-size="16" fill="#405a71">シュピールブーデン広場</text><rect x="468" y="402" width="614" height="34" rx="8" fill="#4a2f4f"/><text x="84" y="517" font-size="24" font-weight="700" fill="#153452">冬のドーム</text><text x="84" y="541" font-size="16" fill="#405a71">移動遊園地（市ではない）</text><rect x="427" y="496" width="423" height="34" rx="8" fill="#2f6a40"/><text x="60" y="645" font-size="18" fill="#405a71">最新情報はハンブルク市の案内で確認（2026年11月1日参照）</text></g></svg>