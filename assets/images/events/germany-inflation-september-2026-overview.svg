<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">2026年9月のドイツの物価</title><desc id="d">2026年7月2.8%、8月2.9%、9月3.3%と物価上昇率が高まり、9月の内訳はエネルギー14.9%、財3.8%、サービス2.7%、コア2.4%、食品0.4%であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツの物価上昇率：3か月続けて上昇</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">前年同月比（2026年）</text><rect x="60" y="180" width="500" height="420" rx="16" fill="white"/><rect x="110" y="274" width="100" height="266" rx="10" fill="#2d6a9f"/><text x="160" y="260" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="middle">2.8%</text><text x="160" y="578" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">7月</text><rect x="260" y="265" width="100" height="275" rx="10" fill="#2d6a9f"/><text x="310" y="251" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="middle">2.9%</text><text x="310" y="578" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">8月</text><rect x="410" y="227" width="100" height="313" rx="10" fill="#b5473a"/><text x="460" y="213" font-size="28" font-weight="700" fill="#b5473a" text-anchor="middle">3.3%</text><text x="460" y="578" font-size="24" font-weight="700" fill="#153452" text-anchor="middle">9月</text><text x="80" y="220" font-size="24" font-weight="700" fill="#153452" text-anchor="start">物価全体</text><text x="600" y="215" font-size="24" font-weight="700" fill="#153452" text-anchor="start">9月の内訳</text><rect x="600" y="240" width="540" height="60" rx="16" fill="white"/><rect x="600" y="240" width="12" height="60" rx="6" fill="#b5473a"/><text x="630" y="280" font-size="22" font-weight="700" fill="#153452" text-anchor="start">エネルギー</text><text x="1115" y="281" font-size="28" font-weight="700" fill="#b5473a" text-anchor="end">+14.9%</text><rect x="600" y="312" width="540" height="60" rx="16" fill="white"/><rect x="600" y="312" width="12" height="60" rx="6" fill="#c9952a"/><text x="630" y="352" font-size="22" font-weight="700" fill="#153452" text-anchor="start">物（財）全体</text><text x="1115" y="353" font-size="28" font-weight="700" fill="#c9952a" text-anchor="end">+3.8%</text><rect x="600" y="384" width="540" height="60" rx="16" fill="white"/><rect x="600" y="384" width="12" height="60" rx="6" fill="#2d6a9f"/><text x="630" y="424" font-size="22" font-weight="700" fill="#153452" text-anchor="start">サービス</text><text x="1115" y="425" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="end">+2.7%</text><rect x="600" y="456" width="540" height="60" rx="16" fill="white"/><rect x="600" y="456" width="12" height="60" rx="6" fill="#2f8a64"/><text x="630" y="496" font-size="22" font-weight="700" fill="#153452" text-anchor="start">コア（食品・エネルギー除く）</text><text x="1115" y="497" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="end">+2.4%</text><rect x="600" y="528" width="540" height="60" rx="16" fill="white"/><rect x="600" y="528" width="12" height="60" rx="6" fill="#5b7086"/><text x="630" y="568" font-size="22" font-weight="700" fill="#153452" text-anchor="start">食品</text><text x="1115" y="569" font-size="28" font-weight="700" fill="#5b7086" text-anchor="end">+0.4%</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦統計局 2026年10月13日発表（2026年10月29日参照）</text></g></svg>