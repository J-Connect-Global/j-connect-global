<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>解雇されたときに取る行動</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">解雇の書面を受け取ったら</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">書面と受け取った日を記録する</text><text x="128" y="213" font-size="20" fill="#52666C">紙に署名した書面でなければ無効（民法第623条）</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">3週間以内に訴えるか決める</text><text x="128" y="303" font-size="20" fill="#52666C">期限を過ぎると不当な解雇でも有効に</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">3日以内に雇用エージェンシーへ</text><text x="128" y="393" font-size="20" fill="#52666C">求職の届け出が遅れると失業手当が減ることも</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">滞在許可への影響を確認</text><text x="128" y="483" font-size="20" fill="#52666C">就労の許可なら外国人局への連絡が必要なことも</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">勤務証明書を請求する</text><text x="128" y="573" font-size="20" fill="#52666C">評価まで書いたものを求めておく</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">解雇保護法</text><text x="788" y="268" font-size="32" fill="#173B48">10人超の会社で</text><text x="788" y="312" font-size="32" fill="#173B48">6か月超の勤務</text><text x="788" y="372" font-size="21" fill="#52666C">この場合、会社は本人の行動</text><text x="788" y="404" font-size="21" fill="#52666C">・事情・経営上の理由など</text><text x="788" y="436" font-size="21" fill="#52666C">社会的に正当な理由が</text><text x="788" y="468" font-size="21" fill="#52666C">なければ解雇できません</text><text x="788" y="500" font-size="21" fill="#52666C">労働組合・弁護士に相談を</text><text x="48" y="622" font-size="22" fill="#173B48">退職の時期が3か月以上先に分かっている場合は、その時点で雇用エージェンシーに届け出ます。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：解雇保護法第1条・第4条・第23条、民法第623条、営業法第109条  |  2026-11-06</text></g></svg>