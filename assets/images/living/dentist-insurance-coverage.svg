<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">歯科の保険の範囲</title><desc id="d">公的保険では大人の歯の健診が年2回、歯石の除去が年1回、歯周病の検査が2年に1回受けられ、専門のクリーニングは原則自費で保険組合によって補助があることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">歯医者：公的保険で受けられること（大人）</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">クリーニング（PZR）は原則自費</text><rect x="60" y="185" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="185" width="10" height="62" rx="5" fill="#2f8a64"/><text x="95" y="224" font-size="22" font-weight="700" fill="#153452" text-anchor="start">歯の健診</text><text x="1110" y="225" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="end">年2回・保険</text><rect x="60" y="257" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="257" width="10" height="62" rx="5" fill="#2f8a64"/><text x="95" y="296" font-size="22" font-weight="700" fill="#153452" text-anchor="start">歯石の除去</text><text x="1110" y="297" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="end">年1回・保険</text><rect x="60" y="329" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="329" width="10" height="62" rx="5" fill="#2f8a64"/><text x="95" y="368" font-size="22" font-weight="700" fill="#153452" text-anchor="start">歯周病の検査</text><text x="1110" y="369" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="end">2年に1回・保険</text><rect x="60" y="401" width="1080" height="62" rx="16" fill="white"/><rect x="60" y="401" width="10" height="62" rx="5" fill="#2f8a64"/><text x="95" y="440" font-size="22" font-weight="700" fill="#153452" text-anchor="start">専門のクリーニング（PZR）</text><text x="1110" y="441" font-size="24" font-weight="700" fill="#b5473a" text-anchor="end">原則自費（補助のある保険組合も）</text><rect x="60" y="480" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="525" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">ボーナス手帳で補助が増える</text><text x="90" y="565" font-size="21" fill="#29465f" text-anchor="start">かぶせ物などの補助は60％ → 5年続けて健診で70％ → 10年で75％</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター（2026年10月29日参照）</text></g></svg>