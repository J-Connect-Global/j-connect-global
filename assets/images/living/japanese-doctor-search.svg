<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日本語で受診できる医療機関の探し方</title><desc id="d">日本語で受診できる医療機関は、外務省「世界の医療事情」、在外公館の案内、116117の医師検索の言語の絞り込みの3つの方法で探し、受診前に電話で日本語の対応と予約を確かめることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日本語で受診できる医療機関の探し方</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">3つの方法で探し、受診の前に電話で確かめる</text><rect x="60" y="180" width="346" height="250" rx="16" fill="white"/><rect x="60" y="180" width="12" height="250" rx="6" fill="#2d6a9f"/><text x="96" y="228" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="start">外務省「世界の医療事情」</text><text x="96" y="268" font-size="20" fill="#29465f" text-anchor="start">日本語で診療できる主な医療機関</text><text x="96" y="298" font-size="20" fill="#29465f" text-anchor="start">日本人の通訳がいる主な病院</text><rect x="426" y="180" width="346" height="250" rx="16" fill="white"/><rect x="426" y="180" width="12" height="250" rx="6" fill="#2f8a64"/><text x="462" y="228" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="start">在外公館の案内</text><text x="462" y="268" font-size="20" fill="#29465f" text-anchor="start">地域の医療機関の情報</text><text x="462" y="298" font-size="20" fill="#29465f" text-anchor="start">夜間・休日の探し方</text><rect x="792" y="180" width="346" height="250" rx="16" fill="white"/><rect x="792" y="180" width="12" height="250" rx="6" fill="#c9952a"/><text x="828" y="228" font-size="24" font-weight="700" fill="#c9952a" text-anchor="start">116117の医師検索</text><text x="828" y="268" font-size="20" fill="#29465f" text-anchor="start">「言語」で日本語を選んで</text><text x="828" y="298" font-size="20" fill="#29465f" text-anchor="start">地域・専門分野と組み合わせる</text><rect x="60" y="470" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="515" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">予約の前に確かめる</text><text x="90" y="555" font-size="21" fill="#29465f" text-anchor="start">日本語で診療できる日・時間 ／ 公的保険で受診できるか ／ 予約の方法</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：外務省、在デュッセルドルフ日本国総領事館、116117（2026年10月29日参照）</text></g></svg>