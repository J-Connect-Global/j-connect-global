<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">デュッセルドルフのカーニバル2026/27：主な催し</title><desc id="d">2026年11月11日（水）のホッペディッツの目覚め、13日（金）の王子とヴェネツィアの式典、14日（土）の子どものホッペディッツの目覚め、2027年1月7日のテレビ中継のシッツング、2月4日（木）11時11分の女性のカーニバルの日、6日（土）14時の子どもと若者の行列、7日（日）11時からのケー通りの仮装散歩、8日（月）のバラの月曜日の行列、9日（火）19時の見送りの式典、10日（水）の灰の水曜日を示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" fill="#153452" font-weight="700">デュッセルドルフ 2026/27：主な催し</text><text x="60" y="132" font-size="22" fill="#405a71">11月に始まり、1月の屋内の催しを経て、2月の6日間で最高潮に</text><rect x="60" y="165" width="1080" height="190" rx="16" fill="white"/><text x="90" y="209" font-size="26" fill="#2a9d8f" font-weight="700">2026年11月　シーズン開幕</text><rect x="90" y="229" width="244" height="104" rx="12" fill="#2a9d8f" opacity=".12"/><text x="212.25" y="263" font-size="21" fill="#2a9d8f" font-weight="700" text-anchor="middle">11/11 水</text><text x="212.25" y="293" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">ホッペディッツの目覚め</text><text x="212.25" y="319" font-size="16" fill="#405a71" text-anchor="middle">11時〜 市庁舎前・無料</text><rect x="348" y="229" width="244" height="104" rx="12" fill="#2a9d8f" opacity=".12"/><text x="470.75" y="263" font-size="21" fill="#2a9d8f" font-weight="700" text-anchor="middle">11/13 金</text><text x="470.75" y="293" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">王子とヴェネツィア</text><text x="470.75" y="319" font-size="16" fill="#405a71" text-anchor="middle">の式典（有料）</text><rect x="607" y="229" width="244" height="104" rx="12" fill="#2a9d8f" opacity=".12"/><text x="729.25" y="263" font-size="21" fill="#2a9d8f" font-weight="700" text-anchor="middle">11/14 土</text><text x="729.25" y="293" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">子どもの</text><text x="729.25" y="319" font-size="16" fill="#405a71" text-anchor="middle">ホッペディッツの目覚め</text><rect x="866" y="229" width="244" height="104" rx="12" fill="#2a9d8f" opacity=".12"/><text x="987.75" y="263" font-size="21" fill="#2a9d8f" font-weight="700" text-anchor="middle">1/7 木</text><text x="987.75" y="293" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">テレビ中継の</text><text x="987.75" y="319" font-size="16" fill="#405a71" text-anchor="middle">シッツング（有料）</text><rect x="60" y="375" width="1080" height="190" rx="16" fill="white"/><text x="90" y="419" font-size="26" fill="#c1121f" font-weight="700">2027年2月　街頭カーニバル</text><rect x="90" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="169.16666666666669" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/4 木</text><text x="169.16666666666669" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">女性のカーニバル</text><text x="169.16666666666669" y="529" font-size="16" fill="#405a71" text-anchor="middle">11時11分 市庁舎</text><rect x="262" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="341.50000000000006" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/6 土</text><text x="341.50000000000006" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">子どもと若者</text><text x="341.50000000000006" y="529" font-size="16" fill="#405a71" text-anchor="middle">の行列 14時</text><rect x="435" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="513.8333333333334" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/7 日</text><text x="513.8333333333334" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">ケー通りの</text><text x="513.8333333333334" y="529" font-size="16" fill="#405a71" text-anchor="middle">仮装散歩 11時〜</text><rect x="607" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="686.1666666666667" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/8 月</text><text x="686.1666666666667" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">バラの月曜日</text><text x="686.1666666666667" y="529" font-size="16" fill="#405a71" text-anchor="middle">の行列</text><rect x="779" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="858.5000000000001" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/9 火</text><text x="858.5000000000001" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">見送りの式典</text><text x="858.5000000000001" y="529" font-size="16" fill="#405a71" text-anchor="middle">19時 市庁舎前</text><rect x="952" y="439" width="158" height="104" rx="12" fill="#c1121f" opacity=".12"/><text x="1030.8333333333335" y="473" font-size="21" fill="#c1121f" font-weight="700" text-anchor="middle">2/10 水</text><text x="1030.8333333333335" y="503" font-size="17" fill="#153452" font-weight="700" text-anchor="middle">灰の水曜日</text><text x="1030.8333333333335" y="529" font-size="16" fill="#405a71" text-anchor="middle">カーニバルの終わり</text><text x="60" y="622" font-size="16" fill="#405a71">出典：デュッセルドルフ・カーニバル委員会（CC）の催し案内（2026年10月31日参照）</text></g></svg>