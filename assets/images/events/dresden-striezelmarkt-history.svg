<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ドレスデンのシュトリーツェルマルクトとシュトレンの歩み</title><desc id="d">1434年の市の始まり、1474年のシュトレンの最初の記録、1491年のバターの使用許可、1994年に始まったシュトレン祭り、1999年のピラミッドのギネス認定、2010年のEU地理的表示保護、2026年の第592回の開催を並べた年表</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">シュトリーツェルマルクトとシュトレンの歩み</text><text x="60" y="134" font-size="22" fill="#405a71">市と焼き菓子が、同じ街で600年近く育ってきた</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="110" y1="380" x2="1090" y2="380" stroke="#8d5a3c" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="130" y1="380" x2="130" y2="332" stroke="#153452" stroke-width="2"/><text x="130" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1434年</text><text x="130" y="292" font-size="18" fill="#405a71" text-anchor="middle">アルトマルクトで</text><text x="130" y="316" font-size="18" fill="#405a71" text-anchor="middle">市が始まる</text><circle cx="290" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="290" y1="380" x2="290" y2="428" stroke="#153452" stroke-width="2"/><text x="290" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1474年</text><text x="290" y="502" font-size="18" fill="#405a71" text-anchor="middle">シュトレンが</text><text x="290" y="526" font-size="18" fill="#405a71" text-anchor="middle">初めて文書に</text><circle cx="450" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="450" y1="380" x2="450" y2="332" stroke="#153452" stroke-width="2"/><text x="450" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1491年</text><text x="450" y="292" font-size="18" fill="#405a71" text-anchor="middle">バターの使用が</text><text x="450" y="316" font-size="18" fill="#405a71" text-anchor="middle">認められる</text><circle cx="610" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="610" y1="380" x2="610" y2="428" stroke="#153452" stroke-width="2"/><text x="610" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1994年</text><text x="610" y="502" font-size="18" fill="#405a71" text-anchor="middle">シュトレン祭りが</text><text x="610" y="526" font-size="18" fill="#405a71" text-anchor="middle">始まる</text><circle cx="770" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="770" y1="380" x2="770" y2="332" stroke="#153452" stroke-width="2"/><text x="770" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">1999年</text><text x="770" y="292" font-size="18" fill="#405a71" text-anchor="middle">ピラミッドが</text><text x="770" y="316" font-size="18" fill="#405a71" text-anchor="middle">ギネス記録に</text><circle cx="930" cy="380" r="13" fill="#153452" stroke="white" stroke-width="4"/><line x1="930" y1="380" x2="930" y2="428" stroke="#153452" stroke-width="2"/><text x="930" y="470" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">2010年</text><text x="930" y="502" font-size="18" fill="#405a71" text-anchor="middle">EUの地理的</text><text x="930" y="526" font-size="18" fill="#405a71" text-anchor="middle">表示保護を受ける</text><circle cx="1090" cy="380" r="13" fill="#b23a3a" stroke="white" stroke-width="4"/><line x1="1090" y1="380" x2="1090" y2="332" stroke="#153452" stroke-width="2"/><text x="1090" y="260" font-size="26" font-weight="700" fill="#153452" text-anchor="middle">2026年</text><text x="1090" y="292" font-size="18" fill="#405a71" text-anchor="middle">第592回</text><text x="1090" y="316" font-size="18" fill="#405a71" text-anchor="middle">11/25〜12/24</text></g></svg>