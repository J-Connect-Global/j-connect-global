name: One-off content build sync
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  build-and-sync:
    if: github.event.pull_request.head.ref == 'content/winter-service-shipping-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build: sync generated content for 2026-11-18 refresh"
            git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
          else
            echo "Generated content is already in sync."
          fi
