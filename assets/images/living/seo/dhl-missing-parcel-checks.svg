<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>配達済みなのに、荷物がない</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="128" font-size="48" fill="#173B48">配達済みなのに、荷物がない</text><text x="48" y="178" font-size="27" fill="#52666C">まず追跡の詳細と実際の受取先を確認する</text><rect x="48" y="209" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="209" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="264" font-size="38" fill="#173B48">1  追跡番号で全履歴を開く</text><text x="81" y="312" font-size="33" fill="#52666C">受取人・保管場所・返送履歴を確認</text><rect x="48" y="351" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="351" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="406" font-size="38" fill="#173B48">2  通知に対応する場所を確認</text><text x="81" y="454" font-size="33" fill="#52666C">同居人・隣人・郵便受け・指定した置き配場所</text><rect x="48" y="493" width="1104" height="126" rx="18" fill="#FFFFFF"/><rect x="48" y="493" width="12" height="126" rx="18" fill="#146859"/><text x="81" y="548" font-size="38" fill="#173B48">3  記録を添えて状況を連絡</text><text x="81" y="596" font-size="33" fill="#52666C">通販は販売店へ相談。配送はDHLの案内へ</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect編集部  |  2026-10-19</text></g></svg>