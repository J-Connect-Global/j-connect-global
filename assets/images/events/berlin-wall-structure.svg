<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ベルリンの壁の構造</title><desc id="d">ベルリンの壁は1枚ではなく、東側から内側の壁、見張りの塔と照明、監視の通路、車止め、西ベルリンに面した高さ約3.6メートルの壁が何重にも並び、その間は死の帯と呼ばれたことを示した概略図</desc><rect width="1200" height="675" rx="28" fill="#f4f6f8"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">「壁」は1枚ではなかった</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">東から西へ、何重もの仕掛け（簡略化した概略図）</text><rect x="80" y="400" width="140" height="160" fill="#dfe6ee"/><text x="150" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">東ベルリン</text><rect x="226" y="300" width="60" height="260" fill="#9aa5b1"/><text x="256" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">内側の壁</text><rect x="292" y="400" width="140" height="160" fill="#c9d3dd"/><text x="362" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">見張りの塔・照明</text><rect x="438" y="400" width="120" height="160" fill="#e9edf1"/><text x="498" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">監視の通路</text><rect x="564" y="400" width="100" height="160" fill="#c9d3dd"/><text x="614" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">車止め</text><rect x="670" y="260" width="70" height="300" fill="#5b6f84"/><text x="705" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">西側の壁（</text><text x="705" y="622" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">約3.6m）</text><rect x="746" y="400" width="140" height="160" fill="#e6efd9"/><text x="816" y="600" font-size="16" font-weight="700" fill="#153452" text-anchor="middle">西ベルリン</text><rect x="396" y="270" width="16" height="130" fill="#5b6f84"/><rect x="380" y="250" width="48" height="30" fill="#5b6f84"/><text x="600" y="200" font-size="22" font-weight="700" fill="#b5473a" text-anchor="middle">壁と壁の間の帯は「死の帯」とも呼ばれた</text><line x1="80" y1="560" x2="1120" y2="560" stroke="#5b6f84" stroke-width="4"/><text x="60" y="650" font-size="16" fill="#5b6f84" text-anchor="start">ベルリンの壁財団などの資料をもとにした概略図。場所や時期によって構造は異なります</text></g></svg>