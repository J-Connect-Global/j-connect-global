<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>確定申告は義務か任意かの判断の流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="118" font-size="42" fill="#173B48">会社員の確定申告　義務？それとも任意？</text><text x="48" y="160" font-size="24" fill="#52666C">代表的な条件を上から確認。一つでも「はい」なら義務の申告です</text><g font-size="25" fill="#173B48"><rect x="48" y="190" width="720" height="78" rx="14" fill="#FFFFFF"/><text x="72" y="222">① 夫婦ともに給与があり、一方が税区分5・6</text><text x="72" y="254" font-size="21" fill="#52666C">または二人とも税区分4で係数（Faktor）を設定</text><rect x="48" y="282" width="720" height="78" rx="14" fill="#FFFFFF"/><text x="72" y="314">② 給与以外の収入が年410ユーロ超</text><text x="72" y="346" font-size="21" fill="#52666C">副業の報酬、家賃収入など（天引きされていないもの）</text><rect x="48" y="374" width="720" height="78" rx="14" fill="#FFFFFF"/><text x="72" y="406">③ 失業手当・育児手当などの給付が年410ユーロ超</text><text x="72" y="438" font-size="21" fill="#52666C">赴任前の日本の給与など、税率計算だけに使う収入も含む</text><rect x="48" y="466" width="720" height="78" rx="14" fill="#FFFFFF"/><text x="72" y="498">④ 同じ時期に複数の勤務先から給与</text><text x="72" y="530" font-size="21" fill="#52666C">2社目以降が税区分6で天引きされている</text></g><path d="M790 230 H850 V505 H790" fill="none" stroke="#C2410C" stroke-width="6"/><path d="M850 368 H880" stroke="#C2410C" stroke-width="6"/><path d="M880 356 L898 368 L880 380 Z" fill="#C2410C"/><rect x="906" y="290" width="246" height="156" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="930" y="340" font-size="23" fill="#C2410C">一つでも「はい」</text><text x="930" y="384" font-size="34" fill="#173B48">義務の申告</text><text x="930" y="420" font-size="21" fill="#52666C">2026年分は2027/8/2</text><rect x="48" y="562" width="720" height="58" rx="14" fill="#DCEBE4"/><text x="72" y="600" font-size="25" fill="#146859">すべて「いいえ」→ 任意の申告（4年以内）</text><text x="796" y="600" font-size="21" fill="#52666C">還付を受けたいなら提出</text><text x="48" y="656" font-size="20" fill="#52666C">図解：J-Connect  |  所得税法第46条第2項の代表例。条件はこのほかにもあります  |  2026-11-05</text></g></svg>
