<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">自動車保険の乗り換えの期限</title><desc id="d">保険の1年が1月1日に始まる契約は11月30日（月）までに解約の通知が保険会社に届いている必要があり、値上げの通知を受け取ったら1か月以内に特別な解約ができ、事故による等級の低下などは対象外であることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">自動車保険の乗り換え：2026年の期限</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">保険の1年が1月1日に始まる契約の場合</text><rect x="60" y="180" width="520" height="250" rx="16" fill="white"/><text x="320" y="235" font-size="24" font-weight="700" fill="#405a71" text-anchor="middle">ふつうの解約の期限</text><text x="320" y="320" font-size="48" font-weight="700" fill="#b5473a" text-anchor="middle">11月30日（月）</text><text x="320" y="375" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">保険会社に「届いている」こと</text><rect x="620" y="180" width="520" height="250" rx="16" fill="white"/><text x="880" y="235" font-size="24" font-weight="700" fill="#405a71" text-anchor="middle">値上げの通知が来たら</text><text x="880" y="320" font-size="40" font-weight="700" fill="#2d6a9f" text-anchor="middle">受け取ってから1か月</text><text x="880" y="375" font-size="22" font-weight="700" fill="#153452" text-anchor="middle">特別な解約ができる</text><rect x="60" y="450" width="1080" height="140" rx="16" fill="#fff7e6"/><text x="90" y="495" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">特別な解約にならない値上げ</text><text x="90" y="540" font-size="22" fill="#29465f" text-anchor="start">事故で無事故の等級が下がった ／ 走行距離の申告を増やした</text><text x="90" y="575" font-size="19" fill="#5b7086" text-anchor="start">※契約の区切りが1月1日でない保険もあります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：消費者センター、ADAC（2026年10月29日参照）</text></g></svg>