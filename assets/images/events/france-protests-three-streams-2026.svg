<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">フランスの抗議：3つの流れが合流</title><desc id="d">高校生、燃料・エネルギー、労働組合の3つの抗議が合流し、10月17日の全国一斉デモにつながったことを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452">フランスの抗議：3つの流れが合流</text><text x="60" y="145" font-size="24" fill="#405a71">外務省と報道に基づく整理（2026年10月21日時点）</text><rect x="60" y="185" width="520" height="115" rx="18" fill="white"/><rect x="60" y="185" width="12" height="115" fill="#3f6fb5"/><text x="95" y="230" font-size="26" font-weight="700" fill="#153452">高校生（リセアン）</text><text x="95" y="272" font-size="22" fill="#29465f">9月中旬〜　教員不足・過密クラスなど</text><rect x="60" y="325" width="520" height="115" rx="18" fill="white"/><rect x="60" y="325" width="12" height="115" fill="#c9952a"/><text x="95" y="370" font-size="26" font-weight="700" fill="#153452">燃料・エネルギー</text><text x="95" y="412" font-size="22" fill="#29465f">9月15日ごろ〜　軽油価格が過去最高水準</text><rect x="60" y="465" width="520" height="115" rx="18" fill="white"/><rect x="60" y="465" width="12" height="115" fill="#7a5aa6"/><text x="95" y="510" font-size="26" font-weight="700" fill="#153452">労働組合</text><text x="95" y="552" font-size="22" fill="#29465f">10月初旬に合流　賃金・年金・2027年予算案</text><g stroke="#7a8a99" stroke-width="5" fill="none" stroke-linecap="round"><path d="M580 242 C640 242 640 382 690 382"/><path d="M580 382 L690 382"/><path d="M580 522 C640 522 640 382 690 382"/></g><path d="M690 368 L712 382 L690 396 Z" fill="#7a8a99"/><rect x="720" y="215" width="420" height="335" rx="20" fill="white"/><rect x="720" y="215" width="420" height="80" rx="20" fill="#b5473a"/><rect x="720" y="275" width="420" height="20" fill="#b5473a"/><text x="745" y="267" font-size="28" font-weight="700" fill="white">10月17日（土）全国一斉デモ</text><text x="745" y="350" font-size="24" fill="#29465f">仏政府発表：約55万人</text><text x="745" y="390" font-size="24" fill="#29465f">（うちパリ11万人）</text><text x="745" y="440" font-size="24" fill="#29465f">主催者推計：約80万人</text><text x="745" y="500" font-size="22" fill="#405a71">一部の集団による放火・略奪</text><text x="60" y="630" font-size="22" fill="#405a71">※参加者の大半は平和的で、破壊は一部の集団（外務省・仏内務省の説明）</text></g></svg>
