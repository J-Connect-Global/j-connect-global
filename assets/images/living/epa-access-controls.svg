<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">ePAの文書単位と施設単位のアクセス制限</title><desc id="desc">文書を非表示にすると原則すべての医療機関から見えなくなる。特定の施設のアクセスを拒否すると、その施設は電子患者記録全体を見られなくなる。薬の一覧は施設ごとに非表示にできる例外。</desc>
<rect width="1200" height="640" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="556" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="38" font-weight="800">アクセス制限は「何を隠すか」で変わる</text>
<g transform="translate(88 150)"><rect width="492" height="244" rx="20" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><text x="28" y="44" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">文書単位で非表示</text><rect x="28" y="68" width="120" height="72" rx="12" fill="#fff" stroke="#aebbd0" stroke-width="2"/><path d="M52 88 H122 M52 104 H122 M52 120 H105" stroke="#47658b" stroke-width="4" stroke-linecap="round"/><path d="M178 104 H220" stroke="#47658b" stroke-width="4" stroke-linecap="round"/><path d="M210 94 L222 104 L210 114" fill="none" stroke="#47658b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="68" width="220" height="72" rx="12" fill="#fff" stroke="#aebbd0" stroke-width="2"/><text x="350" y="96" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17" font-weight="700">すべての医療機関</text><text x="350" y="121" text-anchor="middle" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17">から見えない</text><text x="28" y="177" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">通常の文書は特定の施設だけに</text><text x="28" y="204" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">隠すことはできません。</text></g>
<g transform="translate(620 150)"><rect width="492" height="244" rx="20" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><text x="28" y="44" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="22" font-weight="800">施設単位でアクセス拒否</text><rect x="28" y="68" width="130" height="72" rx="12" fill="#fff" stroke="#b6d2cd" stroke-width="2"/><text x="93" y="96" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17" font-weight="700">選んだ施設</text><text x="93" y="120" text-anchor="middle" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="16">アクセス拒否</text><path d="M180 104 H220" stroke="#2f7771" stroke-width="4" stroke-linecap="round"/><path d="M210 94 L222 104 L210 114" fill="none" stroke="#2f7771" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="68" width="220" height="72" rx="12" fill="#fff" stroke="#b6d2cd" stroke-width="2"/><text x="350" y="96" text-anchor="middle" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17" font-weight="700">ePA全体に</text><text x="350" y="120" text-anchor="middle" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17">アクセスできない</text><text x="28" y="177" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">その施設は文書を閲覧・保存</text><text x="28" y="204" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">できなくなります。</text></g>
<rect x="88" y="426" width="1024" height="86" rx="16" fill="#f7eee3" stroke="#ead8c1" stroke-width="2"/><text x="112" y="462" fill="#9a6130" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="19" font-weight="800">例外：薬の一覧</text><text x="112" y="491" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18">薬の一覧は、特定の医療機関に対して表示を制限できます。</text>
<text x="90" y="548" fill="#4f6474" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="17">設定を変える前に、診療で必要な情報が見えなくなる影響を確認してください。</text><text x="90" y="574" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜確認日：2026年10月26日</text>
</svg>