<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの学生の働き方の比較</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">学生の働き方　4つの違い</text><text x="48" y="152" font-size="23" fill="#52666C">どの働き方でも、有給休暇と病気のときの給与の権利がある</text><rect x="338" y="176" width="408" height="50" rx="10" fill="#173B48"/><text x="354" y="210" font-size="24" fill="#FFFFFF">時間・収入の目安</text><rect x="758" y="176" width="382" height="50" rx="10" fill="#146859"/><text x="774" y="210" font-size="24" fill="#FFFFFF">本人の社会保険料</text><text x="64" y="210" font-size="22" fill="#52666C">働き方</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">ワークスチューデント</text><text x="354" y="272" font-size="26" fill="#173B48">講義期間中は週20時間まで</text><text x="774" y="272" font-size="26" fill="#C2410C">年金のみ</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">ミニジョブ</text><text x="354" y="336" font-size="26" fill="#173B48">月603ユーロ（2027年633）まで</text><text x="774" y="336" font-size="26" fill="#173B48">原則なし（年金は免除可）</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">必修インターン</text><text x="354" y="400" font-size="26" fill="#173B48">大学の規則で決まった実習</text><text x="774" y="400" font-size="26" fill="#173B48">原則なし・最低賃金の対象外</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">任意インターン</text><text x="354" y="464" font-size="26" fill="#173B48">3か月までは最低賃金の対象外</text><text x="774" y="464" font-size="26" fill="#173B48">期間や収入で異なる</text><text x="48" y="622" font-size="22" fill="#173B48">所得税は、年間の所得が基礎控除（2026年1万2,348ユーロ）以下なら確定申告で戻ります。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：社会法典第3・4・5編、最低賃金法第22条、所得税法第32a条  |  2026-11-06</text></g></svg>