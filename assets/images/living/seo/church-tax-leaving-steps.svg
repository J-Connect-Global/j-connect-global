<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>教会から離脱する手続きの流れ</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">教会から離脱する手続き</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">州ごとの届け出先を確認</text><text x="128" y="213" font-size="20" fill="#52666C">NRW・ベルリンは区裁判所、多くの州は役所</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">本人が窓口で届け出る</text><text x="128" y="303" font-size="20" fill="#52666C">パスポート・滞在カード、住民登録の証明</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">手数料を払う</text><text x="128" y="393" font-size="20" fill="#52666C">NRW州は30ユーロ。ほかの州も数十ユーロ程度</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">離脱の証明を受け取る</text><text x="128" y="483" font-size="20" fill="#52666C">大切に保管する</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">給与明細を確認する</text><text x="128" y="573" font-size="20" fill="#52666C">教会税（KiSt）が消えたか確かめる</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">代行サイトに注意</text><text x="788" y="268" font-size="32" fill="#173B48">本人が直接</text><text x="788" y="312" font-size="32" fill="#173B48">届け出る</text><text x="788" y="372" font-size="21" fill="#52666C">お金を取って手続きを代行</text><text x="788" y="404" font-size="21" fill="#52666C">するとうたうサイトでは、</text><text x="788" y="436" font-size="21" fill="#52666C">離脱できない場合があります</text><text x="788" y="468" font-size="21" fill="#52666C">払った教会税は確定申告で</text><text x="788" y="500" font-size="21" fill="#52666C">特別支出として控除できます</text><text x="48" y="622" font-size="22" fill="#173B48">届け出先と費用は州・自治体により異なります。住んでいる地域の案内を確認してください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：NRW州司法省の案内、所得税法第10条・第51a条  |  2026-11-06</text></g></svg>