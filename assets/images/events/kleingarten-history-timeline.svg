<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">クラインガルテンの歴史</title><desc id="d">19世紀初めの貧しい人のための庭、約200年前のカッペルンの最初の団体、1864年のライプツィヒのシュレーバー協会、1983年の連邦市民農園法、今の約86万7,000の庭までを示した年表</desc><rect width="1200" height="675" rx="28" fill="#f2f5ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">クラインガルテンの約200年</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">貧しい人のための庭から、家族の週末の庭へ</text><line x1="165" y1="190" x2="165" y2="610" stroke="#d6c9b8" stroke-width="6"/><circle cx="165" cy="222" r="14" fill="#2f8a64"/><text x="55" y="230" font-size="22" font-weight="700" fill="#153452" text-anchor="start">19世紀</text><rect x="190" y="188" width="950" height="72" rx="16" fill="white"/><text x="215" y="218" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">始まり</text><text x="340" y="218" font-size="23" font-weight="700" fill="#153452" text-anchor="start">「貧しい人のための庭」が各地に</text><text x="340" y="248" font-size="19" fill="#405a71" text-anchor="start">お金のかわりに、野菜を自分で育てる</text><circle cx="165" cy="308" r="14" fill="#2f8a64"/><text x="55" y="316" font-size="22" font-weight="700" fill="#153452" text-anchor="start">200年前</text><rect x="190" y="274" width="950" height="72" rx="16" fill="white"/><text x="215" y="304" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">最初の団体</text><text x="340" y="304" font-size="23" font-weight="700" fill="#153452" text-anchor="start">北ドイツのカッペルンで最初の団体</text><text x="340" y="334" font-size="19" fill="#405a71" text-anchor="start">シュレースヴィヒ＝ホルシュタイン州</text><circle cx="165" cy="394" r="14" fill="#2f8a64"/><text x="55" y="402" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1864</text><rect x="190" y="360" width="950" height="72" rx="16" fill="white"/><text x="215" y="390" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">名前</text><text x="340" y="390" font-size="23" font-weight="700" fill="#153452" text-anchor="start">ライプツィヒでシュレーバー協会</text><text x="340" y="420" font-size="19" fill="#405a71" text-anchor="start">子どもの遊び場の花壇から家族の畑へ</text><circle cx="165" cy="480" r="14" fill="#2f8a64"/><text x="55" y="488" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1983</text><rect x="190" y="446" width="950" height="72" rx="16" fill="white"/><text x="215" y="476" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">法律</text><text x="340" y="476" font-size="23" font-weight="700" fill="#153452" text-anchor="start">連邦市民農園法が施行（4月1日）</text><text x="340" y="506" font-size="19" fill="#405a71" text-anchor="start">小屋は24平方メートルまで</text><circle cx="165" cy="566" r="14" fill="#2f8a64"/><text x="55" y="574" font-size="22" font-weight="700" fill="#153452" text-anchor="start">今</text><rect x="190" y="532" width="950" height="72" rx="16" fill="white"/><text x="215" y="562" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start">数</text><text x="340" y="562" font-size="23" font-weight="700" fill="#153452" text-anchor="start">約86万7,000の庭・約4万4,000ha</text><text x="340" y="592" font-size="19" fill="#405a71" text-anchor="start">ドイツ市民農園連盟</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：ドイツ市民農園連盟、ライプツィヒ市（2026年10月29日参照）</text></g></svg>