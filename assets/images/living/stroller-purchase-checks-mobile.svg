<svg xmlns="http://www.w3.org/2000/svg" width="480" height="710" viewBox="0 0 480 710"><rect width="480" height="710" rx="16" fill="#f4f7fa"/><g font-family="Noto Sans JP, sans-serif" fill="#17324d"><text x="24" y="42" font-size="23" font-weight="700">買う前に確認する3つの場所</text><rect x="20" y="68" width="440" height="192" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="52" cy="102" r="18" fill="#176e91"/><text x="52" y="109" fill="white" text-anchor="middle" font-size="20">1</text><text x="84" y="109" font-size="22" font-weight="700">家の入口・保管場所</text><text x="44" y="152" font-size="20">扉とエレベーターの幅</text><text x="44" y="186" font-size="20">畳んだ本体の置き場所</text><text x="44" y="220" font-size="20">持ち運ぶ部分の重さ</text><rect x="20" y="276" width="440" height="192" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="52" cy="310" r="18" fill="#176e91"/><text x="52" y="317" fill="white" text-anchor="middle" font-size="20">2</text><text x="84" y="317" font-size="22" font-weight="700">車のトランク</text><text x="44" y="360" font-size="20">開口部を通るか</text><text x="44" y="394" font-size="20">コットも一緒に入るか</text><text x="44" y="428" font-size="20">普段の荷物が残せるか</text><rect x="20" y="484" width="440" height="192" rx="12" fill="white" stroke="#c9d8e4"/><circle cx="52" cy="518" r="18" fill="#176e91"/><text x="52" y="525" fill="white" text-anchor="middle" font-size="20">3</text><text x="84" y="525" font-size="22" font-weight="700">車と接続部品</text><text x="44" y="568" font-size="20">シートとベースの型番</text><text x="44" y="602" font-size="20">車の年式・使用座席</text><text x="44" y="636" font-size="20">本体とアダプターの適合</text></g></svg>