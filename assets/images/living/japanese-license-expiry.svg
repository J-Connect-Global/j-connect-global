<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日本の免許の期限切れ</title><desc id="d">日本の免許の期限が切れてから6か月以内なら手続きで再び受け取れ、6か月を超えて3年以内なら帰国から1か月以内の手続きで試験が免除され、3年を超えると取り直しになることを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">ドイツにいる間に、日本の免許が切れたら</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">期限が切れてからの期間で手続きが変わる</text><rect x="60" y="190" width="1080" height="80" rx="16" fill="white"/><rect x="60" y="190" width="10" height="80" rx="5" fill="#2d6a9f"/><text x="95" y="238" font-size="22" font-weight="700" fill="#153452" text-anchor="start">切れてから6か月以内</text><text x="1110" y="239" font-size="24" font-weight="700" fill="#2f8a64" text-anchor="end">手続きをすれば再び受け取れる</text><rect x="60" y="280" width="1080" height="80" rx="16" fill="white"/><rect x="60" y="280" width="10" height="80" rx="5" fill="#2d6a9f"/><text x="95" y="328" font-size="22" font-weight="700" fill="#153452" text-anchor="start">6か月を超えて3年以内</text><text x="1110" y="329" font-size="24" font-weight="700" fill="#2d6a9f" text-anchor="end">帰国から1か月以内の手続きで試験免除</text><rect x="60" y="370" width="1080" height="80" rx="16" fill="white"/><rect x="60" y="370" width="10" height="80" rx="5" fill="#2d6a9f"/><text x="95" y="418" font-size="22" font-weight="700" fill="#153452" text-anchor="start">3年を超える</text><text x="1110" y="419" font-size="24" font-weight="700" fill="#b5473a" text-anchor="end">新しく取り直し</text><rect x="60" y="470" width="1080" height="110" rx="16" fill="#fff7e6"/><text x="90" y="515" font-size="24" font-weight="700" fill="#8a5a00" text-anchor="start">いちばん確実なのは、切れる前に更新すること</text><text x="90" y="555" font-size="21" fill="#29465f" text-anchor="start">出国前や一時帰国のときに、期間の前の更新ができる場合があります</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：警視庁、外務省（2026年10月29日参照）</text></g></svg>