<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">NRWの学校休暇と移動休日</title><desc id="desc">州共通の学校休暇日程に加え、NRWでは学校ごとに決める移動休日が3日あります。旅行を決める前に学校の年間予定表を確認する必要があります。</desc>
<rect width="1200" height="600" rx="28" fill="#f5f2eb"/><rect x="48" y="42" width="1104" height="516" rx="24" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
<text x="88" y="108" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="39" font-weight="800">州共通の日程だけでは、休校日が確定しない</text>
<g transform="translate(88 156)"><rect width="470" height="240" rx="18" fill="#e9f2f0" stroke="#c7ded9" stroke-width="2"/><text x="28" y="48" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="23" font-weight="800">州共通カレンダー</text><text x="28" y="94" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">秋・年末年始・春・夏の</text><text x="28" y="125" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">基本となる休暇期間</text><rect x="28" y="154" width="414" height="52" rx="12" fill="#fff" stroke="#c7ded9" stroke-width="2"/><text x="235" y="186" text-anchor="middle" fill="#2f7771" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">公式カレンダーで確認</text></g>
<g transform="translate(612 156)"><rect width="500" height="240" rx="18" fill="#eef1f8" stroke="#d0d8ea" stroke-width="2"/><text x="28" y="48" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="23" font-weight="800">学校ごとの移動休日</text><text x="28" y="94" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">NRWのカレンダーでは3日</text><text x="28" y="125" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20">具体的な日付は学校ごとに確認</text><rect x="28" y="154" width="444" height="52" rx="12" fill="#fff" stroke="#d0d8ea" stroke-width="2"/><text x="250" y="186" text-anchor="middle" fill="#47658b" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="800">学校の年間予定表を確認</text></g>
<text x="90" y="455" fill="#17324d" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="20" font-weight="700">旅行・勤務先への休暇申請は、学校からの案内を確認してから</text><text x="90" y="505" fill="#7b8a91" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="15">J-Connect制作のオリジナル図｜公式カレンダー確認日：2026年10月26日</text>
</svg>