<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">クリスマスツリーの歴史</title><desc id="d">中世の楽園の劇、1605年のシュトラスブルクの記録、17世紀の教会の批判、三十年戦争後の広がり、19世紀のろうそくの普及までを示した年表</desc><rect width="1200" height="675" rx="28" fill="#f4f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">クリスマスツリーが広まるまで</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">リンゴを飾った「楽園の木」から、ろうそくの灯るもみの木へ</text><line x1="165" y1="190" x2="165" y2="610" stroke="#d6c9b8" stroke-width="6"/><circle cx="165" cy="222" r="14" fill="#2f8a64"/><text x="55" y="230" font-size="22" font-weight="700" fill="#153452" text-anchor="start">中世</text><rect x="190" y="188" width="950" height="72" rx="16" fill="white"/><text x="215" y="218" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">楽園の劇</text><text x="340" y="218" font-size="23" font-weight="700" fill="#153452" text-anchor="start">12月24日のアダムとイブの劇に「楽園の木」</text><text x="340" y="248" font-size="19" fill="#405a71" text-anchor="start">木からリンゴをもぎ取る場面があった</text><circle cx="165" cy="308" r="14" fill="#2f8a64"/><text x="55" y="316" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1605</text><rect x="190" y="274" width="950" height="72" rx="16" fill="white"/><text x="215" y="304" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">記録</text><text x="340" y="304" font-size="23" font-weight="700" fill="#153452" text-anchor="start">シュトラスブルクでツリーの記録</text><text x="340" y="334" font-size="19" fill="#405a71" text-anchor="start">まだろうそくはなかった（1539年説もある）</text><circle cx="165" cy="394" r="14" fill="#2f8a64"/><text x="55" y="402" font-size="22" font-weight="700" fill="#153452" text-anchor="start">17世紀</text><rect x="190" y="360" width="950" height="72" rx="16" fill="white"/><text x="215" y="390" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">批判</text><text x="340" y="390" font-size="23" font-weight="700" fill="#153452" text-anchor="start">説教者ダンハウアーがツリーを批判</text><text x="340" y="420" font-size="19" fill="#405a71" text-anchor="start">それでも家庭へと広まっていく</text><circle cx="165" cy="480" r="14" fill="#2f8a64"/><text x="55" y="488" font-size="22" font-weight="700" fill="#153452" text-anchor="start">1648〜</text><rect x="190" y="446" width="950" height="72" rx="16" fill="white"/><text x="215" y="476" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">広がり</text><text x="340" y="476" font-size="23" font-weight="700" fill="#153452" text-anchor="start">三十年戦争の後、町から町へ</text><text x="340" y="506" font-size="19" fill="#405a71" text-anchor="start">まずプロテスタントの地域で</text><circle cx="165" cy="566" r="14" fill="#2f8a64"/><text x="55" y="574" font-size="22" font-weight="700" fill="#153452" text-anchor="start">19世紀</text><rect x="190" y="532" width="950" height="72" rx="16" fill="white"/><text x="215" y="562" font-size="19" font-weight="700" fill="#b5473a" text-anchor="start">定着</text><text x="340" y="562" font-size="23" font-weight="700" fill="#153452" text-anchor="start">両宗派に認められ、ろうそくも安く</text><text x="340" y="592" font-size="19" fill="#405a71" text-anchor="start">ステアリン・パラフィンの発明</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：katholisch.de（2026年10月27日参照）。始まりには諸説あり</text></g></svg>