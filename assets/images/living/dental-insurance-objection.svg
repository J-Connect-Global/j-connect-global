<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">「契約前の治療」で不払いと言われたら</title><desc id="d">不払いの通知の理由と日付を確認する、約款の条文と待機期間を読む、治療が必要になった日と契約日を並べる、異議を書面で出す、回答がなければ苦情窓口に相談するという流れの図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<text x="60" y="90" font-size="40" font-weight="700" fill="#153452">「契約前の治療」で不払いと言われたら</text>
<text x="60" y="135" font-size="24" fill="#3c5a78">感情ではなく、約款と日付で異議を書きます</text>
<rect x="60" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="100" cy="238" r="24" fill="#1f5f99"/><text x="100" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="302" font-size="22" font-weight="700" fill="#153452">通知を読む</text>
<text x="80" y="370" font-size="20" fill="#2b4560">不払いの理由と、</text>
<text x="80" y="400" font-size="20" fill="#2b4560">保険会社が「</text>
<text x="80" y="430" font-size="20" fill="#2b4560">治療が始まった</text>
<text x="80" y="460" font-size="20" fill="#2b4560">日」としている</text>
<text x="80" y="490" font-size="20" fill="#2b4560">日付を確認する</text>
<path d="M262 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="280" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="320" cy="238" r="24" fill="#1f5f99"/><text x="320" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="300" y="302" font-size="22" font-weight="700" fill="#153452">約款を読む</text>
<text x="300" y="370" font-size="20" fill="#2b4560">契約前の治療の</text>
<text x="300" y="400" font-size="20" fill="#2b4560">除外、待機期間、</text>
<text x="300" y="430" font-size="20" fill="#2b4560">補償の上限の</text>
<text x="300" y="460" font-size="20" fill="#2b4560">条文を探す</text>
<path d="M482 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="500" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="540" cy="238" r="24" fill="#1f5f99"/><text x="540" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="520" y="302" font-size="22" font-weight="700" fill="#153452">日付を並べる</text>
<text x="520" y="370" font-size="20" fill="#2b4560">契約日、診断日、</text>
<text x="520" y="400" font-size="20" fill="#2b4560">治療計画の日、</text>
<text x="520" y="430" font-size="20" fill="#2b4560">治療日を時系</text>
<text x="520" y="460" font-size="20" fill="#2b4560">列で並べる</text>
<path d="M702 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="720" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="760" cy="238" r="24" fill="#1f5f99"/><text x="760" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="740" y="302" font-size="22" font-weight="700" fill="#153452">書面で異議</text>
<text x="740" y="370" font-size="20" fill="#2b4560">条文と日付を示</text>
<text x="740" y="400" font-size="20" fill="#2b4560">し、期限を決め</text>
<text x="740" y="430" font-size="20" fill="#2b4560">て再審査を求め</text>
<text x="740" y="460" font-size="20" fill="#2b4560">る</text>
<path d="M922 380.0 l14 10 l-14 10 z" fill="#1f5f99"/>
<rect x="940" y="190" width="200" height="400" rx="18" fill="#ffffff" stroke="#9cb9d6" stroke-width="2"/>
<circle cx="980" cy="238" r="24" fill="#1f5f99"/><text x="980" y="247" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="960" y="302" font-size="22" font-weight="700" fill="#153452">次の相談先</text>
<text x="960" y="370" font-size="20" fill="#2b4560">回答に納得でき</text>
<text x="960" y="400" font-size="20" fill="#2b4560">なければ、保険</text>
<text x="960" y="430" font-size="20" fill="#2b4560">の苦情窓口や消</text>
<text x="960" y="460" font-size="20" fill="#2b4560">費者センターへ</text>
<text x="60" y="645" font-size="20" fill="#3c5a78">図解：J-Connect編集部。個別の判断は消費者センターや専門家に相談してください。</text></g></svg>