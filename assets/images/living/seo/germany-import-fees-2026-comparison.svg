<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">EU域外通販に関係する費用の比較</title>
  <desc id="desc">2026年11月の2ユーロ取扱手数料、2026年7月の3ユーロ定額関税、輸入消費税と配送会社手数料の違いを比較する図。</desc>
  <rect width="1200" height="675" rx="28" fill="#F5F1E8"/>
  <text x="64" y="82" fill="#1F2933" font-size="38" font-weight="700" font-family="Arial,sans-serif">EU域外通販に関係する費用の比較</text>
  <text x="64" y="126" fill="#52616B" font-size="22" font-family="Arial,sans-serif">日本からドイツへ届くオンライン購入品の確認用</text>
  <g transform="translate(64 178)">
    <rect width="330" height="350" rx="22" fill="#FFFFFF" stroke="#C8D2D4" stroke-width="2"/>
    <rect width="330" height="16" rx="8" fill="#47727A"/>
    <text x="28" y="72" fill="#47727A" font-size="24" font-weight="700" font-family="Arial,sans-serif">2026年11月1日から</text>
    <text x="28" y="145" fill="#1F2933" font-size="66" font-weight="700" font-family="Arial,sans-serif">2 €</text>
    <text x="28" y="190" fill="#1F2933" font-size="28" font-weight="700" font-family="Arial,sans-serif">EU取扱手数料</text>
    <text x="28" y="245" fill="#52616B" font-size="22" font-family="Arial,sans-serif">距離販売が対象</text>
    <text x="28" y="280" fill="#52616B" font-size="22" font-family="Arial,sans-serif">税関申告の品目行ごと</text>
    <text x="28" y="315" fill="#52616B" font-size="22" font-family="Arial,sans-serif">150 €の価格上限なし</text>
  </g>
  <g transform="translate(435 178)">
    <rect width="330" height="350" rx="22" fill="#FFFFFF" stroke="#D9C6A7" stroke-width="2"/>
    <rect width="330" height="16" rx="8" fill="#C28B4B"/>
    <text x="28" y="72" fill="#A46E34" font-size="24" font-weight="700" font-family="Arial,sans-serif">2026年7月1日から</text>
    <text x="28" y="145" fill="#1F2933" font-size="66" font-weight="700" font-family="Arial,sans-serif">3 €</text>
    <text x="28" y="190" fill="#1F2933" font-size="28" font-weight="700" font-family="Arial,sans-serif">定額関税</text>
    <text x="28" y="245" fill="#52616B" font-size="22" font-family="Arial,sans-serif">150 €未満の対象通販</text>
    <text x="28" y="280" fill="#52616B" font-size="22" font-family="Arial,sans-serif">異なる関税分類の品目区分ごと</text>
    <text x="28" y="315" fill="#52616B" font-size="22" font-family="Arial,sans-serif">暫定措置</text>
  </g>
  <g transform="translate(806 178)">
    <rect width="330" height="350" rx="22" fill="#FFFFFF" stroke="#C8D2D4" stroke-width="2"/>
    <rect width="330" height="16" rx="8" fill="#687A63"/>
    <text x="28" y="72" fill="#687A63" font-size="24" font-weight="700" font-family="Arial,sans-serif">別に確認</text>
    <text x="28" y="132" fill="#1F2933" font-size="30" font-weight="700" font-family="Arial,sans-serif">輸入消費税</text>
    <text x="28" y="172" fill="#52616B" font-size="22" font-family="Arial,sans-serif">商品・取引条件による</text>
    <line x1="28" y1="206" x2="300" y2="206" stroke="#D8DEDA" stroke-width="2"/>
    <text x="28" y="260" fill="#1F2933" font-size="27" font-weight="700" font-family="Arial,sans-serif">配送会社の手数料</text>
    <text x="28" y="302" fill="#52616B" font-size="22" font-family="Arial,sans-serif">会社・契約ごとに異なる</text>
  </g>
  <text x="64" y="590" fill="#52616B" font-size="22" font-family="Arial,sans-serif">注意：2 €は税関申告の品目行ごと、3 €は異なる関税分類の品目区分ごとに計算されます。</text>
</svg>