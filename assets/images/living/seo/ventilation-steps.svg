<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">冬の換気の4ステップ</title><desc id="desc">暖房を止める、窓を全開にして5から10分、閉めて暖房を戻す、1日に数回くり返す。</desc><rect width="480" height="520" fill="#f4f7fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172c4b"><text x="24" y="46" font-size="26" font-weight="700">冬の換気の4ステップ</text><text x="24" y="78" font-size="18">窓は傾けず、全開で短く</text><rect x="20" y="104" width="440" height="84" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="138" font-size="22" font-weight="700">1 暖房のつまみを止める</text><text x="36" y="168" font-size="17">いちばん低くしてから窓を開ける</text><rect x="20" y="202" width="440" height="84" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="236" font-size="22" font-weight="700">2 窓を全開にして5〜10分</text><text x="36" y="266" font-size="17">向かい合う窓やドアも開けて風を通す</text><rect x="20" y="300" width="440" height="84" rx="10" fill="#fff" stroke="#a7b6ca"/><text x="36" y="334" font-size="22" font-weight="700">3 閉めて暖房を戻す</text><text x="36" y="364" font-size="17">壁があまり冷えないうちに入れ替わる</text><rect x="20" y="398" width="440" height="84" rx="10" fill="#e8f5ee" stroke="#1e8449" stroke-width="2"/><text x="36" y="432" font-size="22" font-weight="700">4 1日に数回くり返す</text><text x="36" y="462" font-size="17">朝・料理のあと・入浴のあと</text></g></svg>
