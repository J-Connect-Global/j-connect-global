<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">グリューワインの選び方</title><desc id="desc">材料一覧、糖分の調査例、子ども向けの0.0%表示に関する注意点。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf9f4"/><stop offset="1" stop-color="#efe7da"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fbfaf6"/></linearGradient><filter id="shadow" x="-20%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2b291e" flood-opacity=".09"/></filter><linearGradient id="wax" x1="0" x2="1"><stop stop-color="#e1d6bc"/><stop offset=".35" stop-color="#fff6de"/><stop offset=".75" stop-color="#f5e9cd"/><stop offset="1" stop-color="#c3ae8c"/></linearGradient><radialGradient id="fire"><stop stop-color="#fff5a8"/><stop offset=".6" stop-color="#ffc84d"/><stop offset="1" stop-color="#d96c17"/></radialGradient></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" stroke="none"/><rect width="1200" height="9" fill="#723e3b"/><g font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif"><text x="49" y="79" font-size="39" font-weight="800" fill="#6f3934" text-anchor="start">グリューワイン｜買う前の3つの確認</text><text x="50" y="118" font-size="20" font-weight="500" fill="#5e6960" text-anchor="start">材料表示・糖分・子ども向け飲料を分けて考える</text><g filter="url(#shadow)"><rect x="47" y="170" width="362" height="424" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="68" y="194" width="178" height="39" rx="19" fill="#f2e7db" stroke="none"/><text x="157" y="220" font-size="18" font-weight="800" fill="#78453a" text-anchor="middle">材料表示</text><text x="71" y="306" font-size="38" font-weight="850" fill="#254e3e" text-anchor="start">表示の例外</text><line x1="71" y1="338" x2="384" y2="338" stroke="#e8dfd2"/><text x="71" y="385" font-size="18" font-weight="520" fill="#525d55" text-anchor="start">アルコール1.2%超（ビール以外）は</text><text x="71" y="436" font-size="18" font-weight="520" fill="#525d55" text-anchor="start">材料一覧の義務に例外がある</text><text x="71" y="487" font-size="18" font-weight="520" fill="#525d55" text-anchor="start">調査例：12本中2本だけ表示</text><g filter="url(#shadow)"><rect x="433" y="170" width="362" height="424" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="454" y="194" width="178" height="39" rx="19" fill="#f2e7db" stroke="none"/><text x="543" y="220" font-size="18" font-weight="800" fill="#78453a" text-anchor="middle">糖分 · 調査例</text><text x="457" y="306" font-size="38" font-weight="850" fill="#91512c" text-anchor="start">7.5–9.5 g</text><line x1="457" y1="338" x2="770" y2="338" stroke="#e8dfd2"/><text x="457" y="385" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">100 mLあたりの糖分</text><text x="457" y="436" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">200 mLなら約15–19 g相当</text><text x="457" y="487" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">商品によって数値は異なる</text><rect x="462" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="485" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="508" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="531" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="554" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="577" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="600" y="554" width="16" height="18" rx="3" fill="#b97742" stroke="none"/><rect x="623" y="554" width="16" height="18" rx="3" fill="#d9c9b0" stroke="none"/><rect x="646" y="554" width="16" height="18" rx="3" fill="#d9c9b0" stroke="none"/><g filter="url(#shadow)"><rect x="819" y="170" width="362" height="424" rx="22" fill="url(#card)" stroke="#e7e4db"/></g><rect x="840" y="194" width="178" height="39" rx="19" fill="#f2e7db" stroke="none"/><text x="929" y="220" font-size="18" font-weight="800" fill="#78453a" text-anchor="middle">子ども向け</text><text x="843" y="306" font-size="38" font-weight="850" fill="#254e3e" text-anchor="start">0.0%</text><line x1="843" y1="338" x2="1156" y2="338" stroke="#e8dfd2"/><text x="843" y="385" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">アルコール分ゼロを表示で確認</text><text x="843" y="436" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">「alkoholfrei」は微量を含む場合あり</text><text x="843" y="487" font-size="19" font-weight="520" fill="#525d55" text-anchor="start">キンダープンシュも選択肢</text><line x1="50" y1="627" x2="1150" y2="627" stroke="#d8d6cd"/><text x="51" y="653" font-size="14" font-weight="500" fill="#686f68" text-anchor="start">出典：Lebensmittelklarheit・消費者センターの調査例。数値は製品一般の保証値ではありません。</text></g></svg>