<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">ノイスの冬のマーケット：開催時期の違い</title><desc id="d">中心街、北部、競馬場公園の開催時期を示す編集部作成の概念図。地図や実際の建物を再現したものではありません。</desc><rect width="1200" height="630" fill="#f5f1e9"/><text x="70" y="100" font-family="sans-serif" font-size="43" font-weight="bold" fill="#193c3c">ノイスの冬、会場ごとに違う楽しみ方</text><text x="72" y="155" font-family="sans-serif" font-size="24" fill="#355452">2026年11月〜2027年1月｜日程の概念図</text><g font-family="sans-serif" font-size="29" fill="#153b38"><text x="70" y="240">中心街の常設市</text><text x="70" y="337">11月29日の特別市</text><text x="70" y="434">12月の週末市</text></g><g><rect x="415" y="204" width="685" height="52" rx="12" fill="#2c776b"/><rect x="415" y="300" width="110" height="52" rx="12" fill="#bc733c"/><rect x="560" y="397" width="390" height="52" rx="12" fill="#657a9b"/></g><g font-family="sans-serif" font-size="22" fill="#fff"><text x="435" y="238">11月〜12月／一部は1月6日まで</text><text x="431" y="335">1日</text><text x="578" y="432">12月の指定週末</text></g><text x="72" y="550" font-family="sans-serif" font-size="22" fill="#52605c">※ 会場の位置・外観・日付の長さを縮尺で表したものではありません。</text><text x="72" y="585" font-family="sans-serif" font-size="20" fill="#52605c">出典：ノイス市 2026年11月17日発表｜J-Connect編集部作成</text></svg>