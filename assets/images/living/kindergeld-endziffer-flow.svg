<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Kindergeldの支給日を確認する4ステップ</title><desc id="desc">番号の末尾を確認し、同じ末尾の列を選び、該当月の日付を見て、週末や祝日の入金のずれに注意する手順。</desc><rect width="1200" height="420" rx="28" fill="#f7f5ef"/><text x="48" y="58" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#203b4b">2027年の支給日を確認する4ステップ</text><g font-family="Arial,sans-serif"><rect x="48" y="100" width="250" height="210" rx="18" fill="#e0ebf2" stroke="#6d93aa" stroke-width="2"/><circle cx="84" cy="139" r="22" fill="#2e6178"/><text x="84" y="147" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">1</text><text x="75" y="193" font-size="25" font-weight="700" fill="#203b4b">番号を確認</text><text x="75" y="232" font-size="20" fill="#203b4b">最後の数字だけ</text><text x="75" y="262" font-size="20" fill="#203b4b">見れば十分</text><path d="M302 204h26m-8-8 8 8-8 8" fill="none" stroke="#8a9aa2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="100" width="250" height="210" rx="18" fill="#e7eee7" stroke="#8aa58a" stroke-width="2"/><circle cx="376" cy="139" r="22" fill="#4b7051"/><text x="376" y="147" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">2</text><text x="367" y="193" font-size="25" font-weight="700" fill="#203b4b">列を選ぶ</text><text x="367" y="232" font-size="20" fill="#203b4b">末尾0〜9の</text><text x="367" y="262" font-size="20" fill="#203b4b">該当列へ</text><path d="M594 204h26m-8-8 8 8-8 8" fill="none" stroke="#8a9aa2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="632" y="100" width="250" height="210" rx="18" fill="#f3e7d5" stroke="#c4a16b" stroke-width="2"/><circle cx="668" cy="139" r="22" fill="#9b6a2f"/><text x="668" y="147" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">3</text><text x="659" y="193" font-size="25" font-weight="700" fill="#203b4b">月を選ぶ</text><text x="659" y="232" font-size="20" fill="#203b4b">2027年の</text><text x="659" y="262" font-size="20" fill="#203b4b">支給日を見る</text><path d="M886 204h26m-8-8 8 8-8 8" fill="none" stroke="#8a9aa2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="924" y="100" width="228" height="210" rx="18" fill="#f4e0dc" stroke="#c58c7f" stroke-width="2"/><circle cx="960" cy="139" r="22" fill="#9d5145"/><text x="960" y="147" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">4</text><text x="951" y="193" font-size="25" font-weight="700" fill="#203b4b">入金を確認</text><text x="951" y="232" font-size="20" fill="#203b4b">週末・祝日と</text><text x="951" y="262" font-size="20" fill="#203b4b">銀行反映に注意</text></g><text x="48" y="365" font-size="21" font-family="Arial,sans-serif" fill="#203b4b">末尾0は月初、末尾9は月末寄り。日付は連邦雇用庁の公式表で再確認してください。</text></svg>