<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">住宅手当の改正案</title><desc id="d">住宅手当の改正案として、2027年の定期的な引き上げの見送り、暖房費の分の半減、計算式の変更、手続きの簡素化の4点と、国の支出が2027年に約11.56億ユーロ、2028年に約14.86億ユーロ減る見込みを示した図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">住宅手当（Wohngeld）の改正案</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">2027年1月施行を目指す政府案</text><rect x="60" y="180" width="530" height="122" rx="16" fill="white"/><rect x="60" y="180" width="14" height="122" rx="7" fill="#b5473a"/><text x="100" y="235" font-size="26" font-weight="700" fill="#b5473a" text-anchor="start">定期的な引き上げを見送り</text><text x="100" y="275" font-size="21" fill="#29465f" text-anchor="start">2027年の見直しを行わない</text><rect x="610" y="180" width="530" height="122" rx="16" fill="white"/><rect x="610" y="180" width="14" height="122" rx="7" fill="#c9952a"/><text x="650" y="235" font-size="26" font-weight="700" fill="#c9952a" text-anchor="start">暖房費の分を半分に</text><text x="650" y="275" font-size="21" fill="#29465f" text-anchor="start">支給額に含まれる暖房費の分</text><rect x="60" y="320" width="530" height="122" rx="16" fill="white"/><rect x="60" y="320" width="14" height="122" rx="7" fill="#2d6a9f"/><text x="100" y="375" font-size="26" font-weight="700" fill="#2d6a9f" text-anchor="start">計算式の変更</text><text x="100" y="415" font-size="21" fill="#29465f" text-anchor="start">収入の少ない世帯への影響を抑える</text><rect x="610" y="320" width="530" height="122" rx="16" fill="white"/><rect x="610" y="320" width="14" height="122" rx="7" fill="#2f8a64"/><text x="650" y="375" font-size="26" font-weight="700" fill="#2f8a64" text-anchor="start">手続きの簡素化</text><text x="650" y="415" font-size="21" fill="#29465f" text-anchor="start">収入の計算に一律の控除額</text><rect x="60" y="470" width="1080" height="125" rx="16" fill="#fff7e6"/><text x="90" y="515" font-size="23" font-weight="700" fill="#8a5a00" text-anchor="start">国の支出の削減見込み</text><text x="90" y="565" font-size="28" font-weight="700" fill="#153452" text-anchor="start">2027年 約11.56億ユーロ　／　2028年 約14.86億ユーロ</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦議会（hib 2026年10月5日）（2026年10月29日参照）</text></g></svg>