<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの教会税がかかる人とかからない人</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">教会税　かかる人・かからない人</text><text x="48" y="152" font-size="23" fill="#52666C">住民登録の宗教欄の情報が税務署に伝わり、給与から差し引かれる</text><rect x="428" y="176" width="188" height="50" rx="10" fill="#173B48"/><text x="444" y="210" font-size="24" fill="#FFFFFF">教会税</text><rect x="628" y="176" width="512" height="50" rx="10" fill="#146859"/><text x="644" y="210" font-size="24" fill="#FFFFFF">補足</text><text x="64" y="210" font-size="22" fill="#52666C">住民登録の宗教欄</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">カトリック（rk）</text><text x="444" y="272" font-size="26" fill="#C2410C">かかる</text><text x="644" y="272" font-size="26" fill="#173B48">日本での洗礼も対象になるのが一般的</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">プロテスタント（ev）</text><text x="444" y="336" font-size="26" fill="#C2410C">かかる</text><text x="644" y="336" font-size="26" fill="#173B48">ドイツの州教会の教会員</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">仏教・神道</text><text x="444" y="400" font-size="26" fill="#173B48">かからない</text><text x="644" y="400" font-size="26" fill="#173B48">日本の寺院・神社は対象外</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">なし（ohne）</text><text x="444" y="464" font-size="26" fill="#173B48">かからない</text><text x="644" y="464" font-size="26" fill="#173B48">多くの日本人はこれ</text><text x="48" y="622" font-size="22" fill="#173B48">税率は所得税の8%（バイエルン州・バーデン＝ヴュルテンベルク州）か9%（そのほか）。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：所得税法第51a条、連邦住民登録法第3条  |  2026-11-06</text></g></svg>