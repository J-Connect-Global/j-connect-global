<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツ留学の費用の内訳</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツ留学の費用　何にいくらかかる？</text><text x="48" y="152" font-size="23" fill="#52666C">州立大学の多くは授業料無料。ただし毎学期の納付金と生活費の証明が必要</text><rect x="268" y="176" width="508" height="50" rx="10" fill="#173B48"/><text x="284" y="210" font-size="24" fill="#FFFFFF">内容</text><rect x="788" y="176" width="352" height="50" rx="10" fill="#146859"/><text x="804" y="210" font-size="24" fill="#FFFFFF">目安（2026年）</text><text x="64" y="210" font-size="22" fill="#52666C">項目</text><rect x="48" y="230" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="272" font-size="24" fill="#52666C">授業料</text><text x="284" y="272" font-size="26" fill="#173B48">州立大学の多くは無料</text><text x="804" y="272" font-size="26" fill="#C2410C">一部の州・大学で有料</text><rect x="48" y="294" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="336" font-size="24" fill="#52666C">学生納付金</text><text x="284" y="336" font-size="26" fill="#173B48">学期ごと。交通券を含むことが多い</text><text x="804" y="336" font-size="26" fill="#173B48">数百ユーロ／学期</text><rect x="48" y="358" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="400" font-size="24" fill="#52666C">生活費の証明</text><text x="284" y="400" font-size="26" fill="#173B48">閉鎖口座・奨学金など</text><text x="804" y="400" font-size="26" fill="#173B48">月992ユーロ・年11,904</text><rect x="48" y="422" width="1104" height="64" fill="#F9F8F3"/><text x="64" y="464" font-size="24" fill="#52666C">健康保険</text><text x="284" y="464" font-size="26" fill="#173B48">30歳まで公的保険に加入義務</text><text x="804" y="464" font-size="26" fill="#173B48">一般の7割の料率</text><rect x="48" y="486" width="1104" height="64" fill="#FFFFFF"/><text x="64" y="528" font-size="24" fill="#52666C">滞在許可</text><text x="284" y="528" font-size="26" fill="#173B48">新規の手数料</text><text x="804" y="528" font-size="26" fill="#173B48">原則100ユーロ</text><text x="48" y="622" font-size="22" fill="#173B48">授業料と納付金は大学ごとに違います。出願先の大学の案内で確認してください。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第16b条、社会法典第5編第5条・第245条、滞在令第45条  |  2026-11-06</text></g></svg>