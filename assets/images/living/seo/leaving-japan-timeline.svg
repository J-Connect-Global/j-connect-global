<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツへ引っ越す前の手続きのタイムライン</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ドイツへ引っ越す前の手続き　時期別</text><rect x="48" y="150" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="189" r="20" fill="#146859"/><text x="84" y="198" font-size="24" fill="#FFFFFF">1</text><text x="128" y="183" font-size="26" fill="#173B48">3か月前：滞在許可・パスポート・免許</text><text x="128" y="213" font-size="20" fill="#52666C">日本でビザが必要か確認。免許は期間前更新も</text><rect x="48" y="240" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="279" r="20" fill="#146859"/><text x="84" y="288" font-size="24" fill="#FFFFFF">2</text><text x="128" y="273" font-size="26" fill="#173B48">1〜2か月前：年金・保険・住民税</text><text x="128" y="303" font-size="20" fill="#52666C">任意加入、納税管理人、会社の保険の扱い</text><rect x="48" y="330" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="369" r="20" fill="#146859"/><text x="84" y="378" font-size="24" fill="#FFFFFF">3</text><text x="128" y="363" font-size="26" fill="#173B48">1か月前：銀行・カード・携帯・郵便</text><text x="128" y="393" font-size="20" fill="#52666C">海外での利用制限と認証の受け取り</text><rect x="48" y="420" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="459" r="20" fill="#146859"/><text x="84" y="468" font-size="24" fill="#FFFFFF">4</text><text x="128" y="453" font-size="26" fill="#173B48">14日前〜前日：海外転出届</text><text x="128" y="483" font-size="20" fill="#52666C">マイナンバーカードは前日までに継続利用の手続き</text><rect x="48" y="510" width="680" height="78" rx="14" fill="#FFFFFF"/><circle cx="92" cy="549" r="20" fill="#146859"/><text x="84" y="558" font-size="24" fill="#FFFFFF">5</text><text x="128" y="543" font-size="26" fill="#173B48">到着後：住民登録と在留届</text><text x="128" y="573" font-size="20" fill="#52666C">入居から2週間以内。在留届はオンラインで</text><rect x="760" y="150" width="392" height="438" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">1年未満なら</text><text x="788" y="268" font-size="32" fill="#173B48">住所を残す</text><text x="788" y="312" font-size="32" fill="#173B48">のが一般的</text><text x="788" y="372" font-size="21" fill="#52666C">海外転出届を出さない場合、</text><text x="788" y="404" font-size="21" fill="#52666C">年金・住民税・国民健康</text><text x="788" y="436" font-size="21" fill="#52666C">保険は日本に住んでいる</text><text x="788" y="468" font-size="21" fill="#52666C">ときと同じ扱いのまま</text><text x="788" y="500" font-size="21" fill="#52666C">迷ったら市区町村に相談</text><text x="48" y="622" font-size="22" fill="#173B48">手続きの細かい内容は、市区町村や勤め先によって異なります。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：JASSO・マイナンバーカード総合サイト、連邦住民登録法第17条  |  2026-11-06</text></g></svg>