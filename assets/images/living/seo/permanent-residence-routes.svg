<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ドイツの永住許可までの主なルート</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="118" font-size="42" fill="#173B48">永住許可までの期間　ルート別の目安</text><text x="48" y="160" font-size="24" fill="#52666C">滞在許可を持っている期間・年金保険料の月数・ドイツ語の段階</text><g font-size="22" fill="#52666C"><text x="380" y="206">0</text><text x="516" y="206">1年</text><text x="664" y="206">2年</text><text x="812" y="206">3年</text><text x="960" y="206">4年</text><text x="1108" y="206">5年</text></g><g stroke="#D5D9D2" stroke-width="2"><line x1="386" y1="216" x2="386" y2="590"/><line x1="534" y1="216" x2="534" y2="590"/><line x1="682" y1="216" x2="682" y2="590"/><line x1="830" y1="216" x2="830" y2="590"/><line x1="978" y1="216" x2="978" y2="590"/><line x1="1126" y1="216" x2="1126" y2="590"/></g><g font-size="25" fill="#173B48"><text x="48" y="256">一般（§9）</text><text x="48" y="330">専門人材（§18c）</text><text x="48" y="404">ブルーカード B1</text><text x="48" y="478">ブルーカード A1</text><text x="48" y="552">ドイツ人の配偶者</text></g><g font-size="20" fill="#52666C"><text x="48" y="282">年金60か月・B1</text><text x="48" y="356">年金36か月・B1</text><text x="48" y="430">21か月就労・B1</text><text x="48" y="504">27か月就労・A1</text><text x="48" y="578">年金条件なし・B1</text></g><rect x="386" y="232" width="740" height="44" rx="10" fill="#7FA7BE"/><text x="1064" y="262" font-size="24" fill="#FFFFFF">5年</text><rect x="386" y="306" width="444" height="44" rx="10" fill="#146859"/><text x="768" y="336" font-size="24" fill="#FFFFFF">3年</text><rect x="386" y="380" width="259" height="44" rx="10" fill="#C2410C"/><text x="535" y="410" font-size="24" fill="#FFFFFF">21か月</text><rect x="386" y="454" width="333" height="44" rx="10" fill="#B8661F"/><text x="609" y="484" font-size="24" fill="#FFFFFF">27か月</text><rect x="386" y="528" width="444" height="44" rx="10" fill="#5E9C8A"/><text x="768" y="558" font-size="24" fill="#FFFFFF">3年</text><text x="48" y="622" font-size="22" fill="#173B48">日本国籍者向けの就労許可（§19c）で働く人は、原則として一般の5年ルートです。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：滞在法第9条・第18c条・第28条  |  共通条件（生計・住居など）は省略  |  2026-11-05</text></g></svg>
