 stroke="#d9dfd8" stroke-width="2" filter="url(#shadow)"/><rect x="633" y="197" width="226" height="55" rx="14" fill="#f2e6d2"/><text x="746" y="233" font-size="28" font-weight="800" fill="#96723b" text-anchor="middle">03</text><circle cx="746" cy="349" r="102" fill="#f2e6d2" opacity=".55"/><g><rect x="674" y="319" width="144" height="92" rx="14" fill="#fefbf5" stroke="#a98e60" stroke-width="5"/><rect x="691" y="339" width="39" height="27" rx="6" fill="#d5c5a1"/><path d="M691 384h114 M691 397h62" stroke="#b4a37f" stroke-width="6" stroke-linecap="round"/><circle cx="788" cy="356" r="20" fill="#dce9e2"/><path d="M779 356h18 M788 347v18" stroke="#497968" stroke-width="5"/></g><text x="746" y="493" font-size="24" font-weight="800" fill="#203e37" text-anchor="middle">当日の持ち物</text><text x="746" y="535" font-size="18" fill="#6a706b" text-anchor="middle">保険証と接種の記録</text></g><g><rect x="905" y="185" width="250" height="386" rx="24" fill="#fffdf9" stroke="#d9dfd8" stroke-width="2" filter="url(#shadow)"/><rect x="917" y="197" width="226" height="55" rx="14" fill="#e7dfee"/><text x="1030" y="233" font-size="28" font-weight="800" fill="#765c98" text-anchor="middle">04</text><circle cx="1030" cy="349" r="102" fill="#e7dfee" opacity=".55"/><g><rect x="967" y="296" width="126" height="125" rx="13" fill="#6d5b8e" stroke="#554b6f" stroke-width="4"/><rect x="986" y="313" width="89" height="89" rx="6" fill="#fdfaf3"/><text x="1030" y="345" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#6d5b8e">Impfpass</text><path d="M1003 373l15 13 32-34" fill="none" stroke="#3f8668" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1030" y="493" font-size="24" font-weight="800" fill="#203e37" text-anchor="middle">接種後に記録</text><text x="1030" y="535" font-size="18" fill="#6a706b" text-anchor="middle">Impfpassへの記入</text></g>
<text x="600" y="611" font-size="18" text-anchor="middle" fill="#365b4b" font-weight="700">接種内容は一人ひとり異なります。医師の判断を優先してください。</text>
<text x="600" y="643" font-size="15" text-anchor="middle" fill="#7b8a80">記事の受診手順を再構成した編集図解｜J-Connect Global｜参考：STIKO・RKI</text></g></svg>