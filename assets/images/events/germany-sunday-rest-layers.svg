<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">日曜日の静けさを支える4つの層</title><desc id="d">基本法の日曜日の保護、NRW州の閉店法、市町村が決める日曜営業日、労働時間法と機械騒音防止令が重なって日曜日の静けさをつくっていることを示す図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">日曜日の静けさは「4つの層」でできている</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">国の憲法から、近所の芝刈り機まで</text><rect x="60" y="180" width="1080" height="100" rx="16" fill="white"/><rect x="60" y="180" width="16" height="100" rx="8" fill="#2d6a9f"/><text x="100" y="240" font-size="28" font-weight="700" fill="#2d6a9f" text-anchor="start">憲法</text><text x="330" y="224" font-size="23" font-weight="700" fill="#153452" text-anchor="start">基本法140条＋ワイマール憲法139条</text><text x="330" y="260" font-size="21" fill="#405a71" text-anchor="start">日曜・祝日は「労働を休み、心を高める日」</text><rect x="60" y="292" width="1080" height="100" rx="16" fill="white"/><rect x="60" y="292" width="16" height="100" rx="8" fill="#c9952a"/><text x="100" y="352" font-size="28" font-weight="700" fill="#c9952a" text-anchor="start">州の閉店法</text><text x="330" y="336" font-size="23" font-weight="700" fill="#153452" text-anchor="start">NRW州は平日0〜24時、日曜・祝日は原則休業</text><text x="330" y="372" font-size="21" fill="#405a71" text-anchor="start">パン屋・花屋・新聞は5時間まで、薬局は当番制</text><rect x="60" y="404" width="1080" height="100" rx="16" fill="white"/><rect x="60" y="404" width="16" height="100" rx="8" fill="#2f8a64"/><text x="100" y="464" font-size="28" font-weight="700" fill="#2f8a64" text-anchor="start">市の日曜営業日</text><text x="330" y="448" font-size="23" font-weight="700" fill="#153452" text-anchor="start">1店あたり年8回まで・13時から最大5時間</text><text x="330" y="484" font-size="21" fill="#405a71" text-anchor="start">「公共の利益」が必要。市町村全体で年16日まで</text><rect x="60" y="516" width="1080" height="100" rx="16" fill="white"/><rect x="60" y="516" width="16" height="100" rx="8" fill="#8a5aa8"/><text x="100" y="576" font-size="28" font-weight="700" fill="#8a5aa8" text-anchor="start">働く人と騒音</text><text x="330" y="560" font-size="23" font-weight="700" fill="#153452" text-anchor="start">労働時間法9条：日曜は0〜24時の就労禁止が原則</text><text x="330" y="596" font-size="21" fill="#405a71" text-anchor="start">住宅地の芝刈り機は日曜・祝日は終日使用不可</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：基本法、NRW州閉店法、労働時間法、機械騒音防止令（2026年10月26日参照）</text></g></svg>