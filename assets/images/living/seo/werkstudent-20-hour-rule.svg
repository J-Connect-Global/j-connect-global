<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>ワークスチューデントの週20時間の目安</title><rect width="1200" height="675" fill="#F4F3ED"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="50" font-size="23" fill="#146859">J-CONNECT  /  暮らしのメモ</text><text x="48" y="112" font-size="40" fill="#173B48">ワークスチューデント　4つの目安</text><rect x="48" y="150" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="194" r="20" fill="#146859"/><text x="84" y="203" font-size="24" fill="#FFFFFF">1</text><text x="128" y="188" font-size="26" fill="#173B48">講義期間中は週20時間まで</text><text x="128" y="218" font-size="20" fill="#52666C">学業が中心であることが優遇の条件</text><rect x="48" y="250" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="294" r="20" fill="#146859"/><text x="84" y="303" font-size="24" fill="#FFFFFF">2</text><text x="128" y="288" font-size="26" fill="#173B48">休み期間は20時間を超えてもよい</text><text x="128" y="318" font-size="20" fill="#52666C">夏休み・春休みのフルタイムも可能</text><rect x="48" y="350" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="394" r="20" fill="#146859"/><text x="84" y="403" font-size="24" fill="#FFFFFF">3</text><text x="128" y="388" font-size="26" fill="#173B48">20時間を超える期間は年26週まで</text><text x="128" y="418" font-size="20" fill="#52666C">超えると通常の会社員と同じ保険料に</text><rect x="48" y="450" width="680" height="88" rx="14" fill="#FFFFFF"/><circle cx="92" cy="494" r="20" fill="#146859"/><text x="84" y="503" font-size="24" fill="#FFFFFF">4</text><text x="128" y="488" font-size="26" fill="#173B48">卒業・長期休学で優遇は終わる</text><text x="128" y="518" font-size="20" fill="#52666C">語学コースだけの在籍も対象外</text><rect x="760" y="150" width="392" height="388" rx="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="5"/><text x="788" y="206" font-size="26" fill="#C2410C">留学生はさらに</text><text x="788" y="268" font-size="32" fill="#173B48">年140日分</text><text x="788" y="312" font-size="32" fill="#173B48">の上限</text><text x="788" y="372" font-size="21" fill="#52666C">学生の滞在許可の上限</text><text x="788" y="404" font-size="21" fill="#52666C">4時間以内の日は半日</text><text x="788" y="436" font-size="21" fill="#52666C">週20時間までの週は2.5日</text><text x="788" y="468" font-size="21" fill="#52666C">大学内の学生アルバイトは</text><text x="788" y="500" font-size="21" fill="#52666C">数えません</text><text x="48" y="622" font-size="22" fill="#173B48">週20時間と26週は、法律の条文ではなく社会保険の実務上の目安です。</text><text x="48" y="660" font-size="20" fill="#52666C">図解：J-Connect  |  根拠：社会法典第5編第6条、滞在法第16b条第3項  |  2026-11-06</text></g></svg>