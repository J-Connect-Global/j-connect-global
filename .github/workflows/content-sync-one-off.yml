name: One-off content build sync
on:
  push:
    branches:
      - 'content/winter-service-shipping-20261118'
permissions:
  contents: write
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build: sync generated content for 2026-11-18 refresh"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          else
            echo "Generated content is already in sync."
          fi
