<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">本帰国の手続きの時期</title><desc id="d">本帰国の手続きを、3か月前の住まいの解約通知、1〜2か月前の契約の解約、出発前後2週間の住民登録の抹消、帰国後14日以内の転入届・国民年金・国民健康保険、帰国後しばらくしてからの税金と口座の順に並べた時期別の図</desc><rect width="1200" height="675" rx="28" fill="#eef5fb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="95" font-size="40" font-weight="700" fill="#153452" text-anchor="start">本帰国の手続き：いつ・何をする？</text><text x="60" y="145" font-size="24" fill="#405a71" text-anchor="start">ドイツ側と日本側を時期ごとに</text><rect x="60" y="180" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="180" width="200" height="76" rx="16" fill="#2d6a9f"/><rect x="240" y="180" width="20" height="76" rx="0" fill="#2d6a9f"/><text x="160" y="227" font-size="23" font-weight="700" fill="white" text-anchor="middle">3か月前</text><text x="290" y="213" font-size="21" font-weight="700" fill="#153452" text-anchor="start">ドイツ：住まいの解約通知、仕事・学校への連絡</text><text x="290" y="242" font-size="19" fill="#405a71" text-anchor="start">日本：住む場所、子どもの学校の目星</text><rect x="60" y="266" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="266" width="200" height="76" rx="16" fill="#2d6a9f"/><rect x="240" y="266" width="20" height="76" rx="0" fill="#2d6a9f"/><text x="160" y="313" font-size="23" font-weight="700" fill="white" text-anchor="middle">1〜2か月前</text><text x="290" y="299" font-size="21" font-weight="700" fill="#153452" text-anchor="start">ドイツ：契約の解約、引っ越し業者、車の売却</text><text x="290" y="328" font-size="19" fill="#405a71" text-anchor="start">日本：転入先の自治体の確認</text><rect x="60" y="352" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="352" width="200" height="76" rx="16" fill="#2d6a9f"/><rect x="240" y="352" width="20" height="76" rx="0" fill="#2d6a9f"/><text x="160" y="399" font-size="23" font-weight="700" fill="white" text-anchor="middle">出発の前後2週間</text><text x="290" y="385" font-size="21" font-weight="700" fill="#153452" text-anchor="start">ドイツ：住民登録の抹消、放送負担金・保険の手続き</text><text x="290" y="414" font-size="19" fill="#405a71" text-anchor="start">日本：在外公館への帰国届</text><rect x="60" y="438" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="438" width="200" height="76" rx="16" fill="#2d6a9f"/><rect x="240" y="438" width="20" height="76" rx="0" fill="#2d6a9f"/><text x="160" y="485" font-size="23" font-weight="700" fill="white" text-anchor="middle">帰国後14日以内</text><text x="290" y="471" font-size="21" font-weight="700" fill="#153452" text-anchor="start">日本：転入届、国民年金、国民健康保険</text><text x="290" y="500" font-size="19" fill="#405a71" text-anchor="start">ドイツ：残る手続きは郵便・オンラインで</text><rect x="60" y="524" width="1080" height="76" rx="16" fill="white"/><rect x="60" y="524" width="200" height="76" rx="16" fill="#2d6a9f"/><rect x="240" y="524" width="20" height="76" rx="0" fill="#2d6a9f"/><text x="160" y="571" font-size="23" font-weight="700" fill="white" text-anchor="middle">帰国後しばらく</text><text x="290" y="557" font-size="21" font-weight="700" fill="#153452" text-anchor="start">ドイツ：最後の税金の申告、年金の確認、口座の解約</text><text x="290" y="586" font-size="19" fill="#405a71" text-anchor="start">日本：運転免許、子どもの編入</text><text x="60" y="645" font-size="18" fill="#5b7086" text-anchor="start">出典：連邦住民登録法、民法、日本年金機構、厚生労働省（2026年10月29日参照）</text></g></svg>