<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">アーヘン・クリスマスマーケット2026の営業時間</title><desc id="d">通常は毎日11時から21時。11月22日は18時から、12月12日は22時まで、最終日の12月23日は20時までであることを示す図</desc><rect width="1200" height="675" rx="28" fill="#f7f1ea"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="60" y="88" font-size="38" font-weight="700" fill="#153452">アーヘン：2026年の営業時間</text><text x="60" y="134" font-size="22" fill="#405a71">11月20日〜12月23日。時間が変わる日に注意</text><rect x="60" y="170" width="1080" height="440" rx="16" fill="white"/><line x1="360" y1="200" x2="360" y2="550" stroke="#ece4da" stroke-width="2"/><text x="360" y="585" font-size="20" fill="#405a71" text-anchor="middle">10時</text><line x1="418" y1="200" x2="418" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="477" y1="200" x2="477" y2="550" stroke="#ece4da" stroke-width="2"/><text x="477" y="585" font-size="20" fill="#405a71" text-anchor="middle">12時</text><line x1="535" y1="200" x2="535" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="594" y1="200" x2="594" y2="550" stroke="#ece4da" stroke-width="2"/><text x="594" y="585" font-size="20" fill="#405a71" text-anchor="middle">14時</text><line x1="652" y1="200" x2="652" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="711" y1="200" x2="711" y2="550" stroke="#ece4da" stroke-width="2"/><text x="711" y="585" font-size="20" fill="#405a71" text-anchor="middle">16時</text><line x1="769" y1="200" x2="769" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="828" y1="200" x2="828" y2="550" stroke="#ece4da" stroke-width="2"/><text x="828" y="585" font-size="20" fill="#405a71" text-anchor="middle">18時</text><line x1="886" y1="200" x2="886" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="945" y1="200" x2="945" y2="550" stroke="#ece4da" stroke-width="2"/><text x="945" y="585" font-size="20" fill="#405a71" text-anchor="middle">20時</text><line x1="1003" y1="200" x2="1003" y2="550" stroke="#ece4da" stroke-width="2"/><line x1="1062" y1="200" x2="1062" y2="550" stroke="#ece4da" stroke-width="2"/><text x="1062" y="585" font-size="20" fill="#405a71" text-anchor="middle">22時</text><line x1="1120" y1="200" x2="1120" y2="550" stroke="#ece4da" stroke-width="2"/><text x="1120" y="585" font-size="20" fill="#405a71" text-anchor="middle">23時</text><text x="90" y="245" font-size="24" font-weight="700" fill="#153452">通常（毎日）</text><rect x="418" y="215" width="585" height="42" rx="10" fill="#8d5a3c"/><text x="432" y="244" font-size="20" fill="white" font-weight="700">11〜21時</text><text x="90" y="330" font-size="24" font-weight="700" fill="#153452">11月22日（日）</text><rect x="828" y="300" width="175" height="42" rx="10" fill="#405a71"/><text x="842" y="329" font-size="20" fill="white" font-weight="700">18〜21時</text><text x="815" y="329" font-size="18" fill="#405a71" text-anchor="end">死者の日曜日</text><text x="90" y="415" font-size="24" font-weight="700" fill="#153452">12月12日（土）</text><rect x="418" y="385" width="643" height="42" rx="10" fill="#b5473a"/><text x="432" y="414" font-size="20" fill="white" font-weight="700">11〜22時</text><text x="1074" y="414" font-size="18" fill="#b5473a">22時まで延長</text><text x="90" y="500" font-size="24" font-weight="700" fill="#153452">12月23日（水）</text><rect x="418" y="470" width="526" height="42" rx="10" fill="#2f6a40"/><text x="432" y="499" font-size="20" fill="white" font-weight="700">11〜20時</text><text x="957" y="499" font-size="18" fill="#2f6a40">最終日・20時まで</text><text x="60" y="645" font-size="18" fill="#405a71">11月22日の終了時刻は21時とする案内が多い。主催者の案内で確認（2026年10月30日参照）</text></g></svg>