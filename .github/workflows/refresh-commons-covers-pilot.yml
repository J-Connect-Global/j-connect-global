name: Draft PR archival Commons covers pilot
on:
  push:
    branches:
      - codex/article-photo-refresh-2026-11-22
    paths:
      - .github/workflows/refresh-commons-covers-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-three-covers:
    if: github.ref == 'refs/heads/codex/article-photo-refresh-2026-11-22'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image tools
        run: python3 -m pip install --user 'Pillow>=11,<13'

      - name: Fetch three manually verified licensed archival photos
        run: python3 scripts/refresh-commons-covers-pilot.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned packages
        run: npm ci

      - name: Generate committed article HTML and metadata
        run: npm run build

      - name: Validate site before any push
        run: npm run validate

      - name: Commit successful results to draft branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/registry/events.json content/article-photo-credits.json
          git add content/events/cologne-christmas-markets-2026-guide.md
          git add content/events/berlin-christmas-markets-2026-guide.md
          git add content/events/nrw-christmas-market-day-trips-2026.md
          git add assets/img/events/cologne-christmas-markets-2026-guide*
          git add assets/img/events/berlin-christmas-markets-2026-guide*
          git add assets/img/events/nrw-christmas-market-day-trips-2026*
          git add -u germany/ja
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "photos: add three licensed archival Christmas-market covers"
          git push origin "HEAD:refs/heads/codex/article-photo-refresh-2026-11-22"
