<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">外国籍の配偶者がいる家庭の出生前後の準備</title><desc id="d">出産前に原本・翻訳・認証を確認し、出生直後に出生地の戸籍登録所で出生証明書を取得。保険・給付は並行して申請し、日本の出生届は3か月以内、該当する場合は国籍留保も行う。</desc><rect width="1200" height="800" rx="28" fill="#f5f1e8"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif"><rect x="0" y="0" width="1200" height="126" rx="28" fill="#224d52"/><text x="56" y="80" fill="#fff" font-size="42" font-weight="700">出生前後の手続き：4つの確認ポイント</text><g transform="translate(56 158)"><rect width="530" height="250" rx="20" fill="#fff" stroke="#cad8d2" stroke-width="2"/><circle cx="58" cy="54" r="27" fill="#47727a"/><text x="58" y="64" font-size="28" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="100" y="65" font-size="32" font-weight="700" fill="#47727a">出産前</text><text x="32" y="143" font-size="42" font-weight="700" fill="#19364e">書類の準備</text><text x="32" y="199" font-size="30" fill="#405a71">原本・翻訳・認証</text></g><g transform="translate(614 158)"><rect width="530" height="250" rx="20" fill="#fff" stroke="#cad8d2" stroke-width="2"/><circle cx="58" cy="54" r="27" fill="#47727a"/><text x="58" y="64" font-size="28" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="100" y="65" font-size="32" font-weight="700" fill="#47727a">出生直後</text><text x="32" y="143" font-size="42" font-weight="700" fill="#19364e">出生証明書</text><text x="32" y="199" font-size="30" fill="#405a71">出生地のStandesamt</text></g><g transform="translate(56 438)"><rect width="530" height="250" rx="20" fill="#fff" stroke="#cad8d2" stroke-width="2"/><circle cx="58" cy="54" r="27" fill="#47727a"/><text x="58" y="64" font-size="28" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="100" y="65" font-size="32" font-weight="700" fill="#47727a">出生後</text><text x="32" y="143" font-size="42" font-weight="700" fill="#19364e">保険・給付</text><text x="32" y="199" font-size="30" fill="#405a71">各窓口へ並行申請</text></g><g transform="translate(614 438)"><rect width="530" height="250" rx="20" fill="#fff" stroke="#cad8d2" stroke-width="2"/><circle cx="58" cy="54" r="27" fill="#47727a"/><text x="58" y="64" font-size="28" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="100" y="65" font-size="32" font-weight="700" fill="#47727a">3か月以内</text><text x="32" y="143" font-size="42" font-weight="700" fill="#19364e">日本の出生届</text><text x="32" y="199" font-size="30" fill="#405a71">該当時は国籍留保</text></g><text x="56" y="756" font-size="28" fill="#405a71">個別の必要書類・期限は各窓口へ確認。出生後の申請は並行できます。</text></g></svg>
